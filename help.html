  worst possible answer to "I need help". Keep this file until somebody has checked

  location.replace, not location.href: it leaves no history entry, so Back from the
  form returns where they came from rather than bouncing them through here again.

  NOTHING SECRET WAS EVER IN HERE and nothing secret goes in the new one either. The
  intake endpoint takes no secret from a browser: it accepts source=form only, caps
  the body, runs a honeypot and rate limits per IP. See the dialer repo,
  supabase/functions/_shared/intake-rules.ts.
-->
