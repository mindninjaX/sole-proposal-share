<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sole Dialer</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/sole-icon.png" />
<meta name="description" content="Internal prototype: the support agent's screen. One person, one thread, one place to reply. All data on this page is made up." />
<!-- React + Babel from unpkg. Babel PINNED to 7.29.7 (a floating tag rolls to v8 and blanks the page). See docs/MEMORY.md. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #0F1117; background: #F5F4F8; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #5B5BF6 !important; box-shadow: 0 0 0 3px rgba(91,91,246,0.12); }
  button[data-btn] { transition: background .12s, border-color .12s, box-shadow .12s, transform .05s, filter .12s; }
  button[data-btn]:active { transform: translateY(0.5px); }
  button[data-btn="primary"]:hover { filter: brightness(0.94); }
  button[data-btn="secondary"]:hover { border-color: #C7C9FB; color: #4F46E5; background: #F5F6FF; }
  button[data-btn="quiet"]:hover { background: #F3F4F6; }
  [data-row] { transition: background .12s, border-color .12s; }
  [data-row]:hover { background: #F8F8FE; border-color: #D8D9F8; }
  .scroll { overflow-y: auto; }
  /* Times sit in a fixed gutter down the thread. Proportional digits make that
     column ragged, so every clock and percentage on the page is tabular. */
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #D8DAE0; border-radius: 5px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes livedot { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); } 70% { box-shadow: 0 0 0 7px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .rise > * { animation: rise .4s cubic-bezier(.22,1,.36,1) both; }
  .rise > *:nth-child(1) { animation-delay: .02s; }
  .rise > *:nth-child(2) { animation-delay: .06s; }
  .rise > *:nth-child(3) { animation-delay: .10s; }
  .rise > *:nth-child(n+4) { animation-delay: .14s; }
  /* The 3 column workspace collapses in 2 steps: reference column first, then the people rail.
     Support agents may open this on a 13 inch laptop or on half a screen. */
  /* The ticket list. Key and Summary always survive; the rest shed from the right. */
  [data-trow] { grid-template-columns: 74px minmax(0, 1.9fr) 130px 118px 130px 96px 104px; }
  @media (max-width: 1240px) { [data-board] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
  @media (max-width: 1120px) {
    [data-trow] { grid-template-columns: 74px minmax(0, 1.9fr) 130px 130px 104px !important; }
    [data-trow] > :nth-child(4), [data-trow] > :nth-child(6) { display: none; }
  }
  @media (max-width: 820px) {
    [data-trow] { grid-template-columns: 74px minmax(0, 1fr) 104px !important; }
    [data-trow] > :nth-child(3), [data-trow] > :nth-child(5) { display: none; }
  }
  @media (max-width: 1180px) { [data-col="right"] { display: none !important; } }
  @media (max-width: 1060px) { [data-nav] svg { display: none; } }
  @media (max-width: 1000px) { [data-col="left"] { display: none !important; } }
  @media (max-width: 900px)  {
    [data-board], [data-two] { grid-template-columns: minmax(0, 1fr) !important; }
    [data-two] > * { grid-column: auto !important; }
  }
  @media (max-width: 860px)  {
    [data-stats] { flex-direction: column !important; }
    /* The calls table drops By and How rather than squeezing 6 columns onto a laptop. */
    [data-cols] { grid-template-columns: 1.5fr .9fr .8fr 1.15fr !important; }
    [data-cols] > :nth-child(3), [data-cols] > :nth-child(4) { display: none; }
    [data-switch] { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, Fragment } = React;

// --- design tokens ---
// Same palette as index.html so the dialer reads as part of Sole, not a bolt-on.
const T = {
  primary: '#5B5BF6', primaryDark: '#4F46E5', primarySoft: '#EEF0FF', primarySofter: '#F5F6FF',
  bg: '#F5F4F8', card: '#FFFFFF', border: '#E5E7EB', borderSoft: '#ECEDF2',

  // GREYS ARE SPLIT BY ROLE, and this is the change that fixed most of the "washed out"
  // complaint. mutedSoft was #9CA3AF, which is 2.5:1 on white, and it was carrying 49
  // pieces of body copy. Every grey below that renders TEXT now clears 4.5:1. `faint` keeps
  // the old value and is for NON-TEXT only: hairlines, dividers, dots, decorative chevrons.
  // Never put a word or a meaning-bearing icon in faint.
  text: '#0F1117', textSoft: '#374151', muted: '#5B616E', mutedSoft: '#6B7280',
  faint: '#9CA3AF',
  fieldBg: '#F9FAFB',

  // Fills, borders and dots use the base colour. TEXT and meaning-bearing ICONS use the
  // *Text variant: #DC2626 on #FEF2F2 measures 4.41:1 and fails, #B42318 measures 6.0:1.
  green: '#10B981', greenDark: '#047857', greenSoft: '#ECFDF5', greenBorder: '#A7F3D0',
  amber: '#B45309', amberSoft: '#FFFBEB', amberBorder: '#FCD34D',
  red: '#DC2626', redText: '#B42318', redSoft: '#FEF2F2', redBorder: '#FECACA',
  blue: '#2563EB', blueText: '#1D4ED8', blueSoft: '#EFF6FF', blueBorder: '#BFDBFE',

  radius: 12, radiusSm: 8, radiusChip: 6, radiusOverlay: 16,
  spine: '#E1E3ED', track: '#E4E6EE', dotQuiet: '#C3C7D4',
  shadowSm: '0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05)',
  shadowLg: '0 12px 34px -10px rgba(16,24,40,0.22)',
};

// --- type scale ---
// 5 steps, replacing 15 ad hoc sizes including 6 fractional ones. A step's px and
// line-height are fixed; weight may be the default or the one permitted emphasis.
// Colour is always passed separately and never baked into a step.
const TX = {
  metric: { fontSize: 28, fontWeight: 700, lineHeight: 1.1,  letterSpacing: '-0.02em' },
  title:  { fontSize: 18, fontWeight: 700, lineHeight: 1.25, letterSpacing: '-0.02em' },
  strong: { fontSize: 14, fontWeight: 600, lineHeight: 1.45, letterSpacing: '-0.01em' },
  body:   { fontSize: 13, fontWeight: 400, lineHeight: 1.55, letterSpacing: 0 },
  label:  { fontSize: 12, fontWeight: 500, lineHeight: 1.4,  letterSpacing: 0 },
};

// --- spacing ---
// One scale. The old 7/8/10/14/18 margins and 20 distinct padding strings had no rhythm,
// which is why blocks never lined up across the 3 columns.
const S = { xs: 4, sm: 8, md: 12, lg: 16, xl: 20, xxl: 24 };

// --- icons ---
const paths = {
  phone: 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z',
  chat: 'M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z',
  mail: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M22 6l-10 7L2 6',
  video: 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z',
  back: 'M19 12H5 M12 19l-7-7 7-7',
  check: 'M20 6L9 17l-5-5',
  clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 6v6l4 2',
  play: 'M5 3l14 9-14 9V3z',
  spark: 'M12 2l1.9 5.8L20 9.7l-5 3.9L16.2 20 12 16.6 7.8 20 9 13.6l-5-3.9 6.1-1.9L12 2z',
  alert: 'M12 9v4 M12 17h.01 M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z',
  user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  list: 'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01',
  more: 'M12 5h.01 M12 12h.01 M12 19h.01',
  search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.35-4.35',
  history: 'M3 3v5h5 M3.05 13A9 9 0 1 0 6 5.3L3 8 M12 7v5l4 2',
  eye: 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  down: 'M6 9l6 6 6-6',
  right: 'M9 18l6-6-6-6',
  up: 'M18 15l-6-6-6 6',
  bot: 'M12 8V4H8 M4 8h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z M9 14h.01 M15 14h.01',
  x: 'M18 6L6 18 M6 6l12 12',
  activity: 'M22 12h-4l-3 9L9 3l-3 9H2',
  star: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z',
  clip: 'M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48',
  board: 'M4 3h4v18H4z M10 3h4v11h-4z M16 3h4v14h-4z',
  ticket: 'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z M7 7h.01',
  globe: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',
  mic: 'M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z M19 10v2a7 7 0 0 1-14 0v-2 M12 19v4',
  users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
  trend: 'M23 6l-9.5 9.5-5-5L1 18 M17 6h6v6',
  file: 'M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M13 2v7h7',
  minimise: 'M5 12h14',
  expand: 'M15 3h6v6 M9 21H3v-6 M21 3l-7 7 M3 21l7-7',
};
const Icon = ({ name, size = 16, color = 'currentColor', strokeWidth = 1.8, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
       style={{ flexShrink: 0, ...style }}>
    {String(paths[name] || '').split(' M').map((d, i) => <path key={i} d={i ? 'M' + d : d} />)}
  </svg>
);

// --- atoms ---
const Card = ({ children, style, pad = 18, ...rest }) => (
  <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: T.radius,
                boxShadow: T.shadowSm, padding: pad, ...style }} {...rest}>{children}</div>
);

const SectionTitle = ({ children, hint }) => (
  <div style={{ marginBottom: 12 }}>
    <div style={{ fontSize: 14, fontWeight: 700, color: T.text, letterSpacing: '-0.01em' }}>{children}</div>
    {hint && <div style={{ fontSize: 12, color: T.mutedSoft, marginTop: 3 }}>{hint}</div>}
  </div>
);

// Small caps label and key/value row, the pair used down the reference column.
const RefLabel = ({ children }) => (
  <div style={{ fontSize: 11, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase',
    letterSpacing: '0.06em', margin: '20px 0 8px' }}>{children}</div>
);
const RefRow = ({ k, v, strong, from }) => (
  <div style={{ display: 'flex', gap: S.md, alignItems: 'baseline', padding: `${S.xs}px 0` }}>
    <span style={{ ...TX.label, color: T.mutedSoft, flex: 1 }}>{k}</span>
    <span style={{ ...TX.body, color: T.text, textAlign: 'right', overflowWrap: 'break-word',
      wordBreak: 'normal', maxWidth: '74%', minWidth: 0 }}>
      {v}
      {/* Where a fact came from, inline. An enriched fact has to carry its source or an
          agent cannot tell what they can safely say out loud on a call. */}
      {from && (
        <span title={`Read from ${from}`} style={{ display: 'inline-flex', alignItems: 'center',
          gap: 3, marginLeft: 6, ...TX.label, color: T.mutedSoft, whiteSpace: 'nowrap' }}>
          <Icon name="globe" size={10} color={T.faint} />{from}
        </span>
      )}
    </span>
  </div>
);

// THE COLOUR RULE. Exactly 4 things on this page may be coloured, and an agent has to be
// able to tell what needs them from colour alone, without reading a word:
//   urgent  someone is waiting on us and a clock is running
//   blocked we cannot move until something outside this screen happens
//   done    finished, and it should recede
//   brand   this is a thing you can act on right now
// Everything else is neutral. A channel name, a reporter, a product, a count and a
// timestamp are FACTS, not states, so they never get a colour. Before this rule the
// screen had WhatsApp in green, Facebook in blue, the help form in amber and the in-app
// chat in indigo, which put 4 competing colours on a list where nothing was urgent.
const TONES = {
  neutral: { bg: '#F3F4F6',        bd: T.border,      fg: T.textSoft },
  brand:   { bg: T.primarySoft,    bd: '#C7C9FB',     fg: T.primaryDark },
  urgent:  { bg: T.redSoft,        bd: T.redBorder,   fg: T.redText },
  blocked: { bg: T.amberSoft,      bd: T.amberBorder, fg: T.amber },
  done:    { bg: T.greenSoft,      bd: T.greenBorder, fg: T.greenDark },
  // Legacy colour-named aliases. Call sites still pass these; they resolve to the
  // semantic tone above so the rule holds even where the name at the call site is
  // still a colour. `blue` is deliberately demoted to neutral: nothing on this page
  // is blue any more, because a date in the future is a fact about time, not a state.
  red:     { bg: T.redSoft,        bd: T.redBorder,   fg: T.redText },
  amber:   { bg: T.amberSoft,      bd: T.amberBorder, fg: T.amber },
  green:   { bg: T.greenSoft,      bd: T.greenBorder, fg: T.greenDark },
  blue:    { bg: '#F3F4F6',        bd: T.border,      fg: T.textSoft },
};

// One chip. A squared 6px corner at 22px tall reads as a data label; the old 999px pill
// at 3px padding read as a button you could press, which is why the ticket table looked
// like a row of controls rather than a table.
const Chip = ({ children, tone = 'neutral', shape = 'solid', icon, style }) => {
  const t = TONES[tone] || TONES.neutral;
  const bare = shape === 'bare';
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5,
      background: bare ? 'transparent' : t.bg,
      border: `1px solid ${bare ? 'transparent' : t.bd}`,
      color: bare ? (tone === 'neutral' ? T.muted : t.fg) : t.fg,
      borderRadius: T.radiusChip, height: 22, padding: bare ? '0 2px' : '0 8px',
      ...TX.label, fontWeight: 600, whiteSpace: 'nowrap', ...style }}>
      {icon && <Icon name={icon} size={11} color={bare && tone === 'neutral' ? T.muted : t.fg} />}
      {children}
    </span>
  );
};

// Pill is now Chip. Kept as a name so the 28 existing call sites pick up the new shape
// without 28 separate edits, each of which would be a chance to break something.
const Pill = Chip;

// `title` and `aria-label` were not in this signature, so every title passed to a Btn was
// silently dropped. That included the old disabled Email button's "Not connected yet"
// tooltip, which therefore never appeared. An icon-only button with no label is also
// unreachable by a screen reader, so both are forwarded now.
const Btn = ({ children, variant = 'secondary', icon, onClick, style, full, big, disabled,
               title, ariaLabel }) => {
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    borderRadius: T.radiusSm, fontWeight: 600, fontSize: big ? 14 : 13,
    padding: big ? '11px 16px' : '8px 13px', minHeight: big ? 44 : 36,
    width: full ? '100%' : 'auto', border: '1px solid transparent',
    opacity: disabled ? 0.5 : 1, cursor: disabled ? 'default' : 'pointer',
  };
  const skins = {
    primary:   { background: T.primary, borderColor: T.primaryDark, color: '#fff', boxShadow: '0 1px 2px rgba(16,24,40,0.10)' },
    secondary: { background: T.card, borderColor: T.border, color: T.textSoft },
    quiet:     { background: 'transparent', borderColor: 'transparent', color: T.muted },
  };
  return (
    <button data-btn={variant} disabled={disabled} onClick={disabled ? undefined : onClick}
            title={title} aria-label={ariaLabel || title}
            style={{ ...base, ...skins[variant], ...style }}>
      {icon && <Icon name={icon} size={big ? 16 : 15} />}{children}
    </button>
  );
};

const AV_COLORS = ['#5B5BF6', '#0EA5A4', '#D97706', '#DB2777', '#2563EB', '#7C3AED', '#059669', '#EA580C'];
const Avatar = ({ name, size = 40 }) => {
  const initials = String(name || '?').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 997;
  const c = AV_COLORS[h % AV_COLORS.length];
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: c + '18',
      color: c, border: `1px solid ${c}33`, display: 'flex', alignItems: 'center',
      justifyContent: 'center', fontWeight: 700, fontSize: size * 0.36, flexShrink: 0 }}>{initials}</div>
  );
};

const Progress = ({ pct, tone = T.primary }) => (
  <div style={{ height: 5, background: '#EEF0F3', borderRadius: 3, overflow: 'hidden', width: '100%' }}>
    <div style={{ width: `${Math.max(2, Math.min(100, pct))}%`, height: '100%', background: tone, borderRadius: 3 }} />
  </div>
);

const Empty = ({ children }) => (
  <div style={{ background: T.fieldBg, border: `1px dashed ${T.border}`, borderRadius: T.radiusSm,
    padding: '16px 18px', color: T.muted, fontSize: 13 }}>{children}</div>
);

// --- channels ---
// Support arrives on 5 doorsteps and Shishir, Johann and Juhi each named a different one.
// A channel is a LABEL on the conversation, never a second inbox: the whole point of the
// person page is that everything they said to us sits in one thread.
const CHANNELS = {
  app:      { label: 'In-app chat',  tone: 'neutral', via: 'Sole web app' },
  website:  { label: 'Website chat', tone: 'neutral', via: 'via GoHighLevel' },
  whatsapp: { label: 'WhatsApp',     tone: 'neutral', via: 'via GoHighLevel' },
  facebook: { label: 'Facebook',     tone: 'neutral', via: 'via GoHighLevel' },
  phone:    { label: 'Phone',        tone: 'neutral', via: 'Twilio' },
  email:    { label: 'Email',        tone: 'neutral', via: 'SendGrid' },
  academy:  { label: 'Sole Academy', tone: 'neutral', via: 'Asked from inside a video' },
  form:     { label: 'Help form',    tone: 'neutral', via: 'getsole.io/help' },
};
const ChannelChip = ({ id, showVia }) => {
  const c = CHANNELS[id] || CHANNELS.app;
  const t = TONES[c.tone] || TONES.neutral;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11.5,
      fontWeight: 600, color: T.muted, whiteSpace: 'nowrap' }}>
      <span style={{ width: 5, height: 5, borderRadius: '50%', background: T.faint, flexShrink: 0 }} />
      {c.label}{showVia && <span style={{ color: T.mutedSoft, fontWeight: 500 }}>{c.via}</span>}
    </span>
  );
};

// A note in the prototype's own voice: tells the room what is fake and what is the idea.
const Note = ({ children }) => (
  <div style={{ fontSize: 12, color: T.mutedSoft, marginTop: 14, display: 'flex', gap: 7, alignItems: 'flex-start' }}>
    <Icon name="spark" size={13} color={T.mutedSoft} style={{ marginTop: 2 }} />
    <span>{children}</span>
  </div>
);

// --- mock data ---
// Every person, number, quote and message on this page is invented for the demo.
// Two agents, two products. Shishir asked directly whether Merlin's dialer is the same
// thing as a support dialer, and the honest answer is no: SPM has no chatbot, the customer
// is a practice rather than a sole trader, and Merlin is on calls rather than support. So
// the switcher changes the data, not just the greeting.
const AGENTS = [
  { id: 'juhi', name: 'Juhi', product: 'sole', productLabel: 'Sole, small business',
    job: 'Support and calls', hello: 'Good morning, Juhi' },
  { id: 'merlin', name: 'Merlin', product: 'spm', productLabel: 'Sole Practice Manager',
    job: 'Calls only, no support queue', hello: 'Good morning, Merlin' },

const byId = (id) => PEOPLE.find(p => p.id === id);
const prodOf = (p) => p.product || 'sole';
const ticketsOf = (p) => p.tickets || [];

const laneCount = (p, key) =>
    key === 'chat' ? (p.chat.messages || []).filter(m => m.from !== 'system').length
  : key === 'call' ? (p.calls || []).length
  : key === 'ticket' ? ticketsOf(p).length
  : p.timeline.filter(t => t.lane === key || (key === 'behaviour' && t.lane === 'signup')).length;

// --- the one piece of state the demo has to carry ---
// Shishir asked for "have I contacted them? Yes, no, whatever. Move it over", which only
// means anything if the row actually moves. So a small overlay sits on top of the seed
// data: which people have been contacted, and what state each ticket is in now.
const EMPTY_DEMO = { moved: {}, contacted: {}, tickets: {}, notes: {}, made: [], presence: 'available' };
const bucketOf = (p, demo) => (demo.moved || {})[p.id] || p.bucket;
const contactedAt = (p, demo) => (demo.contacted || {})[p.id] || null;
const statusOf = (p, demo) => contactedAt(p, demo)
  ? { label: `You reached out at ${contactedAt(p, demo)}`, tone: 'blue' }
  : { label: p.status, tone: p.statusTone };

// Shishir, 3 Sep: "that needs to be broken up between people that are on trial. And then
// support." Support is what came to us. Outreach is everyone we go to first: new signups,
// activation nudges and the people who cancelled.
const STREAMS = [
  { key: 'support', label: 'Support', hint: 'They came to us.' },
  { key: 'outreach', label: 'Trials and outreach', labelSpm: 'Outreach', hint: 'We go to them first.' },
];
const streamOf = (p) => p.stream || 'support';

const inBucket = (key, product, demo, stream) => PEOPLE
  .filter(p => prodOf(p) === product && bucketOf(p, demo) === key
    && (!stream || streamOf(p) === stream))
  // Anyone sitting in a live chat waiting on a human goes first. They are the only
  // people here who can tell they are being ignored.
  .slice().sort((x, y) => (y.chat.state === 'needs_you' ? 1 : 0) - (x.chat.state === 'needs_you' ? 1 : 0));

const forProduct = (product) => PEOPLE.filter(p => prodOf(p) === product);

// Every ticket in one list, each still carrying the person it belongs to. The board is a
// view over this; it is not a second store.
const ALL_TICKETS = PEOPLE.flatMap(p => ticketsOf(p).map(t => ({ ...t, person: p })));
const tStatus = (t, demo) => (demo.tickets || {})[t.id] || t.status;
const tNotes = (t, demo) => [...(t.notes || []), ...(((demo.notes || {})[t.id]) || [])];

// Johann's 3 minute promise, rendered rather than asserted. It is only shown on people who
// signed up today and have not been reached, because that is the only place it means anything.
const fmtMins = (n) => n < 60 ? `${n} minutes` : n < 90 ? '1 hour' : `${Math.round(n / 60)} hours`;
const callDue = (p, demo) => {
  if (!p.signupMins || contactedAt(p, demo) || (p.calls || []).length) return null;
  const late = p.signupMins - 3;
  return late > 0
    ? `Signed up ${fmtMins(p.signupMins)} ago. The 3 minute call is ${fmtMins(late)} late.`
    : 'Signed up just now. The 3 minute call is due.';
};

// One row, used by both the list and the board's person link. The status pill, the SLA clock
// and the contacted action all read through `demo`, so pressing "Mark as contacted" moves the
// row for real instead of describing that it would.
const QueueRow = ({ p, demo, onOpen, onContact }) => {
  const st = statusOf(p, demo);
  const due = callDue(p, demo);
  return (
    <div data-row onClick={() => onOpen(p.id)}

          {p.unverified && <Pill tone="neutral">No Sole account</Pill>}
          {p.chat.unread > 0 && (
            <Pill tone="red"><Icon name="chat" size={11} />{p.chat.unread} unread</Pill>

        {due && (
          <div style={{ fontSize: 12.5, fontWeight: 600, color: T.red, marginTop: 5 }}>{due}</div>
        )}

      <div style={{ textAlign: 'right', flexShrink: 0, display: 'flex', flexDirection: 'column',

        <div style={{ fontSize: 12.5, color: T.mutedSoft }}>{p.city}</div>
        <div style={{ display: 'flex', gap: 7 }}>
          {bucketOf(p, demo) === 'now' && (
            <Btn variant="secondary" icon="check"
                 onClick={(e) => { e.stopPropagation(); onContact(p.id); }}>Contacted</Btn>
          )}
          <Btn variant="primary" onClick={(e) => { e.stopPropagation(); onOpen(p.id); }}>Open</Btn>
        </div>
      </div>
    </div>
  );
};

const ListScreen = ({ agent, onOpen, demo, onContact, stream, setStream }) => {
  const a = AGENTS.find(x => x.id === agent);
  const now = inBucket('now', a.product, demo, stream);
  const waiting = inBucket('waiting', a.product, demo, stream);
  const done = inBucket('done', a.product, demo, stream);
  const newToday = forProduct(a.product)
    .filter(p => p.joined === 'Today' && streamOf(p) === stream).length;
  const waits = now.map(p => p.chat.waitMins || 0).filter(Boolean);
  const longest = waits.length ? Math.max(...waits) : 0;
  return (
    <div className="rise" style={{ display: 'flex', flexDirection: 'column', gap: 20,
      maxWidth: 1000, margin: '0 auto', padding: '28px 24px 80px', width: '100%' }}>
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: '-0.03em', margin: 0 }}>{a.hello}</h1>
        <div style={{ color: T.muted, fontSize: 13.5, marginTop: 5 }}>
          Wednesday 26 August · {a.productLabel} · {a.job}
        </div>
      </div>

      {/* Two different jobs, so two lists. Support is answering; outreach is the trial and
          activation calls, which is where the automatic AI call runs. */}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {STREAMS.map(st => {
          const on = stream === st.key;
          const n = ['now', 'waiting', 'done']
            .reduce((acc, b) => acc + inBucket(b, a.product, demo, st.key).length, 0);
          const overdue = inBucket('now', a.product, demo, st.key).filter(x => callDue(x, demo)).length;
          const label = a.product === 'spm' && st.labelSpm ? st.labelSpm : st.label;
          return (
            <button key={st.key} data-btn="quiet" onClick={() => setStream(st.key)}
              style={{ border: `1px solid ${on ? T.primary : T.border}`, borderRadius: T.radiusSm,
                background: on ? T.primarySofter : T.card, padding: '9px 13px', textAlign: 'left',
                display: 'flex', alignItems: 'center', gap: 9 }}>
              <span style={{ fontSize: 13, fontWeight: on ? 700 : 600,
                color: on ? T.primaryDark : T.textSoft }}>{label}</span>
              <span className="tnum" style={{ fontSize: 12.5, fontWeight: 700, color: T.mutedSoft }}>{n}</span>
              {overdue > 0 && <Pill tone="red">{overdue} overdue</Pill>}
            </button>
          );
        })}
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 12, color: T.mutedSoft, alignSelf: 'center' }}>
          {(STREAMS.find(x => x.key === stream) || STREAMS[0]).hint}
        </div>
      </div>

      <div data-stats style={{ display: 'flex', gap: 12 }}>
        <Stat n={now.length} label="Waiting on you" tone={T.redText} />
        {a.product === 'sole' && stream === 'support' && (
          <Stat n={longest ? `${longest} min` : 'None'} label="Longest wait in a chat"
                tone={longest > 15 ? T.red : T.text}
                sub={longest ? 'Nobody has replied to them yet' : 'No open chats'} />
        )}
        <Stat n={waiting.length} label="You reached out" tone={T.text} />
        {stream === 'outreach' && a.product === 'sole'
          ? <Stat n={newToday} label="Signed up today" sub="In this sample, not a real signup rate" />
          : <Stat n={done.length} label="Sorted today" />}
      </div>

      {!now.length && !waiting.length && !done.length && (
        <Empty>Nothing in this list right now.</Empty>
      )}
      {BUCKETS.map(b => {
        const rows = b.key === 'now' ? now : b.key === 'waiting' ? waiting : done;
        if (!rows.length) return null;
        return (
          <div key={b.key}>
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>
                {b.title} <span style={{ color: T.mutedSoft, fontWeight: 500 }}>({rows.length})</span>
              </div>
              <div style={{ fontSize: 12, color: T.mutedSoft, marginTop: 3 }}>
                {a.product === 'spm' && b.hintSpm ? b.hintSpm
                  : stream === 'outreach' && b.hintOut ? b.hintOut : b.hint}
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {rows.map(p => (
                <QueueRow key={p.id} p={p} demo={demo} onOpen={onOpen} onContact={onContact} />
              ))}
            </div>
          </div>
        );
      })}
      <Note>
        One row per person, whatever they came in on. The ticket is the issue they raised, and it
        lives on their record: the Tickets tab above is the same tickets, sorted by state instead
        of by person.
      </Note>
    </div>
  );
};

// --- left column: move between people without going back ---
const RAIL_FILTERS = [
  { key: 'all',     label: 'All' },
  { key: 'now',     label: 'Needs you' },
  { key: 'unread',  label: 'Unread' },
  { key: 'waiting', label: 'Waiting' },
];

const PeopleRail = ({ currentId, onOpen, product, demo, stream }) => {
  // The rail is how an agent moves between people without going back to the list, so it
  // needs to answer "who else needs me" and "find that person" in place. A name search
  // matters more than it looks: the rail holds every person, and scrolling a rail to find
  // someone you were just talking to is the slowest thing on the screen.
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');
  const needle = q.trim().toLowerCase();

  const all = [
    { title: 'Needs you now', key: 'now',     rows: inBucket('now', product, demo, stream) },
    { title: 'Waiting on them', key: 'waiting', rows: inBucket('waiting', product, demo, stream) },
    { title: 'Done today', key: 'done',      rows: inBucket('done', product, demo, stream) },
  ];
  const match = (p) => {
    if (needle && ![p.name, p.business].some(v => String(v || '').toLowerCase().includes(needle))) return false;
    if (filter === 'unread') return p.chat.unread > 0;
    return true;
  };
  const groups = all
    .filter(g => filter === 'all' || filter === 'unread' || g.key === filter)
    .map(g => ({ ...g, rows: g.rows.filter(match) }));
  const total = groups.reduce((n, g) => n + g.rows.length, 0);

  return (
    <div data-col="left" className="scroll" style={{ width: 268, flexShrink: 0, background: T.card,
      borderRight: `1px solid ${T.border}`, overflowY: 'auto' }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 2, background: T.card,
        borderBottom: `1px solid ${T.borderSoft}`, padding: `${S.md}px ${S.md}px ${S.sm + 2}px` }}>
        <div style={{ position: 'relative', marginBottom: S.sm }}>
          <Icon name="search" size={13} color={T.mutedSoft}
            style={{ position: 'absolute', left: 9, top: 9, pointerEvents: 'none' }} />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Find someone"
            style={{ width: '100%', height: 32, border: `1px solid ${T.border}`,
              borderRadius: T.radiusSm, padding: '0 9px 0 28px', ...TX.label, background: T.card }} />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: S.xs }}>
          {RAIL_FILTERS.map(f => {
            const on = filter === f.key;
            return (
              <button key={f.key} onClick={() => setFilter(f.key)}
                style={{ height: 26, padding: `0 ${S.sm - 2}px`, borderRadius: T.radiusChip,
                  border: `1px solid ${on ? T.primaryDark : T.border}`,
                  background: on ? T.primary : T.card, color: on ? '#fff' : T.muted,
                  ...TX.label, fontWeight: on ? 700 : 500 }}>{f.label}</button>
            );
          })}
        </div>
      </div>

      {!total && (
        <div style={{ padding: `${S.xl}px ${S.lg}px`, ...TX.label, color: T.mutedSoft, textAlign: 'center' }}>
          {needle ? `Nobody matching "${q}".` : 'Nobody in this filter.'}
        </div>
      )}

      {groups.map(g => !!g.rows.length && (
        <div key={g.title}>
          <div style={{ padding: `${S.md + 2}px ${S.lg}px ${S.sm}px`, ...TX.label,
            fontWeight: 600, color: T.mutedSoft }}>{g.title} · {g.rows.length}</div>
          {g.rows.map(p => {
            const on = p.id === currentId;
            return (
              <button key={p.id} data-row={on ? undefined : true} onClick={() => onOpen(p.id)}
                style={{ display: 'flex', gap: 11, alignItems: 'center', width: '100%', textAlign: 'left',
                  padding: '11px 16px', border: 'none',
                  borderLeft: `3px solid ${on ? T.primary : 'transparent'}`,
                  background: on ? T.primarySofter : 'transparent' }}>
                <Avatar name={p.name} size={34} />
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: on ? 700 : 600, whiteSpace: 'nowrap',
                    overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.name}</div>
                  <div style={{ fontSize: 12, color: T.mutedSoft, whiteSpace: 'nowrap',
                    overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.business}</div>
                </div>
                {p.chat.unread > 0 && (
                  <span style={{ background: T.red, color: '#fff', borderRadius: 999, minWidth: 20,
                    height: 20, fontSize: 11.5, fontWeight: 700, display: 'flex', alignItems: 'center',
                    justifyContent: 'center', padding: '0 6px', flexShrink: 0 }}>{p.chat.unread}</span>
                )}
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
};

// --- the chat lane ---
const Bubble = ({ m, agentName }) => {
  if (m.from === 'system') return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '2px 0' }}>
      <div style={{ flex: 1, height: 1, background: T.borderSoft }} />
      <span style={{ fontSize: 12, color: T.mutedSoft, whiteSpace: 'nowrap' }}>{m.text}</span>
      <div style={{ flex: 1, height: 1, background: T.borderSoft }} />
    </div>
  );
  const mine = m.from === 'agent';
  const skin = mine ? { bg: T.primary, fg: '#fff', bd: T.primaryDark }
    : m.from === 'bot' ? { bg: m.failed ? T.redSoft : '#EDEFF5', fg: T.text, bd: m.failed ? T.redBorder : '#E1E4EE' }
    : { bg: T.card, fg: T.text, bd: '#DCDEE8' };
  const who = mine ? agentName : m.from === 'bot' ? 'Sole assistant' : 'Them';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: mine ? 'flex-end' : 'flex-start', gap: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 11.5, color: T.mutedSoft }}>
        {m.from === 'bot' && <Icon name="bot" size={12} color={m.failed ? T.red : T.mutedSoft} />}
        <span style={{ fontWeight: 600, color: m.failed ? T.red : T.mutedSoft }}>{who}</span>
        <span className="tnum">{m.when}</span>
        {/* Only shown where it changes. A thread that starts on the website and moves to
            WhatsApp is still one thread, and this is what makes that visible. */}
        {m.via && <ChannelChip id={m.via} />}
      </div>
      <div style={{ maxWidth: '80%', background: skin.bg, color: skin.fg, border: `1px solid ${skin.bd}`,
        borderRadius: 12, padding: '10px 13px', fontSize: 13.5, lineHeight: 1.55 }}>
        {m.text}
        {/* Juhi asked for this outright: "can I attach something here, the screenshot or an
            attachment?" It matters more inbound than outbound, because a screenshot is how
            she finds out what actually happened. */}
        {m.file && (
          <div style={{ marginTop: 9, display: 'flex', alignItems: 'center', gap: 9,
            background: mine ? 'rgba(255,255,255,0.15)' : T.fieldBg,
            border: `1px solid ${mine ? 'rgba(255,255,255,0.25)' : T.border}`,
            borderRadius: T.radiusSm, padding: '8px 10px' }}>
            <Icon name="file" size={13} color={mine ? '#fff' : T.primary} />
            <span style={{ fontSize: 12.5, fontWeight: 600 }}>{m.file.name}</span>
            <span style={{ fontSize: 11.5, color: mine ? 'rgba(255,255,255,0.75)' : T.mutedSoft }}>{m.file.size}</span>
          </div>
        )}
        {m.video && (
          <div style={{ marginTop: 9, display: 'flex', alignItems: 'center', gap: 8,
            background: mine ? 'rgba(255,255,255,0.15)' : T.card,
            border: `1px solid ${mine ? 'rgba(255,255,255,0.25)' : T.border}`,
            borderRadius: T.radiusSm, padding: '7px 10px' }}>
            <Icon name="play" size={12} color={mine ? '#fff' : T.primary} />
            <span style={{ fontSize: 12.5, fontWeight: 600 }}>{m.video}</span>
          </div>
        )}
      </div>
    </div>
  );
};

// Juhi's sharpest question, unprompted: "now that I have taken over, and I missed it, hand
// over to the bot. So will it automatically hand over to bot or will I have to do that every
// time?" So it is automatic. The countdown is on screen because a silent rule is one she
// cannot trust, and the demo link exists because nobody waits 3 minutes in a meeting.
const IDLE_LIMIT = 180;
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

const ChatLane = ({ p, agentName, state, setState, msgs, setMsgs, presence }) => {
  const [draft, setDraft] = useState('');
  const [idle, setIdle] = useState(0);
  const [attached, setAttached] = useState(null);
  const boxRef = useRef(null);
  useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [msgs]);
  useEffect(() => { setDraft(''); setIdle(0); setAttached(null); }, [p.id]);

  const now = () => '10:22 AM';
  const autoBack = (why) => {
    setState('bot');
    setMsgs(m => [...m, { from: 'system', when: now(), text: why }]);
    setIdle(0);
  };

  // The clock only runs while she is holding the conversation.
  useEffect(() => {
    if (state !== 'you') { setIdle(0); return; }
    const t = setInterval(() => setIdle(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [state, p.id]);

  useEffect(() => {
    if (state === 'you' && idle >= IDLE_LIMIT) {
      autoBack('Nobody replied for 3 minutes, so the bot picked this back up on its own.');
    }
  }, [idle, state]);

  // Setting yourself Away is the other half of the same problem: the times she knows in
  // advance she is going into a call with Joe or Shishir.
  useEffect(() => {
    if (presence === 'away' && state === 'you') {
      autoBack(`${agentName} went away, so the bot picked this back up.`);
    }
  }, [presence]);

  if (p.chat.state === 'none') return <Empty>{p.chat.empty}</Empty>;

  const takeOver = () => {
    setState('you'); setIdle(0);
    setMsgs(m => [...m, { from: 'system', when: now(), text: `${agentName} took over from the bot` }]);
  };
  const handBack = () => { setState('bot'); setMsgs(m => [...m, { from: 'system', when: now(), text: `${agentName} handed the conversation back to the bot` }]); };
  const send = () => {
    const t = draft.trim(); if (!t && !attached) return;
    setMsgs(m => [...m, { from: 'agent', when: now(), text: t || 'Have a look at this.',
      file: attached ? { name: attached, size: '96 KB' } : null }]);
    setDraft(''); setAttached(null); setIdle(0);
  };
  const left = IDLE_LIMIT - idle;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      {/* Which doorstep this conversation arrived on. Shishir, Johann and Juhi each named a
          different one, and the answer is a label rather than another inbox. */}
      <div style={{ flexShrink: 0, marginBottom: 12 }}><LaneSource info={LANE_INFO.chat} /></div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingBottom: 12,
        marginBottom: 14, borderBottom: `1px solid ${T.borderSoft}`, flexShrink: 0, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: T.muted }}>Latest on</span>
        <ChannelChip id={p.chat.channel || 'app'} showVia />
        <div style={{ flex: 1 }} />
        <span style={{ fontSize: 11.5, color: T.mutedSoft }}>
          Everything they have ever sent us, on any channel, is in this one thread.
        </span>
      </div>
      {state === 'needs_you' && (
        <div style={{ background: T.redSoft, border: `1px solid ${T.redBorder}`, borderRadius: T.radiusSm,
          padding: 14, marginBottom: 16, display: 'flex', alignItems: 'center', gap: 12,
          flexWrap: 'wrap', flexShrink: 0 }}>
          <Icon name="chat" size={17} color={T.red} />
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: T.red }}>
              {p.name.split(' ')[0]} asked to speak to a person, {p.chat.waitingSince} ago.
            </div>
            <div style={{ fontSize: 12.5, color: T.textSoft, marginTop: 2 }}>{p.chat.toldUser}</div>
          </div>
          <Btn variant="primary" icon="chat" onClick={takeOver}>Take over</Btn>
        </div>
      )}

      <div ref={boxRef} className="scroll" style={{ flex: 1, minHeight: 160, overflowY: 'auto',
        display: 'flex', flexDirection: 'column', gap: 14, paddingRight: 4 }}>
        {msgs.map((m, i) => <Bubble key={i} m={m} agentName={agentName} />)}
      </div>

      <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.borderSoft}`, flexShrink: 0 }}>
        {state === 'you' ? (
          <Fragment>
            {attached && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 9,
                background: T.fieldBg, border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
                padding: '7px 10px', width: 'fit-content' }}>
                <Icon name="file" size={13} color={T.primary} />
                <span style={{ fontSize: 12.5, fontWeight: 600 }}>{attached}</span>
                <button data-btn="quiet" onClick={() => setAttached(null)}
                  style={{ border: 'none', background: 'transparent', padding: 2, display: 'flex' }}>
                  <Icon name="x" size={13} color={T.mutedSoft} />
                </button>
              </div>
            )}
            <div style={{ display: 'flex', gap: 10 }}>
              <button data-btn="secondary" onClick={() => setAttached('where-to-click.png')}
                title="Attach a screenshot or a file"
                style={{ border: `1px solid ${T.border}`, background: T.card, borderRadius: T.radiusSm,
                  width: 44, minHeight: 44, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0 }}>
                <Icon name="clip" size={17} color={T.muted} />
              </button>
              <input value={draft} onChange={e => { setDraft(e.target.value); setIdle(0); }}
                onKeyDown={e => { if (e.key === 'Enter') send(); }}
                placeholder={`Write to ${p.name.split(' ')[0]}...`}
                style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
                  padding: '11px 13px', background: T.card, minHeight: 44 }} />
              <Btn variant="primary" big onClick={send} disabled={!draft.trim() && !attached}>Send</Btn>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 9, flexWrap: 'wrap' }}>
              <span style={{ fontSize: 12.5, color: T.mutedSoft, flex: 1, minWidth: 200 }}>
                You are replying and the bot is silent. If you go 3 minutes without answering,
                it picks the conversation back up so nobody is left waiting.
              </span>
              <Pill tone={left <= 30 ? 'red' : 'neutral'}>
                <Icon name="clock" size={11} />Bot takes over in <span className="tnum">{mmss(Math.max(0, left))}</span>
              </Pill>
              {left > 20 && (
                <Btn variant="quiet" onClick={() => setIdle(IDLE_LIMIT - 8)}>Show me that happening</Btn>
              )}
              <Btn variant="quiet" onClick={handBack}>Hand back now</Btn>
            </div>
          </Fragment>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 220, background: T.fieldBg, border: `1px solid ${T.border}`,
              borderRadius: T.radiusSm, padding: '11px 13px', color: T.mutedSoft, fontSize: 13.5,
              minHeight: 44, display: 'flex', alignItems: 'center' }}>
              {state === 'quiet' ? 'This conversation is closed. Reply and it opens again.'
                : state === 'needs_you' ? 'They have asked for a person, so the bot has stopped answering. Nothing goes out until you reply.'
                : 'The bot is answering. Take over if you want to reply yourself.'}
            </div>
            {state !== 'needs_you' && <Btn variant="secondary" big icon="chat" onClick={takeOver}>Take over</Btn>}
          </div>
        )}
      </div>
    </div>
  );
};

// --- one call, expandable to everything we hold about it ---
// Johann: "she's not just support. Julie's gonna call all the new customers as well, all the
// churn customers. So for each of those types of calls, I'd like to know what's working."
// The type is on the record for that reason: it is what the roll-up groups by.
const CALL_TYPES = {
  ai:      { label: 'AI call', tone: 'brand' },
  welcome: { label: 'Welcome call', tone: 'brand' },
  support: { label: 'Support call', tone: 'neutral' },
  churn:   { label: 'Churn call', tone: 'red' },
  inbound: { label: 'They called us', tone: 'blue' },
};
const callType = (c) => CALL_TYPES[c.type] || CALL_TYPES.support;

const CallCard = ({ c, agentName, defaultOpen, onCall }) => {
  const [open, setOpen] = useState(!!defaultOpen);
  const [card, setCard] = useState('open');
  const [showTx, setShowTx] = useState(false);
  const tone = TONES[c.outcomeTone] || TONES.neutral;
  return (
    <Card pad={0} style={{ overflow: 'hidden' }}>
      <button data-row onClick={() => setOpen(v => !v)} style={{ display: 'flex', alignItems: 'center',
        gap: 14, width: '100%', textAlign: 'left', padding: 16, border: 'none', background: 'transparent' }}>
        <div style={{ width: 36, height: 36, borderRadius: '50%', background: tone.bg,
          border: `1px solid ${tone.bd}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name="phone" size={15} color={tone.fg} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700 }}>
            {c.when} <span style={{ color: T.mutedSoft, fontWeight: 500 }}>· {c.len} · {c.how} · {c.by}</span>
          </div>
          <div style={{ display: 'flex', gap: 7, marginTop: 6, flexWrap: 'wrap' }}>
            <Pill tone={callType(c).tone}>{callType(c).label}</Pill>
            {c.kind && <Pill tone="neutral">{c.kind}</Pill>}
            <Pill tone={c.outcomeTone}>{c.outcome}</Pill>
            {c.score !== null && (
              <Pill tone={c.score >= 7 ? 'green' : 'amber'}><Icon name="star" size={11} />Call score {c.score} of 10</Pill>
            )}
          </div>
        </div>
        <Icon name={open ? 'up' : 'down'} size={16} color={T.mutedSoft} />
      </button>

      {open && (
        <div style={{ borderTop: `1px solid ${T.borderSoft}`, padding: 18, display: 'flex',
          flexDirection: 'column', gap: 20, animation: 'fade .18s ease' }}>
          {/* Shishir drew this line himself: "for support it's support, Juhi will be the one
              talking. But we are talking about also activation." So an AI call says so, and it
              only ever appears on an activation call. */}
          {c.ai && (
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', background: T.primarySofter,
              border: '1px solid #D5D7FB', borderRadius: T.radiusSm, padding: '11px 13px' }}>
              <Icon name="bot" size={15} color={T.primaryDark} style={{ marginTop: 2 }} />
              <span style={{ fontSize: 12.5, color: T.textSoft, lineHeight: 1.55 }}>{c.ai}</span>
            </div>
          )}
          {c.missed ? (
            <div>
              <SectionTitle hint="Juhi named this as the thing that fails today: inbound calls land on the general number and get missed.">
                Nobody picked up
              </SectionTitle>
              <Empty>{c.missed}</Empty>
              <div style={{ marginTop: 12 }}>
                <Btn variant="primary" icon="phone" onClick={onCall}>Call her back</Btn>
              </div>
            </div>
          ) : c.voicemail ? (
            <div>
              <SectionTitle>The voicemail you left</SectionTitle>
              <Empty>“{c.voicemail}”</Empty>
            </div>
          ) : (
            <Fragment>
              <div>
                <SectionTitle>{c.recording ? 'The screen recording' : 'The recording'}</SectionTitle>
                <div style={{ display: 'flex', alignItems: 'center', gap: 14, background: T.fieldBg,
                  border: `1px solid ${T.border}`, borderRadius: T.radiusSm, padding: '11px 14px' }}>
                  <div style={{ width: 30, height: 30, borderRadius: '50%', background: T.primary,
                    display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icon name="play" size={12} color="#fff" />
                  </div>
                  <Progress pct={0} />
                  <span style={{ fontSize: 12.5, color: T.mutedSoft, whiteSpace: 'nowrap' }}>
                    {c.recording ? c.recording.label : c.len}
                  </span>
                </div>
                {/* Juhi records a Meet so the developers can watch the bug instead of reading
                    her description of it. That handoff is the whole reason she uses Meet. */}
                {c.recording && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginTop: 10,
                    background: T.blueSoft, border: `1px solid ${T.blueBorder}`, borderRadius: T.radiusSm,
                    padding: '9px 12px' }}>
                    <Icon name="users" size={14} color={T.blue} />
                    <span style={{ fontSize: 12.5, color: T.textSoft }}>{c.recording.shared}</span>
                  </div>
                )}
                <button data-btn="quiet" onClick={() => setShowTx(v => !v)}
                  style={{ border: 'none', background: 'transparent', color: T.primaryDark, fontWeight: 600,
                    fontSize: 13, marginTop: 12, padding: 0, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <Icon name={showTx ? 'up' : 'down'} size={14} />{showTx ? 'Hide what was said' : 'Read what was said'}
                </button>
                {showTx && (
                  <div style={{ marginTop: 12, background: T.fieldBg, border: `1px solid ${T.border}`,
                    borderRadius: T.radiusSm, padding: 16, fontSize: 13.5, lineHeight: 1.7, color: T.textSoft,
                    display: 'flex', flexDirection: 'column', gap: 9 }}>
                    {c.transcript.map(([who, line], i) => (
                      <div key={i}>
                        <span style={{ fontWeight: 700, color: who === 'You' ? T.primaryDark : T.text }}>{who}: </span>{line}
                      </div>
                    ))}
                    <div style={{ color: T.mutedSoft, fontSize: 12.5 }}>...</div>
                  </div>
                )}
              </div>

              {!!c.agreed.length && (
                <div>
                  <SectionTitle hint="Pulled out of the call. Change anything that is wrong.">What you agreed</SectionTitle>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                    {c.agreed.map((s, i) => (
                      <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                        <Icon name="check" size={15} color={T.green} style={{ marginTop: 2 }} />
                        <span style={{ fontSize: 13.5, lineHeight: 1.55 }}>{s}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {c.next && (
                <div style={{ background: T.blueSoft, border: `1px solid ${T.blueBorder}`,
                  borderRadius: T.radiusSm, padding: 14, display: 'flex', alignItems: 'center', gap: 12 }}>
                  <Icon name="clock" size={17} color={T.blue} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: T.blue }}>Next: {c.next.title}</div>
                    <div style={{ fontSize: 12.5, color: T.textSoft, marginTop: 2 }}>{c.next.body}</div>
                  </div>
                  <Btn variant="secondary">Change</Btn>
                </div>
              )}

              {!!c.coach.length && (
                <div>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 10 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>How the call went</div>
                      <div style={{ fontSize: 12, color: T.mutedSoft, marginTop: 3 }}>
                        Scored against the call guide, which nobody has written yet, so the number
                        is a placeholder. Only {agentName} and their manager see this.
                      </div>
                    </div>
                    <Pill tone="amber">Draft</Pill>
                    <Pill tone="neutral"><Icon name="eye" size={12} />Private</Pill>
                  </div>
                  {c.mood && (
                    <div style={{ marginBottom: 12 }}>
                      <Meta tone="neutral">How they sounded: {c.mood.toLowerCase()}</Meta>
                    </div>
                  )}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {c.coach.map((s, i) => (
                      <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                        <div style={{ width: 6, height: 6, borderRadius: '50%', background: T.mutedSoft,
                          marginTop: 8, flexShrink: 0 }} />
                        <span style={{ fontSize: 13.5, lineHeight: 1.6, color: T.textSoft }}>{s}</span>
                      </div>
                    ))}
                  </div>
                  {/* The other direction of the same loop: one call teaching the guide, not
                      just the guide marking one call. This is the line that turns the score
                      into something the team owns. */}
                  {c.learned && (
                    <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 9,
                      background: T.greenSoft, border: `1px solid ${T.greenBorder}`,
                      borderRadius: T.radiusSm, padding: '9px 12px' }}>
                      <Icon name="trend" size={14} color={T.greenDark} />
                      <span style={{ fontSize: 12.5, color: T.textSoft }}>{c.learned}</span>
                    </div>
                  )}
                </div>
              )}

              {c.approve && (
                <div style={{ background: T.primarySofter, border: '1px solid #D5D7FB',
                  borderRadius: T.radiusSm, padding: 16 }}>
                  <SectionTitle hint="The bot did not know this one. Your answer is how it learns.">
                    One answer to approve
                  </SectionTitle>
                  {card === 'open' ? (
                    <Fragment>
                      <div style={{ background: T.card, border: `1px solid ${T.border}`,
                        borderRadius: T.radiusSm, padding: 14 }}>
                        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>“{c.approve.q}”</div>
                        <div style={{ fontSize: 13.5, lineHeight: 1.65 }}>{c.approve.a}</div>
                        <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 8,
                          background: T.fieldBg, border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
                          padding: '8px 11px' }}>
                          <Icon name="play" size={12} color={T.primary} />
                          <span style={{ fontSize: 12.5, fontWeight: 600 }}>{c.approve.video}</span>
                        </div>
                      </div>
                      <div style={{ display: 'flex', gap: 9, marginTop: 14, flexWrap: 'wrap', alignItems: 'center' }}>
                        <Btn variant="primary" icon="check" onClick={() => setCard('approved')}>Looks right, use it</Btn>
                        <Btn variant="secondary" onClick={() => setCard('approved')}>Fix it first</Btn>
                        <div style={{ flex: 1 }} />
                        <Btn variant="quiet" onClick={() => setCard('binned')}>Not useful</Btn>
                      </div>
                    </Fragment>
                  ) : (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <Icon name={card === 'approved' ? 'check' : 'x'} size={16}
                            color={card === 'approved' ? T.green : T.mutedSoft} />
                      <span style={{ fontSize: 13.5, color: T.textSoft }}>
                        {card === 'approved'
                          ? 'Saved to the answer queue. It goes live in the chatbot once someone signs off on the wording.'
                          : 'Binned. It will not be suggested again.'}
                      </span>
                    </div>
                  )}
                </div>
              )}
            </Fragment>
          )}
        </div>
      )}
    </Card>
  );
};

// [in the support ticket system]."
//
// On 4 Sep Rishabh corrected the reading: Shishir meant the VIEW should be a LIST rather
// than a kanban. He was not saying the entity lives elsewhere. Sole is moving off Jira, so
// the ticket is ours: raised here, worked here, closed here. The board is kept as the
// second view, which is what the original objection was actually about.

  internal: { label: 'Raised by us', tone: 'neutral' },

// --- middle column: one thread, read through a filter ---
// The demo runs on one clock: Wednesday 26 August 2026, 10:22 AM AEST. Every event
// carries the day it happened on, and the thread is grouped by that day, so the
// reader never has to hold "Mon 25 Aug" and "Tuesday, 4:41 PM" in their head at once.
const TODAY_KEY = '2026-08-26';
const dayNum = (k) => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const TODAY_NUM = dayNum(TODAY_KEY);
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

const dayLabel = (k) => {
  const [y, m, d] = k.split('-').map(Number);
  const full = `${WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]} ${d} ${MONTHS[m - 1]}`;
  const ago = TODAY_NUM - dayNum(k);
  if (ago < 0) return { lead: 'Coming up', trail: full };
  if (ago === 0) return { lead: 'Today', trail: full };
  if (ago === 1) return { lead: 'Yesterday', trail: full };
  return { lead: full, trail: `${ago} days ago` };
};

// Contiguous runs of the same day become one group. The data is already newest first.
const byDay = (rows) => rows.reduce((acc, t) => {
  const k = t.d || TODAY_KEY;
  const last = acc[acc.length - 1];
  if (last && last.d === k) last.items.push(t); else acc.push({ d: k, items: [t] });
  return acc;
}, []);

const THREAD_GRID = { display: 'grid', gridTemplateColumns: '52px 26px minmax(0, 1fr)', columnGap: 16 };

// Watch progress reads as a number and a word, never a bare coloured bar.
const Meter = ({ pct }) => {
  const done = pct >= 100;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 9 }}>
      <div style={{ width: 116, height: 4, borderRadius: 2, background: T.track, overflow: 'hidden' }}>
        <div style={{ width: `${Math.max(4, Math.min(100, pct))}%`, height: '100%', borderRadius: 2,
          background: done ? T.green : '#F59E0B' }} />
      </div>
      <span className="tnum" style={{ fontSize: 12, fontWeight: 600, color: done ? T.greenDark : T.amber }}>
        {done ? 'Watched all of it' : `Stopped at ${pct}%`}
      </span>
    </div>
  );
};

// Email state is a fact about the row, not a status badge. A dot and a word, not a pill.
const Meta = ({ tone, children }) => {
  const t = TONES[tone] || TONES.neutral;
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, marginTop: 9 }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: t.fg, flexShrink: 0 }} />
      <span style={{ fontSize: 12, fontWeight: 600, color: t.fg }}>{children}</span>
    </div>
  );
};

const DayHead = ({ dayKey }) => {
  const { lead, trail } = dayLabel(dayKey);
  const future = dayNum(dayKey) > TODAY_NUM;
  return (
    <div style={{ position: 'sticky', top: 0, zIndex: 2, background: T.bg,
      padding: '13px 0 12px', display: 'flex', alignItems: 'center', gap: 12 }}>
      <span style={{ fontSize: 12.5, fontWeight: 700, whiteSpace: 'nowrap',
        color: future ? T.blue : T.text }}>{lead}</span>
      <span style={{ flex: 1, height: 1, background: T.border }} />
      <span className="tnum" style={{ fontSize: 12, color: T.mutedSoft, whiteSpace: 'nowrap' }}>{trail}</span>
    </div>
  );
};

// Silence is the one thing a list of events cannot say. `days` is the count of empty
// days between the two groups, so a 4 day step reads as 3 days with nothing in them.
const QuietGap = ({ days }) => (
  <div style={THREAD_GRID}>
    <div />
    <div style={{ position: 'relative', height: 38 }}>
      <div style={{ position: 'absolute', left: 12, top: 0, bottom: 0, width: 2,
        backgroundImage: `repeating-linear-gradient(to bottom, ${T.spine} 0 3px, transparent 3px 8px)` }} />
    </div>
    <div className="tnum" style={{ fontSize: 12, color: T.mutedSoft, paddingTop: 11 }}>
      {`${days} days with nothing at all`}
    </div>
  </div>
);

const EventRow = ({ t, first, tail, onOpenCalls }) => {
  const tone = TONES[t.tone] || TONES.neutral;
  // An anchor gets a badge: something went wrong, or a human was involved, or this is
  // where the story starts. Everything else is a dot, so the anchors carry the shape.
  const anchor = t.tone === 'red' || t.tone === 'amber' || t.lane === 'call'
    || t.lane === 'signup' || t.lane === 'ticket';
  const alarm = t.tone === 'red';
  const opens = t.lane === 'call' && !!onOpenCalls;
  // A boxed row pulls back by its own padding so every title in the thread starts on
  // the same vertical edge, boxed or not.
  const boxed = alarm || opens;
  const box = alarm ? { background: T.redSoft, border: `1px solid ${T.redBorder}` }
            : opens ? { background: T.card, border: `1px solid ${T.border}` } : null;
  const anchorY = boxed ? 21 : 11;
  const line = tail ? { top: 0, height: first ? 0 : anchorY }
                    : { top: first ? anchorY : 0, bottom: 0 };

  const words = (
    <Fragment>
      <div style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.4, color: T.text }}>{t.title}</div>
      {t.body && <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.textSoft, marginTop: 3 }}>{t.body}</div>}
      {t.video && <Meter pct={t.video.pct} />}
      {t.email && <Meta tone={t.email.tone}>{t.email.state}</Meta>}
      {/* The one event on the page the product database cannot see. Kept, and labelled, so the
          limit Shishir drew is visible rather than argued about later. */}
      {t.frontEnd && <Meta tone="amber">Front end only, not in the database</Meta>}
    </Fragment>
  );

  return (
    <div style={{ ...THREAD_GRID, alignItems: 'start' }}>
      <div className="tnum" style={{ fontSize: 12, fontWeight: 600, color: T.mutedSoft,
        textAlign: 'right', paddingTop: anchorY - 9, whiteSpace: 'nowrap' }}>{t.when}</div>

      <div style={{ position: 'relative', alignSelf: 'stretch' }}>
        <div style={{ position: 'absolute', left: 12, width: 2, background: T.spine, ...line }} />
        {anchor ? (
          <div style={{ position: 'absolute', left: 1, top: anchorY - 12, width: 24, height: 24,
            borderRadius: '50%', background: tone.bg, border: `1px solid ${tone.bd}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name={LANE_ICON[t.lane] || 'activity'} size={12} color={tone.fg} strokeWidth={2.1} />
          </div>
        ) : (
          <div style={{ position: 'absolute', left: 8, top: anchorY - 5, width: 9, height: 9,
            borderRadius: '50%', background: t.tone === 'green' ? T.green : T.dotQuiet,
            boxShadow: `0 0 0 3px ${T.bg}` }} />
        )}
      </div>

      <div style={{ paddingBottom: tail ? 2 : 22, minWidth: 0 }}>
        {opens ? (
          <button data-row onClick={onOpenCalls} style={{ ...box, borderRadius: 10, padding: '11px 14px',
            marginLeft: -14, width: 'calc(100% + 14px)', textAlign: 'left', display: 'flex',
            alignItems: 'center', gap: 12, color: 'inherit' }}>
            <div style={{ flex: 1, minWidth: 0 }}>{words}</div>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, color: T.muted,
              fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap' }}>
              Open<Icon name="right" size={14} />
            </span>
          </button>
        ) : boxed ? (
          <div style={{ ...box, borderRadius: 10, padding: '11px 14px', marginLeft: -14 }}>{words}</div>
        ) : words}
      </div>
    </div>
  );
};

// Where a lane's data comes from, said out loud on the lane itself. Shishir would not
// commit to how deep the Mixpanel feed goes, so the app-activity lane says that rather than
// letting the demo imply the fidelity is free. He also assumed the video data came from
// Mixpanel; it comes from the Academy's own player, which is the answer given on the call.

const LaneSource = ({ info }) => info ? (
  <div style={{ padding: '10px 12px', background: info.live ? T.fieldBg : T.amberSoft,
    border: `1px solid ${info.live ? T.border : T.amberBorder}`, borderRadius: T.radiusSm,
    marginBottom: 4 }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
      <Icon name={info.live ? 'spark' : 'alert'} size={13} color={info.live ? T.mutedSoft : T.amber} />
      <Pill tone={info.live ? 'green' : 'amber'}>{info.live ? 'Live at launch' : info.blocker}</Pill>
    </div>
    <div style={{ fontSize: 12, color: info.live ? T.muted : T.amber, lineHeight: 1.55 }}>{info.source}</div>
  </div>

const Thread = ({ rows, note, onOpenCalls, showGaps, info }) => {
  const groups = byDay(rows);
  return (
    <div style={{ width: '100%', maxWidth: 700, margin: '0 auto', padding: '9px 22px 28px' }}>
      <LaneSource info={info} />
      {groups.map((g, gi) => {
        const next = groups[gi + 1];
        const gap = next && dayNum(g.d) <= TODAY_NUM ? dayNum(g.d) - dayNum(next.d) : 0;
        const lastGroup = gi === groups.length - 1;
        return (
          <Fragment key={g.d}>
            <DayHead dayKey={g.d} />
            {g.items.map((t, i) => (
              <EventRow key={i} t={t} first={i === 0} onOpenCalls={onOpenCalls}
                        tail={lastGroup && i === g.items.length - 1} />
            ))}
            {showGaps && gap >= 4 && <QuietGap days={gap - 1} />}
          </Fragment>
        );
      })}
      <div style={{ marginTop: 6, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>{note}</div>
    </div>
  );
};

const PersonScreen = ({ id, onBack, onOpen, onCall, agentName, demo, onContact,
                       onOpenTicket, onNewTicket, onMessage }) => {
  const p = byId(id);
  const startLane = p.chat.state === 'needs_you' ? 'chat' : 'all';
  const [lane, setLane] = useState(startLane);
  const [chatState, setChatState] = useState(p.chat.state);
  const [msgs, setMsgs] = useState(p.chat.messages);
  const [booking, setBooking] = useState(false);

  // Moving between people must never leak one person's conversation into another's.
  useEffect(() => {
    setLane(startLane);
    setChatState(p.chat.state);
    setMsgs(p.chat.messages);
    setBooking(false);
  }, [p.id]);

  const rows = lane === 'all' ? p.timeline
    : lane === 'behaviour' ? p.timeline.filter(t => t.lane === 'behaviour' || t.lane === 'signup')
    : p.timeline.filter(t => t.lane === lane);

  const chatPill = chatState === 'needs_you' ? { tone: 'red', label: `Waiting for you, ${p.chat.waitingSince}` }
    : chatState === 'you' ? { tone: 'green', label: 'You are replying' }
    : chatState === 'bot' ? { tone: 'neutral', label: 'Bot active' } : null;

  const st = statusOf(p, demo);
  const due = callDue(p, demo);
  const openTickets = ticketsOf(p).filter(t => tStatus(t, demo) !== 'closed').length;

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
      <PeopleRail currentId={id} onOpen={onOpen} product={prodOf(p)} demo={demo} stream={streamOf(p)} />

      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '14px 22px 0', borderBottom: `1px solid ${T.border}`,
          background: T.card, flexShrink: 0 }}>
          {/* THE HEADER, rebuilt 4 Sep. It had 4 chips stacking vertically beside the name
              and 5 equal-weight outline buttons, so there was no primary action and the
              urgency was spread across 3 red things at once. Now: 1 line for identity and
              the action, 1 line of facts, 1 line of chips that never stacks, and the reason
              the primary button says what it says. "Best next move" moved out of the right
              column to here, because it is an action and it belongs with the buttons. */}
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: S.md + 1 }}>
            <button data-btn="quiet" onClick={onBack} style={{ border: 'none', background: 'transparent',
              color: T.muted, padding: S.xs, display: 'flex', marginTop: 2 }}><Icon name="back" size={17} /></button>
            <Avatar name={p.name} size={40} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <h1 style={{ ...TX.title, margin: 0 }}>{p.name}</h1>
              <div style={{ color: T.mutedSoft, ...TX.label, marginTop: 2 }}>
                {p.business} · {p.phone}{p.localTime ? ` · ${p.localTime} their time` : ''}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: S.sm, flexShrink: 0 }}>
              <Btn variant="primary" icon={NEXT_ICON[p.recommend.label] || 'chat'}
                onClick={() => (NEXT_IS_CALL[p.recommend.label] ? onCall() : setLane('chat'))}>
                {p.recommend.label}
              </Btn>
              <Btn variant="secondary" icon="chat" onClick={() => onMessage(p)}>Message</Btn>
              <HeaderMore items={[
                ...(bucketOf(p, demo) === 'now'
                  ? [{ icon: 'check', label: 'Mark as contacted', onClick: () => onContact(p.id) }] : []),
                { icon: 'phone', label: 'Call', onClick: onCall },
                { icon: 'video', label: 'Book a time', onClick: () => setBooking(true) },
                { icon: 'mail', label: 'Email', hint: 'Not connected yet', disabled: true },
              ]} />
            </div>
          </div>

          {/* One chip row, on its own line so it can never stack against the name. */}
          <div style={{ display: 'flex', alignItems: 'center', gap: S.sm - 2, flexWrap: 'wrap',
            marginTop: S.sm + 2, paddingLeft: 66 }}>
            <Chip tone={st.tone}>{st.label}</Chip>
            {chatPill && <Chip tone={chatPill.tone}>{chatPill.label}</Chip>}
            {due && <Chip tone="urgent" icon="clock">{due}</Chip>}
            {p.unverified && <Chip tone="neutral" shape="bare">No Sole account</Chip>}
            {openTickets > 0 && (
              <button data-btn="quiet" onClick={() => setLane('ticket')}

                <Chip tone="neutral" icon="ticket">{openTickets} open</Chip>
              </button>
            )}
          </div>

          {/* Why the primary button says what it says. Without this the recommendation is an
              instruction with no reasoning, which is the thing that stops agents trusting it. */}
          {p.recommend.why && (
            <div style={{ ...TX.label, color: T.muted, marginTop: S.sm - 2, paddingLeft: 66 }}>
              {p.recommend.why}

          )}

          <div style={{ display: 'flex', gap: 2, marginTop: 12, overflowX: 'auto' }}>
            {LANES.map(l => {
              const n = l.key === 'all' ? 0 : laneCount(p, l.key);
              const on = lane === l.key;
              const urgent = l.key === 'chat' && chatState === 'needs_you';
              return (
                <button key={l.key} data-btn="quiet" onClick={() => setLane(l.key)}

                    fontWeight: on ? 700 : 500, whiteSpace: 'nowrap',
                    color: on ? T.primaryDark : urgent ? T.red : T.muted,
                    borderBottom: `2px solid ${on ? T.primary : 'transparent'}`, marginBottom: -1 }}>
                  {l.label}
                  {LANE_INFO[l.key] && !LANE_INFO[l.key].live && (
                    <span title="Not connected yet" style={{ display: 'inline-block', width: 6, height: 6,
                      borderRadius: '50%', background: T.amberBorder, marginLeft: 6,
                      verticalAlign: 'middle' }} />

                  {l.key !== 'all' && n > 0 && (

                  )}
