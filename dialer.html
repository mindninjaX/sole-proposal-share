<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; height: 100%; }

  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #5B5BF6 !important; box-shadow: 0 0 0 3px rgba(91,91,246,0.12); }
  button[data-btn] { transition: background .12s, border-color .12s, box-shadow .12s, transform .05s, filter .12s; }
  button[data-btn]:active { transform: translateY(0.5px); }
  button[data-btn="primary"]:hover { filter: brightness(0.94); }
  button[data-btn="secondary"]:hover { border-color: #C7C9FB; color: #4F46E5; background: #F5F6FF; }
  button[data-btn="quiet"]:hover { background: #F3F4F6; }
  [data-row] { transition: background .12s, border-color .12s; }
  [data-row]:hover { background: #F8F8FE; border-color: #D8D9F8; }
  .scroll { overflow-y: auto; }
  /* Times sit in a fixed gutter down the thread. Proportional digits make that
     column ragged, so every clock and percentage on the page is tabular. */
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #D8DAE0; border-radius: 5px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes livedot { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); } 70% { box-shadow: 0 0 0 7px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .rise > * { animation: rise .4s cubic-bezier(.22,1,.36,1) both; }
  .rise > *:nth-child(1) { animation-delay: .02s; }
  .rise > *:nth-child(2) { animation-delay: .06s; }
  .rise > *:nth-child(3) { animation-delay: .10s; }
  .rise > *:nth-child(n+4) { animation-delay: .14s; }
  /* The 3 column workspace collapses in 2 steps: reference column first, then the people rail.
     Support agents may open this on a 13 inch laptop or on half a screen. */
  @media (max-width: 1180px) { [data-col="right"] { display: none !important; } }
  @media (max-width: 1000px) { [data-col="left"] { display: none !important; } }
  @media (max-width: 860px)  {
    [data-stats] { flex-direction: column !important; }
    [data-cols] { grid-template-columns: 1.6fr 1fr 1.2fr !important; }
    [data-cols] > :nth-child(3), [data-cols] > :nth-child(4) { display: none; }
  }

    borderRadius: T.radiusSm, fontWeight: 600, fontSize: big ? 14 : 13,
    padding: big ? '11px 16px' : '8px 13px', minHeight: big ? 44 : 36,
    width: full ? '100%' : 'auto', border: '1px solid transparent',
    opacity: disabled ? 0.5 : 1, cursor: disabled ? 'default' : 'pointer',
  };
  const skins = {
    primary:   { background: T.primary, borderColor: T.primaryDark, color: '#fff', boxShadow: '0 1px 2px rgba(16,24,40,0.10)' },
    secondary: { background: T.card, borderColor: T.border, color: T.textSoft },
    quiet:     { background: 'transparent', borderColor: 'transparent', color: T.muted },
  };
  return (
    <button data-btn={variant} disabled={disabled} onClick={disabled ? undefined : onClick}
            style={{ ...base, ...skins[variant], ...style }}>
      {icon && <Icon name={icon} size={big ? 16 : 15} />}{children}

  );

  const initials = String(name || '?').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: c + '18',
      color: c, border: `1px solid ${c}33`, display: 'flex', alignItems: 'center',
      justifyContent: 'center', fontWeight: 700, fontSize: size * 0.36, flexShrink: 0 }}>{initials}</div>
  );

const laneCount = (p, key) =>
    key === 'chat' ? (p.chat.messages || []).filter(m => m.from !== 'system').length
  : key === 'call' ? (p.calls || []).length
  : p.timeline.filter(t => t.lane === key || (key === 'behaviour' && t.lane === 'signup')).length;

const inBucket = (key) => PEOPLE.filter(p => p.bucket === key)
  // Anyone sitting in a live chat waiting on a human goes first. They are the only
  // people here who can tell they are being ignored.
  .slice().sort((x, y) => (y.chat.state === 'needs_you' ? 1 : 0) - (x.chat.state === 'needs_you' ? 1 : 0));

const ChatLane = ({ p, agentName, state, setState, msgs, setMsgs }) => {
  const [draft, setDraft] = useState('');
  const boxRef = useRef(null);
  useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [msgs]);
  useEffect(() => { setDraft(''); }, [p.id]);

  if (p.chat.state === 'none') return <Empty>{p.chat.empty}</Empty>;

  const now = () => '10:22 AM';
  const takeOver = () => { setState('you'); setMsgs(m => [...m, { from: 'system', when: now(), text: `${agentName} took over from the bot` }]); };
  const handBack = () => { setState('bot'); setMsgs(m => [...m, { from: 'system', when: now(), text: `${agentName} handed the conversation back to the bot` }]); };
  const send = () => {
    const t = draft.trim(); if (!t) return;
    setMsgs(m => [...m, { from: 'agent', when: now(), text: t }]); setDraft('');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      {state === 'needs_you' && (
        <div style={{ background: T.redSoft, border: `1px solid ${T.redBorder}`, borderRadius: T.radiusSm,
          padding: 14, marginBottom: 16, display: 'flex', alignItems: 'center', gap: 12,
          flexWrap: 'wrap', flexShrink: 0 }}>
          <Icon name="chat" size={17} color={T.red} />
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: T.red }}>
              {p.name.split(' ')[0]} asked to speak to a person, {p.chat.waitingSince} ago.
            </div>
            <div style={{ fontSize: 12.5, color: T.textSoft, marginTop: 2 }}>{p.chat.toldUser}</div>
          </div>
          <Btn variant="primary" icon="chat" onClick={takeOver}>Take over</Btn>
        </div>
      )}

      <div ref={boxRef} className="scroll" style={{ flex: 1, minHeight: 160, overflowY: 'auto',
        display: 'flex', flexDirection: 'column', gap: 14, paddingRight: 4 }}>
        {msgs.map((m, i) => <Bubble key={i} m={m} agentName={agentName} />)}
      </div>

      <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.borderSoft}`, flexShrink: 0 }}>
        {state === 'you' ? (
          <Fragment>
            <div style={{ display: 'flex', gap: 10 }}>
              <input value={draft} onChange={e => setDraft(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') send(); }}
                placeholder={`Write to ${p.name.split(' ')[0]}...`}
                style={{ flex: 1, border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
                  padding: '11px 13px', background: T.card, minHeight: 44 }} />
              <Btn variant="primary" big onClick={send} disabled={!draft.trim()}>Send</Btn>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 9 }}>
              <span style={{ fontSize: 12.5, color: T.mutedSoft, flex: 1 }}>
                You are replying. The bot has stepped back and will not send anything.
              </span>
              <Btn variant="quiet" onClick={handBack}>Hand back to the bot</Btn>
            </div>
          </Fragment>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 220, background: T.fieldBg, border: `1px solid ${T.border}`,
              borderRadius: T.radiusSm, padding: '11px 13px', color: T.mutedSoft, fontSize: 13.5,
              minHeight: 44, display: 'flex', alignItems: 'center' }}>
              {state === 'quiet' ? 'This conversation is closed. Reply and it opens again.'
                                 : 'The bot is answering. Take over if you want to reply yourself.'}
            </div>
            {state !== 'needs_you' && <Btn variant="secondary" big icon="chat" onClick={takeOver}>Take over</Btn>}
          </div>
        )}

    </div>
  );
};

// --- middle column: one thread, read through a filter ---
// The demo runs on one clock: Wednesday 26 August 2026, 10:22 AM AEST. Every event
// carries the day it happened on, and the thread is grouped by that day, so the
// reader never has to hold "Mon 25 Aug" and "Tuesday, 4:41 PM" in their head at once.
const TODAY_KEY = '2026-08-26';
const dayNum = (k) => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const TODAY_NUM = dayNum(TODAY_KEY);
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

const dayLabel = (k) => {
  const [y, m, d] = k.split('-').map(Number);
  const full = `${WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]} ${d} ${MONTHS[m - 1]}`;
  const ago = TODAY_NUM - dayNum(k);
  if (ago < 0) return { lead: 'Coming up', trail: full };
  if (ago === 0) return { lead: 'Today', trail: full };
  if (ago === 1) return { lead: 'Yesterday', trail: full };
  return { lead: full, trail: `${ago} days ago` };
};

// Contiguous runs of the same day become one group. The data is already newest first.
const byDay = (rows) => rows.reduce((acc, t) => {
  const k = t.d || TODAY_KEY;
  const last = acc[acc.length - 1];
  if (last && last.d === k) last.items.push(t); else acc.push({ d: k, items: [t] });
  return acc;
}, []);

const THREAD_GRID = { display: 'grid', gridTemplateColumns: '52px 26px minmax(0, 1fr)', columnGap: 16 };

// Watch progress reads as a number and a word, never a bare coloured bar.
const Meter = ({ pct }) => {
  const done = pct >= 100;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 9 }}>
      <div style={{ width: 116, height: 4, borderRadius: 2, background: T.track, overflow: 'hidden' }}>
        <div style={{ width: `${Math.max(4, Math.min(100, pct))}%`, height: '100%', borderRadius: 2,
          background: done ? T.green : '#F59E0B' }} />
      </div>
      <span className="tnum" style={{ fontSize: 12, fontWeight: 600, color: done ? T.greenDark : T.amber }}>
        {done ? 'Watched all of it' : `Stopped at ${pct}%`}
      </span>
    </div>
  );
};

// Email state is a fact about the row, not a status badge. A dot and a word, not a pill.
const Meta = ({ tone, children }) => {
  const t = TONES[tone] || TONES.neutral;
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, marginTop: 9 }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: t.fg, flexShrink: 0 }} />
      <span style={{ fontSize: 12, fontWeight: 600, color: t.fg }}>{children}</span>
    </div>
  );
};

const DayHead = ({ dayKey }) => {
  const { lead, trail } = dayLabel(dayKey);
  const future = dayNum(dayKey) > TODAY_NUM;
  return (
    <div style={{ position: 'sticky', top: 0, zIndex: 2, background: T.bg,
      padding: '13px 0 12px', display: 'flex', alignItems: 'center', gap: 12 }}>
      <span style={{ fontSize: 12.5, fontWeight: 700, whiteSpace: 'nowrap',
        color: future ? T.blue : T.text }}>{lead}</span>
      <span style={{ flex: 1, height: 1, background: T.border }} />
      <span className="tnum" style={{ fontSize: 12, color: T.mutedSoft, whiteSpace: 'nowrap' }}>{trail}</span>
    </div>
  );
};

// Silence is the one thing a list of events cannot say. `days` is the count of empty
// days between the two groups, so a 4 day step reads as 3 days with nothing in them.
const QuietGap = ({ days }) => (
  <div style={THREAD_GRID}>
    <div />
    <div style={{ position: 'relative', height: 38 }}>
      <div style={{ position: 'absolute', left: 12, top: 0, bottom: 0, width: 2,
        backgroundImage: `repeating-linear-gradient(to bottom, ${T.spine} 0 3px, transparent 3px 8px)` }} />
    </div>
    <div className="tnum" style={{ fontSize: 12, color: T.mutedSoft, paddingTop: 11 }}>
      {`${days} days with nothing at all`}
    </div>
  </div>
);

const EventRow = ({ t, first, tail, onOpenCalls }) => {
  const tone = TONES[t.tone] || TONES.neutral;
  // An anchor gets a badge: something went wrong, or a human was involved, or this is
  // where the story starts. Everything else is a dot, so the anchors carry the shape.
  const anchor = t.tone === 'red' || t.tone === 'amber' || t.lane === 'call' || t.lane === 'signup';
  const alarm = t.tone === 'red';
  const opens = t.lane === 'call' && !!onOpenCalls;
  // A boxed row pulls back by its own padding so every title in the thread starts on
  // the same vertical edge, boxed or not.
  const boxed = alarm || opens;
  const box = alarm ? { background: T.redSoft, border: `1px solid ${T.redBorder}` }
            : opens ? { background: T.card, border: `1px solid ${T.border}` } : null;
  const anchorY = boxed ? 21 : 11;
  const line = tail ? { top: 0, height: first ? 0 : anchorY }
                    : { top: first ? anchorY : 0, bottom: 0 };

  const words = (
    <Fragment>
      <div style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.4, color: T.text }}>{t.title}</div>
      {t.body && <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.textSoft, marginTop: 3 }}>{t.body}</div>}
      {t.video && <Meter pct={t.video.pct} />}
      {t.email && <Meta tone={t.email.tone}>{t.email.state}</Meta>}
    </Fragment>
  );

  return (
    <div style={{ ...THREAD_GRID, alignItems: 'start' }}>
      <div className="tnum" style={{ fontSize: 12, fontWeight: 600, color: T.mutedSoft,
        textAlign: 'right', paddingTop: anchorY - 9, whiteSpace: 'nowrap' }}>{t.when}</div>

      <div style={{ position: 'relative', alignSelf: 'stretch' }}>
        <div style={{ position: 'absolute', left: 12, width: 2, background: T.spine, ...line }} />
        {anchor ? (
          <div style={{ position: 'absolute', left: 1, top: anchorY - 12, width: 24, height: 24,
            borderRadius: '50%', background: tone.bg, border: `1px solid ${tone.bd}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name={LANE_ICON[t.lane] || 'activity'} size={12} color={tone.fg} strokeWidth={2.1} />
          </div>
        ) : (
          <div style={{ position: 'absolute', left: 8, top: anchorY - 5, width: 9, height: 9,
            borderRadius: '50%', background: t.tone === 'green' ? T.green : T.dotQuiet,
            boxShadow: `0 0 0 3px ${T.bg}` }} />
        )}
      </div>

      <div style={{ paddingBottom: tail ? 2 : 22, minWidth: 0 }}>
        {opens ? (
          <button data-row onClick={onOpenCalls} style={{ ...box, borderRadius: 10, padding: '11px 14px',
            marginLeft: -14, width: 'calc(100% + 14px)', textAlign: 'left', display: 'flex',
            alignItems: 'center', gap: 12, color: 'inherit' }}>
            <div style={{ flex: 1, minWidth: 0 }}>{words}</div>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, color: T.muted,
              fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap' }}>
              Open<Icon name="right" size={14} />
            </span>
          </button>
        ) : boxed ? (
          <div style={{ ...box, borderRadius: 10, padding: '11px 14px', marginLeft: -14 }}>{words}</div>
        ) : words}
      </div>
    </div>
  );
};

const Thread = ({ rows, note, onOpenCalls, showGaps }) => {
  const groups = byDay(rows);
  return (
    <div style={{ width: '100%', maxWidth: 700, margin: '0 auto', padding: '9px 22px 28px' }}>
      {groups.map((g, gi) => {
        const next = groups[gi + 1];
        const gap = next && dayNum(g.d) <= TODAY_NUM ? dayNum(g.d) - dayNum(next.d) : 0;
        const lastGroup = gi === groups.length - 1;
        return (
          <Fragment key={g.d}>
            <DayHead dayKey={g.d} />
            {g.items.map((t, i) => (
              <EventRow key={i} t={t} first={i === 0} onOpenCalls={onOpenCalls}
                        tail={lastGroup && i === g.items.length - 1} />
            ))}
            {showGaps && gap >= 4 && <QuietGap days={gap - 1} />}
          </Fragment>
        );
      })}
      <div style={{ marginTop: 6, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>{note}</div>
    </div>
  );
};

// --- screen 2: the person, 3 columns ---
const PersonScreen = ({ id, onBack, onOpen, onCall, agentName }) => {
  const p = byId(id);
  const [lane, setLane] = useState(p.chat.state === 'needs_you' ? 'chat' : 'all');
  const [chatState, setChatState] = useState(p.chat.state);
  const [msgs, setMsgs] = useState(p.chat.messages);

  // Moving between people must never leak one person's conversation into another's.
  useEffect(() => {
    setLane(p.chat.state === 'needs_you' ? 'chat' : 'all');
    setChatState(p.chat.state);
    setMsgs(p.chat.messages);
  }, [p.id]);

  const rows = lane === 'all' ? p.timeline
    : lane === 'behaviour' ? p.timeline.filter(t => t.lane === 'behaviour' || t.lane === 'signup')
    : p.timeline.filter(t => t.lane === lane);

  const chatPill = chatState === 'needs_you' ? { tone: 'red', label: `Waiting for you, ${p.chat.waitingSince}` }
    : chatState === 'you' ? { tone: 'green', label: 'You are replying' }
    : chatState === 'bot' ? { tone: 'neutral', label: 'Bot active' } : null;

  return (
    <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
      <PeopleRail currentId={id} onOpen={onOpen} />

      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '14px 22px 0', borderBottom: `1px solid ${T.border}`,
          background: T.card, flexShrink: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 13 }}>
            <button data-btn="quiet" onClick={onBack} style={{ border: 'none', background: 'transparent',
              color: T.muted, padding: 4, display: 'flex' }}><Icon name="back" size={17} /></button>
            <Avatar name={p.name} size={40} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
                <h1 style={{ fontSize: 18, fontWeight: 800, letterSpacing: '-0.02em', margin: 0 }}>{p.name}</h1>
                <Pill tone={p.statusTone}>{p.status}</Pill>
                {chatPill && <Pill tone={chatPill.tone}>{chatPill.label}</Pill>}
              </div>
              <div style={{ color: T.mutedSoft, fontSize: 12.5, marginTop: 2 }}>
                {p.business} · {p.city} · {p.localTime} their time
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant={p.recommend.label === 'Call' ? 'primary' : 'secondary'} icon="phone" onClick={onCall}>Call</Btn>
              <Btn variant="secondary" icon="mail">Email</Btn>
              <Btn variant="secondary" icon="video">Book</Btn>
            </div>
          </div>

          <div style={{ display: 'flex', gap: 2, marginTop: 12, overflowX: 'auto' }}>
            {LANES.map(l => {
              const n = l.key === 'all' ? 0 : laneCount(p, l.key);
              const on = lane === l.key;
              const urgent = l.key === 'chat' && chatState === 'needs_you';
              return (
                <button key={l.key} data-btn="quiet" onClick={() => setLane(l.key)}
                  style={{ border: 'none', background: 'transparent', padding: '9px 12px', fontSize: 13,
                    fontWeight: on ? 700 : 500, whiteSpace: 'nowrap',
                    color: on ? T.primaryDark : urgent ? T.red : T.muted,
                    borderBottom: `2px solid ${on ? T.primary : 'transparent'}`, marginBottom: -1 }}>
                  {l.label}
                  {l.key !== 'all' && n > 0 && (
                    <span style={{ marginLeft: 6, fontSize: 11.5, fontWeight: 700,
                      color: urgent ? T.red : on ? T.primaryDark : T.mutedSoft }}>{n}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        <div className="scroll" style={{ flex: 1, overflowY: 'auto', minHeight: 0,
          display: 'flex', flexDirection: 'column' }}>
          {lane === 'chat' ? (
            <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column',
              width: '100%', maxWidth: 780, margin: '0 auto', padding: 22 }}>
              <ChatLane p={p} agentName={agentName} state={chatState} setState={setChatState}
                        msgs={msgs} setMsgs={setMsgs} />
            </div>
          ) : lane === 'call' ? (
            <div style={{ width: '100%', maxWidth: 760, margin: '0 auto', padding: 22 }}>
              {p.calls.length ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {p.calls.map(c => (
                    <CallCard key={c.id} c={c} agentName={agentName}
                              defaultOpen={p.calls.length === 1} />
                  ))}
                </div>
              ) : <Empty>No calls with {p.name.split(' ')[0]} yet.</Empty>}
            </div>
          ) : rows.length ? (
            <Thread rows={rows} showGaps={lane === 'all'}
                    onOpenCalls={p.calls.length ? () => setLane('call') : null} note={
              <Note>One thread from signup to now, newest first. The tabs above are the same
                list with the rest hidden, so nothing here is written down twice.</Note>
            } />
          ) : (
            <div style={{ width: '100%', maxWidth: 700, margin: '0 auto', padding: 22 }}>
              <Empty>Nothing here yet for {p.name.split(' ')[0]}.</Empty>
            </div>
          )}
        </div>
      </div>

      <div data-col="right" className="scroll" style={{ width: 330, flexShrink: 0, background: T.card,
        borderLeft: `1px solid ${T.border}`, overflowY: 'auto', padding: '20px 18px 48px' }}>
        <SectionTitle>Who this is</SectionTitle>
        <div style={{ fontSize: 13.5, lineHeight: 1.65, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {p.summary.map((s, i) => <p key={i} style={{ margin: 0 }}>{s}</p>)}
        </div>
        <div style={{ fontSize: 11.5, color: T.mutedSoft, marginTop: 10, lineHeight: 1.5 }}>{p.summarySource}</div>

        {p.sayOne.lead && (
          <div style={{ marginTop: 18, background: T.primarySofter, border: '1px solid #D5D7FB',
            borderRadius: T.radiusSm, padding: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: T.primaryDark, textTransform: 'uppercase',
              letterSpacing: '0.06em', marginBottom: 8 }}>Say one thing</div>
            <div style={{ fontSize: 13.5, lineHeight: 1.6, fontWeight: 500 }}>“{p.sayOne.lead}”</div>
            {!!p.sayOne.spares.length && (
              <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid #D5D7FB' }}>
                {p.sayOne.spares.map((s, i) => (
                  <div key={i} style={{ fontSize: 12.5, color: T.muted, marginTop: i ? 6 : 0 }}>· “{s}”</div>
                ))}
              </div>
            )}
            <div style={{ fontSize: 11.5, color: T.mutedSoft, marginTop: 10 }}>{p.sayOne.why}</div>
          </div>
        )}

        <div style={{ marginTop: 14, background: T.fieldBg, border: `1px solid ${T.border}`,
          borderRadius: T.radiusSm, padding: '11px 13px' }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 3 }}>Best next move: {p.recommend.label}</div>
          <div style={{ fontSize: 12, color: T.muted, lineHeight: 1.5 }}>{p.recommend.why}</div>
        </div>

        <RefLabel>Contact</RefLabel>
        <RefRow k="Mobile" v={p.phone} strong />
        <RefRow k="Email" v={p.email} />
        <RefRow k="Location" v={p.city} />
        <RefRow k="User ID" v={p.userId} />
        <RefRow k="Platform" v={p.platform} />

        <RefLabel>Business</RefLabel>
        <RefRow k="Business" v={p.business} strong />
        <RefRow k="Trade" v={p.trade} />
        <RefRow k="Website" v={p.website} />
        <RefRow k="ABN" v={p.abn} />

        <RefLabel>Subscription</RefLabel>
        <RefRow k="Plan" v={p.plan} strong />
        <RefRow k="Status" v={p.subStatus} />
        <RefRow k="Trial day" v={p.trialDay} />
        <RefRow k="Renews" v={p.renewal} />

        <RefLabel>Account</RefLabel>
        <RefRow k="Joined" v={p.joined} />
        <RefRow k="Last active" v={p.lastActive} />
        <RefRow k="Chat messages" v={p.totalMessages} />
        <RefRow k="Came from" v={p.source} />
      </div>
    </div>
  );
};

// --- the call itself ---
const CallOverlay = ({ p, onEnd, onCancel }) => {
  const [secs, setSecs] = useState(0);
  useEffect(() => { const t = setInterval(() => setSecs(s => s + 1), 1000); return () => clearInterval(t); }, []);
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = String(secs % 60).padStart(2, '0');
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(15,17,23,0.55)', zIndex: 90,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, animation: 'fade .16s ease' }}>
      <div style={{ background: T.card, borderRadius: 16, boxShadow: T.shadowLg, width: 'min(560px, 100%)',
        maxHeight: '90vh', overflow: 'auto', animation: 'rise .22s cubic-bezier(.22,1,.36,1) both' }}>
        <div style={{ padding: '20px 24px', borderBottom: `1px solid ${T.border}`,
          display: 'flex', alignItems: 'center', gap: 14 }}>
          <Avatar name={p.name} size={44} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 16 }}>{p.name}</div>
            <div style={{ fontSize: 13, color: T.muted }}>{p.phone}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: T.red, animation: 'livedot 1.6s infinite' }} />
            <div style={{ fontWeight: 700, fontSize: 16 }}>{mm}:{ss}</div>
          </div>
        </div>
        <div style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 18 }}>
          {p.sayOne.lead && (
            <div>
              <SectionTitle>Say this</SectionTitle>
              <div style={{ background: T.primarySofter, border: '1px solid #D5D7FB', borderRadius: T.radiusSm,
                padding: '14px 16px', fontSize: 15, lineHeight: 1.6 }}>“{p.sayOne.lead}”</div>
            </div>
          )}
          {!!p.sayOne.spares.length && (
            <div>
              <SectionTitle>Then ask</SectionTitle>
              {p.sayOne.spares.map((s, i) => (
                <div key={i} style={{ fontSize: 13.5, color: T.textSoft, marginTop: i ? 7 : 0 }}>· “{s}”</div>
              ))}
            </div>
          )}
          <div>
            <SectionTitle hint="Only if you want to. The call is recorded and written up for you anyway.">Notes</SectionTitle>
            <textarea placeholder="Anything you want to remember..." rows={3}
              style={{ width: '100%', border: `1px solid ${T.border}`, borderRadius: T.radiusSm,
                padding: 12, resize: 'vertical', background: T.fieldBg }} />
          </div>
        </div>
        <div style={{ padding: '16px 24px', borderTop: `1px solid ${T.border}`, background: T.fieldBg,
          borderRadius: '0 0 16px 16px', display: 'flex', gap: 10, alignItems: 'center' }}>
          <Btn variant="quiet" onClick={onCancel}>Cancel</Btn>
          <div style={{ flex: 1 }} />
          <Btn variant="primary" big icon="check" onClick={onEnd}>End call</Btn>
        </div>
      </div>
    </div>
  );
};

// --- recent calls: the manager's view ---
const ALL_CALLS = PEOPLE.flatMap(p => (p.calls || []).map(c => ({ ...c, person: p })));
const RecentScreen = ({ onOpen }) => (
  <div className="rise" style={{ display: 'flex', flexDirection: 'column', gap: 18,
    maxWidth: 1000, margin: '0 auto', padding: '28px 24px 80px', width: '100%' }}>
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 800, letterSpacing: '-0.03em', margin: 0 }}>Recent calls</h1>
      <div style={{ color: T.muted, fontSize: 13.5, marginTop: 5 }}>Everyone the team has spoken to.</div>
    </div>
    <Card pad={0}>
      <div data-cols style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr .6fr .7fr 1.2fr', gap: 14,
        padding: '12px 18px', borderBottom: `1px solid ${T.border}`, fontSize: 11.5, fontWeight: 700,
        color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
        <div>Who</div><div>When</div><div>How</div><div>Length</div><div>How it went</div>
      </div>
      {ALL_CALLS.map((c, i) => (
        <div key={c.id} data-row data-cols onClick={() => onOpen(c.person.id)}
          style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr .6fr .7fr 1.2fr', gap: 14,
            padding: '14px 18px', alignItems: 'center', cursor: 'pointer',
            borderBottom: i === ALL_CALLS.length - 1 ? 'none' : `1px solid ${T.borderSoft}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 11, minWidth: 0 }}>
            <Avatar name={c.person.name} size={32} />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{c.person.name}</div>
              <div style={{ fontSize: 12, color: T.mutedSoft, whiteSpace: 'nowrap',
                overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.person.business}</div>
            </div>
          </div>
          <div style={{ fontSize: 13, color: T.textSoft }}>{c.when}</div>
          <div style={{ fontSize: 13, color: T.muted }}>{c.how}</div>
          <div style={{ fontSize: 13, color: T.muted }}>{c.len}</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            <Pill tone={c.outcomeTone}>{c.outcome}</Pill>
            {c.score !== null && <Pill tone={c.score >= 7 ? 'green' : 'amber'}>{c.score}/10</Pill>}
          </div>
        </div>
      ))}
    </Card>
    <Note>Click any row to open that call inside the person it belongs to. Nothing lives on its own.</Note>
  </div>
);

// --- app ---
// Hash routing so a refresh lands where you were, and a screen can be linked in a message:
// #/person/p-priya, #/call/p-priya (in-call overlay), #/recent.
const parseHash = () => {
  const parts = String(window.location.hash || '').replace(/^#\/?/, '').split('/');
  const name = parts[0], id = parts[1];
  if (name === 'person' && byId(id)) return { name: 'person', id };
  if (name === 'call' && byId(id)) return { name: 'person', id, calling: id };
  if (name === 'recent') return { name: 'recent' };
  return { name: 'list' };
};

const App = () => {
  const [agent, setAgent] = useState('juhi');
  const [screen, setScreen] = useState(parseHash);
  const [calling, setCalling] = useState(() => parseHash().calling || null);
  const tab = screen.name === 'recent' ? 'recent' : 'list';
  const agentName = AGENTS.find(x => x.id === agent).name;

  useEffect(() => {
    const onHash = () => { const s = parseHash(); setScreen(s); setCalling(s.calling || null); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = (s) => {
    const h = s.name === 'list' ? '#/' : `#/${s.name}${s.id ? '/' + s.id : ''}`;
    if (window.location.hash !== h) window.location.hash = h;
    setScreen(s);
  };

  // The person view is a fixed 3 column workspace, so the page itself must not scroll.
  // The list and recent screens are ordinary documents, so they must.
  const workspace = screen.name === 'person';
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg }}>
      <DemoBanner />
      <TopBar agent={agent} setAgent={setAgent} tab={tab}
              setTab={(t) => go({ name: t === 'list' ? 'list' : 'recent' })} />
      <div className={workspace ? '' : 'scroll'} style={{ flex: 1, minHeight: 0, display: 'flex',
        flexDirection: 'column', overflowY: workspace ? 'hidden' : 'auto' }}>
        {screen.name === 'list' && <ListScreen agent={agent} onOpen={(id) => go({ name: 'person', id })} />}
        {screen.name === 'recent' && <RecentScreen onOpen={(id) => go({ name: 'person', id })} />}
        {screen.name === 'person' && (
          <PersonScreen id={screen.id} agentName={agentName}
            onBack={() => go({ name: 'list' })}
            onOpen={(id) => go({ name: 'person', id })}
            onCall={() => setCalling(screen.id)} />
        )}
      </div>
      {calling && (
        <CallOverlay p={byId(calling)} onCancel={() => setCalling(null)} onEnd={() => setCalling(null)} />
      )}
    </div>
  );
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return (
      <div style={{ padding: 30, margin: 30, background: '#FEF2F2', border: '1px solid #FECACA',
        borderRadius: 12, fontFamily: 'ui-monospace, monospace', fontSize: 13, color: '#991B1B' }}>
        <b>Something broke</b>
        <pre style={{ whiteSpace: 'pre-wrap', marginTop: 10 }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
