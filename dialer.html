<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Sole Dialer</title>
<!--
  THIS PAGE IS A REDIRECT, AND IT USED TO BE 214KB OF PROTOTYPE.

  It was the static walkthrough: invented people, invented tickets, invented calls,
  with a banner that called them customers. The real dialer now exists at
  /dialer-app/, reads the live database and is the thing anybody should be looking at.

  REDIRECTED RATHER THAN DELETED because Johann has this link in WhatsApp, and a dead
  link reads as a dead project. A 404 says "they gave up"; a redirect says "it moved".

  THE BODY HAD TO GO, not just be hidden. Any renderable markup below this point can
  paint for a frame before navigation, and a flash of the fake UI on the way to the
  real one is the specific thing this must not do. GitHub Pages cannot issue an HTTP
  301, so the redirect is client-side: location.replace runs before the parser reaches
  any content, and the <meta> below it covers a browser with JavaScript off.

  location.replace, not location.href: it does not leave an entry in history, so Back
  from the real app returns to wherever they came from rather than bouncing them
  through here again.

  THE HASH IS DELIBERATELY NOT FORWARDED. The old links carry fixture person ids, and
  those people do not exist in the live database, so forwarding one lands somebody on
  a record that cannot resolve.
-->
<script>location.replace('/sole-proposal-share/dialer-app/');</script>
<meta http-equiv="refresh" content="0; url=/sole-proposal-share/dialer-app/">
<style>
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         color:#0f172a; background:#f8fafc; display:grid; place-items:center;
         min-height:100vh; padding:24px; }
  .c { max-width:30rem; text-align:center; }
  a { color:#4f46e5; }
</style>
</head>
<body>
  <div class="c">
    <p>The dialer has moved.</p>
    <p><a href="/sole-proposal-share/dialer-app/">Open the dialer</a></p>
  </div>
</body>
</html>
