const fmtMoney = (n) => '$' + Number(n || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtMoney0 = (n) => '$' + Number(n || 0).toLocaleString('en-AU', { maximumFractionDigits: 0 });
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// colour + date helpers (same as pages/unibox.html) — Sole Academy's thumbnail and
// video-poster gradients need them.
const hexMix = (hex, towards, ratio) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const tr = parseInt(towards.slice(1, 3), 16), tg = parseInt(towards.slice(3, 5), 16), tb = parseInt(towards.slice(5, 7), 16);
  const mix = (a, c) => Math.round(a + (c - a) * ratio);
  const toHex = n => n.toString(16).padStart(2, '0');
  return `#${toHex(mix(r, tr))}${toHex(mix(g, tg))}${toHex(mix(b, tb))}`;
};
const darkenHex = (hex, r = 0.18) => hexMix(hex, '#141527', r);
const withAlpha = (hex, alpha) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const a = Math.round(Math.max(0, Math.min(1, alpha)) * 255).toString(16).padStart(2, '0');
  return `#${h}${a}`;
};
const fmtDate = (d) => d ? d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

const DAY_MS = 86400000;
const startOfDay = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const ACTIVITY_BY_DAY = [0, 2, 3, 1, 2, 2, 1, 2, 1, 2, 1, 1, 2];
const SEED_LABELS = ['Sent an invoice', 'Matched a bank transaction', 'Categorised an expense', 'Followed up an overdue invoice', 'Sent a payment reminder', 'Recorded a new asset', 'Attached a receipt'];
const SEED_ACTIVITY = (() => {
  const now = Date.now(); const out = [];
  ACTIVITY_BY_DAY.forEach((cnt, ago) => { for (let k = 0; k < cnt; k++) out.push({ ts: now - ago * DAY_MS - (k + 1) * 3600000, kind: 'done', label: SEED_LABELS[(ago + k) % SEED_LABELS.length] }); });
  return out;
})();
const computeStreak = (activity) => {
  const days = new Set(activity.map(a => startOfDay(a.ts)));
  let d = startOfDay(Date.now()); let streak = 0;
  if (!days.has(d)) d -= DAY_MS;
  while (days.has(d)) { streak++; d -= DAY_MS; }
  return streak;
};
const computeProgress = (activity) => {
  const today0 = startOfDay(Date.now()); const counts = {};
  activity.forEach(a => { const ago = Math.round((today0 - startOfDay(a.ts)) / DAY_MS); counts[ago] = (counts[ago] || 0) + 1; });
  return { today: counts[0] || 0, streak: computeStreak(activity) };
};

const HEALTH_DEF = 'Your business health starts at 100. Overdue invoices, unmatched transactions and untidy books lower it; clearing them lifts it back up. It never hits zero.';
const STREAK_DEF = "Days in a row you've checked in and cleared at least one thing. It never counts down — quieter days simply don't add to it.";
function computeHealth(items, streak = 0) {
  const penalty = items.reduce((s, it) => s + (it.weight || 0), 0);
  const score = clamp(Math.round(Math.max(40, 100 - penalty + Math.min(streak || 0, 5))), 1, 100);
  let band, label;
  if (score >= 80) { band = 'green'; label = 'In the green'; }
  else if (score >= 60) { band = 'amber'; label = 'A few things to tidy'; }
  else { band = 'red'; label = 'Needs attention'; }
  return { score, band, label };
}

  const pal = { neutral: { bg: T.fieldBg, fg: T.muted, bd: T.border }, green: { bg: T.greenSoft, fg: T.greenDark, bd: '#BBF0D8' }, amber: { bg: T.amberSoft, fg: T.amberText, bd: '#F3DDBB' }, red: { bg: T.redSoft, fg: T.redText, bd: '#F6C9CB' }, blue: { bg: T.blueSoft, fg: T.blue, bd: '#CADEFB' }, accent: { bg: T.primarySoft, fg: T.primary, bd: '#D9D9F7' } };
  const p = pal[tone] || pal.neutral;
  return <span style={{ display: 'inline-flex', alignItems: 'center', padding: '2px 8px', borderRadius: 999, background: p.bg, color: p.fg, border: `1px solid ${p.bd}`, fontSize: 10.5, fontWeight: 600, whiteSpace: 'nowrap', ...style }}>{children}</span>;
};
const IconTile = ({ icon, tone = 'accent', size = 44, iconSize = 20 }) => {

// health ring — stroke scales with size (ported fix); score-only when small
const HealthRing = ({ score, band, size = 60, celebrate }) => {
  const stroke = Math.max(4, Math.round(size * 0.1)), compact = size < 66;
  const r = (size / 2) - stroke / 2 - 1, c = 2 * Math.PI * r, off = c * (1 - clamp(score, 0, 100) / 100), col = BAND[band].color;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0, animation: celebrate ? 'ringpop .5s ease' : undefined }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.border} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: 'stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ fontSize: Math.round(size * (compact ? 0.36 : 0.3)), fontWeight: 800, color: col, lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{score}</div>
        {!compact && <div style={{ fontSize: 10, color: T.mutedSoft, fontWeight: 600 }}>/ 100</div>}
      </div>
    </div>
  );
};

// confetti — confined to the phone frame (position:absolute)
const CONFETTI_COLORS = [T.primary, T.green, T.amber, '#EC4899', T.blue];
const reduce = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const Confetti = ({ fire, big }) => {
  const [pieces, setPieces] = useState(null); const timer = useRef();
  useEffect(() => {
    if (!fire || reduce()) return;
    const n = big ? 80 : 36;
    setPieces(Array.from({ length: n }, (_, i) => ({ key: fire + '-' + i, left: Math.random() * 100, bg: CONFETTI_COLORS[i % CONFETTI_COLORS.length], w: 6 + Math.random() * 5, h: 8 + Math.random() * 7, delay: Math.random() * (big ? 0.3 : 0.18), dur: (big ? 1.4 : 1.05) + Math.random() * 0.5, rot: Math.random() * 360 })));
    clearTimeout(timer.current); timer.current = setTimeout(() => setPieces(null), big ? 2100 : 1600);
    return () => clearTimeout(timer.current);
  }, [fire]);
  if (!pieces) return null;
  return <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 60, overflow: 'hidden' }} aria-hidden="true">{pieces.map(p => <span key={p.key} style={{ position: 'absolute', top: -10, left: p.left + '%', width: p.w, height: p.h, background: p.bg, borderRadius: 2, animation: `confettiFall ${p.dur}s ease-in ${p.delay}s forwards` }} />)}</div>;
};

// cleared it loads the next 5. Browse-only — the CTAs below act on the front card.
const CARD_H = 210;
const SwipeDeck = ({ items, onAction }) => {
  const [batch, setBatch] = useState(() => items.slice(0, 5).map(i => i.id));   // stable snapshot order
  const [pos, setPos] = useState(0);                                            // which batch card is front (cycles)
  const [dx, setDx] = useState(0);
  const [dragging, setDragging] = useState(false);
  const start = useRef(null);
  // remove resolved ids; when the batch empties, load the next 5 most-urgent
  useEffect(() => {
    const ids = new Set(items.map(i => i.id));
    setBatch(prev => {
      const kept = prev.filter(id => ids.has(id));
      if (kept.length === 0 && items.length > 0) { setPos(0); return items.slice(0, 5).map(i => i.id); }
      return kept;
    });
  }, [items]);
  const byId = {}; items.forEach(i => { byId[i.id] = i; });
  const cards = batch.map(id => byId[id]).filter(Boolean);
  useEffect(() => { setPos(p => (cards.length ? p % cards.length : 0)); }, [cards.length]);
  if (!cards.length) return null;
  const n = cards.length;
  const f = pos % n;
  const front = cards[f];
  const isRed = (id) => id === 'not_match' || id === 'ignore' || id === 'not_asset';
  const onDown = (e) => { if (n < 2) return; start.current = e.clientX; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };
  const onMove = (e) => { if (start.current == null) return; setDx(e.clientX - start.current); };
  const onUp = (e) => {
    if (start.current == null) return;
    const d = e.clientX - start.current; start.current = null; setDragging(false);
    if (Math.abs(d) > 56 && n > 1) setPos(p => (p + 1) % n);   // send front below the stack; next rises
    setDx(0);
  };
  return (
    <div>
      <div style={{ position: 'relative', height: CARD_H, isolation: 'isolate' }}>
        {cards.map((it, j) => {
          const sp = (j - f + n) % n;                 // 0 = front, grows toward the back
          const isFront = sp === 0;
          const depth = Math.min(sp, 3);
          const tf = isFront ? `translateX(${dx}px) rotate(${dx * 0.03}deg)` : `translateY(${depth * 11}px) scale(${1 - depth * 0.05})`;
          return (
            <div key={it.id}
              onPointerDown={isFront ? onDown : undefined} onPointerMove={isFront ? onMove : undefined} onPointerUp={isFront ? onUp : undefined} onPointerCancel={isFront ? onUp : undefined}
              style={{ position: 'absolute', top: 0, left: 0, right: 0, height: CARD_H, background: T.card, borderRadius: 20, border: `1px solid ${T.borderSoft}`, boxShadow: isFront ? T.shadowLg : T.shadowSm, zIndex: 30 - sp, opacity: sp <= 2 ? 1 : 0, cursor: isFront ? 'grab' : 'default', touchAction: 'pan-y', transformOrigin: 'top center', transform: tf, transition: (isFront && dragging) ? 'none' : 'transform .34s cubic-bezier(.22,1,.36,1), opacity .34s ease' }}>
              <PriorityCard item={it} />
            </div>
          );
        })}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, margin: '16px 0 14px' }}>
        {cards.map((_, k) => <span key={k} style={{ width: k === f ? 18 : 6, height: 6, borderRadius: 999, background: k === f ? T.primary : T.border, transition: 'width .2s, background .2s' }} />)}
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
        <button className="tap press" onClick={() => onAction(front, front.primary.id)} style={{ height: 52, border: 'none', borderRadius: 14, background: T.primary, color: '#fff', fontSize: 16, fontWeight: 700 }}>{front.primary.label}</button>
        {front.secondary && front.secondary.length > 0 && (
          <div style={{ display: 'flex', gap: 9 }}>
            {front.secondary.map(s => <button key={s.id} className="tap press" onClick={() => onAction(front, s.id)} style={{ flex: 1, height: 44, border: `1px solid ${T.border}`, borderRadius: 12, background: T.card, color: isRed(s.id) ? T.redText : T.textSoft, fontSize: 14, fontWeight: 600 }}>{s.label}</button>)}
          </div>
        )}
      </div>
    </div>
  );
};
const UniboxScreen = ({ items, progress, allTime, onBack, onAction, onMore }) => {
  const [showAll, setShowAll] = useState(false);
  const health = useMemo(() => computeHealth(items, progress.streak), [items, progress.streak]);
  const ranked = useMemo(() => rankItems(items), [items]);
  const doneToday = progress.today || 0, remaining = items.length;
  const allClear = items.length === 0;
  // Persistent health ring: show a mini ring in the header once the health card scrolls
  // out of view; it shares `health`, so it fills live as items are completed.
  const scrollRef = useRef(null), healthRef = useRef(null);
  const [miniRing, setMiniRing] = useState(false);
  useEffect(() => {
    const root = scrollRef.current, target = healthRef.current;
    if (!root || !target || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver((es) => setMiniRing(!es[0].isIntersecting), { root, threshold: 0 });
    io.observe(target);
    return () => io.disconnect();
  }, []);

  const byModule = (mods) => ranked.filter(i => mods.includes(i.module));
  const groups = [
    { id: 'get_paid', icon: 'dollar', tone: 'accent', title: 'Get paid', items: byModule(['sales', 'quotes']) },
    { id: 'reconcile', icon: 'bank', tone: 'blue', title: 'Bank feed', items: byModule(['bankfeed']) },
    { id: 'expenses', icon: 'receipt', tone: 'amber', title: 'Expenses', items: byModule(['expenses']) },
    { id: 'assets', icon: 'layers', tone: 'green', title: 'Assets', items: byModule(['assets']) },
  ].filter(g => g.items.length > 0);
  const everythingCount = groups.length + 2; // + Liabilities + Key dates

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: T.bg }}>
      <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12, padding: '6px 12px 12px', background: T.card, borderBottom: `1px solid ${T.border}` }}>
        <button className="tap press" onClick={onBack} style={{ width: 40, height: 40, border: 'none', background: 'none', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="arrowLeft" size={24} color={T.text} /></button>
        <span style={{ fontSize: 22, fontWeight: 800, color: T.text }}>Unibox</span>
        <div style={{ flex: 1 }} />
        {miniRing && !allClear && <button className="tap press" title="Business health" onClick={() => scrollRef.current && scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' })} style={{ border: 'none', background: 'none', padding: 0, marginRight: 4, animation: 'fadeUp .25s ease' }}><HealthRing score={health.score} band={health.band} size={34} /></button>}
      </div>
      <div ref={scrollRef} className="screen-scroll" style={{ padding: '14px 14px 40px' }}>
        <div ref={healthRef}><HealthCard health={health} streak={progress.streak} /></div>

        {allClear ? (
          <div style={{ background: T.card, borderRadius: 18, boxShadow: T.shadowSm, textAlign: 'center', padding: '40px 24px', marginBottom: 14 }}>
            <div style={{ display: 'inline-flex', animation: 'ringpop .5s ease' }}><IconTile icon="sparkle" tone="green" size={64} iconSize={30} /></div>
            <div style={{ fontSize: 20, fontWeight: 800, color: T.text, marginTop: 14 }}>You're all clear ✨</div>
            <div style={{ fontSize: 13.5, color: T.muted, marginTop: 6 }}>Everything's actioned. Your business is in the green.</div>
          </div>
        ) : (
          <React.Fragment>
            {/* priorities — a swipeable card deck: swipe/tap to browse, act via the CTAs below */}
            <div style={{ marginBottom: 18 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', margin: '2px 2px 10px' }}>
                <span style={{ fontSize: 15.5, fontWeight: 800, color: T.text, letterSpacing: -0.2 }}>Do these first</span>
                <span style={{ fontSize: 12.5, color: T.muted }}><b style={{ color: T.text, fontWeight: 700 }}>{remaining}</b> to action{doneToday > 0 ? ` · ${doneToday} done` : ''}</span>
              </div>
              <SwipeDeck items={ranked} onAction={onAction} />
            </div>

            {/* everything else */}
            {!showAll ? (
              <button className="tap press" onClick={() => setShowAll(true)} style={{ width: '100%', border: `1px solid ${T.borderSoft}`, background: T.card, borderRadius: 16, boxShadow: T.shadowSm, padding: '16px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9, fontSize: 14.5, fontWeight: 700, color: T.textSoft }}>
                <Icon name="chevronDown" size={18} color={T.mutedSoft} />Show everything else<span style={{ color: T.mutedSoft, fontWeight: 500 }}>· {everythingCount} cards</span>
              </button>
            ) : (
              <React.Fragment>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '2px 2px 12px' }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: 0.6 }}>Everything else</span>
                  <div style={{ flex: 1, height: 1, background: T.borderSoft }} />
                  <button className="tap" onClick={() => setShowAll(false)} style={{ border: 'none', background: 'none', color: T.muted, fontSize: 13, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 4 }}><span style={{ display: 'inline-flex', transform: 'rotate(180deg)' }}><Icon name="chevronDown" size={14} /></span>Hide</button>
                </div>
                {groups.map(g => (
                  <CategoryCard key={g.id} icon={g.icon} tone={g.tone} title={g.title} items={g.items}
                    renderRow={(it, i, len) => <ItemRow key={it.id} item={it} onAction={onAction} onMore={onMore} last={i === len - 1} />} />
                ))}
                <UCard icon="scale" tone="amber" title="Liabilities & equity" count={LIABILITIES.length}>

                </UCard>
              </React.Fragment>
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
};

// Same key as the web build on purpose: one product, two platforms, one Pages origin.
const ACADEMY_STORE_KEY = 'sole.b2c.academy.v1';
const loadAcademy = () => { try { return JSON.parse(localStorage.getItem(ACADEMY_STORE_KEY) || '{}'); } catch (_) { return {}; } };
const saveAcademy = (patch) => { try { localStorage.setItem(ACADEMY_STORE_KEY, JSON.stringify({ ...loadAcademy(), ...patch })); } catch (_) {} };
const academyCompleted = () => loadAcademy().completed || {};
const isLessonComplete = (id) => !!academyCompleted()[id];
const setLessonComplete = (id, done) => { const c = { ...academyCompleted() }; if (done) c[id] = Date.now(); else delete c[id]; saveAcademy({ completed: c }); };
const markLessonComplete = (id) => setLessonComplete(id, true);
const academyLastLesson = () => loadAcademy().lastLesson || {};
const setLastLesson = (courseId, lessonId) => saveAcademy({ lastLesson: { ...academyLastLesson(), [courseId]: lessonId }, lastCourse: courseId });
const courseById = (id) => ACADEMY_COURSES.find(c => c.id === id) || null;
const catColor = (course) => moduleFace(course).color;

// --- production state ---
// A chapter is only watchable once its video is published, so every surface has to
// be honest about what exists today. Nothing here may promise a video that hasn't
// been recorded. Mirrors the SPM Academy in index.html.
const ACADEMY_STATUS = {
  published: { label: 'Available',   pill: 'green'   },
  recording: { label: 'Recording',   pill: 'amber'   },
  planned:   { label: 'Coming soon', pill: 'neutral' },
};
// An unlabelled chapter is never playable — fail safe, not fail open.
const chapterStatus = (lesson) => (lesson && ACADEMY_STATUS[lesson.status]) ? lesson.status : 'planned';
const isPublished = (lesson) => chapterStatus(lesson) === 'published';
const publishedLessons = (course) => (course ? course.lessons : []).filter(isPublished);
const isModuleFullyPublished = (course) => !!course && course.lessons.length > 0 && course.lessons.every(isPublished);
// Optimistic: the module is watchable if ANY chapter is. Drives play-vs-chip.
const moduleStatus = (course) => publishedLessons(course).length ? 'published'
  : (course ? course.lessons : []).some(l => chapterStatus(l) === 'recording') ? 'recording' : 'planned';
// NB counts every NON-published chapter (recording + planned) — i.e. "still to come".
const recordingCount = (course) => (course ? course.lessons : []).filter(l => chapterStatus(l) !== 'published').length;
const courseMins = (c) => c.lessons.reduce((s, l) => s + l.mins, 0);
const courseDoneCount = (c) => c.lessons.filter(l => isLessonComplete(l.id)).length;
// Progress divides by EVERY chapter so the bar can never read 100% on a half-recorded
// module; completion also requires the whole module published, so nobody is certified
// on a module that doesn't exist yet.
const courseProgressPct = (c) => c.lessons.length ? Math.round((courseDoneCount(c) / c.lessons.length) * 100) : 0;
const isCourseComplete = (c) => isModuleFullyPublished(c) && courseDoneCount(c) === c.lessons.length;
const resumeLessonId = (course) => {
  const ls = course ? course.lessons : []; if (!ls.length) return null;
  const last = academyLastLesson()[course.id];
  if (last && ls.some(l => l.id === last)) return last;
  const pub = publishedLessons(course);
  return (pub.find(l => !isLessonComplete(l.id)) || pub[0] || ls[0]).id;
};
const nextUpCourse = () => {
  // Prefer a module with something to watch — the hero shouldn't open on a poster.
  const watchable = ACADEMY_COURSES.filter(c => publishedLessons(c).length > 0);
  const pool = watchable.length ? watchable : ACADEMY_COURSES;
  const lc = loadAcademy().lastCourse;
  const last = lc ? courseById(lc) : null;
  if (last && !isCourseComplete(last)) return last;
  return pool.find(c => courseDoneCount(c) > 0 && !isCourseComplete(c))
      || pool.find(c => courseDoneCount(c) === 0)
      || pool[0];
};
const certifiedCourses = () => ACADEMY_COURSES.filter(isCourseComplete);
const pathsForCourse = (id) => LEARNING_PATHS.filter(p => p.courseIds.includes(id));
const academyStats = () => {
  const all = ACADEMY_COURSES.flatMap(c => c.lessons);
  const available = all.filter(isPublished);
  const done = all.filter(l => isLessonComplete(l.id));
  return {
    // Denominators are what EXISTS today, so the tiles don't read as a 2/34 failure
    // while the rest is still being filmed; `inProduction` carries the remainder.
    lessonsDone: done.length, totalLessons: available.length,
    coursesDone: certifiedCourses().length,
    inProduction: all.length - available.length,
    coursesAvailable: ACADEMY_COURSES.filter(isModuleFullyPublished).length,
    modules: ACADEMY_COURSES.length,
    minutes: done.reduce((s, l) => s + l.mins, 0),
    certificates: certifiedCourses().length,
  };
};

  return (
    <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: radius, overflow: 'hidden',

      <div style={{ position: 'absolute', top: 10, right: 10, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#141527', 0.34), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '3px 9px', borderRadius: 999 }}>

      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {watchable ? (
          <div style={{ width: playSize, height: playSize, borderRadius: '50%', background: withAlpha('#FFFFFF', 0.97), color, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 26px rgba(0,0,0,0.28)' }}>
            <svg width={Math.round(playSize * 0.33)} height={Math.round(playSize * 0.33)} viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 2 }}><polygon points="6,4 20,12 6,20" /></svg>

      )}
    </div>
  );
};

const APathCard = ({ path, onOpen }) => {
  const courses = path.courseIds.map(courseById).filter(Boolean);

  const pct = all.length ? Math.round((doneN / all.length) * 100) : 0;

        ) : (
          <button className="tap press" onClick={onPlay} aria-label="Play chapter" style={{ width: 72, height: 72, borderRadius: '50%', border: 'none', background: 'rgba(255,255,255,0.97)', color, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 12px 30px rgba(0,0,0,0.3)' }}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 3 }}><polygon points="6,4 20,12 6,20" /></svg>
          </button>
        )}
      </div>
    </div>
  );
};

// --- the Academy screen ---------------------------------------------------
// All navigation is local state: there is no router in this file, and `onBack`
// pops to the course list first, then out to the dashboard.
const AcademyScreen = ({ onBack, fireToast, onCertificate }) => {
  const [view, setView] = useState('home');
  const [courseId, setCourseId] = useState(null);
  const [search, setSearch] = useState('');
  const [cat, setCat] = useState('all');
  const [tab, setTab] = useState('overview');
  const [playing, setPlaying] = useState(false);
  const [activeId, setActiveId] = useState(null);
  // Progress lives in localStorage, not state, so writes need an explicit nudge.
  const [, tick] = useState(0);
  const refresh = () => tick(t => t + 1);

  const course = courseId ? courseById(courseId) : null;
  useEffect(() => { if (course) { setActiveId(resumeLessonId(course)); setTab('overview'); setPlaying(false); } }, [courseId]);
  useEffect(() => { if (course && activeId) setLastLesson(course.id, activeId); setPlaying(false); setTab('overview'); }, [activeId]);

  const openCourse = (c) => { setCourseId(c.id); };
  const openPath = (p) => { const cs = p.courseIds.map(courseById).filter(Boolean); const next = cs.find(c => !isCourseComplete(c)) || cs[0]; if (next) openCourse(next); };
  const back = () => { if (courseId) setCourseId(null); else onBack(); };

  const stats = academyStats();
  const header = (title) => (
    <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 10, padding: '6px 12px 12px', background: T.card, borderBottom: `1px solid ${T.border}` }}>
      <button className="tap press" onClick={back} style={{ width: 40, height: 40, border: 'none', background: 'none', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="arrowLeft" size={24} color={T.text} /></button>
      <span style={{ flex: 1, minWidth: 0, fontSize: 22, fontWeight: 800, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</span>
      {!courseId && stats.lessonsDone > 0 && <Pill tone="accent">{stats.lessonsDone}/{stats.totalLessons}</Pill>}
    </div>
  );

  // ----- course player -----
  if (course) {
    const lessons = course.lessons;
    const idx = Math.max(0, lessons.findIndex(l => l.id === activeId));
    const lesson = lessons[idx];
    const color = catColor(course);
    const complete = isLessonComplete(lesson.id);
    const lessonPub = isPublished(lesson);
    const lessonState = chapterStatus(lesson);
    const isLast = idx === lessons.length - 1;
    const pct = courseProgressPct(course);
    const inPaths = pathsForCourse(course.id);
    const completeAndNext = () => {
      const was = isCourseComplete(course);
      markLessonComplete(lesson.id);
      if (!isLast) setActiveId(lessons[idx + 1].id); else refresh();
      if (!was && isCourseComplete(course)) { onCertificate(course); fireToast('🎓 Module complete — certificate earned!'); }
      else fireToast('Chapter marked complete');
    };
    const toggle = () => { setLessonComplete(lesson.id, !complete); refresh(); };
    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: T.bg }}>
        {header(course.title)}
        <div className="screen-scroll" style={{ padding: '0 0 40px' }}>
          <AVideoStage lesson={lesson} color={color} catIcon={moduleFace(course).icon} playing={playing} onPlay={() => setPlaying(true)} />
          <div style={{ padding: '14px 14px 0' }}>
            <div style={{ fontSize: 12, color: T.muted, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}><span>Chapter {idx + 1} of {lessons.length} · {lesson.mins} min</span>{!lessonPub && <Pill tone={lessonState === 'recording' ? 'amber' : 'neutral'}>{ACADEMY_STATUS[lessonState].label}</Pill>}</div>
            <div style={{ fontSize: 19, fontWeight: 800, color: T.text, marginTop: 3, letterSpacing: -0.3, lineHeight: 1.25 }}>{lesson.title}</div>
            <div style={{ display: 'flex', gap: 10, marginTop: 13 }}>
              {/* No complete action on a chapter with no video — you can't finish
                  something that hasn't been recorded. */}
              {!lessonPub ? null : complete
                ? <BigBtn key="lesson-done" tone="soft" icon="check" onClick={toggle}>Completed</BigBtn>
                : <BigBtn key="lesson-todo" icon="check" iconRight={!isLast ? 'arrow' : undefined} onClick={completeAndNext}>{isLast ? 'Mark complete' : 'Complete & next'}</BigBtn>}
              {!isLast && <BigBtn tone="ghost" iconRight="arrow" onClick={() => setActiveId(lessons[idx + 1].id)} style={{ flex: '0 0 96px' }}>Next</BigBtn>}
            </div>
            <div style={{ marginTop: 14 }}>
              <ASeg value={tab} onChange={setTab} items={[{ id: 'overview', label: 'Overview' }, { id: 'transcript', label: 'Transcript' }, { id: 'resources', label: `Resources${(lesson.resources || []).length ? ' ' + lesson.resources.length : ''}` }]} />
            </div>
            <ACard style={{ marginTop: 12 }}>
              <div style={{ padding: '14px 15px' }}>
                {tab === 'overview' && (
                  <Fragment>
                    {/* Say plainly what state this chapter is in. */}
                    {!lessonPub && (
                      <div style={{ display: 'flex', gap: 10, padding: '11px 12px', borderRadius: 14, marginBottom: 13,
                        background: lessonState === 'recording' ? T.amberSoft : T.blueSoft }}>
                        <Icon name={lessonState === 'recording' ? 'video' : 'clock'} size={18} color={lessonState === 'recording' ? T.amberText : T.blue} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text }}>{lessonState === 'recording' ? 'This chapter is being recorded' : 'Scripted, not yet filmed'}</div>
                          <div style={{ fontSize: 12.5, color: T.muted, lineHeight: 1.45, marginTop: 2 }}>
                            {lessonState === 'recording' ? 'The video lands shortly. Below is what it covers.'
                                                        : 'Below is what it will cover. It appears here as soon as it is recorded.'}
                          </div>
                        </div>
                      </div>
                    )}
                    <div style={{ fontSize: 14.5, color: T.textSoft, lineHeight: 1.6 }}>{lesson.description}</div>
                    {lesson.takeaways && (
                      <div style={{ marginTop: 15 }}>
                        <div style={{ fontSize: 14, fontWeight: 700, color: T.text }}>What you'll learn</div>
                        <div style={{ marginTop: 9, display: 'flex', flexDirection: 'column', gap: 9 }}>
                          {lesson.takeaways.map((t, i) => <div key={i} style={{ display: 'flex', gap: 9, fontSize: 13.5, color: T.textSoft, lineHeight: 1.4 }}><Icon name="checkCircle" size={17} color={T.green} /><span>{t}</span></div>)}
                        </div>
                      </div>
                    )}
                  </Fragment>
                )}
                {tab === 'transcript' && (
                  lesson.transcript
                    ? <div style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.7, whiteSpace: 'pre-line' }}>{lesson.transcript}</div>
                    : <div style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.5 }}>A full transcript will be available once the video for this chapter is published.</div>
                )}
                {tab === 'resources' && (
                  (lesson.resources || []).length
                    ? <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                        {lesson.resources.map((r, i) => (
                          <button key={i} className="tap press" onClick={() => fireToast('Opening resource (demo)')} style={{ display: 'flex', alignItems: 'center', gap: 11, width: '100%', border: `1px solid ${T.border}`, background: T.card, borderRadius: 14, padding: '11px 12px', textAlign: 'left' }}>
                            <IconTile icon="fileText" tone="accent" size={34} iconSize={16} />
                            <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 600, color: T.text }}>{r.label}</span>
                            <Icon name="download" size={17} color={T.mutedSoft} />
                          </button>
                        ))}
                      </div>
                    : <div style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.5 }}>Downloadable templates and checklists will appear here.</div>
                )}
              </div>
            </ACard>
            <ACard>
              <div style={{ padding: '14px 15px 10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 15.5, fontWeight: 700, color: T.text }}>Chapters</span>
                <span style={{ fontSize: 12.5, color: T.muted }}>{courseDoneCount(course)}/{lessons.length} · {pct}%</span>
              </div>
              {recordingCount(course) > 0 && <div style={{ fontSize: 12, color: T.mutedSoft, marginTop: 6 }}>{publishedLessons(course).length} ready to watch · {recordingCount(course)} still in production</div>}
              <div style={{ padding: '0 15px 12px' }}><ABar pct={pct} color={pct === 100 ? T.green : color} height={5} /></div>
              <div style={{ borderTop: `1px solid ${T.borderSoft}` }}>
                {lessons.map((l, i) => <ALessonRow key={l.id} lesson={l} index={i} active={l.id === lesson.id} complete={isLessonComplete(l.id)} onClick={() => setActiveId(l.id)} last={i === lessons.length - 1} />)}
              </div>
            </ACard>
            {!!inPaths.length && (
              <ACard>
                <div style={{ padding: '14px 15px' }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6 }}>Part of these paths</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 9 }}>
                    {inPaths.map(p => (
                      <span key={p.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, border: `1px solid ${T.border}`, borderRadius: 999, padding: '6px 11px', fontSize: 12.5, fontWeight: 600, color: T.textSoft }}>
                        <Icon name="graduation" size={13} color={T.primary} />{p.title}
                      </span>
                    ))}
                  </div>
                </div>
              </ACard>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ----- catalog -----
  const q = search.trim().toLowerCase();
  const filtered = ACADEMY_COURSES
    .filter(c => cat === 'all' || c.track === cat)
    .filter(c => !q || (c.title + ' ' + c.summary + ' ' + moduleFace(c).trackLabel + ' ' + c.lessons.map(l => l.title).join(' ')).toLowerCase().includes(q));
  const resume = nextUpCourse();
  const resumeNext = resume ? resume.lessons.find(l => l.id === resumeLessonId(resume)) : null;
  const resumeStarted = resume ? courseDoneCount(resume) > 0 : false;
  const popular = ACADEMY_POPULAR.map(courseById).filter(Boolean);
  const certs = certifiedCourses();
  const inProgress = ACADEMY_COURSES.filter(c => courseDoneCount(c) > 0 && !isCourseComplete(c));

  // Denominators count what's recorded today; the sub-line carries the rest.
  const statCells = [
    { icon: 'bookOpen', tone: 'accent', label: 'Chapters watched', value: `${stats.lessonsDone}/${stats.totalLessons}`,
      sub: stats.inProduction ? `${stats.inProduction} in production` : null },
    { icon: 'graduation', tone: 'blue', label: 'Modules complete', value: `${stats.coursesDone}/${stats.modules}`,
      sub: `${stats.coursesAvailable} fully recorded` },
    { icon: 'clock', tone: 'amber', label: 'Minutes learned', value: `${stats.minutes}` },
    { icon: 'award', tone: 'green', label: 'Certificates', value: `${stats.certificates}` },
  ];
  const statGrid = (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 14 }}>
      {statCells.map(c => (
        <div key={c.label} style={{ background: T.card, borderRadius: 16, boxShadow: T.shadowSm, padding: '13px 14px' }}>
          <IconTile icon={c.icon} tone={c.tone} size={32} iconSize={16} />
          <div style={{ fontSize: 20, fontWeight: 800, color: T.text, marginTop: 9, letterSpacing: -0.4 }}>{c.value}</div>
          <div style={{ fontSize: 12.5, color: T.muted, marginTop: 1 }}>{c.label}</div>
          {c.sub && <div style={{ fontSize: 11, color: T.mutedSoft, marginTop: 1 }}>{c.sub}</div>}
        </div>
      ))}
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: T.bg }}>
      {header('Sole Academy')}
      <div style={{ flexShrink: 0, padding: '12px 14px', background: T.card, borderBottom: `1px solid ${T.border}` }}>
        <ASeg value={view} onChange={setView} items={[{ id: 'home', label: 'Start' }, { id: 'courses', label: 'Modules' }, { id: 'paths', label: 'Paths' }, { id: 'progress', label: 'Progress' }]} />
      </div>
      <div className="screen-scroll" style={{ padding: '14px 14px 40px' }}>
        {view === 'home' && (
          <Fragment>
            {resume && (
              <ACard onClick={() => openCourse(resume)}>
                <AThumb course={resume} playSize={62} watermark={150} />
                <div style={{ padding: '14px 15px 16px' }}>
                  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: T.primary }}>
                    <span style={{ width: 6, height: 6, borderRadius: 999, background: T.primary }} />If you've got 5 minutes
                  </div>
                  <div style={{ fontSize: 21, fontWeight: 800, color: T.text, letterSpacing: -0.4, lineHeight: 1.2, marginTop: 6 }}>{resume.title}</div>
                  <div style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.45, marginTop: 6 }}>{resume.summary}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 10, fontSize: 12.5, color: T.muted, flexWrap: 'wrap' }}>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={13} color={T.mutedSoft} />{resume.lessons.length} chapters</span>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="clock" size={13} color={T.mutedSoft} />{resumeNext ? `Next: ${resumeNext.mins} min` : `${courseMins(resume)} min`}</span>
                  </div>
                  <div style={{ display: 'flex', marginTop: 14 }}><BigBtn icon="play" onClick={() => openCourse(resume)}>{resumeStarted ? 'Resume module' : 'Start module'}</BigBtn></div>
                </div>
              </ACard>
            )}
            {statGrid}
            <div style={{ fontSize: 16.5, fontWeight: 800, color: T.text, margin: '4px 2px 10px' }}>Where to start</div>
            {LEARNING_PATHS.slice(0, 2).map(p => <APathCard key={p.id} path={p} onOpen={() => openPath(p)} />)}
            <div style={{ fontSize: 16.5, fontWeight: 800, color: T.text, margin: '18px 2px 10px' }}>Popular modules</div>
            {popular.map(c => <ACourseCard key={c.id} course={c} onOpen={() => openCourse(c)} />)}
          </Fragment>
        )}

        {view === 'courses' && (
          <Fragment>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, background: T.card, borderRadius: 14, padding: '11px 13px', marginBottom: 12, boxShadow: T.shadowSm }}>
              <Icon name="search" size={17} color={T.mutedSoft} />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search modules and chapters…"
                style={{ flex: 1, minWidth: 0, border: 'none', background: 'transparent', outline: 'none', fontSize: 15, color: T.text }} />
              {search && <button className="tap" onClick={() => setSearch('')} aria-label="Clear" style={{ border: 'none', background: 'none', padding: 2 }}><Icon name="close" size={16} color={T.muted} /></button>}
            </div>
            {/* Horizontal rail: 8 category chips will never fit across 404px. */}
            <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 4, marginBottom: 14 }}>
              {[{ id: 'all', label: `All · ${ACADEMY_COURSES.length}` }].concat(
                ACADEMY_TRACKS.map(c => { const n = ACADEMY_COURSES.filter(x => x.track === c.id).length; return n ? { id: c.id, label: `${c.label} · ${n}` } : null; }).filter(Boolean)
              ).map(c => {
                const on = cat === c.id;
                return <button key={c.id} className="tap" onClick={() => setCat(c.id)}
                  style={{ flexShrink: 0, border: `1px solid ${on ? T.primary : T.border}`, background: on ? T.primarySoft : T.card, color: on ? T.primary : T.textSoft,
                    borderRadius: 999, padding: '8px 14px', fontSize: 13, fontWeight: on ? 700 : 500, whiteSpace: 'nowrap' }}>{c.label}</button>;
              })}
            </div>
            {filtered.length
              ? filtered.map(c => <ACourseCard key={c.id} course={c} onOpen={() => openCourse(c)} />)
              : <ACard><AEmpty title="No modules match" hint="Try a different track or clear your search." /></ACard>}
          </Fragment>
        )}

        {view === 'paths' && (
          <Fragment>
            <div style={{ display: 'flex', gap: 11, background: T.primarySofter, border: `1px solid ${T.primarySoft}`, borderRadius: 16, padding: '13px 14px', marginBottom: 14 }}>
              <IconTile icon="graduation" tone="accent" size={36} iconSize={17} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14.5, fontWeight: 700, color: T.text }}>Pick a path</div>
                <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.45, marginTop: 2 }}>Short sequences built around what you're trying to get done. New here? Start with "Brand new to Sole".</div>
              </div>
            </div>
            {LEARNING_PATHS.map(p => <APathCard key={p.id} path={p} onOpen={() => openPath(p)} />)}
          </Fragment>
        )}

        {view === 'progress' && (
          <Fragment>
            {statGrid}
            {!inProgress.length && !certs.length ? (
              <ACard>
                <div style={{ padding: '4px 4px 16px' }}>
                  <AEmpty icon="rocket" title="Five minutes is enough to start" hint="Nothing here yet. Follow a path, or pick whichever course solves the thing that's bugging you." />
                  <div style={{ display: 'flex', padding: '0 16px' }}><BigBtn icon="graduation" onClick={() => openPath(LEARNING_PATHS[0])}>Start with the basics</BigBtn></div>
                </div>
              </ACard>
            ) : (
              <Fragment>
                {!!inProgress.length && (
                  <Fragment>
                    <div style={{ fontSize: 16.5, fontWeight: 800, color: T.text, margin: '4px 2px 10px' }}>Continue learning</div>
                    <ACard>
                      {inProgress.map((c, i) => (
                        <button key={c.id} className="tap" onClick={() => openCourse(c)} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: '13px 15px', border: 'none', background: 'transparent', textAlign: 'left', borderBottom: i === inProgress.length - 1 ? 'none' : `1px solid ${T.borderSoft}` }}>
                          <IconTile icon={moduleFace(c).icon} tone="accent" size={40} iconSize={19} />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 14.5, fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.title}</div>
                            <div style={{ marginTop: 6 }}><ABar pct={courseProgressPct(c)} color={catColor(c)} height={5} /></div>
                          </div>
                          <span style={{ fontSize: 12.5, color: T.muted, flexShrink: 0 }}>{courseProgressPct(c)}%</span>
                        </button>
                      ))}
                    </ACard>
                  </Fragment>
                )}
                <div style={{ fontSize: 16.5, fontWeight: 800, color: T.text, margin: '18px 2px 10px' }}>Certificates <span style={{ fontWeight: 500, color: T.muted }}>· {certs.length}</span></div>
                {certs.length ? certs.map(c => (
                  <ACard key={c.id} onClick={() => onCertificate(c)}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 15px' }}>
                      <IconTile icon="award" tone="green" size={42} iconSize={20} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 15, fontWeight: 700, color: T.text }}>{c.title}</div>
                        <div style={{ fontSize: 12.5, color: T.muted, marginTop: 1 }}>{c.lessons.length} chapters · {courseMins(c)} min</div>
                      </div>
                      <Icon name="chevronRight" size={18} color={T.mutedSoft} />
                    </div>
                  </ACard>
                )) : (
                  <ACard><div style={{ display: 'flex', gap: 11, padding: '14px 15px' }}>
                    <IconTile icon="award" tone="neutral" size={36} iconSize={17} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14.5, fontWeight: 700, color: T.text }}>No certificates yet</div>
                      <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.45, marginTop: 2 }}>Finish every chapter in a fully-recorded module to earn your first one.</div>
                    </div>
                  </div></ACard>
                )}
              </Fragment>
            )}
          </Fragment>
        )}
      </div>
    </div>
  );
};

const App = () => {
  const [tab, setTab] = useState('dashboard');       // active bottom tab
  const [screen, setScreen] = useState('dashboard'); // dashboard | unibox | invoices | expense | transactions
  const [drawer, setDrawer] = useState(false);
  const [items, setItems] = useState(SEED_ITEMS);
  const [activity, setActivity] = useState(SEED_ACTIVITY);
  const [allTime, setAllTime] = useState(42);
  const [toast, setToast] = useState(null);
  const [burst, setBurst] = useState({ n: 0, big: false });
  const [sheet, setSheet] = useState(null);
  const toastTimer = useRef(); const burstN = useRef(0);
  const progress = useMemo(() => computeProgress(activity), [activity]);

  const fireToast = (t) => { const obj = typeof t === 'string' ? { message: t } : t; setToast(obj); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(c => c === obj ? null : c), obj.action ? 5000 : 2600); };
  const fireBurst = (big) => { burstN.current += 1; setBurst({ n: burstN.current, big: !!big }); };

  const completeItem = (item, message, kind = 'done') => {
    const idx = items.findIndex(i => i.id === item.id);
    const entry = { ts: Date.now(), kind, label: message };
    const nextActivity = [entry, ...activity];
    const prevToday = progress.today, nextToday = computeProgress(nextActivity).today;
    const prevTier = tierFor(allTime).name, nextTier = tierFor(allTime + 1).name;
    const remaining = items.filter(i => i.id !== item.id).length;
    let msg = message, big = false, note = null;
    if (nextTier !== prevTier) { big = true; note = `Nice work — you've reached ${nextTier}`; }
    else { for (const m of DAILY_MILESTONES) if (prevToday < m && nextToday >= m) { big = true; note = `${m} done today — you're on a roll!`; break; } }
    if (remaining === 0) { big = true; if (!note) note = "That's everything actioned — you're all clear ✨"; }
    if (note) msg = note; else if (prevToday === 0 && nextToday >= 1) msg = `${message} · 🔥 ${computeProgress(nextActivity).streak}-day streak`;
    setItems(prev => prev.filter(i => i.id !== item.id));
    setActivity(nextActivity); setAllTime(a => a + 1); fireBurst(big); setSheet(null);
    fireToast({ message: msg, tone: 'undo', action: { label: 'Undo', onClick: () => { setItems(cur => { const arr = [...cur]; arr.splice(Math.min(idx, arr.length), 0, item); return arr; }); setActivity(cur => cur.filter(a => a !== entry)); setAllTime(a => Math.max(0, a - 1)); setToast(null); } } });
  };
  const onAction = (item, actionId) => {
    if (actionId === '__toast') { fireToast(item.__toast); return; }
    if (actionId === 'preview') { fireToast('Opening preview (demo)'); return; }
    if (MATCH_ACTIONS.includes(actionId)) { setSheet({ type: 'match', item }); return; }
    const mode = MODE_FOR[actionId];
    if (mode) { setSheet({ type: mode, item }); return; }
    completeItem(item, directMessage(item, actionId));
  };
  const onMore = (item) => setSheet({ type: 'actions', item, onPick: (id) => { setSheet(null); setTimeout(() => onAction(item, id), 60); } });

  const openUnibox = () => { setDrawer(false); setScreen('unibox'); };
  const go = (s) => { setDrawer(false); setScreen(s); };
  const onTab = (id) => { setTab(id); setScreen(id); };
  const count = items.length;
  const home = () => { setScreen('dashboard'); setTab('dashboard'); };

  let body;
  if (screen === 'unibox') body = <UniboxScreen items={items} progress={progress} allTime={allTime} onBack={home} onAction={onAction} onMore={onMore} />;
  else if (screen === 'academy') body = <AcademyScreen onBack={home} fireToast={fireToast} onCertificate={(c) => setSheet({ type: 'certificate', course: c })} />;
  else if (screen === 'dashboard') body = <div className="screen-scroll"><Dashboard count={count} onOpenUnibox={openUnibox} /></div>;
  // NOTE: this fallback does TABS.find(...).label — an unlisted `screen` throws, and
  // with no ErrorBoundary that white-screens the app. Every pushed surface needs its
  // own branch ABOVE this line.
  else body = <StubScreen title={(TABS.find(t => t.id === screen) || { label: screen }).label} onBack={home} />;

  // Pushed, focused surfaces hide the tab bar and pull the snackbar down with them.
  const FULLSCREEN = ['unibox', 'academy'];
  const full = FULLSCREEN.includes(screen);
  const darkStatus = screen === 'dashboard';
  return (
    <div className="device">
      <StatusBar dark={darkStatus} />
      <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>{body}</div>
      {!full && <TabBar active={tab} onTab={onTab} onMore={() => setDrawer(true)} />}
      <MoreDrawer open={drawer} count={count} onClose={() => setDrawer(false)} onGo={go} />
      <Sheet open={!!sheet} onClose={() => setSheet(null)}>{sheet && <SheetBody sheet={sheet} onComplete={completeItem} onClose={() => setSheet(null)} fireToast={fireToast} />}</Sheet>
      <Snackbar toast={toast} onClose={() => setToast(null)} bottom={full ? 26 : 86} />
      <Confetti fire={burst.n} big={burst.big} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
