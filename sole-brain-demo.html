/* ---- matching: deterministic keyword scoring, no fake AI ---- */
function score(query, item){
  const q = query.toLowerCase().replace(/[^a-z0-9 ]/g,' ');
  const words = q.split(/\s+/).filter(w => w.length > 2);
  if(!words.length) return 0;
  const hay = ((item.q || item.term) + ' ' + (item.aliases||[]).join(' ') + ' ' + (item.short||item.means||'')).toLowerCase();
  let s = 0;
  (item.aliases||[]).forEach(a => { if(q.includes(a.toLowerCase())) s += 10 + a.length; });
  words.forEach(w => { if(hay.includes(w)) s += 3; });
  return s;
}
const NUMBERY = /how many|how much|count|total|number of|revenue|mrr|signup|signed up/i;

function search(query){
  const numeric = NUMBERY.test(query);
  const a = ANSWERS.map(x => ({x, s:score(query,x), kind:'answer'}));
  const d = DEFINITIONS.map(x => {
    let s = score(query, x);
    // A "how many" question wants a number, not a vocabulary lesson. Without this,
    // "how many users signed up in July?" matches the *word* "User" and gives a
    // definition of the word instead of refusing to invent the figure — which is
    // the single most important thing this demo has to show.
    if(numeric && s > 0) s += (x.kind === 'Number' ? 14 : -8);
    return {x, s, kind:'definition'};
  });
  return [...a, ...d].filter(r => r.s > 6).sort((p,q) => q.s - p.s);
}

function fmtDate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${+dd} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`;
}

function Ask(){
  const [log, setLog] = useState([]);
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({behavior:'smooth'}); }, [log, busy]);

  function ask(text){
    const query = (text || '').trim();
    if(!query || busy) return;
    setVal('');
    setLog(l => [...l, {who:'me', text:query}]);
    setBusy(true);
    setTimeout(() => {
      const hits = search(query);
      let reply;
      if(!hits.length){
        // a number-shaped question with no definition still refuses, rather than missing
        const numeric = NUMBERY.test(query);
        reply = numeric
          ? {type:'def', item:{kind:'Number', term:query.trim().replace(/\?*$/,''), filter:null,
              note:'No definition exists for this, and nobody owns it yet. Until one does, any number is a guess wearing a uniform.'}}
          : {type:'miss', query};
      } else {
        const top = hits[0];
        // a "how many" question that maps to an Answer with a linked number → answer with the number
        if(top.kind === 'answer' && top.x.isNumber && NUMBERY.test(query)){
          reply = {type:'def', item: DEFINITIONS.find(d => d.id === top.x.isNumber)};
        } else {
          reply = {type:'hit', item:top.x, kind:top.kind};
        }
      }
      setLog(l => [...l, {who:'claude', reply}]);
      setBusy(false);
    }, 480);
  }

  return (
    <div style={{display:'grid', gridTemplateColumns:'minmax(0,1fr) 260px', gap:20, alignItems:'start'}}>
      {/* channel */}
      <div style={{background:'var(--card)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden',
        display:'flex', flexDirection:'column', height:'min(660px, calc(100vh - 250px))'}}>
        <div style={{background:'var(--slack)', color:'#fff', padding:'12px 18px', display:'flex',
          alignItems:'center', gap:10, flexShrink:0}}>
          <span style={{fontWeight:700, fontSize:15}}># ask-sole</span>
          <span style={{opacity:.65, fontSize:12.5}}>Claude is in this channel · read-only</span>
        </div>

        <div style={{flex:1, overflowY:'auto', padding:'18px 20px'}}>
          {!log.length && (
            <div style={{color:'var(--muted)', fontSize:14, padding:'8px 0 14px'}}>
              Ask anything about Sole. Try one of the examples on the right — each is chosen to show a
              different behaviour, including the two where it deliberately refuses to answer.
            </div>
          )}
          {log.map((m, i) => m.who === 'me' ? (
            <div key={i} style={{margin:'0 0 18px', animation:'fadein 180ms ease'}}>
              <div style={{display:'flex', gap:10, alignItems:'baseline'}}>
                <div style={{width:26, height:26, borderRadius:6, background:'#D9D9EC', flexShrink:0,
                  display:'grid', placeItems:'center', fontSize:11, fontWeight:700, color:'var(--ink)'}}>R</div>
                <div>
                  <div style={{fontWeight:700, fontSize:14}}>You</div>
                  <div style={{fontSize:15}}>@Claude {m.text}</div>
                </div>
              </div>
            </div>
          ) : (
            <div key={i} style={{margin:'0 0 22px'}}>
              <div style={{display:'flex', gap:10}}>
                <div style={{width:26, height:26, borderRadius:6, background:'var(--accent)', flexShrink:0,
                  display:'grid', placeItems:'center', fontSize:11, fontWeight:700, color:'#fff'}}>C</div>
                <div style={{minWidth:0, flex:1}}>
                  <div style={{fontWeight:700, fontSize:14, marginBottom:5}}>Claude
                    <span style={{fontWeight:500, fontSize:11, color:'var(--muted)', marginLeft:7}}>APP</span></div>
                  {m.reply.type === 'hit' && <AnswerCard item={m.reply.item} kind={m.reply.kind} />}
                  {m.reply.type === 'def' && <DefCard d={m.reply.item} />}
                  {m.reply.type === 'miss' && <MissCard query={m.reply.query} />}
                </div>
              </div>
            </div>
          ))}
          {busy && <div style={{display:'flex', gap:6, padding:'4px 0 0 36px'}}>
            {[0,1,2].map(i => <span key={i} style={{width:6, height:6, borderRadius:9,
              background:'var(--muted)', animation:`blink 1.1s ${i*0.16}s infinite`}} />)}
          </div>}
          <div ref={endRef} />
        </div>

        <div style={{borderTop:'1px solid var(--line)', padding:12, flexShrink:0}}>
          <div style={{display:'flex', gap:8}}>
            <input value={val} onChange={e => setVal(e.target.value)}
              onKeyDown={e => { if(e.key === 'Enter') ask(val); }}
              placeholder="Ask @Claude something about Sole…"
              style={{flex:1, padding:'11px 13px', borderRadius:9, border:'1px solid var(--line)',
                fontSize:14.5, fontFamily:'inherit', outline:'none', background:'var(--paper)'}} />
            <button onClick={() => ask(val)} disabled={busy || !val.trim()}
              style={{padding:'11px 18px', borderRadius:9, border:0, background:'var(--accent)', color:'#fff',
                fontWeight:700, fontSize:14, cursor: val.trim() ? 'pointer' : 'default', opacity: val.trim() ? 1 : .4}}>
              Ask
            </button>
          </div>
        </div>
      </div>

      {/* examples */}
      <div>
        <div style={{fontSize:11, fontWeight:700, letterSpacing:'.09em', textTransform:'uppercase',
          color:'var(--muted)', marginBottom:11}}>Try these</div>
        {PRESETS.map(p => (
          <button key={p.label} onClick={() => ask(p.label)}
            style={{display:'block', width:'100%', textAlign:'left', marginBottom:7, padding:'10px 12px',
              background:'var(--card)', border:'1px solid var(--line)', borderRadius:9, cursor:'pointer',
              fontSize:13.5, lineHeight:1.35, color:'var(--ink)'}}>
            {p.label}
            <span style={{display:'block', fontSize:11.5, color:'var(--muted)', marginTop:3}}>{p.why}</span>
          </button>
        ))}
        {!!log.length && <button onClick={() => setLog([])}
          style={{marginTop:6, background:'none', border:0, color:'var(--muted)', fontSize:12.5,
            cursor:'pointer', padding:'4px 0'}}>Clear</button>}
      </div>
    </div>
  );
}

/* ---- the Notion side ---- */
const VIEWS = [
  { id:'all',   label:'All answers',    f: a => true },
  { id:'needs', label:'Needs you',      f: a => a.status === 'Draft' },
  { id:'noown', label:'No owner',       f: a => !a.owner },
  { id:'cust',  label:'Customer-ready', f: a => a.audience === 'Customer-ready' && a.status === 'Live' },
  { id:'dec',   label:'Decisions',      f: a => a.type === 'Decision' },
];

function Brain(){
  const [view, setView] = useState('all');
  const v = VIEWS.find(x => x.id === view);
  const rows = ANSWERS.filter(v.f);
  const undefCount = DEFINITIONS.filter(d => d.kind === 'Number' && !d.filter).length;

  return (
    <div>
      <p style={{color:'var(--ink-soft)', marginTop:0, maxWidth:'70ch'}}>
        This is the Notion side — two databases, and every row below is real Sole content, not demo filler.
        It is stored in the exact shape the schema specifies, so this same set is what gets pushed into
        Notion once the workspace exists. Nothing here has to be retyped.
      </p>

      <div style={{display:'flex', gap:7, flexWrap:'wrap', margin:'22px 0 14px'}}>
        {VIEWS.map(x => (
          <button key={x.id} onClick={() => setView(x.id)}
            style={{padding:'7px 13px', borderRadius:999, fontSize:13, fontWeight:600, cursor:'pointer',
              border:'1px solid ' + (view === x.id ? 'var(--accent)' : 'var(--line)'),
              background: view === x.id ? 'var(--accent)' : 'var(--card)',
              color: view === x.id ? '#fff' : 'var(--ink-soft)'}}>
            {x.label}
            <span style={{opacity:.65, marginLeft:6}}>{ANSWERS.filter(x.f).length}</span>
          </button>
        ))}
      </div>

      <div style={{background:'var(--card)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden'}}>
        {rows.length === 0 && <div style={{padding:'26px 20px', color:'var(--green)', fontSize:14}}>
          Empty — which is the point. This view should never have anything in it.</div>}
        {rows.map((a, i) => (
          <div key={a.id} style={{padding:'14px 18px', borderTop: i ? '1px solid var(--line-soft)' : 0,
            display:'grid', gridTemplateColumns:'minmax(0,1fr) auto', gap:14, alignItems:'start'}}>
            <div style={{minWidth:0}}>
              <div style={{fontWeight:600, fontSize:14.5}}>{a.q}{a.type === 'Question' ? '' : ''}</div>
              <div style={{fontSize:13, color:'var(--muted)', marginTop:3}}>{a.short}</div>
              <div style={{marginTop:7, display:'flex', gap:6, flexWrap:'wrap', alignItems:'center'}}>
                <Badge tone="plain">{a.type}</Badge>
                <Badge tone={a.status === 'Live' ? 'live' : 'draft'}>{a.status}</Badge>
                {a.conflict && <Badge tone="undef">Conflict</Badge>}
                <span style={{fontSize:12, color:'var(--muted)'}}>{a.area} · {a.product.join(', ')}</span>
              </div>
            </div>
            <div style={{textAlign:'right', fontSize:12, color:'var(--muted)', whiteSpace:'nowrap'}}>
              <div style={{color:'var(--ink-soft)', fontWeight:600}}>{a.owner || '— unassigned'}</div>
              <div>review: {a.every === 'Never' ? 'never' : a.every + 'd'}</div>
            </div>
          </div>
        ))}
      </div>

      <h3 style={{fontSize:15, margin:'34px 0 4px'}}>Definitions
        <span style={{fontWeight:500, color:'var(--muted)', fontSize:13.5, marginLeft:8}}>
          one word, one meaning · one number, one definition</span></h3>
      <p style={{color:'var(--ink-soft)', fontSize:13.5, marginTop:6, maxWidth:'70ch'}}>
        <b>{undefCount} of the {DEFINITIONS.filter(d => d.kind === 'Number').length} numbers below have no
        agreed definition.</b> That isn't a gap in the demo — it's the actual current state, and it's why
        two people can quote two different figures and both be right.
      </p>

      <div style={{background:'var(--card)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden', marginTop:12}}>
        {DEFINITIONS.map((d, i) => {
          const un = d.kind === 'Number' && !d.filter;
          return (
            <div key={d.id} style={{padding:'14px 18px', borderTop: i ? '1px solid var(--line-soft)' : 0}}>
              <div style={{display:'flex', gap:9, alignItems:'center', flexWrap:'wrap'}}>
                <span style={{fontWeight:700, fontSize:14.5}}>{d.term}</span>
                <Badge tone="plain">{d.kind}</Badge>
                {un && <Badge tone="undef">Undefined</Badge>}
              </div>
              <div style={{fontSize:13, color:'var(--muted)', marginTop:5, lineHeight:1.55}}>
                {d.means || d.note}
              </div>
              {d.filter && <div style={{fontSize:12, color:'var(--muted)', marginTop:6,
                fontFamily:'var(--mono)', background:'var(--paper)', padding:'6px 9px', borderRadius:6,
                display:'inline-block'}}>{d.filter}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---- shell ---- */
function App(){
  const [tab, setTab] = useState('ask');
  return (
    <div style={{maxWidth:1080, margin:'0 auto', padding:'0 24px 70px'}}>
      <header style={{padding:'44px 0 24px'}}>
        <div style={{fontSize:12, fontWeight:700, letterSpacing:'.12em', textTransform:'uppercase',
          color:'var(--accent)', marginBottom:13}}>Working demo · v1</div>
        <h1 style={{fontSize:38, fontWeight:800, letterSpacing:'-.025em', margin:'0 0 14px'}}>Sole Brain</h1>
        <p style={{fontSize:17.5, color:'var(--ink-soft)', maxWidth:'64ch', margin:0}}>
          One place to ask anything about our products, our processes and our numbers — and get the same
          answer as everyone else. This is the real thing, wired to real Sole content.
        </p>
        <div style={{marginTop:20, background:'var(--amber-soft)', border:'1px solid var(--amber-line)',
          borderRadius:10, padding:'13px 15px', fontSize:13.5, color:'var(--amber)', maxWidth:'72ch'}}>
          <b>What's real and what isn't.</b> Every answer, definition, gap and contradiction below is genuine
          Sole content. The matching is simple keyword search, not a language model — so it only knows what's
          written down, which is exactly the point. In production the retrieval is Claude reading Notion.
        </div>
      </header>

      <div style={{display:'flex', gap:5, borderBottom:'1px solid var(--line)', marginBottom:26}}>
        {[['ask','Ask it'], ['brain','Inside the brain']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{padding:'11px 17px', border:0, background:'none', cursor:'pointer', fontSize:14.5,
              fontWeight:700, color: tab === id ? 'var(--accent)' : 'var(--muted)',
              borderBottom:'2px solid ' + (tab === id ? 'var(--accent)' : 'transparent'), marginBottom:-1}}>
            {label}
          </button>
        ))}
      </div>

      {tab === 'ask' ? <Ask /> : <Brain />}

      <footer style={{marginTop:44, paddingTop:22, borderTop:'1px solid var(--line)',
        color:'var(--muted)', fontSize:12.5}}>
        Internal working demo · not for distribution outside Sole. The reasoning behind every rule you see
        here — why it refuses numbers, why drafts are announced, why Slack can't edit — is in the proposal
        alongside this.
      </footer>
    </div>
  );
}

class Boundary extends React.Component {
  constructor(p){ super(p); this.state = {e:null}; }
  static getDerivedStateFromError(e){ return {e}; }
  render(){
    if(this.state.e) return <pre style={{background:'#FEF0F0', color:'#B91C1C', padding:20,
      margin:20, borderRadius:10, whiteSpace:'pre-wrap'}}>{String(this.state.e && this.state.e.stack || this.state.e)}</pre>;
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
</body>
</html>
