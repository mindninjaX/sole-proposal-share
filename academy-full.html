<!-- FROZEN SNAPSHOT, 27 Aug 2026. This is the FULL Academy: tabs, guided learning
     paths, progress, certificates, stat tiles and module covers. It was generated from
     index.html Module 15 before that module was cut back to "a module, then its videos",
     and it is kept as a second version because a demo needed the fuller surface at short
     notice. It is deliberately NOT regenerated by scripts/build-academy-standalone.js,
     which now emits the simplified academy.html. Two consequences:
       1. Editing Module 15 does NOT update this file. It will drift, on purpose.
       2. Its curriculum still comes live from Supabase, so published videos appear here
          without a redeploy, exactly like academy.html.
     One hand edit was made after freezing: the Popular modules grid caps card width so a
     single published module does not stretch to the full page width.
     If this version wins, regenerate it properly from a branch rather than editing here. -->
<!-- GENERATED FILE. Do not edit by hand.
     Source: index.html (Module 15) + scripts/build-academy-standalone.js
     Rebuild: node scripts/build-academy-standalone.js -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color: #0F1117;
    background: #F5F4F8;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #5B5BF6 !important; box-shadow: 0 0 0 3px rgba(91, 91, 246, 0.12); }
  button:focus-visible { outline: 2px solid #5B5BF6; outline-offset: 2px; }
  ::placeholder { color: #9CA3AF; }
  /* Suppress native number-input spinner UI — every tabular number in this app
     is right-aligned in a tight cell, and the spinner buttons silently steal width. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  /* === Hover states ============================================================
     Inline styles can't express :hover, so we tag interactive elements with
     data-attrs and provide hover treatments here. Keeps the entire app feeling
     responsive without per-component onMouseEnter handlers. */
  button[data-btn]:not(:disabled) { transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s, transform 0.05s; }
  button[data-btn]:not(:disabled):active { transform: translateY(0.5px); }
  button[data-btn="ghost"]:not(:disabled):hover         { background: #F9FAFB; border-color: #D1D5DB; }
  button[data-btn="soft"]:not(:disabled):hover          { background: #EEF0FF; border-color: #C7C9FB; }
  button[data-btn="primary"]:not(:disabled):hover       { background: #4F46E5; border-color: #4F46E5; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25); }
  button[data-btn="primaryOutline"]:not(:disabled):hover{ background: #EEF0FF; }
  button[data-btn="iconOnly"]:not(:disabled):hover      { background: #F3F4F6; }
  button[data-btn="danger"]:not(:disabled):hover        { background: #DC2626; border-color: #DC2626; }
  button[data-btn="dangerOutline"]:not(:disabled):hover { background: #FEE2E2; border-color: #FCA5A5; }

  /* Generic hover affordance for any button that opted-in via [data-hover] but isn't
     a Btn-atom variant (e.g. table row actions, kebab triggers, list rows). */
  [data-hover="row"]:not(:disabled)                     { transition: background 0.1s; }
  [data-hover="row"]:not(:disabled):hover               { background: #F9FAFB; }
  /* Sole Academy — thumbnail play button grows when its card is hovered. */
  .academy-play                                         { transition: transform .18s ease, box-shadow .18s ease; }
  [data-academy-card]:hover .academy-play               { transform: scale(1.09); box-shadow: 0 14px 34px rgba(0,0,0,0.34); }
  /* Canonical section-navigation tabs (<Tabs>): inactive tab darkens its label
     on hover so it reads as clickable without painting a background block. */
  [data-tab]:not([data-active="true"]):not(:disabled):hover { color: #1F2937 !important; }
  [data-tab]::-webkit-scrollbar, .tab-scroll::-webkit-scrollbar { height: 0; }
  /* Relationship-map node cards: gentle lift on hover (the branch-highlight is JS-driven). */
  [data-crm-card]:hover { box-shadow: 0 12px 26px rgba(17,17,23,.16) !important; }
  /* Notification rows: quick-action strip stays hidden until the row is hovered,
     keeping the list calm at scale (reveal-on-hover, like an email client). */
  [data-ntf-row] .ntf-actions                           { opacity: 0; transition: opacity 0.12s; }
  [data-ntf-row]:hover .ntf-actions                     { opacity: 1; }
  [data-ntf-row]:hover                                  { background: #F9FAFB; }
  button[data-hover="surface"]:not(:disabled)           { transition: background 0.12s, border-color 0.12s; }
  button[data-hover="surface"]:not(:disabled):hover     { background: #F3F4F6; border-color: #D1D5DB; }
  /* Dashboard interactives — lift + indigo halo so KPIs/tiles feel clickable
     without screaming. Drilling is the dashboard's headline behavior. */
  button[data-hover="kpi"]:not(:disabled),
  button[data-hover="tile"]:not(:disabled) {
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  button[data-hover="kpi"]:not(:disabled):hover {
    transform: translateY(-1px);
    border-color: #C7C9FB;
    box-shadow: 0 6px 16px -8px rgba(91, 91, 246, 0.28), 0 1px 2px rgba(15, 17, 23, 0.04);
  }
  button[data-hover="tile"]:not(:disabled):hover {
    border-color: #C7C9FB;
    background: #F5F6FF;
  }
  /* Practice-side card lift — opt-in via <Card hover>. The data-hover="tile" rules
     above only match <button>; Card is a <div>, so it needs its own rule. */
  [data-card="lift"]        { transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
  [data-card="lift"]:hover  { transform: translateY(-2px); border-color: #C7C9FB; box-shadow: 0 10px 24px -12px rgba(91,91,246,0.28), 0 1px 2px rgba(15,17,23,0.04); }
  /* Onboarding builder rail/rows — hover affordance + reveal-on-hover delete. These
     classes existed in the builder with no CSS, so the rail felt dead. Non-active
     rows omit an inline background so this hover wins; active rows set it inline. */
  [data-onb-row]                       { transition: background 0.1s; }
  [data-onb-row]:hover                 { background: #F9FAFB; }
  .onb-rowdel                          { opacity: 0; transition: opacity 0.12s; }
  [data-onb-row]:hover .onb-rowdel     { opacity: 1; }
  a[data-hover="link"]                                  { transition: color 0.1s; }
  a[data-hover="link"]:hover                            { color: #4F46E5; }
  /* Inline link affordance for entity names in dashboard tables
     (project / task names). Click target inherits via row click;
     hover underline + indigo tint signal "click navigates". */
  [data-link="cell"]                                    { color: #5B5BF6; cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.1s; }
  [data-link="cell"]:hover                              { border-bottom-color: #5B5BF6; }

  /* Capacity Planner day-cells: lift + halo on hover so each bar feels
     individually clickable and inspectable, not just decorative. */
  [data-cap-cell]                                        { transition: filter .12s ease, transform .12s ease; }
  [data-cap-cell]:hover                                  { filter: brightness(1.06) saturate(1.1); transform: scaleY(1.04); transform-origin: bottom; }
  [data-cap-cell]:hover [data-cap-fill]                  { box-shadow: 0 0 0 1px rgba(91, 91, 246, 0.55); }

  /* Proposals list — Notion-style hover reveal of inline row actions. */
  .proposal-row:hover                                              { background: #F9FAFB !important; }
  .proposal-row[data-selected="true"]                              { background: #F5F6FF !important; }
  .proposal-row[data-selected="true"]:hover                        { background: #EEF0FF !important; }
  .proposal-row:hover .row-inline-actions                          { opacity: 1 !important; }
  .proposal-row:focus-within .row-inline-actions                   { opacity: 1 !important; }

  button[data-chip]:not(:disabled):not([data-selected="true"]):hover {
    background: #F9FAFB; border-color: #D1D5DB; color: #1F2937;
  }
  button[data-chip][data-selected="true"]:not(:disabled):hover {
    filter: brightness(0.97);
  }

  button[data-accordion]:not(:disabled) { transition: background 0.1s; }
  button[data-accordion]:not(:disabled):not([data-open="true"]):hover { background: #F9FAFB; }

  button[data-preview-tab]:not(:disabled) { transition: background 0.1s, color 0.1s; }
  button[data-preview-tab]:not(:disabled):not([data-active="true"]):hover {
    background: #F3F4F6; color: #1F2937;
  }

  button[data-stage]:not(:disabled) { transition: opacity 0.1s; border-radius: 8px; }
  button[data-stage]:not(:disabled):hover { background: #F9FAFB; }
  .scroll-area { overflow-y: auto; }
  .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes expand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);   border-color: #E5E7EB; }
    20%  { box-shadow: 0 0 0 6px rgba(217, 119, 6, 0.18); border-color: #D97706; }
    100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);   border-color: #E5E7EB; }
  }
  @keyframes pulseField {
    0%, 100% { background: #F9FAFB; }
    50%      { background: #EEF0FF; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.2); }
  }
  @keyframes drawerin { from { transform: translateX(100%); } to { transform: translateX(0); } }

  /* Deals likelihood slider — clean track (filled via inline gradient) + thumb. */
  input[type="range"].dl-range { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; outline: none; cursor: pointer; }
  input[type="range"].dl-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 2px solid #5B5BF6; box-shadow: 0 1px 3px rgba(15,17,23,0.25); cursor: pointer; }
  input[type="range"].dl-range::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 2px solid #5B5BF6; box-shadow: 0 1px 3px rgba(15,17,23,0.25); cursor: pointer; }

  /* Rich block editor — placeholder for empty contenteditable. The :empty
     selector matches when the element contains nothing, including a single
     <br> that browsers leave after the user deletes all content (so we also
     handle the "only-a-br" case via the :has selector with a fallback). */
  .rich-block-editor:empty::before,
  .rich-block-editor:has(> br:only-child)::before {
    content: attr(data-placeholder);
    color: #9CA3AF;
    pointer-events: none;
  }
  .rich-block-editor h2 { font-size: 18px; font-weight: 700; margin: 8px 0 4px; line-height: 1.3; }
  .rich-block-editor h3 { font-size: 15px; font-weight: 600; margin: 6px 0 2px; line-height: 1.3; }
  .rich-block-editor p  { margin: 0 0 6px; }
  .rich-block-editor ul, .rich-block-editor ol { margin: 4px 0 6px; padding-left: 22px; }
  .rich-block-editor li { margin: 1px 0; }

  /* ---- Proposal templates: typography stacks loaded into rendered pages ---- */
  .tpl-font-editorial-heading { font-family: 'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-feature-settings: 'ss01', 'cv11'; }
  .tpl-font-editorial-body    { font-family: 'Source Serif 4', 'Iowan Old Style', Georgia, serif; font-feature-settings: 'ss01'; }
  .tpl-font-editorial-sans    { font-family: 'Inter', system-ui, sans-serif; }
  .tpl-font-modern-heading    { font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.03em; font-feature-settings: 'cv11', 'ss01'; }
  .tpl-font-modern-body       { font-family: 'Inter', system-ui, sans-serif; }
  .tpl-font-boutique-heading  { font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, Georgia, serif; }
  .tpl-font-boutique-body     { font-family: 'Source Serif 4', Georgia, serif; }
  .tpl-font-boutique-sans     { font-family: 'Inter', system-ui, sans-serif; }
  .tpl-script                 { font-family: 'Caveat', 'Brush Script MT', cursive; }
  .tpl-mono                   { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* Tabular numerals + slashed zero on every figure that appears in a money cell,
     date, ID or page number — keeps columns perfectly aligned. */
  .tpl-num                    { font-variant-numeric: tabular-nums slashed-zero; font-feature-settings: 'tnum', 'zero', 'ss01'; }
  /* Small-cap-like uppercase tracked caption for labels (KICKER / META / FOOTER).
     We avoid native small-caps because Source Serif's render in browsers is uneven;
     we get the same legibility from manual uppercase + tracking. */
  .tpl-caption                { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; }

  /* ---- PDF print-mode plumbing ---- */
  .pdf-document { display: none; }            /* Always offscreen on the editor surface; revealed in print only. */
  @media print {
    html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; overflow: visible !important; height: auto !important; }
    body > #root { display: none !important; } /* Hide the entire editor app. */
    .pdf-document {
      display: block !important;
      position: static !important;
      background: #fff !important;
    }
    .pdf-page {
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .pdf-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    @page { size: A4; margin: 0; }
    * {
      -webkit-print-color-adjust: exact !important;
      color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /* In print, the templated page card shouldn't clip its content — the
       on-screen viewport-bound height is irrelevant when we're paginated
       across A4 sheets. */
    .tpl-page-card { box-shadow: none !important; }
    .tpl-page-scroll { overflow: visible !important; }
  }

  /* Inline editable text in the live preview — soft tint + faint underline
     on hover hints at editability without nudging surrounding layout. The
     in-edit ring lives in inline styles on EditableText so it stays themed. */
  [data-editable][data-editing="false"]:hover {
    background: rgba(91, 91, 246, 0.06);
    box-shadow: inset 0 -1px 0 rgba(91, 91, 246, 0.42);
  }
  [data-editable][data-editing="false"]:focus-visible {
    outline: 2px solid rgba(91, 91, 246, 0.55);
    outline-offset: 3px;
    border-radius: 4px;
  }
  [data-editable][data-empty="true"][data-editing="false"] {
    opacity: 0.55;
  }

  /* ============================================================================
     CLIENT PORTAL PREMIUM THEME — scoped to .sole-portal so the practice/SPM
     side is completely untouched. On-brand with the marketing site: Plus Jakarta
     Sans, deep-indigo (#4A3FBE) brand + orange spark, brand-tinted depth, grain
     + aurora atmosphere. White-label ready (one accent drives it all).
     ============================================================================ */
  .sole-portal { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .sole-portal ::selection { background: var(--pt-ring, rgba(74,63,190,0.14)); }
  .sole-portal input:focus, .sole-portal select:focus, .sole-portal textarea:focus { border-color: var(--pt-brand, #4A3FBE) !important; box-shadow: 0 0 0 3px var(--pt-ring, rgba(74,63,190,0.13)) !important; }
  /* Card surfaces — neutral hairline border + restrained single-layer shadow (B2B, brand-agnostic) */
  .sole-portal [data-card] { border-radius: 12px !important; border-color: var(--pt-border, #E6E8EC) !important; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05) !important; }
  .sole-portal [data-card="stat"] { transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s cubic-bezier(.22,1,.36,1); }
  .sole-portal [data-card="stat"]:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -8px rgba(16,24,40,0.13) !important; }
  /* Primary CTA — solid brand fill (no gradient), hairline border, restrained shadow */
  .sole-portal [data-btn="primary"] { background: var(--pt-brand, #4A3FBE) !important; border-color: var(--pt-brand-deep, #3C33A4) !important; box-shadow: 0 1px 2px rgba(16,24,40,0.10) !important; transition: filter .15s, box-shadow .15s; }
  .sole-portal [data-btn="primary"]:hover { filter: brightness(0.95); }
  .sole-portal [data-btn="primaryOutline"] { color: var(--pt-brand, #4A3FBE) !important; border-color: var(--pt-brand-border, #C7C9FB) !important; }
  .sole-portal [data-chip][data-selected="true"] { background: var(--pt-brand-soft, #EEF0FF) !important; border-color: var(--pt-brand, #4A3FBE) !important; color: var(--pt-brand-deep, #3C33A4) !important; }
  /* Staggered load reveal (subtle) */
  @keyframes ptReveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .pt-reveal { animation: ptReveal .45s cubic-bezier(.22,1,.36,1) both; }
  .pt-lift { transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s cubic-bezier(.22,1,.36,1); }
  .pt-lift:hover { transform: translateY(-2px); }
  /* One-class staggered page-load reveal — add .pt-stagger to a screen's root column */
  .sole-portal .pt-stagger > * { animation: ptReveal .45s cubic-bezier(.22,1,.36,1) both; }
  .sole-portal .pt-stagger > *:nth-child(1) { animation-delay: .02s; }
  .sole-portal .pt-stagger > *:nth-child(2) { animation-delay: .07s; }
  .sole-portal .pt-stagger > *:nth-child(3) { animation-delay: .12s; }
  .sole-portal .pt-stagger > *:nth-child(4) { animation-delay: .17s; }
  .sole-portal .pt-stagger > *:nth-child(5) { animation-delay: .22s; }
  .sole-portal .pt-stagger > *:nth-child(n+6) { animation-delay: .26s; }
  /* Icon tiles — flat neutral tint + hairline inset ring (no gradient) */
  .sole-portal [data-iconchip]:not([data-grad]) { box-shadow: inset 0 0 0 1px rgba(16,24,40,0.05); }
  .sole-portal [data-iconchip][data-tone="accent"]:not([data-grad]) { background: var(--pt-brand-soft, #EEF0FF) !important; }
  /* White-label: ACCENT icon tiles follow the client brand (gradient bg keeps its white
     icon; flat tiles get a brand-soft bg + brand icon stroke — CSS overrides the inline
     stroke attribute). Semantic tones (green/amber/red/blue) intentionally stay fixed. */
  .sole-portal [data-iconchip][data-grad][data-tone="accent"] { background: linear-gradient(135deg, var(--pt-brand-mid, #5A4FCF) 0%, var(--pt-brand, #4A3FBE) 100%) !important; }
  .sole-portal [data-iconchip][data-tone="accent"]:not([data-grad]) svg { stroke: var(--pt-brand, #4A3FBE) !important; }
  /* Soft/ghost/icon buttons — faint brand tint on hover */
  .sole-portal [data-btn="soft"]:not(:disabled), .sole-portal [data-btn="ghost"]:not(:disabled), .sole-portal [data-btn="iconOnly"]:not(:disabled) { transition: border-color .12s, color .12s, background .12s; }
  .sole-portal [data-btn="soft"]:not(:disabled):hover, .sole-portal [data-btn="ghost"]:not(:disabled):hover, .sole-portal [data-btn="iconOnly"]:not(:disabled):hover { border-color: var(--pt-brand-border, #C7C9FB) !important; color: var(--pt-brand, #4A3FBE) !important; }
  .sole-portal [data-btn="iconOnly"]:not(:disabled):hover { background: var(--pt-brand-softer, #F5F6FF) !important; }
  /* List-row hover — soft neutral tint */
  .sole-portal [data-hover="row"]:not(:disabled) { transition: background .12s; }
  .sole-portal [data-hover="row"]:not(:disabled):hover { background: var(--pt-row-hover, #F6F6FE); }
  /* Live presence ring pulse */
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
  .sole-portal [data-card="stat"], .sole-portal [data-card="panel"] { box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05) !important; }
  /* Date input picker icon — tone it toward muted so it matches custom selects */
  .sole-portal input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; filter: grayscale(1); cursor: pointer; }
  .sole-portal input[type="date"] { font-size: 13px; min-height: 36px; }
  /* Stepper steps read as clickable — hover tints subtly */
  .sole-portal [data-portal-step] { transition: background .12s; border-radius: 10px; }
  .sole-portal [data-portal-step]:hover { background: var(--pt-brand-softer, rgba(74,63,190,0.06)); }
  .sole-portal [data-portal-step]:hover .pps-dot { border-color: var(--pt-brand, #4A3FBE) !important; color: var(--pt-brand, #4A3FBE); transform: translateY(-1px); }
  .sole-portal [data-portal-step]:hover .pps-label { color: var(--pt-brand-deep, #3C33A4); }
</style>
</head>
<body>
<div id="root"></div>

<!-- The curriculum baked in at build time from index.html's own ACADEMY_* consts.

// --- client-portal theme (PT) — B2B / professional, white-label-ready.
// Scoped to portal components only (the practice side keeps T). The whole portal
// is driven by ONE brand hex: every shade/tint/border/soft-shadow is *derived*
// from it via makePortalTheme(), so the portal recolours cleanly for any client
// brand — not just the original indigo. Direction: Ramp/Wise/Mixpanel — neutral
// surfaces, hairline borders, restrained shadows, brand used as a sharp accent
// (buttons, active nav, links, small tints) rather than big gradient fills.
//
// White-label seam: PT holds REAL hex (so SVG <Icon stroke={...}> works); the
// static .sole-portal CSS block reads matching --pt-* CSS variables which
// ClientPortalApp sets on its root from PT. Switch brand via ?brand=<key|hex>
// or localStorage 'sole.portal.brand' (the in-portal switcher sets + reloads).
const _ptHex2rgb = (h) => { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h || '4A3FBE', 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const _ptClamp = (x) => Math.max(0, Math.min(255, Math.round(x)));
const _ptRgb2hex = (r, g, b) => '#' + [r, g, b].map(x => _ptClamp(x).toString(16).padStart(2, '0')).join('');
const _ptMix = (hex, target, amt) => { const [r, g, b] = _ptHex2rgb(hex); const [tr, tg, tb] = _ptHex2rgb(target); return _ptRgb2hex(r + (tr - r) * amt, g + (tg - g) * amt, b + (tb - b) * amt); };
const ptLighten = (hex, amt) => _ptMix(hex, '#FFFFFF', amt);
const ptDarken = (hex, amt) => _ptMix(hex, '#000000', amt);
const ptRgba = (hex, a) => { const [r, g, b] = _ptHex2rgb(hex); return `rgba(${r},${g},${b},${a})`; };

  brandMid: ptLighten(brand, 0.12),

  brandSoft: ptLighten(brand, 0.90),       // very light brand tint — soft backgrounds
  brandSofter: ptLighten(brand, 0.95),

// Lighten/darken a hex by mixing toward white/black. Returns the new hex.
// Used so brand color can drive gradient highlights and tinted backgrounds.
const hexMix = (hex, towards, ratio) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const tr = parseInt(towards.slice(1, 3), 16);
  const tg = parseInt(towards.slice(3, 5), 16);
  const tb = parseInt(towards.slice(5, 7), 16);
  const mix = (a, c) => Math.round(a + (c - a) * ratio);
  const toHex = n => n.toString(16).padStart(2, '0');
  return `#${toHex(mix(r, tr))}${toHex(mix(g, tg))}${toHex(mix(b, tb))}`;
};
const lightenHex = (hex, r = 0.85) => hexMix(hex, '#FFFFFF', r);
const darkenHex  = (hex, r = 0.18) => hexMix(hex, '#0F1117', r);
const withAlpha  = (hex, alpha) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const a = Math.round(Math.max(0, Math.min(1, alpha)) * 255).toString(16).padStart(2, '0');
  return `#${h}${a}`;
};

const fmtDate = (d) => d ? d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const addMonths = (n) => { const d = new Date(); d.setMonth(d.getMonth() + n); return d; };
const computeStartDate = (chip, custom) => {
  if (chip === 'today') return new Date();
  if (chip === 'tomorrow') return addDays(1);
  if (chip === '1w') return addDays(7);
  if (chip === '1m') return addMonths(1);
  if (chip === 'custom' && custom) return new Date(custom);
  return null;
};

const useViewport = () => {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  useEffect(() => {
    const on = () => setW(window.innerWidth);
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, []);
  return { w, isMobile: w < 768, isTablet: w < 1024, isCompact: w < 1200, hasPreview: w >= 1100 };
};

const BrandMark = ({ brand, size = 18 }) => {
  if (brand === 'hubspot') {
    const c = '#FF7A59';
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
        <circle cx="17" cy="6" r="2.4" fill={c} />
        <circle cx="9.5" cy="14.5" r="5.2" stroke={c} strokeWidth="1.8" fill="none" />
        <line x1="11.4" y1="11.4" x2="15.6" y2="7.2" stroke={c} strokeWidth="1.8" strokeLinecap="round" />
        <line x1="9.5" y1="9.3" x2="9.5" y2="6" stroke={c} strokeWidth="1.8" strokeLinecap="round" />
      </svg>
    );
  }
  if (brand === 'xero') {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10.5" fill="#13B5EA" />
        <path d="M8 8.4l3.6 3.6L8 15.6M16 8.4L12.4 12 16 15.6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none" />

  return null;
};

// --- atoms ---
const Card = ({ children, style, padded = true, hover, onClick }) => (
  <div data-card={hover ? 'lift' : 'base'} onClick={onClick} style={{
    background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: T.radiusCard,
    boxShadow: T.shadowSm, padding: padded ? T.space.lg : 0, ...style
  }}>{children}</div>
);

const Label = ({ children, style }) => (
  <div style={{ fontSize: 12, fontWeight: 500, color: T.textSoft, marginBottom: 6, ...style }}>{children}</div>
);

const SectionTitle = ({ children, style }) => (
  <div style={{ fontSize: 14, fontWeight: 600, color: T.text, ...style }}>{children}</div>
);

const Helper = ({ children, style }) => (
  <div style={{ fontSize: 12, color: T.muted, ...style }}>{children}</div>
);

// --- shadcn-grade building blocks (Jun-24 polish pass) -----------------------
// Reusable, inline-styled off T. Reference Icon/IconChip/MiniSpark at render time
// (defined later in the file) — fine since these only run inside JSX at runtime.
const ICONCHIP_TONES = {
  accent:  { bg: T.primarySoft, fg: T.primary,    grad: 'linear-gradient(135deg, #5A4FCF 0%, #4A3FBE 100%)', shadow: 'rgba(74,63,190,0.5)' },
  green:   { bg: T.greenSoft,   fg: T.greenDark,  grad: 'linear-gradient(135deg, #34D399 0%, #059669 100%)', shadow: 'rgba(5,150,105,0.42)' },
  amber:   { bg: T.amberSoft,   fg: T.amber,      grad: 'linear-gradient(135deg, #FBBF24 0%, #D97706 100%)', shadow: 'rgba(217,119,6,0.42)' },
  blue:    { bg: T.blueSoft,    fg: T.blue,       grad: 'linear-gradient(135deg, #60A5FA 0%, #2563EB 100%)', shadow: 'rgba(37,99,235,0.42)' },
  red:     { bg: T.redSoft,     fg: T.red,        grad: 'linear-gradient(135deg, #F87171 0%, #DC2626 100%)', shadow: 'rgba(220,38,38,0.42)' },
  neutral: { bg: T.fieldBg,     fg: T.muted,      grad: 'linear-gradient(135deg, #9CA3AF 0%, #6B7280 100%)', shadow: 'rgba(107,114,128,0.36)' },
};
// Rounded-square icon tile — the reference's signature motif. `gradient` renders a
// bold tone-coloured gradient tile with a white icon (used on KPIs/heroes); the
// flat pastel default is used elsewhere. data-iconchip/-tone/-grad are hooks the
// portal CSS uses to enrich tiles without touching the practice side.
const IconChip = ({ icon, tone = 'accent', size = 36, style, gradient }) => {
  const t = ICONCHIP_TONES[tone] || ICONCHIP_TONES.accent;
  const bg = gradient ? t.grad : t.bg;
  const fg = gradient ? '#fff' : t.fg;
  return (
    <div data-iconchip data-tone={tone} data-grad={gradient ? 'true' : undefined} style={{ width: size, height: size, borderRadius: Math.round(size * 0.29), background: bg, color: fg, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, boxShadow: gradient ? `0 6px 14px -6px ${t.shadow}` : undefined, ...style }}>
      <Icon name={icon} size={Math.round(size * 0.5)} color={fg} />
    </div>
  );
};

// KPI tile — compact, uniform height. icon chip + label + big value + sub (and
// optional delta). Keep every tile in a row structurally identical (icon+label+
// value+sub) so the grid doesn't leave a void under shorter cards. `spark` is
// supported but discouraged in a mixed row — it changes card height.
const StatCard = ({ icon, tone = 'accent', label, value, sub, delta, deltaTone, spark, onClick, style }) => (
  <div onClick={onClick} data-card="stat" data-hover={onClick ? 'tile' : undefined} style={{ background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: T.radiusCard, boxShadow: T.shadowSm, padding: '13px 15px', display: 'flex', flexDirection: 'column', cursor: onClick ? 'pointer' : 'default', minWidth: 0, ...style }}>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
      {icon && <IconChip icon={icon} tone={tone} size={32} gradient />}
      {delta != null && <span style={{ fontSize: 11.5, fontWeight: 700, color: deltaTone === 'down' ? T.red : T.greenDark, display: 'inline-flex', alignItems: 'center', gap: 2 }}>{deltaTone === 'down' ? '▼' : '▲'} {delta}</span>}
    </div>
    <div style={{ fontSize: 11.5, fontWeight: 600, color: T.muted, letterSpacing: 0.2, marginTop: 11 }}>{label}</div>
    <div style={{ fontSize: 22, fontWeight: 800, color: T.text, letterSpacing: -0.4, fontVariantNumeric: 'tabular-nums', marginTop: 2, lineHeight: 1.15 }}>{value}</div>
    {sub && <div style={{ fontSize: 11.5, color: T.muted, marginTop: 3 }}>{sub}</div>}
    {/* Fixed-height viz slot — keeps a row of tiles equal height whatever the viz (r5 lesson). */}
    {spark && <div style={{ height: 28, display: 'flex', alignItems: 'flex-end', marginTop: 9 }}>{spark}</div>}
  </div>
);

// Card with a standard header row (icon + title + subtitle + right-aligned actions).
const PanelCard = ({ title, subtitle, icon, iconTone = 'accent', actions, children, style, bodyStyle }) => (
  <div data-card="panel" style={{ background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: T.radiusCard, boxShadow: T.shadowSm, overflow: 'hidden', ...style }}>
    {(title || actions) && (
      <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '14px 16px', borderBottom: `1px solid ${T.borderSoft}` }}>
        {icon && <IconChip icon={icon} tone={iconTone} size={32} />}
        <div style={{ flex: 1, minWidth: 0 }}>
          {title && <div style={{ fontSize: 14, fontWeight: 700, color: T.text }}>{title}</div>}
          {subtitle && <div style={{ fontSize: 11.5, color: T.muted, marginTop: 1 }}>{subtitle}</div>}
        </div>
        {actions}
      </div>
    )}
    <div style={{ padding: 16, ...bodyStyle }}>{children}</div>
  </div>
);

// Page header — large title + subtitle + actions.
const PageHead = ({ title, subtitle, actions, style }) => (
  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap', marginBottom: 18, ...style }}>
    <div style={{ minWidth: 0 }}>
      <div style={{ fontSize: 22, fontWeight: 800, color: T.text, letterSpacing: -0.4 }}>{title}</div>
      {subtitle && <Helper style={{ fontSize: 13, marginTop: 3 }}>{subtitle}</Helper>}
    </div>
    {actions && <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>{actions}</div>}
  </div>
);

// Tone-aware status / callout banner.
const BANNER_TONES = {
  success: { bg: T.greenSoft,     bd: '#A7F3D0', fg: T.greenDark, icon: 'checkCircle' },
  info:    { bg: T.blueSoft,      bd: '#BFDBFE', fg: T.blue,      icon: 'info' },
  accent:  { bg: T.primarySofter, bd: '#C7C9FB', fg: T.primary,   icon: 'shield' },
  warn:    { bg: T.amberSoft,     bd: '#FCD34D', fg: '#92400E',   icon: 'alertTriangle' },
  danger:  { bg: T.redSoft,       bd: '#FECACA', fg: '#991B1B',   icon: 'alertTriangle' },
};
const Banner = ({ tone = 'info', title, children, icon, action, style }) => {
  const t = BANNER_TONES[tone] || BANNER_TONES.info;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: t.bg, border: `1px solid ${t.bd}`, borderRadius: T.radius, ...style }}>
      <Icon name={icon || t.icon} size={18} color={t.fg} />
      <div style={{ flex: 1, minWidth: 0 }}>
        {title && <div style={{ fontSize: 13.5, fontWeight: 700, color: t.fg }}>{title}</div>}
        {children && <div style={{ fontSize: 12.5, color: t.fg, opacity: 0.92, marginTop: title ? 1 : 0, lineHeight: 1.45 }}>{children}</div>}
      </div>
      {action}
    </div>
  );
};

// Horizontal step tracker — done / current / upcoming.
const Stepper = ({ steps, style }) => (
  <div style={{ display: 'flex', alignItems: 'center', ...style }}>
    {steps.map((s, i) => {
      const last = i === steps.length - 1;
      const done = s.state === 'done', current = s.state === 'current';
      const c = done ? T.green : current ? T.primary : T.borderStrong;
      return (
        <React.Fragment key={s.label || i}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
            <div style={{ width: 24, height: 24, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: done ? T.green : current ? T.primary : T.card, border: `1.5px solid ${c}`, flexShrink: 0 }}>
              {done ? <Icon name="check" size={12} color="#fff" strokeWidth={3} /> : <span style={{ fontSize: 11, fontWeight: 800, color: current ? '#fff' : T.mutedSoft }}>{i + 1}</span>}
            </div>
            <span style={{ fontSize: 12.5, fontWeight: current ? 700 : 600, color: done ? T.text : current ? T.primary : T.muted, whiteSpace: 'nowrap' }}>{s.label}</span>
          </div>
          {!last && <div style={{ flex: 1, height: 1.5, background: done ? T.green : T.border, margin: '0 10px', minWidth: 16 }} />}
        </React.Fragment>
      );
    })}
  </div>
);

// Consistent empty state.
const EmptyState = ({ icon = 'inbox', title, hint, action, style }) => (
  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '40px 24px', ...style }}>
    <IconChip icon={icon} tone="neutral" size={44} />
    {title && <div style={{ fontSize: 14, fontWeight: 700, color: T.text, marginTop: 12 }}>{title}</div>}
    {hint && <Helper style={{ fontSize: 12.5, marginTop: 4, maxWidth: 320 }}>{hint}</Helper>}
    {action && <div style={{ marginTop: 14 }}>{action}</div>}
  </div>
);

// --- DataTable — the ONE table primitive (Jun-30) -----------------------------
// Every tabular list in the SPM renders through this so they look identical. It's
// CSS-grid based (keeps the minmax(px, Nfr) column flex the surfaces already use)
// and composes existing atoms (RowCheckbox, Pill, ClientMark…) via column render()
// fns — it owns LAYOUT, not domain cells. All spacing/border metrics live in the
// DT_* constants so they never drift between surfaces.
//
//   columns: [{ key, header, width, align('left'|'right'|'center'), sortable,
//               sortValue(row), render(row, ctx), defaultVisible, alwaysVisible,
//               headerStyle, cellStyle }]
//   rows, rowKey(row)=row.id, onRowClick(row), rowStyle(row, ctx)
//   selectable + selectedIds(Set) + onSelectionChange(Set)   (omit → no checkbox col)
//   columnVisibility {key:bool}  (absent keys fall back to defaultVisible !== false)
//   defaultSort {key,dir:1|-1} + onSortChange(next)   (sorting is internal)
//   toolbar (above card) · bulkBar (above card when selection non-empty) ·
//   empty (EmptyState props) · footer (inside card, bottom)
//   rowHeight · density('standard'|'compact') · minWidth · zebra
const DT_ROW_H = 48;
const DT_ROW_H_COMPACT = 44;
const DT_HEADER_PAD = '11px 16px';
const DT_CELL_PAD = '12px 16px';
// Minimal/Notion header: no fill, just a quiet uppercase micro-label over a hairline divider.
const DT_HEADER_TXT = { fontSize: 10.5, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6 };

const DataTable = ({
  columns, rows, rowKey, onRowClick, rowStyle,
  selectable, selectedIds, onSelectionChange,
  columnVisibility, defaultSort, onSortChange,
  toolbar, bulkBar, empty, footer,
  rowHeight, density = 'standard', minWidth, zebra, style, cardStyle,
}) => {
  const keyOf = rowKey || ((r) => r.id);
  const [sort, setSort] = useState(defaultSort || null);
  const rh = rowHeight || (density === 'compact' ? DT_ROW_H_COMPACT : DT_ROW_H);

  const visibleColumns = columns.filter((c) => {
    if (c.alwaysVisible) return true;
    if (columnVisibility && (c.key in columnVisibility)) return columnVisibility[c.key];
    return c.defaultVisible !== false;
  });

  const widthOf = (w) => (typeof w === 'number' ? `${w}px` : (w || 'minmax(0,1fr)'));
  const template = [selectable ? '34px' : null, ...visibleColumns.map((c) => widthOf(c.width))].filter(Boolean).join(' ');

  let displayRows = rows;
  if (sort && sort.key) {
    const col = columns.find((c) => c.key === sort.key);
    if (col) {
      const val = col.sortValue || ((r) => r[sort.key]);
      displayRows = [...rows].sort((a, b) => {
        const av = val(a), bv = val(b);
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        const cmp = (typeof av === 'number' && typeof bv === 'number') ? av - bv : String(av).localeCompare(String(bv));
        return sort.dir === -1 ? -cmp : cmp;
      });
    }
  }

  const clickSort = (col) => {
    if (!col.sortable) return;
    setSort((prev) => {
      const next = (!prev || prev.key !== col.key) ? { key: col.key, dir: 1 } : prev.dir === 1 ? { key: col.key, dir: -1 } : null;
      onSortChange && onSortChange(next);
      return next;
    });
  };

  const sel = selectedIds || new Set();
  const allSelected = selectable && displayRows.length > 0 && displayRows.every((r) => sel.has(keyOf(r)));
  const someSelected = selectable && displayRows.some((r) => sel.has(keyOf(r)));
  const toggleAll = () => { if (!onSelectionChange) return; const n = new Set(sel); if (allSelected) displayRows.forEach((r) => n.delete(keyOf(r))); else displayRows.forEach((r) => n.add(keyOf(r))); onSelectionChange(n); };
  const toggleRow = (r) => { if (!onSelectionChange) return; const id = keyOf(r); const n = new Set(sel); n.has(id) ? n.delete(id) : n.add(id); onSelectionChange(n); };

  return (
    <div style={style}>
      {toolbar}
      {selectable && sel.size > 0 && bulkBar}
      <div data-card="base" style={{ background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: T.radiusCard, boxShadow: T.shadowXs, overflow: 'hidden', ...cardStyle }}>
        <div style={{ overflowX: 'auto' }}>
          <div style={{ minWidth: minWidth || 0 }}>
            {/* header — white, anchored only by a hairline divider (Notion-minimal) */}
            <div style={{ display: 'grid', gridTemplateColumns: template, gap: T.space.md, padding: DT_HEADER_PAD, background: T.card, borderBottom: `1px solid ${T.border}`, alignItems: 'center' }}>
              {selectable && <RowCheckbox checked={allSelected} indeterminate={!allSelected && someSelected} onChange={toggleAll} ariaLabel="Select all" />}
              {visibleColumns.map((c) => {
                const active = sort && sort.key === c.key;
                return (
                  <div key={c.key} onClick={() => clickSort(c)} style={{ ...DT_HEADER_TXT, color: active ? T.text : T.muted, cursor: c.sortable ? 'pointer' : 'default', userSelect: 'none', textAlign: c.align || 'left', whiteSpace: 'nowrap', ...(c.headerStyle || {}) }}>
                    {c.header}{c.sortable && active && <span style={{ fontSize: 8, marginLeft: 4 }}>{sort.dir === -1 ? '▲' : '▼'}</span>}
                  </div>
                );
              })}
            </div>
            {/* rows */}
            {displayRows.length === 0
              ? (empty ? <EmptyState {...empty} style={{ padding: '40px 16px', ...(empty.style || {}) }} /> : null)
              : displayRows.map((r, i) => {
                const id = keyOf(r);
                const selected = selectable && sel.has(id);
                const ctx = { selected, index: i };
                return (
                  <div key={id} data-hover={onRowClick ? 'row' : undefined} onClick={onRowClick ? () => onRowClick(r) : undefined}
                    style={{ display: 'grid', gridTemplateColumns: template, gap: T.space.md, padding: DT_CELL_PAD, minHeight: rh, alignItems: 'center', borderBottom: i < displayRows.length - 1 ? `1px solid ${T.borderSoft}` : 'none', fontSize: 13, cursor: onRowClick ? 'pointer' : 'default', background: selected ? T.primarySofter : (zebra && i % 2 ? T.surface : undefined), ...(rowStyle ? rowStyle(r, ctx) : {}) }}>
                    {selectable && <RowCheckbox checked={selected} onChange={() => toggleRow(r)} ariaLabel="Select row" />}
                    {visibleColumns.map((c) => (
                      <div key={c.key} style={{ minWidth: 0, textAlign: c.align || 'left', ...(c.cellStyle || {}) }}>
                        {c.render ? c.render(r, ctx) : <span style={{ color: T.textSoft, display: 'block', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r[c.key]}</span>}
                      </div>
                    ))}
                  </div>
                );
              })}
          </div>
        </div>
        {footer}
      </div>
    </div>
  );
};

const Input = ({ value, onChange, placeholder, style, type, autoFocus, onKeyDown, suffix, prefix }) => {
  const native = (
    <input
      type={type || 'text'} autoFocus={autoFocus} onKeyDown={onKeyDown}
      value={value} onChange={onChange} placeholder={placeholder}
      style={{
        width: '100%', padding: '9px 12px', border: (suffix || prefix) ? 'none' : `1px solid ${T.border}`,
        borderRadius: 8, background: 'transparent', color: T.text, outline: 'none',
        ...((suffix || prefix) ? {} : style)
      }}
    />
  );
  if (!suffix && !prefix) return native;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', border: `1px solid ${T.border}`, borderRadius: 8,
      background: T.card, paddingLeft: prefix ? 12 : 0, paddingRight: suffix ? 12 : 0, ...style
    }}>
      {prefix && <span style={{ color: T.muted, fontSize: 13 }}>{prefix}</span>}
      {native}
      {suffix && <span style={{ color: T.muted, fontSize: 13 }}>{suffix}</span>}
    </div>
  );
};

const Select = ({ value, onChange, children, style }) => (
  <select value={value} onChange={onChange}
    style={{
      width: '100%', padding: '9px 12px', border: `1px solid ${T.border}`, borderRadius: 8,
      background: T.card, color: T.text, appearance: 'none',
      backgroundImage: `linear-gradient(45deg, transparent 50%, ${T.muted} 50%), linear-gradient(135deg, ${T.muted} 50%, transparent 50%)`,
      backgroundPosition: 'calc(100% - 16px) 50%, calc(100% - 11px) 50%',
      backgroundSize: '5px 5px, 5px 5px', backgroundRepeat: 'no-repeat',
      paddingRight: 32, cursor: 'pointer', ...style
    }}>
    {children}
  </select>
);

// Button atom — `borderRadius: 8` on every variant keeps the entire app squircle-shaped.
// Inline buttons elsewhere should also use 8 (or 999 for pure-pill chips). Don't mix.
const Btn = ({ variant = 'ghost', children, onClick, style, disabled, icon, iconRight, size = 'md', title, type }) => {
  // Sizes tuned for 13" laptops — md is the default everywhere except dense tables.
  // Keep heights consistent so a row of mixed buttons doesn't look ragged.
  const sizes = {
    sm: { padding: '5px 10px', fontSize: 12, minHeight: 28 },
    md: { padding: '7px 13px', fontSize: 13, minHeight: 32 },
    lg: { padding: '9px 16px', fontSize: 14, minHeight: 38 },
  };
  const iconSize = size === 'sm' ? 12 : size === 'lg' ? 15 : 13;
  const base = {
    borderRadius: 8, border: `1px solid ${T.border}`,
    background: T.card, color: T.text, fontWeight: 500, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap',
    lineHeight: 1.2, ...sizes[size]
  };
  const styles = {
    ghost: { ...base },
    soft: { ...base, background: T.fieldBg },
    primary: { ...base, background: T.primary, color: '#fff', borderColor: T.primary, boxShadow: '0 1px 2px rgba(79,70,229,0.18)' },
    primaryOutline: { ...base, background: T.card, color: T.primary, borderColor: T.primary, fontWeight: 600 },
    danger: { ...base, background: T.red, color: '#fff', borderColor: T.red },
    dangerOutline: { ...base, background: T.card, color: T.red, borderColor: '#FECACA' },
    iconOnly: { ...base, padding: size === 'sm' ? 6 : 7, minWidth: sizes[size].minHeight },
  };
  return (
    <button onClick={onClick} disabled={disabled} data-btn={variant} title={title} type={type}
      style={{ ...styles[variant], opacity: disabled ? 0.5 : 1, cursor: disabled ? 'not-allowed' : 'pointer', ...style }}>
      {icon && <Icon name={icon} size={iconSize} />}
      {children}
      {iconRight && <Icon name={iconRight} size={iconSize} />}
    </button>
  );
};

const Toggle = ({ on, onChange, size = 'md' }) => {
  const w = size === 'sm' ? 32 : 38;
  const h = size === 'sm' ? 18 : 22;
  const k = h - 4;
  return (
    <button onClick={() => onChange(!on)}
      style={{
        width: w, height: h, padding: 0, border: 'none', borderRadius: 999,
        background: on ? T.primary : '#D1D5DB', position: 'relative', cursor: 'pointer',
        transition: 'background 0.15s', flexShrink: 0
      }}>
      <span style={{
        position: 'absolute', top: 2, left: on ? w - k - 2 : 2,
        width: k, height: k, borderRadius: '50%', background: '#fff',
        transition: 'left 0.15s', boxShadow: '0 1px 2px rgba(0,0,0,0.15)'
      }} />
    </button>
  );
};

const SegToggle = ({ options, value, onChange }) => (
  <div style={{
    display: 'inline-flex', border: `1px solid ${T.border}`, borderRadius: 8, padding: 3,
    background: T.fieldBg
  }}>
    {options.map(opt => (
      <button key={opt.value} onClick={() => onChange(opt.value)}
        style={{
          padding: '6px 14px', border: 'none', borderRadius: 6,
          background: value === opt.value ? T.card : 'transparent',
          color: value === opt.value ? T.text : T.muted,
          fontWeight: value === opt.value ? 600 : 500,
          boxShadow: value === opt.value ? `0 1px 2px rgba(0,0,0,0.05), 0 0 0 1px ${T.border}` : 'none',
          cursor: 'pointer', transition: 'all 0.1s'
        }}>
        {opt.label}
      </button>
    ))}
  </div>
);

const Pill = ({ children, color = 'neutral', style, title }) => {
  const palettes = {
    neutral: { bg: T.fieldBg, fg: T.muted, bd: T.border },
    green: { bg: T.greenSoft, fg: T.greenDark, bd: '#A7F3D0' },
    amber: { bg: T.amberSoft, fg: T.amber, bd: '#FCD34D' },
    blue: { bg: T.blueSoft, fg: T.blue, bd: '#BFDBFE' },
    accent: { bg: T.primarySoft, fg: T.primary, bd: '#C7C9FB' },
    red: { bg: T.redSoft, fg: T.red, bd: '#FECACA' },
  };
  const p = palettes[color];
  return (
    <span title={title} style={{
      display: 'inline-flex', alignItems: 'center', padding: '2px 8px', borderRadius: 999,
      background: p.bg, color: p.fg, border: `1px solid ${p.bd}`,
      fontSize: 11, fontWeight: 500, whiteSpace: 'nowrap', ...style
    }}>{children}</span>
  );
};

// `title` mirrors Pill's — optional and inert unless passed, so existing call
// sites are unaffected; it exists because a filter chip sometimes needs to explain
// itself (e.g. an Academy module's recording status).
const Chip = ({ selected, onClick, children, style, size = 'md', title }) => (
  <button onClick={onClick} title={title} data-chip data-selected={selected ? 'true' : 'false'}
    style={{
      padding: size === 'sm' ? '5px 10px' : '7px 14px',
      borderRadius: 999,
      border: `1px solid ${selected ? T.primary : T.border}`,
      background: selected ? T.primarySoft : T.card,
      color: selected ? T.primary : T.textSoft,
      fontWeight: selected ? 600 : 500,
      fontSize: size === 'sm' ? 12 : 13,
      cursor: 'pointer', transition: 'all 0.1s',
      whiteSpace: 'nowrap', display: 'inline-flex', alignItems: 'center', gap: 4,
      ...style
    }}>{children}</button>
);

// --- Tabs (canonical section navigation) ---
// ONE underline tab pattern used across the whole app, so section navigation
// always looks identical (the old mix of boxed / segmented / pill strips was the
// inconsistency users called out). Active = dark label + a 2px brand underline;
// inactive = muted. Reads visually distinct from filter chips (pills) by design.
//   tabs:    [{ id, label, icon?, count?, badgeTone?, tooltip?, disabled? }]
//   accent:  override the underline/badge colour (e.g. portal PT.brand)
//   right:   node pinned to the right of the strip (e.g. a readiness pill)
//   size:    'sm' | 'md'
// count + badgeTone render a small badge: 'neutral' (quiet), 'alert' (amber,
// e.g. profile gaps), 'hot' (red, e.g. unread) — all three exist in the app today.
const TabBadge = ({ count, tone = 'neutral', active, accent }) => {
  const acc = accent || T.primary;
  const solid = tone === 'alert' ? T.amber : tone === 'hot' ? T.red : null;
  const st = solid
    ? { background: solid, color: '#fff', minWidth: 17, height: 17, padding: '0 5px' }
    : { background: active ? ptRgba(acc, 0.12) : T.fieldBg, color: active ? acc : T.muted, minWidth: 18, padding: '1px 7px' };
  return (
    <span style={{ fontSize: 10.5, fontWeight: 700, borderRadius: 999, textAlign: 'center',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1, ...st }}>{count}</span>
  );
};
// TabInfo: the ⓘ beside a tab label. This used to be a bare `title=` on the tab
// button, which meant the explanation was hover-only: unreachable on touch, and
// the glyph looked interactive while doing nothing on click. Same fault, and the
// same fix, as WarningTooltip further down. Opens on hover AND on tap; dismisses
// on outside press or Esc. Rendered as a SIBLING of the tab button, never nested,
// so it stays valid HTML and its own tap doesn't switch tabs.
const TabInfo = ({ text, color, size = 13 }) => {
  const [open, setOpen] = useState(false);
  const [hover, setHover] = useState(false);
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  // The tab strip is a horizontal scroller (`.tab-scroll`, overflowX: auto), and
  // an `overflow-x: auto` box also clips vertically, so an absolutely-positioned
  // panel renders into the DOM and is then invisible. So the panel is `fixed` and
  // positioned off the trigger's measured rect, which escapes the scroller.
  const place = () => {
    const r = ref.current && ref.current.getBoundingClientRect();
    if (!r) return;
    const W = 260, half = W / 2;
    const cx = Math.min(Math.max(r.left + r.width / 2, half + 8), window.innerWidth - half - 8);
    setPos({ left: cx, top: r.bottom + 8 });
  };
  // Dismissal has to clear `hover` as well as `open`. After a click the pointer is
  // still sitting on the glyph, so hover stays true and `open || hover` would keep
  // the panel up, and Esc would look broken. Clearing both means it stays shut until
  // the pointer genuinely leaves and returns.
  const dismiss = () => { setOpen(false); setHover(false); };
  useEffect(() => {
    if (!open) return;
    const onDoc = (ev) => { if (ref.current && !ref.current.contains(ev.target)) dismiss(); };
    const onKey = (ev) => { if (ev.key === 'Escape') dismiss(); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('touchstart', onDoc);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('touchstart', onDoc);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);
  return (
    <span ref={ref} style={{ position: 'relative', display: 'inline-flex', flexShrink: 0 }}>
      <button type="button" aria-label="What this means" aria-expanded={open ? 'true' : 'false'}
        onClick={(e) => { e.stopPropagation(); place(); setOpen(o => !o); }}
        onMouseEnter={() => { place(); setHover(true); }} onMouseLeave={() => setHover(false)}
        style={{
          border: 'none', background: 'transparent', padding: 2, margin: 0, borderRadius: 4,
          display: 'inline-flex', alignItems: 'center', cursor: 'pointer', color,
        }}>
        <Icon name="info" size={size} color={color} />
      </button>
      {(open || hover) && pos && (
        <div role="tooltip" style={{
          position: 'fixed', top: pos.top, left: pos.left, transform: 'translateX(-50%)',
          width: 260, padding: 10, background: T.card, border: `1px solid ${T.border}`, borderRadius: 10,
          boxShadow: '0 10px 28px rgba(15,17,23,0.14)', zIndex: 300, animation: 'expand 0.12s ease',
          fontSize: 12, lineHeight: 1.5, color: T.text, fontWeight: 500, whiteSpace: 'normal', textAlign: 'left',
        }}>{text}</div>
      )}
    </span>
  );
};
const Tabs = ({ tabs, value, onChange, accent, right, size = 'md', style }) => {
  const acc = accent || T.primary;
  const pad = size === 'sm' ? '8px 12px' : '10px 14px';
  const fs = size === 'sm' ? 12.5 : 13;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${T.border}`, marginBottom: 16, ...style }}>
      <div className="tab-scroll" style={{ display: 'flex', gap: 2, overflowX: 'auto', flex: 1, minWidth: 0 }}>
        {tabs.map(t => {
          const active = value === t.id;
          // The wrapper carries the active underline so it still spans the label AND
          // the ⓘ, exactly as it did when the glyph lived inside the button.
          return (
            <span key={t.id} style={{
              display: 'inline-flex', alignItems: 'center', flexShrink: 0, marginBottom: -1,
              borderBottom: `2px solid ${active ? acc : 'transparent'}`,
              paddingRight: t.tooltip ? (size === 'sm' ? 10 : 12) : 0,
              opacity: t.disabled ? 0.5 : 1, transition: 'border-color .12s ease',
            }}>
              <button data-tab data-active={active ? 'true' : 'false'} disabled={t.disabled}
                onClick={() => !t.disabled && onChange(t.id)}
                style={{
                  border: 'none', background: 'transparent', padding: pad,
                  paddingRight: t.tooltip ? 4 : undefined,
                  color: active ? T.text : T.muted, fontWeight: active ? 700 : 500, fontSize: fs,
                  cursor: t.disabled ? 'not-allowed' : 'pointer', whiteSpace: 'nowrap',
                  display: 'inline-flex', alignItems: 'center', gap: 7,
                  transition: 'color .12s ease',
                }}>
                {t.icon && <Icon name={t.icon} size={size === 'sm' ? 14 : 15} color={active ? acc : T.mutedSoft} />}
                {t.label}
                {t.count != null && <TabBadge count={t.count} tone={t.badgeTone} active={active} accent={acc} />}
              </button>
              {t.tooltip && <TabInfo text={t.tooltip} color={active ? acc : T.mutedSoft} size={size === 'sm' ? 12 : 13} />}
            </span>
          );
        })}
      </div>
      {right && <div style={{ flexShrink: 0 }}>{right}</div>}
    </div>
  );
};

// Star rating — read-only display by default (no `onChange`); pass `onChange`
// for an interactive 1–max picker (the client feedback flow uses this). Filled
// stars use T.amber; empty stars are a T.borderStrong outline. No half-stars.
// Renders its own <svg> (not <Icon>) so it can toggle `fill` per star — the
// shared Icon atom hardcodes fill="none".
const StarRating = ({ value = 0, max = 5, size = 16, onChange, onHoverChange, gap = 2 }) => {
  const [hover, setHover] = useState(0);
  const interactive = !!onChange;
  const setH = (n) => { setHover(n); if (onHoverChange) onHoverChange(n); };
  const shown = interactive && hover ? hover : value;
  const pts = '12 2 15 8.6 22 9.3 17 14.1 18.2 21 12 17.5 5.8 21 7 14.1 2 9.3 9 8.6 12 2';
  const starSvg = (filled) => (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? T.amber : 'none'} stroke={filled ? T.amber : T.borderStrong}
      strokeWidth={1.4} strokeLinejoin="round">
      <polygon points={pts} />
    </svg>
  );
  return (
    <span style={{ display: 'inline-flex', gap, alignItems: 'center' }} role={interactive ? 'radiogroup' : 'img'}
      aria-label={interactive ? 'Rate your experience' : `${value} out of ${max} stars`}>
      {Array.from({ length: max }, (_, i) => {
        const n = i + 1;
        const filled = n <= shown;
        if (!interactive) return <span key={n} style={{ display: 'inline-flex' }}>{starSvg(filled)}</span>;
        return (
          <button key={n} type="button" onClick={() => onChange(n)}
            onMouseEnter={() => setH(n)} onMouseLeave={() => setH(0)}
            aria-label={`${n} star${n > 1 ? 's' : ''}`}
            style={{ border: 'none', background: 'transparent', padding: 0, cursor: 'pointer', display: 'inline-flex', lineHeight: 0 }}>
            {starSvg(filled)}
          </button>
        );
      })}
    </span>
  );
};

// Click-to-edit text used by the live preview for inline-editable page
// headings + subtitles. Renders plain text in its caller's typography by
// default; clicking switches to contentEditable for direct manipulation. On
// blur (or Enter for single-line) the new value is committed via onChange.
// Esc cancels. The wrapper handles its own DOM content during editing to
// avoid React contentEditable warnings — re-renders triggered from above
// while editing are intentionally swallowed so the cursor stays put.
const EditableText = ({
  value,
  onChange,
  placeholder = '',
  multiline = false,
  style = {},
  className = '',
  asTag = 'span',
  ariaLabel = 'Edit',
}) => {
  const [editing, setEditing] = useState(false);
  const ref = useRef(null);
  const initial = useRef('');
  useEffect(() => {
    if (editing && ref.current) {
      ref.current.innerText = value || '';
      initial.current = value || '';
      ref.current.focus();
      const range = document.createRange();
      range.selectNodeContents(ref.current);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, [editing]);
  const Tag = asTag;
  if (!onChange) {
    return (
      <Tag className={className} style={style}>
        {(value !== undefined && value !== null && value !== '') ? value : (placeholder || '')}
      </Tag>
    );
  }
  const commit = () => {
    const next = (ref.current?.innerText || '').replace(/\s+$/g, '');
    setEditing(false);
    if (next !== initial.current) onChange(next);
  };
  const cancel = () => {
    if (ref.current) ref.current.innerText = initial.current;
    setEditing(false);
  };
  return (
    <Tag
      ref={ref}
      contentEditable={editing}
      suppressContentEditableWarning
      role="textbox"
      tabIndex={0}
      aria-label={ariaLabel}
      title={editing ? undefined : 'Click or press Enter to edit'}
      onClick={(e) => {
        if (editing) return;
        e.stopPropagation();
        setEditing(true);
      }}
      onFocus={(e) => {
        // Keyboard activation: Enter/Space in role=textbox should enter
        // edit mode. We can't tell here whether focus came from click or
        // tab — that's handled in onKeyDown below.
      }}
      onBlur={editing ? commit : undefined}
      onKeyDown={(e) => {
        if (!editing) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setEditing(true);
          }
          return;
        }
        if (!multiline && e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      }}
      className={className}
      data-editable
      data-editing={editing ? 'true' : 'false'}
      data-empty={!value && !editing ? 'true' : 'false'}
      style={{
        ...style,
        cursor: editing ? 'text' : 'pointer',
        outline: 'none',
        borderRadius: 4,
        transition: 'box-shadow 120ms ease, background 120ms ease',
        ...(editing ? {
          padding: '2px 6px',
          margin: '-2px -6px',
          boxShadow: `0 0 0 1px ${withAlpha(T.primary, 0.5)}, 0 0 0 4px ${withAlpha(T.primary, 0.12)}`,
          background: T.card,
        } : {}),
      }}
    >
      {editing ? null : ((value !== undefined && value !== null && value !== '') ? value : (placeholder || ' '))}
    </Tag>
  );
};

const Modal = ({ open, onClose, title, subtitle, children, width = 620, padded = true }) => {
  useEffect(() => {
    if (!open) return;
    const onKey = e => { if (e.key === 'Escape') onClose(); };

    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'rgba(15, 17, 23, 0.42)', zIndex: 200,
      display: 'flex', alignItems: 'flex-start', justifyContent: 'center',

// --- error boundary so crashes are visible instead of blank ---
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Render crash:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{
          padding: 24, margin: 24, border: `1px solid ${T.red}`, borderRadius: 12,
          background: T.redSoft, color: T.red, fontFamily: 'monospace', fontSize: 12
        }}>
          <div style={{ fontWeight: 700, marginBottom: 8 }}>⚠ Render crashed</div>
          <div>{String(this.state.error?.message || this.state.error)}</div>
          <pre style={{ marginTop: 10, fontSize: 11, whiteSpace: 'pre-wrap' }}>{this.state.error?.stack}</pre>
          <button onClick={() => this.setState({ error: null })} style={{
            marginTop: 12, padding: '6px 12px', border: 'none',
            background: T.red, color: '#fff', borderRadius: 6, cursor: 'pointer'
          }}>Reset</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// --- toast ---

const Toast = ({ toast, onClose }) => {
  if (!toast) return null;

  const tone = t.tone || (t.action ? 'undo' : 'success');
  const palette = tone === 'undo'
    ? { bg: '#FFFBEB', bd: '#FCD34D', fg: '#92400E', icon: 'info' }
    : { bg: T.greenSoft, bd: '#A7F3D0', fg: T.greenDark, icon: 'check' };
  return (
    <div style={{
      position: 'fixed', top: 16, right: 16, zIndex: 300,
      background: palette.bg, border: `1px solid ${palette.bd}`, color: palette.fg,
      padding: '8px 10px 8px 14px', borderRadius: 10,
      display: 'flex', alignItems: 'center', gap: 10,
      boxShadow: '0 4px 12px rgba(15, 17, 23, 0.10)', fontSize: 13, fontWeight: 500,
      animation: 'slidein 0.2s ease'
    }}>
      <Icon name={palette.icon} size={14} color={palette.fg} strokeWidth={2.5} />
      <span>{t.message}</span>
      {t.action && (
        <button onClick={() => { t.action.onClick(); onClose(); }} style={{
          background: 'transparent', border: `1px solid ${palette.bd}`, color: palette.fg,
          padding: '3px 10px', borderRadius: 6, cursor: 'pointer',
          fontWeight: 700, fontSize: 12, marginLeft: 2
        }}>
          {t.action.label}
        </button>
      )}

        background: 'transparent', border: 'none', color: palette.fg,
        padding: 4, opacity: 0.7, cursor: 'pointer', display: 'inline-flex'

        <Icon name="close" size={14} />
      </button>
    </div>
  );
};
