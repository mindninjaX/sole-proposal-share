// --- Sole Academy / Training (Module 15) ---
// In-app, video-first learning centre for people new to Sole Practice Manager.
// Mirrors the AI Prompt Library (Module 14) build pattern: seed data + a
// versioned localStorage store + components + routed pages, all self-contained
// here and wired into PracticeApp via switch cases + one top-level sidebar item
// + a sidebarActive branch.
//   NOTE — "onboarding" here means NEW-USER onboarding (learning the tool),
//   which is distinct from the client KYC "Onboarding" template builder.
//   VideoStage supports both a real <video> file (videoUrl) and a YouTube/Vimeo
//   iframe (embedUrl). Two hero lessons carry a placeholder sample MP4 so the
//   player actually plays; swap videoUrl/embedUrl for real Sole clips when they
//   exist (see docs/BACKLOG.md). Every other lesson shows the branded poster.
const ACADEMY_LEARNER = 'Sarah Mitchell'; // demo signed-in staff member (matches owners used across the app)
// Placeholder clips (Google public sample bucket) — stand-ins until real videos exist.

// Tracks group the modules for browsing. They are deliberately coarse (5) —
// after the Aug-4 meeting the *module* is the unit that mirrors the app's menu,
// so a fine-grained category filter on top of that would just be noise. Each
// module carries its OWN sidebar icon (see ACADEMY_MODULES) and borrows its
// track's hue, so a course card is recognisable against the real sidebar item
// it teaches.
const trackById = (id) => ACADEMY_TRACKS.find(t => t.id === id) || { id, label: id, color: T.primary, blurb: '' };
// One lookup for everything a card/thumbnail needs to render a module's identity:
// the module's own icon + its track's label and hue.
const moduleFace = (course) => {
  const t = trackById(course && course.track);
  return { trackId: t.id, trackLabel: t.label, blurb: t.blurb, color: t.color, icon: (course && course.icon) || 'bookOpen' };
};

// --- Modules → chapters ---
// STRUCTURE DECIDED IN THE AUG-4 MEETING (Rishav Kumar / Johann Oberholzer):
// every module is named after a group in the app's left-hand menu, and the
// chapters inside it are that group's sub-pages, in menu order. Two modules
// sit outside the menu by design: "Getting started with SPM" (the orientation
// course) and "Set up your practice" (JO: "that'll work for 90% of it, there'll
// be a few settings it won't" — permissions, team, year-end, templates,
// newsletters, company setup).
//   Source for the group/sub-page names and every chapter description:
//   docs/spm-knowledge-base/SPM-KNOWLEDGE-BASE.md → PART E (the LIVE app,
//   screenshot-confirmed), NOT this prototype's sidebar. The videos are recorded
//   against production, so the Academy must use production's words. Three
//   modules therefore cover surfaces this prototype doesn't render (Scheduling,
//   Communications, Finance & invoicing) — that's intentional.
//
// `status` per chapter is the production state of the *video*:
//   'published' → a real clip exists and can be watched + completed
//   'recording' → being filmed now (Juhi); shows the in-production state
//   'planned'   → scripted, not yet filmed
// Juhi finished the deal-management handover first, so Deals is the published
// module. Swap a chapter to 'published' + add videoUrl/embedUrl as clips land.
// `appRoute` deep-links a chapter to the real surface in this build so a learner
// can go and poke at it; omitted where the prototype has no built page.

// Role paths. JO asked that these "establish what it would be for the staff",
// so each one is a real job in an accounting practice, not a topic bundle.

// Persistence — completed chapters + resume points survive reload. Same shape and
// robustness as PROMPT_STORE_KEY (swallow quota / private-mode errors).
//   v2 (Aug-5): the Aug-4 restructure renamed every module and chapter id, so v1
//   completions would show as phantom progress against chapters that no longer
//   exist. Bumping the key retires them cleanly.
//   NOTE for the content-management portal: keep authored content in its OWN key
//   (sole.academy.content.v1) — this one is learner progress only.
const ACADEMY_STORE_KEY = 'sole.academy.v2';
const loadAcademy = () => { try { return JSON.parse(localStorage.getItem(ACADEMY_STORE_KEY) || '{}'); } catch (_) { return {}; } };
const saveAcademy = (patch) => { try { localStorage.setItem(ACADEMY_STORE_KEY, JSON.stringify({ ...loadAcademy(), ...patch })); } catch (_) {} };
const academyCompleted = () => loadAcademy().completed || {};
const isLessonComplete = (lessonId) => !!academyCompleted()[lessonId];
const setLessonComplete = (lessonId, done) => { const c = { ...academyCompleted() }; if (done) c[lessonId] = Date.now(); else delete c[lessonId]; saveAcademy({ completed: c }); };
const markLessonComplete = (lessonId) => setLessonComplete(lessonId, true);
const academyLastLesson = () => loadAcademy().lastLesson || {};
const setLastLesson = (courseId, lessonId) => saveAcademy({ lastLesson: { ...academyLastLesson(), [courseId]: lessonId }, lastCourse: courseId });
const courseById = (id) => ACADEMY_COURSES.find(c => c.id === id) || null;
const catColor = (course) => moduleFace(course).color;
const courseMins = (course) => (course ? course.lessons : []).reduce((s, l) => s + (l.mins || 0), 0);

// --- production state ---
// A chapter is only watchable once its video is published, so every surface has
// to be honest about what exists today. Nothing else in the module is allowed to
// promise a video that hasn't been recorded.
const ACADEMY_STATUS = {
  published: { label: 'Available',  pill: 'green',   short: 'available' },
  recording: { label: 'Recording',  pill: 'amber',   short: 'recording' },
  planned:   { label: 'Coming soon', pill: 'neutral', short: 'planned'  },
};
// A chapter counts as published only if there is actually something to watch.
// `status` is authored by hand in Academy Studio, so trusting it alone put a
// play button on chapters with no video at all (7 of them in the seed, found
// 26 Aug 2026). Every honesty rule downstream keys off this one function, so
// checking reality here fixes the play button, mark-complete and certificates
// in one place.
const chapterHasVideo = (lesson) => !!(lesson && (lesson.videoUrl || lesson.embedUrl));
const chapterStatus = (lesson) => {
  const raw = (lesson && ACADEMY_STATUS[lesson.status]) ? lesson.status : 'planned';
  return (raw === 'published' && !chapterHasVideo(lesson)) ? 'recording' : raw;
};
const isPublished = (lesson) => chapterStatus(lesson) === 'published';
const publishedLessons = (course) => (course ? course.lessons : []).filter(isPublished);
const isModuleFullyPublished = (course) => !!course && course.lessons.length > 0 && course.lessons.every(isPublished);
// A lesson's real poster image: an explicit thumbUrl, or one derived from a
// YouTube embed. Used instead of the branded gradient wherever a real video
// exists, so a learner can tell real footage from a placeholder at a glance.
const YOUTUBE_ID_RE = /(?:youtube(?:-nocookie)?\.com\/embed\/|youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{6,})/;
const youtubeThumbFromEmbed = (embedUrl) => {
  const m = embedUrl && embedUrl.match(YOUTUBE_ID_RE);
  return m ? `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg` : null;
};
const lessonThumb = (lesson) => (lesson && (lesson.thumbUrl || youtubeThumbFromEmbed(lesson.embedUrl))) || null;
// Only modules with a real, watchable chapter are shown to learners: a module
// that is 100% planned or recording has nothing to click on yet, so it does
// not belong in any browsing surface (Home, Modules, search). It still exists
// in the data the moment Academy Studio publishes its first chapter for it.
const visibleCourses = () => ACADEMY_COURSES.filter(c => publishedLessons(c).length > 0);
// The module's own state: published if anything can be watched, else recording
// if anything is in production, else planned.
const moduleStatus = (course) => publishedLessons(course).length ? 'published'
  : (course ? course.lessons : []).some(l => chapterStatus(l) === 'recording') ? 'recording' : 'planned';
const recordingCount = (course) => (course ? course.lessons : []).filter(l => chapterStatus(l) !== 'published').length;
// Seam for the written-guide surface: a chapter gains
// guide: { shot, alt, pins:[{ n, x, y, title, body }] }. Everything here reads it
// defensively so it lights up the moment the data lands.
const hasGuide = (lesson) => !!(lesson && lesson.guide && (lesson.guide.pins || []).length);
// Screen Tour (pages/screen-tour.html) is the OTHER written explanation: an
// annotated screenshot of a real dashboard with a pin per metric. A chapter that
// names a `tour` gets a link straight at that walkthrough — which is the meeting's
// "I want the concept, not the whole video" case, answered with assets that exist
// today rather than waiting on filming. Sibling path because the deploy workflow
// flattens pages/ to the hosting root alongside index.html.
const hasTour = (lesson) => !!(lesson && lesson.tour);
const tourHref = (lesson) => `screen-tour.html#${lesson.tour}`;

// Progress is measured over EVERY chapter (not just published ones) so the bar
// never reads 100% on a module that's still half-recorded. Completion — and
// therefore the certificate — additionally requires the whole module to be
// published, so no one is certified on a course that doesn't exist yet.
const courseDoneCount = (course) => (course ? course.lessons : []).filter(l => isLessonComplete(l.id)).length;
const courseProgressPct = (course) => { const n = course ? course.lessons.length : 0; return n ? Math.round((courseDoneCount(course) / n) * 100) : 0; };
const isCourseComplete = (course) => !!course && isModuleFullyPublished(course) && courseDoneCount(course) === course.lessons.length;
// Resume never lands you on an unrecorded chapter.
const resumeLesson = (course) => {
  const ls = course ? course.lessons : []; if (!ls.length) return null;
  const last = academyLastLesson()[course.id];
  if (last && ls.some(l => l.id === last)) return last;
  const pub = publishedLessons(course);
  return (pub.find(l => !isLessonComplete(l.id)) || pub[0] || ls[0]).id;
};
const nextUpCourse = () => {
  // No fallback to the full, mostly-unpublished catalogue: with nothing real
  // to watch, the Home hero should show nothing rather than promote a
  // placeholder module.
  const watchable = visibleCourses();
  if (!watchable.length) return null;
  const lc = loadAcademy().lastCourse;
  if (lc && watchable.some(c => c.id === lc) && !isCourseComplete(courseById(lc))) return courseById(lc);
  return watchable.find(c => courseDoneCount(c) > 0 && !isCourseComplete(c))
      || watchable.find(c => courseDoneCount(c) === 0)
      || watchable[0];
};
const certifiedCourses = () => ACADEMY_COURSES.filter(isCourseComplete);
const academyStats = () => {
  const all = ACADEMY_COURSES.flatMap(c => c.lessons);
  const available = all.filter(isPublished);
  const done = all.filter(l => isLessonComplete(l.id));
  return {
    coursesDone: certifiedCourses().length,
    // Denominators are what actually exists today, so the tiles don't read as a
    // 3/67 failure while the videos are still being filmed.
    coursesAvailable: ACADEMY_COURSES.filter(isModuleFullyPublished).length,
    lessonsDone: done.length,
    totalLessons: available.length,
    inProduction: all.length - available.length,
    modules: ACADEMY_COURSES.length,
    minutes: done.reduce((s, l) => s + (l.mins || 0), 0),
    certificates: certifiedCourses().length,
  };
};

// The 16:9 video-first surface. Plays a real <video> file or a YouTube/Vimeo
// iframe when available; otherwise a branded gradient poster + play chrome.
//   The clips are hosted off-domain, so a blocked network or a moved file would
//   otherwise leave a black rectangle with no explanation. `failed` catches the
//   <video> error event and falls back to the branded poster with a retry, so the
//   surface degrades to "couldn't load" rather than "appears broken".
const VideoStage = ({ lesson, color = T.primary, catIcon = 'video', playing, onPlay }) => {
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [lesson.id, playing]);
  const hasFile = !!lesson.videoUrl;
  const hasEmbed = !!lesson.embedUrl;
  const stage = { position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radiusLg, overflow: 'hidden' };
  if (playing && hasFile && !failed) {
    return (
      <div style={{ ...stage, background: '#000' }}>
        <video src={lesson.videoUrl} controls autoPlay preload="metadata" onError={() => setFailed(true)}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
      </div>
    );
  }
  if (failed) {
    return (
      <div style={{ ...stage, background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.46)} 100%)`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ position: 'absolute', right: -26, bottom: -32, opacity: 0.13, pointerEvents: 'none', transform: 'rotate(-8deg)' }}>
          <Icon name={catIcon} size={210} color="#fff" strokeWidth={1.2} />
        </div>
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <Icon name="alertTriangle" size={26} color="#fff" />
          <div style={{ fontSize: 14.5, fontWeight: 700, marginTop: 8 }}>This clip couldn’t load</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 400, lineHeight: 1.5 }}>Check your connection and try again — the notes, transcript and resources below are all still here.</div>
          <div style={{ marginTop: 13 }}><Btn variant="soft" size="sm" icon="refresh" onClick={() => setFailed(false)}>Try again</Btn></div>
        </div>
      </div>
    );
  }
  if (playing && hasEmbed) {
    const src = lesson.embedUrl + (lesson.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
    return (
      <div style={{ ...stage, background: '#000' }}>
        <iframe src={src} title={lesson.title} frameBorder="0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />
      </div>
    );
  }
  // An unrecorded chapter shows its production state on the poster instead of a
  // play button, so nobody clicks play and gets nothing. A recorded chapter
  // shows its real video thumbnail instead of the branded gradient, so a
  // learner can tell real footage from a placeholder at a glance.
  const state = chapterStatus(lesson);
  const pending = state !== 'published';
  const thumb = !pending && lessonThumb(lesson);
  return (
    <div style={{ ...stage, display: 'flex', alignItems: 'center', justifyContent: 'center',
      ...(thumb
        ? { backgroundImage: `linear-gradient(180deg, rgba(15,17,23,0.10) 0%, rgba(15,17,23,0.58) 100%), url(${thumb})`, backgroundSize: 'cover', backgroundPosition: 'center' }
        : { background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.46)} 100%)` }) }}>
      {!thumb && <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', background: `radial-gradient(110% 80% at 14% -6%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 50%)` }} />}
      {!thumb && (
        <div style={{ position: 'absolute', right: -26, bottom: -32, opacity: 0.13, color: '#fff', transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
          <Icon name={catIcon} size={210} color="#fff" strokeWidth={1.2} />
        </div>
      )}
      <div style={{ position: 'absolute', top: 16, left: 18, zIndex: 2, maxWidth: '70%' }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 1.4, textTransform: 'uppercase', color: 'rgba(255,255,255,0.82)' }}>{pending ? (state === 'recording' ? 'In production' : 'Scripted') : 'Video chapter'}</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginTop: 3, color: '#fff', letterSpacing: -0.2 }}>{lesson.title}</div>
      </div>
      <div style={{ position: 'absolute', top: 16, right: 18, zIndex: 2, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '4px 9px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={12} color="#fff" />{lesson.mins} min
      </div>
      {pending ? (
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <Icon name={state === 'recording' ? 'video' : 'clock'} size={30} color="#fff" />
          <div style={{ fontSize: 14.5, fontWeight: 700, marginTop: 8 }}>{state === 'recording' ? 'Being recorded now' : 'Coming soon'}</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 400, lineHeight: 1.5 }}>
            {state === 'recording'
              ? 'The video lands shortly. What it covers is written up below.'
              : 'This chapter is scripted and queued for filming. What it covers is written up below.'}
          </div>
        </div>
      ) : (
        <button onClick={onPlay} aria-label="Play chapter" style={{
          position: 'relative', zIndex: 2, width: 82, height: 82, borderRadius: '50%', border: 'none', cursor: 'pointer',
          background: withAlpha('#FFFFFF', 0.97), color, display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 16px 40px rgba(0,0,0,0.30), 0 4px 12px rgba(0,0,0,0.12)', transition: 'transform .14s' }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.07)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 4 }}><polygon points="6,4 20,12 6,20" /></svg>
        </button>
      )}
      {!pending && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 2, display: 'flex', alignItems: 'center', gap: 11, padding: '11px 15px', background: 'linear-gradient(180deg, transparent, rgba(0,0,0,0.38))' }}>
          <Icon name="play" size={15} color="#fff" />
          <div style={{ flex: 1, height: 4, borderRadius: 999, background: 'rgba(255,255,255,0.3)', overflow: 'hidden' }}>
            <div style={{ width: '0%', height: '100%', background: '#fff' }} />
          </div>
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.9)', fontVariantNumeric: 'tabular-nums' }}>0:00 / {lesson.mins}:00</span>
          <Icon name="video" size={15} color="rgba(255,255,255,0.9)" />
        </div>
      )}
    </div>
  );
};

// Shared module thumbnail — the module's signature motif. A track-hued gradient
// carries an oversized, cropped watermark of the module's OWN sidebar icon, so a
// card is recognisable as "the thing that lives at <menu item>" rather than just
// another play tile. Plus a frosted duration chip, a completed badge, a centred
// play button (grows on card hover via .academy-play), and a YouTube-style
// progress bar welded to the bottom edge. Reused by CourseCard + the Home hero.
//   When nothing in the module is published yet, the play button is replaced by a
//   "Recording" / "Coming soon" chip — the tile must never promise a video that
//   hasn't been filmed.
const AcademyThumb = ({ course, height, radius = T.radiusLg, playSize = 54, watermark = 132 }) => {
  const face = moduleFace(course);
  const color = face.color;
  const pct = courseProgressPct(course);
  const done = isCourseComplete(course);
  const started = courseDoneCount(course) > 0;
  const mStatus = moduleStatus(course);
  const watchable = mStatus === 'published';
  // A real chapter's thumbnail stands in for the branded gradient the moment
  // one exists: the module cover should look like the thing it teaches, not
  // a coloured placeholder, as soon as there is real footage to show.
  const thumb = watchable && lessonThumb(publishedLessons(course)[0]);
  return (
    <div style={{ position: 'relative', width: '100%', ...(height ? { height } : { aspectRatio: '16 / 9' }), borderRadius: radius, overflow: 'hidden',
      ...(thumb
        ? { backgroundImage: `linear-gradient(180deg, rgba(15,17,23,0.10) 0%, rgba(15,17,23,0.50) 100%), url(${thumb})`, backgroundSize: 'cover', backgroundPosition: 'center' }
        : { background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.44)} 100%)` }) }}>
      {!thumb && <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(120% 84% at 12% -8%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 52%)` }} />}
      {!thumb && (
        <div style={{ position: 'absolute', right: -20, bottom: -26, opacity: 0.15, color: '#fff', transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
          <Icon name={face.icon} size={watermark} color="#fff" strokeWidth={1.3} />
        </div>
      )}
      <div style={{ position: 'absolute', top: 12, right: 12, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={11} color="#fff" />{courseMins(course)} min
      </div>
      {done && <div style={{ position: 'absolute', top: 12, left: 12, display: 'inline-flex', alignItems: 'center', gap: 4, background: T.green, color: '#fff', fontSize: 10.5, fontWeight: 700, padding: '3px 8px', borderRadius: 999, boxShadow: '0 2px 8px rgba(5,150,105,0.4)' }}><Icon name="check" size={11} color="#fff" />Done</div>}
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {watchable ? (
          <div className="academy-play" style={{ width: playSize, height: playSize, borderRadius: '50%', background: withAlpha('#FFFFFF', 0.97), color, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 28px rgba(0,0,0,0.30)' }}>
            <svg width={Math.round(playSize * 0.33)} height={Math.round(playSize * 0.33)} viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 2 }}><polygon points="6,4 20,12 6,20" /></svg>
          </div>
        ) : (
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: withAlpha('#0F1117', 0.42), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '6px 12px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
            <Icon name={mStatus === 'recording' ? 'video' : 'clock'} size={13} color="#fff" />
            {mStatus === 'recording' ? 'Being recorded' : 'Coming soon'}
          </div>
        )}
      </div>
      {started && !done && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 4, background: withAlpha('#0F1117', 0.28) }}>
          <div style={{ width: `${pct}%`, height: '100%', background: '#fff' }} />
        </div>
      )}
    </div>
  );
};

// Catalog grid card — thumbnail + a quiet, scannable body. The meta line names
// the menu group this module teaches (the whole point of the Aug-4 restructure),
// then the track and level. The status line flips between real progress, the
// production state, and "N chapters".
const CourseCard = ({ course, onOpen }) => {
  const face = moduleFace(course);
  const pct = courseProgressPct(course);
  const done = isCourseComplete(course);
  const started = courseDoneCount(course) > 0;
  const color = face.color;
  const avail = publishedLessons(course).length;
  const pending = recordingCount(course);
  const mStatus = moduleStatus(course);
  return (
    <div onClick={onOpen} role="button" tabIndex={0} data-academy-card
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onOpen(); } }}
      style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, overflow: 'hidden', cursor: 'pointer', display: 'flex', flexDirection: 'column', boxShadow: T.shadowSm, transition: 'border-color .14s, box-shadow .14s, transform .14s' }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = T.borderStrong; e.currentTarget.style.boxShadow = '0 10px 26px rgba(15,17,23,0.10)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.boxShadow = T.shadowSm; e.currentTarget.style.transform = 'none'; }}>
      <AcademyThumb course={course} radius={0} />
      <div style={{ padding: 15, display: 'flex', flexDirection: 'column', gap: 9, flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 10.5, fontWeight: 600, color: color }}><Icon name={face.icon} size={12} color={color} />{course.menuGroup}</span>
          <span style={{ width: 3, height: 3, borderRadius: 999, background: T.mutedSoft }} />
          <span style={{ fontSize: 10.5, color: T.muted }}>{course.level}</span>
        </div>
        <div style={{ fontSize: 14.5, fontWeight: 700, color: T.text, lineHeight: 1.3, letterSpacing: -0.2 }}>{course.title}</div>
        <Helper style={{ fontSize: 11.5, lineHeight: 1.5, flex: 1 }}>{course.summary}</Helper>
        {started ? (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, fontWeight: 500, color: done ? T.greenDark : T.muted, marginBottom: 5 }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>{done ? <Icon name="checkCircle" size={12} color={T.greenDark} /> : <Icon name="play" size={11} color={T.muted} />}{done ? 'Completed' : `${courseDoneCount(course)} of ${course.lessons.length} chapters`}</span><span>{pct}%</span>
            </div>
            <ProgressBar pct={pct} color={done ? T.green : color} height={5} />
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, fontSize: 11, color: T.muted }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{course.lessons.length} chapters</span>
            {mStatus === 'published'
              ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontWeight: 600, color }}>{pending ? `${avail} ready` : 'Start'}<Icon name="arrow" size={12} color={color} /></span>
              : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, color: mStatus === 'recording' ? T.amber : T.mutedSoft, fontWeight: 600 }}>
                  <Icon name={mStatus === 'recording' ? 'video' : 'clock'} size={12} color={mStatus === 'recording' ? T.amber : T.mutedSoft} />
                  {mStatus === 'recording' ? 'Recording' : 'Coming soon'}
                </span>}
          </div>
        )}
      </div>
    </div>
  );
};

// Which paths contain a given course (used by the player's "Part of" card).
const pathsForCourse = (courseId) => LEARNING_PATHS.filter(p => p.courseIds.includes(courseId));

// A path can hold any number of courses, so the card must NOT render the full
// list (it wouldn't scale and rows would be uneven). Instead: a fixed-height
// summary — a segmented tracker (one segment per course, so it scales to any
// count) + a single "up next / start with" course callout + counts. The full
// ordered sequence lives in the player ("Part of these paths") / on open.
const LearningPathCard = ({ path, onOpen }) => {
  const courses = path.courseIds.map(courseById).filter(Boolean);
  const allLessons = courses.flatMap(c => c.lessons);
  const doneN = allLessons.filter(l => isLessonComplete(l.id)).length;
  const pct = allLessons.length ? Math.round((doneN / allLessons.length) * 100) : 0;
  const doneCourses = courses.filter(isCourseComplete).length;
  const started = doneN > 0;
  const complete = pct === 100;
  const totalMins = courses.reduce((s, c) => s + courseMins(c), 0);
  const currentIdx = courses.findIndex(c => !isCourseComplete(c)); // first unfinished; -1 if all done
  const nextCourse = currentIdx >= 0 ? courses[currentIdx] : null;
  // What follows the up-next module — the part that differentiates one path from
  // another (all five open with "Getting started with SPM").
  const rest = nextCourse ? courses.slice(currentIdx + 1) : [];
  return (
    <div data-academy-card onClick={onOpen} role="button" tabIndex={0}
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onOpen(); } }}
      style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, overflow: 'hidden', cursor: 'pointer', boxShadow: T.shadowSm, display: 'flex', flexDirection: 'column', transition: 'border-color .14s, box-shadow .14s, transform .14s' }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = T.borderStrong; e.currentTarget.style.boxShadow = '0 10px 26px rgba(15,17,23,0.10)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.boxShadow = T.shadowSm; e.currentTarget.style.transform = 'none'; }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '15px 18px', borderBottom: `1px solid ${T.borderSoft}`, background: T.primarySofter }}>
        <IconChip icon="graduation" tone="accent" size={40} gradient />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: T.text, letterSpacing: -0.2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{path.title}</div>
          <div style={{ fontSize: 11.5, color: T.muted, marginTop: 2, display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="users" size={12} color={T.mutedSoft} />{path.forRole}</div>
        </div>
        {complete ? <Pill color="green" style={{ fontSize: 9.5 }}>Complete</Pill> : started ? <Pill color="accent" style={{ fontSize: 9.5 }}>{pct}%</Pill> : null}
      </div>
      <div style={{ padding: '14px 18px', display: 'flex', flexDirection: 'column', gap: 14, flex: 1 }}>
        {/* minHeight reserves both lines. WebkitLineClamp caps the text at 2 but
            doesn't reserve the space, so a 1-line blurb used to pull everything
            below it up and break alignment across the row. */}
        <Helper style={{ fontSize: 12, lineHeight: 1.5, minHeight: 36, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{path.blurb}</Helper>
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: T.textSoft }}>Module path</span>
            <span style={{ fontSize: 10.5, color: T.muted }}>{doneCourses} of {courses.length} done</span>
          </div>
          <div style={{ display: 'flex', gap: 4 }}>
            {courses.map((c, i) => { const cDone = isCourseComplete(c); const cCur = i === currentIdx; return (
              <div key={c.id} title={c.title} style={{ flex: 1, height: 6, borderRadius: 999, background: cDone ? T.green : cCur ? T.primary : T.border }} />
            ); })}
          </div>
        </div>
        {complete ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, fontWeight: 600, color: T.greenDark }}><Icon name="checkCircle" size={15} color={T.green} />All {courses.length} modules complete</div>
        ) : nextCourse ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 11px', borderRadius: 10, background: T.fieldBg, border: `1px solid ${T.borderSoft}` }}>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: T.card, border: `1px solid ${T.border}`, color: catColor(nextCourse), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name={moduleFace(nextCourse).icon} size={15} color={catColor(nextCourse)} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 9.5, color: T.muted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 }}>{started ? 'Up next' : 'Start with'}</div>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nextCourse.title}</div>
            </div>
            <span style={{ fontSize: 10.5, color: T.muted, flexShrink: 0 }}>{nextCourse.lessons.length} chapters</span>
          </div>
        ) : null}
        {/* Every path opens with the same orientation module, so the callout above
            is identical on all five cards. This line is what actually tells them
            apart — the modules that make this path *this* path. */}
        {rest.length > 0 && (
          <div style={{ fontSize: 11, color: T.muted, lineHeight: 1.5, display: 'flex', gap: 5 }}>
            <span style={{ fontWeight: 700, flexShrink: 0 }}>then</span>
            <span style={{ minWidth: 0 }}>{rest.map(c => c.title).join(' · ')}</span>
          </div>
        )}
      </div>
      <div style={{ padding: '13px 18px', borderTop: `1px solid ${T.borderSoft}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, background: T.surface }}>
        <Btn variant={complete ? 'soft' : 'primary'} size="sm" icon={complete ? 'checkCircle' : 'play'}>{complete ? 'Review path' : started ? 'Continue' : 'Start path'}</Btn>
        <span style={{ fontSize: 11, color: T.muted, display: 'inline-flex', alignItems: 'center', gap: 12 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{courses.length} modules</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="clock" size={12} color={T.mutedSoft} />{totalMins} min</span>
        </span>
      </div>
    </div>
  );
};

// One chapter in the player's playlist. Unpublished chapters read as muted with a
// production dot instead of a play glyph, so the playlist tells you at a glance
// what you can actually watch today.
const LessonRow = ({ lesson, index, active, complete, onClick }) => {
  const st = chapterStatus(lesson);
  const pub = st === 'published';
  return (
    <button onClick={onClick} data-hover="row" style={{
      width: '100%', display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', border: 'none', textAlign: 'left',
      borderRadius: 8, background: active ? T.primarySoft : 'transparent', cursor: 'pointer' }}>
      <span style={{ width: 22, height: 22, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        background: complete ? T.green : active ? T.primary : T.fieldBg, color: (complete || active) ? '#fff' : T.muted,
        border: (complete || active) ? 'none' : `1px solid ${T.border}`, fontSize: 11, fontWeight: 700 }}>
        {/* The play glyph is reserved for chapters you can actually play — an
            active-but-unrecorded chapter keeps its number so the marker doesn't
            imply a video is sitting there. */}
        {complete ? <Icon name="check" size={12} color="#fff" /> : (active && pub) ? <Icon name="play" size={11} color="#fff" /> : index + 1}
      </span>
      <span style={{ flex: 1, minWidth: 0, fontSize: 12.5, fontWeight: active ? 600 : 500, color: active ? T.primary : pub ? T.text : T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lesson.title}</span>
      {!pub && <span title={st === 'recording' ? 'Being recorded' : 'Coming soon'} style={{ flexShrink: 0, width: 6, height: 6, borderRadius: 999, background: st === 'recording' ? T.amber : T.borderStrong }} />}
      <span style={{ fontSize: 11, color: T.muted, flexShrink: 0 }}>{lesson.mins}m</span>
    </button>
  );
};

const CertificateModal = ({ course, open, onClose, fireToast }) => {
  if (!course) return null;
  const color = catColor(course);
  return (
    <Modal open={open} onClose={onClose} title="Module completed" subtitle="Nice work — you've finished every chapter." width={540}>
      <div style={{ border: `1px solid ${T.border}`, borderRadius: 14, overflow: 'hidden' }}>
        <div style={{ background: `linear-gradient(135deg, ${color} 0%, ${darkenHex(color, 0.34)} 100%)`, padding: '28px 24px', textAlign: 'center', color: '#fff', position: 'relative' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1px)', backgroundSize: '16px 16px' }} />
          <div style={{ position: 'relative' }}>
            <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'rgba(255,255,255,0.95)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 12 }}><Icon name="award" size={28} color={color} /></div>
            <div style={{ fontSize: 11, letterSpacing: 2, textTransform: 'uppercase', opacity: 0.85, fontWeight: 700 }}>Certificate of completion</div>
            <div style={{ fontSize: 20, fontWeight: 800, marginTop: 6, letterSpacing: -0.3 }}>{course.title}</div>
          </div>
        </div>
        <div style={{ padding: '20px 24px', textAlign: 'center' }}>
          <Helper style={{ fontSize: 12 }}>Awarded to</Helper>
          <div style={{ fontSize: 18, fontWeight: 700, color: T.text, marginTop: 2 }}>{ACADEMY_LEARNER}</div>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 22, marginTop: 14, fontSize: 11.5, color: T.muted }}>
            <div><div style={{ fontWeight: 700, color: T.text }}>{course.lessons.length}</div>chapters</div>
            <div><div style={{ fontWeight: 700, color: T.text }}>{courseMins(course)} min</div>watched</div>
            <div><div style={{ fontWeight: 700, color: T.text }}>{fmtDate(new Date())}</div>completed</div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginTop: 18, flexWrap: 'wrap' }}>
            <Btn variant="primary" icon="download" onClick={() => fireToast('Certificate downloaded (demo)')}>Download</Btn>
            <Btn variant="ghost" icon="share" onClick={() => fireToast('Share link copied (demo)')}>Share</Btn>
            <Btn variant="ghost" onClick={onClose}>Close</Btn>
          </div>
          <div style={{ marginTop: 16, fontSize: 11, color: T.mutedSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
            <span style={{ fontWeight: 700, color: T.text }}>S<span style={{ color: T.primary }}>•</span>le</span> Academy
          </div>
        </div>
      </div>
    </Modal>
  );
};

// --- Sole Academy catalog views ---
const AcademyHome = ({ openCourse, openPath, goView }) => {
  const { isTablet } = useViewport();
  const stats = academyStats();
  const resume = nextUpCourse();
  const resumePct = resume ? courseProgressPct(resume) : 0;
  const resumeStarted = resume ? courseDoneCount(resume) > 0 : false;
  const recommendedPath = LEARNING_PATHS[0];
  // A module only counts as "popular" once it actually has something to
  // watch: otherwise the home page would open with a promoted card that's
  // all "Coming soon", which is the exact confusion this pass is fixing.
  const popular = (() => {
    const real = ACADEMY_POPULAR.map(courseById).filter(c => c && publishedLessons(c).length > 0);
    return real.length ? real : visibleCourses().slice(0, 3);
  })();
  const color = resume ? catColor(resume) : T.primary;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      {resume && (
        <div style={{ display: 'grid', gridTemplateColumns: isTablet ? '1fr' : 'minmax(0,1.35fr) minmax(0,1fr)', border: `1px solid ${T.border}`, borderRadius: T.radiusLg, overflow: 'hidden', background: T.card, boxShadow: T.shadowSm }}>
          <div style={{ padding: isTablet ? '24px 24px 8px' : '28px 30px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 11 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase', color: T.primary }}>

// Full course view — video-first player + lesson playlist + progress + cert.
const CoursePlayerPage = ({ courseId, lessonId, fireToast }) => {
  const course = courseById(courseId);
  // Only chapters with a real video are ever shown here: a module page is
  // Module, then Video, and nothing else, so there is no row for a chapter
  // that doesn't exist yet.
  const lessons = course ? publishedLessons(course) : [];
  const { isTablet } = useViewport();
  const [, tick] = useState(0);
  const refresh = () => tick(t => t + 1);
  const [playing, setPlaying] = useState(false);
  const [tab, setTab] = useState('overview');
  const [certFor, setCertFor] = useState(null);
  // The ROUTE owns the active chapter (#/course/<module>/<chapter>), so
  // every chapter is deep-linkable, survives a reload, and can be handed to
  // someone in Slack. `lessonId` absent → fall back to the resume point.
  const routeLesson = lessonId && lessons.some(l => l.id === lessonId) ? lessonId : null;
  const activeId = routeLesson || (course ? resumeLesson(course) : null);
  const goLesson = (id) => { if (course) window.location.hash = `#/course/${course.id}/${id}`; };
  useEffect(() => { if (course && activeId) setLastLesson(course.id, activeId); setPlaying(false); setTab('overview'); }, [activeId]);
  if (!course || !lessons.length) {
    return (
      <main style={{ flex: 1, minWidth: 0, padding: '24px 28px 60px' }}>
        <Btn variant="ghost" size="sm" icon="chevronLeft" onClick={() => { window.location.hash = '#/modules'; }}>Back to modules</Btn>
        <Card style={{ marginTop: 16 }}><EmptyState icon="search" title={course ? 'Nothing to watch yet' : 'Module not found'} hint={course ? 'This module has no published chapters yet. Check back once Academy Studio publishes one.' : 'This training module may have moved.'} action={<Btn variant="primary" size="sm" icon="bookOpen" onClick={() => { window.location.hash = '#/modules'; }}>Browse modules</Btn>} /></Card>
      </main>
    );
  }
  const idx = Math.max(0, lessons.findIndex(l => l.id === activeId));
  const lesson = lessons[idx];
  const face = moduleFace(course);
  const color = face.color;
  // Progress here is measured against what's actually on this page (the
  // published chapters), not the full authored curriculum, matching the
  // list below it so the percentage and the row count never disagree.
  const done = lessons.filter(l => isLessonComplete(l.id)).length;
  const pct = lessons.length ? Math.round((done / lessons.length) * 100) : 0;
  const complete = isLessonComplete(lesson.id);
  const isLast = idx === lessons.length - 1;
  const lessonPub = isPublished(lesson);
  const lessonState = chapterStatus(lesson);

  const completeAndNext = () => {
    const wasComplete = isCourseComplete(course);
    markLessonComplete(lesson.id);
    if (!wasComplete && isCourseComplete(course)) { setCertFor(course); fireToast('🎓 Module complete — certificate earned!'); refresh(); }
    else { fireToast('Chapter marked complete'); if (!isLast) goLesson(lessons[idx + 1].id); else refresh(); }
  };
  const toggleComplete = () => { setLessonComplete(lesson.id, !complete); refresh(); };

  const nextLesson = !isLast ? lessons[idx + 1] : null;
  const prevLesson = idx > 0 ? lessons[idx - 1] : null;
  const inPaths = pathsForCourse(course.id);
  const aboutRows = [
    ['menu', 'Menu group', course.menuGroup],
    ['bookOpen', 'Chapters', `${lessons.length}`],
    ['clock', 'Duration', `${lessons.reduce((s, l) => s + (l.mins || 0), 0)} min`],
    ['gauge', 'Level', course.level],
  ];

  // ← / → move through chapters. Guarded so it never fires while someone is
  // typing in the header search or any other field.
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight' && nextLesson) { e.preventDefault(); goLesson(nextLesson.id); }
      if (e.key === 'ArrowLeft' && prevLesson) { e.preventDefault(); goLesson(prevLesson.id); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [activeId, course.id]);

  const playlist = (
    <Card padded={false} style={{ overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${T.borderSoft}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700 }}>Chapters</span>
          <span style={{ fontSize: 11, color: T.muted }}>{done}/{lessons.length} · {pct}%</span>
        </div>
        <ProgressBar pct={pct} color={pct === 100 ? T.green : color} height={6} />
      </div>
      <div style={{ padding: 6, maxHeight: isTablet ? 'none' : 520, overflowY: 'auto' }}>
        {lessons.map((l, i) => <LessonRow key={l.id} lesson={l} index={i} active={l.id === lesson.id} complete={isLessonComplete(l.id)} onClick={() => goLesson(l.id)} />)}
      </div>
    </Card>
  );

  const aboutCard = (
    <Card padded={false} style={{ overflow: 'hidden' }}>
      <div style={{ padding: '13px 16px', borderBottom: `1px solid ${T.borderSoft}`, fontSize: 13, fontWeight: 700 }}>About this module</div>
      <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 11 }}>
        {aboutRows.map(([ic, label, val], i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, color: T.muted }}><Icon name={ic} size={13} color={T.mutedSoft} />{label}</span>
            <span style={{ fontWeight: 600, color: T.text }}>{val}</span>
          </div>
        ))}
        {inPaths.length > 0 && (
          <div style={{ borderTop: `1px solid ${T.borderSoft}`, paddingTop: 11, marginTop: 1 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 7 }}>Part of these paths</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {inPaths.map(p => <button key={p.id} onClick={() => { window.location.hash = '#/paths'; }} style={{ border: `1px solid ${T.border}`, background: T.card, borderRadius: 999, padding: '4px 10px', fontSize: 10.5, fontWeight: 600, color: T.textSoft, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="graduation" size={11} color={T.primary} />{p.title}</button>)}
            </div>
          </div>
        )}
      </div>
    </Card>
  );

  return (
    <main style={{ flex: 1, minWidth: 0, padding: '24px 28px 60px', overflow: 'auto' }}>
      <Btn variant="ghost" size="sm" icon="chevronLeft" onClick={() => { window.location.hash = '#/modules'; }}>Back to modules</Btn>
      <div style={{ marginTop: 12, marginBottom: 16 }}>
        {/* Breadcrumb: Academy, Modules, the menu group this module teaches. */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', fontSize: 11, color: T.muted }}>
          <button onClick={() => { window.location.hash = '#/'; }} style={{ border: 'none', background: 'transparent', padding: 0, color: T.muted, fontSize: 11, fontWeight: 500, cursor: 'pointer' }}>Academy</button>
          <Icon name="chevronRight" size={11} color={T.mutedSoft} />
          <button onClick={() => { window.location.hash = '#/modules'; }} style={{ border: 'none', background: 'transparent', padding: 0, color: T.muted, fontSize: 11, fontWeight: 500, cursor: 'pointer' }}>Modules</button>
          <Icon name="chevronRight" size={11} color={T.mutedSoft} />
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontWeight: 600, color }}><Icon name={face.icon} size={12} color={color} />{course.menuGroup}</span>
          <span style={{ width: 3, height: 3, borderRadius: 999, background: T.mutedSoft }} />
          <span>{course.level}</span>
          {isCourseComplete(course) && <Pill color="green" style={{ fontSize: 9.5, marginLeft: 2 }}>Completed</Pill>}
        </div>
        <div style={{ fontSize: 23, fontWeight: 800, letterSpacing: -0.4, marginTop: 7 }}>{course.title}</div>
        <Helper style={{ marginTop: 3, fontSize: 13, maxWidth: 640 }}>{course.summary}</Helper>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: isTablet ? '1fr' : 'minmax(0,1fr) 340px', gap: 22, alignItems: 'start' }}>
        <div style={{ minWidth: 0 }}>
          <VideoStage lesson={lesson} color={color} catIcon={face.icon} playing={playing} onPlay={() => setPlaying(true)} />
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, marginTop: 16, flexWrap: 'wrap' }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 11, color: T.muted, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                <span>Chapter {idx + 1} of {lessons.length} · {lesson.mins} min</span>
                {!lessonPub && <Pill color={lessonState === 'recording' ? 'amber' : 'neutral'} style={{ fontSize: 9.5 }}>{ACADEMY_STATUS[lessonState].label}</Pill>}
              </div>
              <div style={{ fontSize: 18, fontWeight: 700, marginTop: 2, letterSpacing: -0.2 }}>{lesson.title}</div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {/* Distinct keys force a remount (not an in-place restyle) so the Btn
                  atom's base `border` shorthand and the primary variant's `borderColor`
                  never transition on the same node — avoids React's shorthand warning.
                  An unrecorded chapter offers no complete action at all — you can't
                  finish a video that doesn't exist yet. */}
              {!lessonPub ? null : complete
                ? <Btn key="lesson-done" variant="soft" size="sm" icon="check" onClick={toggleComplete}>Completed</Btn>
                : <Btn key="lesson-todo" variant="primary" size="sm" icon="check" iconRight={!isLast ? 'arrow' : undefined} onClick={completeAndNext}>{isLast ? 'Mark complete' : 'Complete & next'}</Btn>}
              {prevLesson && <Btn variant="ghost" size="sm" icon="chevronLeft" onClick={() => goLesson(prevLesson.id)}>Previous</Btn>}
              {nextLesson && <Btn variant="ghost" size="sm" iconRight="arrow" onClick={() => goLesson(nextLesson.id)}>Next</Btn>}
            </div>
          </div>
          <Tabs tabs={[{ id: 'overview', label: 'Overview' }, { id: 'transcript', label: 'Transcript' }, { id: 'resources', label: 'Resources', count: (lesson.resources || []).length || undefined }]} value={tab} onChange={setTab} style={{ marginTop: 16 }} />
          {tab === 'overview' && (
            <Card>
              {/* Production state, stated plainly. A learner who lands on an
                  unrecorded chapter should leave knowing what it will cover and
                  what they can do about it today — not staring at a dead player. */}
              {!lessonPub && (
                <Banner tone={lessonState === 'recording' ? 'warn' : 'info'} icon={lessonState === 'recording' ? 'video' : 'clock'}
                  title={lessonState === 'recording' ? 'This chapter is being recorded' : 'This chapter is scripted, not yet filmed'}
                  style={{ marginBottom: 14 }}
                  /* When an annotated walkthrough exists it's the better answer than
                     the raw screen — it explains every number rather than just
                     showing them. Prefer it; fall back to the live screen. */
                  action={hasTour(lesson)
                    ? <Btn variant="soft" size="sm" icon="image" iconRight="arrow" onClick={() => { window.open(tourHref(lesson), '_blank', 'noopener'); }}>Read the walkthrough</Btn>
                    : undefined}>
                  {lessonState === 'recording'
                    ? (hasTour(lesson)
                        ? 'The video lands shortly. Until then the annotated walkthrough already explains every number on this screen.'
                        : 'The video lands shortly. In the meantime, here’s what it covers — and you can go and click through the real screen now.')
                    : (hasTour(lesson)
                        ? 'Here’s what it will cover. The annotated walkthrough of this screen is ready now if you don’t want to wait.'
                        : 'Here’s what it will cover. It’ll appear here as soon as it’s recorded.')}
                </Banner>
              )}
              <div style={{ fontSize: 13.5, color: T.textSoft, lineHeight: 1.65 }}>{lesson.description}</div>
              {lesson.takeaways && (
                <div style={{ marginTop: 16 }}>
                  <SectionTitle>What you'll learn</SectionTitle>
                  <div style={{ marginTop: 9, display: 'flex', flexDirection: 'column', gap: 9 }}>{lesson.takeaways.map((t, i) => <div key={i} style={{ display: 'flex', gap: 9, fontSize: 12.5, color: T.textSoft, lineHeight: 1.4 }}><Icon name="checkCircle" size={16} color={T.green} /><span>{t}</span></div>)}</div>
                </div>
              )}
              {/* The annotated walkthrough for this screen (Screen Tour, Module 92).
                  Offered on every chapter that has one, recorded or not — reading

// --- Academy search ---
// The Aug-4 meeting asked for the case where someone wants ONE concept, not a
// whole video: "suppose I want to know what lifecycle health means — I don't want
// to watch the whole video, I just search the topic and get the video, or the
// document." So the index goes three levels deep: modules, chapters, and (when
// the written-guide data lands) the individual annotations inside a guide. Read
// defensively via hasGuide/optional chaining so guides light up automatically.
const academySearch = (query) => {
  const q = (query || '').trim().toLowerCase();
  if (q.length < 2) return null;
  const has = (...parts) => parts.filter(Boolean).join(' ').toLowerCase().includes(q);
  // Search only ever surfaces modules and chapters a learner could actually
  // open, the same rule as every other browsing surface: nothing with no
  // video behind it.
  const modules = visibleCourses().filter(c => has(c.title, c.summary, c.menuGroup, moduleFace(c).trackLabel));
  const chapters = [];
  const guides = [];
  ACADEMY_COURSES.forEach(c => {
    publishedLessons(c).forEach(l => {
      // `tags` is in the published contract (docs/ACADEMY_INTEGRATION.md) and the
      // Studio can author it, but this index used to ignore it, so synonyms the
      // content team typed were silently discarded. Tags are how a vocabulary miss
      // ("realisation", "write-off", "recoverability") gets fixed without a
      // developer: add the word in the Studio, search finds the chapter.
      if (has(l.title, l.description, (l.takeaways || []).join(' '), (l.tags || []).join(' '), l.transcript)) chapters.push({ course: c, lesson: l });
      if (hasGuide(l)) {
        l.guide.pins.forEach(pin => { if (has(pin.title, pin.body)) guides.push({ course: c, lesson: l, pin }); });
      }
    });
  });
  return { q, modules, chapters, guides, total: modules.length + chapters.length + guides.length };
};

const ACADEMY_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlY2RyZmFwdmp5ZGtudXpqcmZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDI1MDIsImV4cCI6MjEwMzMxODUwMn0.lYT3mWW0iO58YMdYbOA4_dv-LKEKa4PcH3W4oWTQlTI";

/* ---- curriculum ---------------------------------------------------------
   ACADEMY_TRACKS / ACADEMY_COURSES / ACADEMY_POPULAR / LEARNING_PATHS were
   `const` literals inside index.html. Here they are `let`, because the
   document behind them can be replaced once the live one arrives. Every
   consumer looks them up at render time (trackById, courseById, pathsForCourse
   and friends are all functions), so reassigning is enough. Nothing derives
   from them at module scope. Keep it that way. */
let ACADEMY_TRACKS = [], ACADEMY_COURSES = [], ACADEMY_POPULAR = [], LEARNING_PATHS = [];
let ACADEMY_META = { title: 'Sole Academy', blurb: '' };
let ACADEMY_SOURCE = { kind: 'bundled', version: null, publishedAt: null };

const applyCurriculum = (doc) => {
  if (!doc || !Array.isArray(doc.courses) || !doc.courses.length) return false;
  ACADEMY_TRACKS = (doc.tracks || []).map(t => ({ id: t.id, label: t.label, color: t.color || T.primary, blurb: t.blurb || '' }));
  ACADEMY_COURSES = (doc.courses || []).map(c => ({
    ...c,
    lessons: (c.lessons || []).map(l => ({ ...l, status: l.status || 'planned' })),
  }));
  // A published document flags popular modules per course; the bundled one also
  // carries the hand-picked order. Prefer the order when we have it.
  const flagged = ACADEMY_COURSES.filter(c => c.popular).map(c => c.id);
  const ordered = (doc.popularOrder || []).filter(id => ACADEMY_COURSES.some(c => c.id === id));
  ACADEMY_POPULAR = ordered.length ? ordered : flagged;
  LEARNING_PATHS = (doc.paths || []).map(p => ({ ...p, courseIds: (p.courseIds || []).slice() }));
  ACADEMY_META = doc.meta || ACADEMY_META;
  return true;
};
applyCurriculum(window.SOLE_ACADEMY_BUNDLED);

/* Three sources, in order of authority:
     1. LIVE   the newest published version in Supabase, written by Academy Studio.
     2. FILE   academy-curriculum.json sitting next to this page. This is the
                 Studio's "Download curriculum.json" output, committed by hand.
                 It exists so content is never blocked on the shared backend:
                 the Studio works fully in local mode and hands over that file.
     3. BUNDLE baked in at build time. Always present, so the page is never blank.
   ?curriculum=bundled or ?curriculum=file pins a source for a demo. */
const fetchFileCurriculum = () =>
  fetch('academy-curriculum.json', { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .catch(() => null);

// Published versions are anon-readable by design (RLS blocks drafts and blocks
// writes: see supabase/migrations/0003_academy_cms.sql). No auth, no session.
const fetchPublishedCurriculum = (pinnedVersion) => {
  const filter = pinnedVersion ? '&version=eq.' + encodeURIComponent(pinnedVersion) : '';
  const url = ACADEMY_SUPABASE_URL + '/rest/v1/academy_versions?product=eq.' + ACADEMY_PRODUCT
    + filter + '&select=version,doc,published_at&order=version.desc&limit=1';
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  // A slow network must never hold the page hostage: the bundle is already on
  // screen, so give up quickly and keep it.
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 6000) : null;
  return fetch(url, { headers: { apikey: ACADEMY_SUPABASE_ANON_KEY }, signal: ctrl ? ctrl.signal : undefined })
    .then(r => { if (!r.ok) throw new Error('academy fetch failed: ' + r.status); return r.json(); })
    .then(rows => (rows && rows[0]) || null)
    .finally(() => { if (timer) clearTimeout(timer); });
};

/* ---- routing ------------------------------------------------------------
   #/                     home
   #/modules #/paths #/progress
   #/course/<courseId>[/<lessonId>]
   Query flags live on the hash-free part of the URL so they survive navigation:
   ?curriculum=bundled  ignore Supabase entirely (demo safety net)
   ?v=<n>               pin a specific published version */
const parseAcademyHash = () => {
  const raw = (window.location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if (!parts.length) return { view: 'home' };
  if (parts[0] === 'course') return { view: 'course', courseId: parts[1] || '', lessonId: parts[2] || '' };
  if (parts[0] === 'modules' || parts[0] === 'paths' || parts[0] === 'progress') return { view: parts[0] === 'modules' ? 'courses' : parts[0] };
  return { view: 'home' };
};

const StandaloneAcademy = () => {
  const [route, setRoute] = useState(parseAcademyHash);
  const [rev, setRev] = useState(0);          // bumped when the live curriculum lands
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const onHash = () => { setRoute(parseAcademyHash()); window.scrollTo({ top: 0, behavior: 'auto' }); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const fireToast = (t) => {
    setToast(t);
    const ms = (t && t.action) ? 5000 : 2400;
    setTimeout(() => setToast(cur => (cur === t ? null : cur)), ms);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const pin = params.get('curriculum');

      ACADEMY_SOURCE = { kind: 'file', version: null, publishedAt: null };

    if (pin === 'file') { useFile(); return; }

      .catch(() => { /* everything failed; the bundle is already on screen */ });
  }, []);

  const body = route.view === 'course'
    ? <CoursePlayerPage key={route.courseId + '/' + route.lessonId} courseId={route.courseId} lessonId={route.lessonId} fireToast={fireToast} />

    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: T.bg }}>
      <AcademyHeader />
      {/* key={rev} remounts the tree when the live curriculum replaces the
          bundled one, so every component re-reads the module-level arrays. */}
      <div key={rev} style={{ flex: 1, width: '100%', maxWidth: 1180, margin: '0 auto', display: 'flex' }}>{body}</div>
      <AcademyFooter source={ACADEMY_SOURCE} />
      <Toast toast={toast} onClose={() => setToast(null)} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><StandaloneAcademy /></ErrorBoundary>
);

</script>
</body>
</html>
