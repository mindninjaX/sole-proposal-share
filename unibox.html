  [data-hover="row"]:not(:disabled):hover  { background: #F9FAFB; }

     on hover so it reads as clickable without painting a background block. */
  [data-tab]:not([data-active="true"]):not(:disabled):hover { color: #1F2937 !important; }
  [data-tab]::-webkit-scrollbar, .tab-scroll::-webkit-scrollbar { height: 0; }

  [data-hover="nav"]:hover                 { background: #F5F6FF; }

  .scroll-area::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }

const hexMix = (hex, towards, ratio) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const tr = parseInt(towards.slice(1, 3), 16);
  const tg = parseInt(towards.slice(3, 5), 16);
  const tb = parseInt(towards.slice(5, 7), 16);
  const mix = (a, c) => Math.round(a + (c - a) * ratio);
  const toHex = n => n.toString(16).padStart(2, '0');
  return `#${toHex(mix(r, tr))}${toHex(mix(g, tg))}${toHex(mix(b, tb))}`;
};
const darkenHex = (hex, r = 0.18) => hexMix(hex, '#0F1117', r);
const withAlpha = (hex, alpha) => {
  if (!hex || typeof hex !== 'string') return hex;
  const h = hex.replace('#', '');
  if (h.length !== 6) return hex;
  const a = Math.round(Math.max(0, Math.min(1, alpha)) * 255).toString(16).padStart(2, '0');
  return `#${h}${a}`;
};

// --- confetti (dependency-free reward burst; single ref'd timer; honours reduced motion) ---
const CONFETTI_COLORS = [T.primary, T.green, T.amber, '#EC4899', T.blue];
const prefersReducedMotion = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const Confetti = ({ fire, big }) => {
  const [pieces, setPieces] = useState(null);
  const timer = useRef();
  useEffect(() => {
    if (!fire || prefersReducedMotion()) return;   // no particles for reduced-motion users
    const n = big ? 90 : 40;
    setPieces(Array.from({ length: n }, (_, i) => ({
      key: fire + '-' + i,
      left: Math.random() * 100,
      bg: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      delay: Math.random() * (big ? 0.35 : 0.2),
      dur: (big ? 1.5 : 1.1) + Math.random() * 0.5,
      rot: Math.random() * 360,
    })));
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setPieces(null), big ? 2200 : 1700);
    return () => clearTimeout(timer.current);
  }, [fire]);
  if (!pieces) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 280, overflow: 'hidden' }} aria-hidden="true">
      {pieces.map(p => (
        <span key={p.key} style={{ position: 'absolute', top: 0, left: p.left + '%', width: p.w, height: p.h, background: p.bg, borderRadius: 2, transform: `rotate(${p.rot}deg)`, animation: `confettiFall ${p.dur}s ease-in ${p.delay}s forwards` }} />
      ))}
    </div>
  );
};

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Render crash:', error, info); }
  render() {
    if (this.state.error) {
      return (<div style={{ padding: 24, margin: 24, border: `1px solid ${T.red}`, borderRadius: 12, background: T.redSoft, color: T.red, fontFamily: 'monospace', fontSize: 12 }}>
        <div style={{ fontWeight: 700, marginBottom: 8 }}>⚠ Render crashed</div>
        <div>{String(this.state.error?.message || this.state.error)}</div>
        <pre style={{ marginTop: 10, fontSize: 11, whiteSpace: 'pre-wrap' }}>{this.state.error?.stack}</pre>
      </div>);
    }
    return this.props.children;
  }
}

const HealthRing = ({ score, size = 104, band, celebrate }) => {
  // Stroke scales with the ring — a fixed 9px looked like a thick, broken swoosh at the
  // small header size. Below ~64px we drop the "/100" too (it crowds the score); the band
  // label beside the ring carries the scale.
  const stroke = Math.max(4, Math.round(size * 0.09));
  const compact = size < 64;
  const r = (size / 2) - stroke / 2 - 1;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
  const col = BAND[band].color;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0, animation: celebrate ? 'ringpop 0.5s ease' : undefined }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.border} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`}
          style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(.22,1,.36,1), stroke 0.3s' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ fontSize: Math.round(size * (compact ? 0.36 : 0.3)), fontWeight: 800, color: col, lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{score}</div>
        {!compact && <div style={{ fontSize: 10, color: T.mutedSoft, fontWeight: 600, marginTop: 1 }}>/ 100</div>}
      </div>
    </div>
  );
};

// Active module set + registration flags, derived from the plan and any extra add-ons.
const modulesFor = (plan, extraAddons) => {
  const activeAddons = [...new Set([...(plan.includedAddons || []), ...extraAddons])];
  const mods = new Set(plan.base || []);
  activeAddons.forEach(id => { const a = addonById(id); if (a) a.unlocks.forEach(m => mods.add(m)); });
  const reg = { gst: mods.has('bankfeed') || mods.has('liabilities'), payroll: false, contractors: mods.has('projects') };
  return { activeModules: [...mods], activeAddons, reg };
};
// Monthly price: plan + paid extras. Compliance grants `freeSlots` free add-ons; a
// coming-soon add-on (crypto) is never charged. Matches the screenshots' totals.
const priceFor = (plan, extraAddons) => {
  let total = plan.price, freeLeft = plan.freeSlots || 0;
  extraAddons.filter(id => !(plan.includedAddons || []).includes(id)).forEach(id => {
    const a = addonById(id); if (!a || a.comingSoon) return;
    if (freeLeft > 0) { freeLeft -= 1; return; }
    total += a.price;
  });
  return total;
};

// --- gamification: tiers (all-time actions) + streak + activity history ---
const TIERS = [
  { name: 'Starter',   min: 0,   icon: 'sparkle' },
  { name: 'Regular',   min: 10,  icon: 'flame' },
  { name: 'Sharp',     min: 50,  icon: 'target' },
  { name: 'Pro',       min: 150, icon: 'award' },
  { name: 'Sole star', min: 350, icon: 'star' },
];
const tierFor = (n) => {
  let i = 0;
  for (let k = 0; k < TIERS.length; k++) if (n >= TIERS[k].min) i = k;
  const tier = TIERS[i];
  const next = TIERS[i + 1] || null;
  const toNext = next ? next.min - n : 0;
  const span = next ? next.min - tier.min : 1;
  const progress = next ? clamp((n - tier.min) / span, 0, 1) : 1;
  return { tier, next, toNext, progress };
};
const DAILY_MILESTONES = [3, 5, 10];

const DAY_MS = 86400000;
const startOfDay = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
// Seed ~2 weeks of prior activity (none today, so clearing the first item today
// visibly extends the streak). Counts are per-day-ago; index 0 = today.
const ACTIVITY_BY_DAY = [0, 2, 3, 1, 2, 2, 1, 2, 1, 2, 1, 1, 2];
const SEED_LABELS = ['Sent an invoice', 'Matched a bank transaction', 'Categorised an expense', 'Followed up an overdue invoice', 'Sent a payment reminder', 'Recorded a new asset', 'Attached a receipt'];
const SEED_ACTIVITY = (() => {
  const now = Date.now(); const out = [];
  ACTIVITY_BY_DAY.forEach((cnt, ago) => {
    for (let k = 0; k < cnt; k++) out.push({ ts: now - ago * DAY_MS - (k + 1) * 3600000, kind: 'done', label: SEED_LABELS[(ago + k) % SEED_LABELS.length] });
  });
  return out;
})();
const computeStreak = (activity) => {
  const days = new Set(activity.map(a => startOfDay(a.ts)));
  let d = startOfDay(Date.now()); let streak = 0;
  if (!days.has(d)) d -= DAY_MS;          // today empty → count up to yesterday
  while (days.has(d)) { streak++; d -= DAY_MS; }
  return streak;
};
const computeProgress = (activity) => {
  const today0 = startOfDay(Date.now());
  const counts = {};
  activity.forEach(a => { const ago = Math.round((today0 - startOfDay(a.ts)) / DAY_MS); counts[ago] = (counts[ago] || 0) + 1; });
  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(counts[i] || 0);
  let thisWeek = 0, prevWeek = 0;
  for (let i = 0; i < 7; i++) thisWeek += counts[i] || 0;
  for (let i = 7; i < 14; i++) prevWeek += counts[i] || 0;
  return { today: counts[0] || 0, yesterday: counts[1] || 0, thisWeek, prevWeek, last7, streak: computeStreak(activity) };
};

// --- health score (deterministic; encouraging floor; never 0) ---
function computeHealth(items, streak = 0, isNew = false) {
  const penalty = items.reduce((s, it) => s + (it.weight || 0), 0);
  const streakBonus = Math.min(streak || 0, 5);
  const floor = isNew ? 72 : 40;
  let score = clamp(Math.round(Math.max(floor, 100 - penalty + streakBonus)), 1, 100);
  let band, label, tail;
  if (score >= 80)      { band = 'green'; label = 'In the green';         tail = "you're in great shape 🎉"; }
  else if (score >= 60) { band = 'amber'; label = 'A few things to tidy';  tail = "you're in good shape 👍"; }
  else                  { band = 'red';   label = 'Needs attention';       tail = "let's knock a few out"; }
  return { score, band, label, tail };
}

    <div style={{ fontSize: 12, color: T.muted, marginBottom: 6 }}><b style={{ color: T.textSoft }}>To:</b> {item.email}</div>
    <div style={{ fontSize: 12, color: T.muted, marginBottom: 8 }}><b style={{ color: T.textSoft }}>Subject:</b> Reminder: invoice {item.invoiceNo} — {fmtMoney(item.amount)} {item.type === 'overdue_invoice' ? 'overdue' : 'due soon'}</div>
    <textarea defaultValue={emailBody(item)} style={{ width: '100%', minHeight: 96, border: `1px solid ${T.border}`, borderRadius: 8, padding: 10, fontSize: 12.5, color: T.text, resize: 'vertical', background: T.card, fontFamily: 'inherit' }} />
    <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
      <Btn variant="primary" size="sm" icon="send" onClick={onConfirm}>Send reminder</Btn>
      <Btn size="sm" onClick={onCancel}>Cancel</Btn>
    </div>
  </div>
);

const CategoryPanel = ({ onConfirm, onCancel }) => (
  <div style={panelStyle}>
    <div style={{ fontSize: 12, fontWeight: 600, color: T.textSoft, marginBottom: 8 }}>Choose a category</div>
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
      {CATEGORIES.map(c => <Chip key={c} size="sm" onClick={() => onConfirm(c)}>{c}</Chip>)}
    </div>
    <div style={{ marginTop: 12 }}><Btn size="sm" onClick={onCancel}>Cancel</Btn></div>
  </div>
);

const ReceiptPanel = ({ onConfirm, onCancel }) => {
  const [up, setUp] = useState(false);
  const go = () => { if (up) return; setUp(true); setTimeout(onConfirm, 700); };
  return (
    <div style={panelStyle}>
      <div onClick={go} style={{ border: `1.5px dashed ${T.borderStrong}`, borderRadius: 10, padding: 18, textAlign: 'center', cursor: up ? 'default' : 'pointer', color: T.muted, background: T.card }}>
        {up
          ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><span style={{ display: 'inline-flex', animation: 'spin 0.8s linear infinite' }}><Icon name="refresh" size={15} /></span> Uploading…</span>
          : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><Icon name="upload" size={16} /> Click to attach a receipt (demo)</span>}
      </div>
      <div style={{ marginTop: 10 }}><Btn size="sm" onClick={onCancel} disabled={up}>Cancel</Btn></div>
    </div>
  );
};

const AssetPanel = ({ onConfirm, onCancel }) => {
  const [cat, setCat] = useState('Computer');
  const [method, setMethod] = useState('bank');
  return (
    <div style={panelStyle}>
      <Label>Asset category</Label>
      <Select value={cat} onChange={e => setCat(e.target.value)} style={{ maxWidth: 260 }}>
        {['Computer', 'Equipment', 'Vehicle', 'Furniture'].map(c => <option key={c}>{c}</option>)}
      </Select>
      <Label style={{ marginTop: 12 }}>Payment method</Label>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        <Chip size="sm" selected={method === 'bank'} onClick={() => setMethod('bank')}>Link bank transaction</Chip>
        <Chip size="sm" selected={method === 'cash'} onClick={() => setMethod('cash')}>Paid with cash</Chip>
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
        <Btn variant="primary" size="sm" icon="check" onClick={onConfirm}>Record asset</Btn>
        <Btn size="sm" onClick={onCancel}>Cancel</Btn>
      </div>
    </div>
  );
};

const PanelSwitch = ({ item, mode, onComplete, onClose }) => {
  if (mode === 'email') return <EmailPanel item={item} onConfirm={() => onComplete(item, `Reminder sent to ${item.client}`)} onCancel={onClose} />;
  if (mode === 'category') return <CategoryPanel onConfirm={(c) => onComplete(item, `Categorised as ${c}`)} onCancel={onClose} />;
  if (mode === 'receipt') return <ReceiptPanel onConfirm={() => onComplete(item, 'Receipt attached')} onCancel={onClose} />;
  if (mode === 'asset') return <AssetPanel onConfirm={() => onComplete(item, 'Recorded as an asset')} onCancel={onClose} />;
  return null;
};

// --- match window (modal) — "click Match → opens the match window" (stakeholder) ---
const MatchOption = ({ selected, onClick, label, sub, badge }) => (
  <button onClick={onClick} style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left', padding: '10px 12px', borderRadius: 10, cursor: 'pointer', border: `1.5px solid ${selected ? T.primary : T.border}`, background: selected ? T.primarySofter : T.card }}>
    <span style={{ width: 18, height: 18, borderRadius: '50%', flexShrink: 0, border: `1.5px solid ${selected ? T.primary : T.borderStrong}`, background: selected ? T.primary : T.card, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{selected && <Icon name="check" size={11} color="#fff" strokeWidth={3} />}</span>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text }}>{label}</div>
      {sub && <div style={{ fontSize: 11.5, color: T.muted, marginTop: 1 }}>{sub}</div>}
    </div>
    {badge}
  </button>
);

const MatchModal = ({ item, isMobile, onClose, onConfirm, onReject }) => {
  const hasAi = !!(item && item.aiMatch);
  const [picked, setPicked] = useState(null);
  useEffect(() => { setPicked(item && item.aiMatch ? 'ai' : null); }, [item && item.id]);
  if (!item) return null;
  const inbound = item.amountTone === 'in';
  const candidates = inbound ? MATCH_CANDIDATES_IN : MATCH_CANDIDATES_OUT;
  const bankLine = item.bankLine || item.sub;
  return (
    <Modal open={!!item} onClose={onClose} isMobile={isMobile} icon="bank" maxWidth={480}
      title="Match this transaction" subtitle="Confirm what this belongs to so your books stay reconciled.">
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: T.surface, border: `1px solid ${T.borderSoft}`, borderRadius: 10 }}>
        <IconChip icon="bank" tone={inbound ? 'green' : 'neutral'} size={30} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{item.rowTitle}</div>
          {bankLine && <div style={{ fontSize: 11.5, color: T.muted }}>{bankLine}</div>}
        </div>
        <span style={{ fontWeight: 700, fontSize: 14, color: inbound ? T.greenDark : T.text, fontVariantNumeric: 'tabular-nums' }}>{inbound ? '+' : '-'}{fmtMoney(item.amount)}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, margin: '14px 0 8px' }}>
        {hasAi && <Icon name="sparkle" size={13} color={T.primary} />}
        <span style={{ fontSize: 12, fontWeight: 600, color: T.textSoft }}>{hasAi ? 'Sole suggests' : 'Choose a match'}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {hasAi && (
          <MatchOption selected={picked === 'ai'} onClick={() => setPicked('ai')}
            label={item.aiMatch.label} sub={item.aiMatch.detail} badge={<Pill color="green">{Math.round(item.aiMatch.confidence * 100)}%</Pill>} />
        )}
        {candidates.map(c => (
          <MatchOption key={c.id} selected={picked === c.id} onClick={() => setPicked(c.id)}
            label={c.label} sub={c.sub + ' · ' + fmtMoney(c.amount)} />
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
        <Btn variant="primary" icon="check" disabled={!picked} onClick={() => onConfirm(item)}>Confirm match</Btn>
        <Btn onClick={() => onReject(item)}>Not a match</Btn>
      </div>
    </Modal>
  );
};

// --- viewport (drives CHROME only — sidebar drawer / topbar). The bento column
// count is measured off real CONTENT width by a separate ResizeObserver, never
// window width, so a title can't collapse to one letter. See docs/MEMORY.md. ---
const useViewport = () => {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  useEffect(() => { const on = () => setW(window.innerWidth); window.addEventListener('resize', on); return () => window.removeEventListener('resize', on); }, []);
  return { w, isMobile: w < 768, isTablet: w < 1024 };
};

// --- quiet action row (Asana-style: leading status marker · title/sub · right-aligned meta + action) ---
const QUIET_BTN = { border: `1px solid ${T.border}`, background: T.card, color: T.textSoft, fontSize: 12, fontWeight: 500, padding: '4px 10px', borderRadius: 6, cursor: 'pointer', whiteSpace: 'nowrap', lineHeight: 1.4 };
// Home cards float on the coloured canvas — a touch more radius + shadow than a flat dashboard tile.
const CARD = { background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: 14, boxShadow: T.shadowSm, overflow: 'hidden' };

// Shared row shell. DESKTOP: one line — [glyph · title/sub · fixed AMOUNT col · fixed
// ACTION col] so amounts and buttons align across rows and with the header CTA. MOBILE:
// a tidy 2-line card — title + amount on top, sub + actions below — so the number is
// paired with its item and never floats alone on its own line.
const RowShell = ({ icon, iconColor, title, titleTag, sub, amountNode, actions, isMobile, last, actionWidth = 108 }) => {
  const border = last ? 'none' : `1px solid ${T.borderSoft}`;
  const col = iconColor || T.mutedSoft;
  const glyph = <span style={{ width: 18, flexShrink: 0, display: 'inline-flex', justifyContent: 'center', color: col, marginTop: isMobile ? 1 : 0 }}><Icon name={icon} size={15} color={col} strokeWidth={2} /></span>;
  const titleText = <span style={{ fontSize: 13, fontWeight: 500, color: T.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 }}>{title}</span>;
  // Desktop: the type tag sits beside the title. Mobile: it moves to the start of the sub
  // line so a long title never has to truncate to make room for it on the top line.
  const titleEl = (titleTag && !isMobile)
    ? <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>{titleText}{titleTag}</div>
    : titleText;
  const subContent = (titleTag && isMobile)
    ? <React.Fragment><span style={{ display: 'inline-flex', verticalAlign: 'middle', marginRight: 7 }}>{titleTag}</span>{sub}</React.Fragment>
    : sub;
  // On mobile the sub is allowed to wrap to a 2nd line rather than truncate; on desktop it stays a single ellipsised line.
  const subEl = <div style={{ fontSize: 11.5, color: T.muted, lineHeight: 1.4, ...(isMobile ? {} : { whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }) }}>{subContent}</div>;
  if (isMobile) {
    return (
      <div className="ub-row" style={{ display: 'flex', alignItems: 'flex-start', gap: 12, padding: '11px 14px', borderBottom: border }}>
        {glyph}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>{titleEl}</div>
            {amountNode && <div style={{ flexShrink: 0 }}>{amountNode}</div>}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginTop: 5 }}>
            <div style={{ flex: 1, minWidth: 0 }}>{subEl}</div>
            {actions && <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>{actions}</div>}
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="ub-row" data-hover="row" style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderBottom: border }}>
      {glyph}
      <div style={{ flex: 1, minWidth: 0 }}>{titleEl}<div style={{ marginTop: 1 }}>{subEl}</div></div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
        {amountNode && <div style={{ minWidth: 74, textAlign: 'right' }}>{amountNode}</div>}
        {actions && <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 6, minWidth: actionWidth }}>{actions}</div>}
      </div>
    </div>
  );
};

// Row overflow menu — an always-visible ⋯ that opens the secondary actions. Rendered
// fixed-position so it escapes the card's overflow:hidden; single click-away scrim.
const RowMenu = ({ actions, onPick }) => {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({ top: 0, right: 0 });
  const btnRef = useRef(null);
  if (!actions || !actions.length) return null;
  const toggle = () => {
    if (open) { setOpen(false); return; }
    const r = btnRef.current.getBoundingClientRect();
    setPos({ top: r.bottom + 6, right: Math.max(8, window.innerWidth - r.right) });
    setOpen(true);
  };
  return (
    <React.Fragment>
      <button ref={btnRef} className="ub-qbtn" title="More actions" onClick={toggle}
        style={{ border: `1px solid ${T.border}`, background: T.card, borderRadius: 6, padding: '0 6px', height: 30, display: 'inline-flex', alignItems: 'center', cursor: 'pointer', color: T.muted, flexShrink: 0 }}>
        <Icon name="more" size={15} />
      </button>
      {open && (
        <React.Fragment>
          <div onClick={() => setOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 210 }} />
          <div style={{ position: 'fixed', top: pos.top, right: pos.right, minWidth: 168, background: T.card, border: `1px solid ${T.border}`, borderRadius: 10, boxShadow: T.shadowLg, zIndex: 211, overflow: 'hidden', animation: 'expand .14s ease' }}>
            {actions.map(a => (
              <button key={a.id} data-hover="row" onClick={() => { setOpen(false); onPick(a.id); }}
                style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', background: 'none', padding: '9px 13px', fontSize: 12.5, color: T.text, cursor: 'pointer', whiteSpace: 'nowrap' }}>{a.label}</button>
            ))}
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
};

// Action row — a RowShell whose amount is the item's value and whose actions are one
// always-visible primary button + a ⋯ overflow menu for the rest. Inline panels
// (email/category/receipt/asset) still expand below the row.
// What kind of thing a row is, by module — shown as a small neutral tag in the mixed
// focus list so an invoice is distinguishable from a bank transaction, expense, etc.
const TYPE_LABEL = { quotes: 'Quote', sales: 'Invoice', bankfeed: 'Bank', expenses: 'Expense', assets: 'Asset' };
const ActionRow = ({ item, openMode, onAction, onComplete, onClose, innerRef, flash, last, isMobile, showType }) => {
  const badgeRed = item.badge && item.badge.color === 'red';
  const typeTag = showType ? <Pill color="neutral" style={{ padding: '1px 7px', fontSize: 10.5, flexShrink: 0 }}>{TYPE_LABEL[item.module] || 'To do'}</Pill> : null;
  const sub = (
    <React.Fragment>
      {item.badge && <span style={{ color: badgeRed ? T.red : T.muted, fontWeight: badgeRed ? 600 : 400 }}>{item.badge.label}{item.sub ? ' · ' : ''}</span>}
      {item.sub}
    </React.Fragment>
  );
  const amountNode = item.amount != null ? (
    <span style={{ fontSize: 13, fontWeight: 600, color: item.amountTone === 'in' ? T.greenDark : T.textSoft, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>
      {item.amountTone === 'in' ? '+' : item.amountTone === 'out' ? '-' : ''}{fmtMoney(item.amount)}
    </span>
  ) : null;
  const actions = (
    <React.Fragment>
      <RowMenu actions={item.secondary} onPick={(id) => onAction(item, id)} />
      <button className="ub-qbtn" style={{ ...QUIET_BTN, height: 30, display: 'inline-flex', alignItems: 'center' }} title={item.primary.title || item.primary.label} onClick={() => onAction(item, item.primary.id)}>{item.primary.label}</button>
    </React.Fragment>
  );
  return (
    <div ref={innerRef} style={{ animation: flash ? 'rowflash 1.4s ease' : undefined }}>
      <RowShell icon={item.icon} iconColor={item.severity === 'high' ? T.red : T.mutedSoft}
        title={item.rowTitle} titleTag={typeTag} sub={sub} amountNode={amountNode} actions={actions}
        isMobile={isMobile} last={last} actionWidth={146} />
      {openMode && <div style={{ padding: '2px 14px 14px 44px' }}><PanelSwitch item={item} mode={openMode} onComplete={onComplete} onClose={onClose} /></div>}
    </div>
  );
};

// --- widget (self-contained home card: header · optional tabs · quiet rows · show more) ---
const WidgetTabs = ({ tabs, value, onChange, counts }) => (
  <div style={{ display: 'flex', gap: 18, padding: '0 14px', borderBottom: `1px solid ${T.borderSoft}`, overflowX: 'auto', scrollbarWidth: 'none' }}>
    {tabs.map(t => {
      const active = t.id === value;
      return (
        <button key={t.id} onClick={() => onChange(t.id)} style={{ background: 'none', border: 'none', padding: '9px 0', marginBottom: -1, fontSize: 12.5, fontWeight: active ? 600 : 500, color: active ? T.text : T.muted, borderBottom: `2px solid ${active ? T.primary : 'transparent'}`, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap', flexShrink: 0 }}>
          {t.label}{counts[t.id] > 0 && <span style={{ fontSize: 11, fontWeight: 600, color: active ? T.primary : T.mutedSoft }}>{counts[t.id]}</span>}
        </button>
      );
    })}
  </div>
);

// Header "+ add" — a single quiet button, or a small dropdown when there are 2+.
const WidgetAdd = ({ label, actions }) => {
  const [open, setOpen] = useState(false);
  if (!actions || actions.length === 0) return null;
  if (actions.length === 1) return (
    <button className="ub-qbtn" style={{ ...QUIET_BTN, padding: '3px 9px', display: 'inline-flex', alignItems: 'center', gap: 5 }} onClick={actions[0].onClick}><Icon name="plus" size={12} />{actions[0].label}</button>
  );
  return (
    <div style={{ position: 'relative' }}>
      {open && <div onClick={() => setOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 80 }} />}
      <button className="ub-qbtn" style={{ ...QUIET_BTN, padding: '3px 9px', display: 'inline-flex', alignItems: 'center', gap: 4, position: 'relative', zIndex: 81 }} onClick={() => setOpen(v => !v)}><Icon name="plus" size={12} />{label}<Icon name="chevronDown" size={11} /></button>
      {open && (
        <div style={{ position: 'absolute', top: 32, right: 0, minWidth: 160, background: T.card, border: `1px solid ${T.border}`, borderRadius: 10, boxShadow: T.shadowLg, zIndex: 82, overflow: 'hidden', animation: 'expand .14s ease' }}>
          {actions.map(a => <button key={a.label} data-hover="row" onClick={() => { setOpen(false); a.onClick(); }} style={{ display: 'flex', alignItems: 'center', gap: 8, width: '100%', border: 'none', background: 'none', padding: '9px 12px', fontSize: 12.5, color: T.text, cursor: 'pointer', textAlign: 'left' }}><Icon name="plus" size={12} color={T.mutedSoft} />{a.label}</button>)}
        </div>
      )}
    </div>
  );
};

// Shared widget header — mono icon · title · count · (add). The header CTA sits flush
// to the card's right edge so it lines up with the row action buttons below it.
// (Widget hide/show lives in the Customise popover, not a per-card ⋯.)
const WidgetHead = ({ icon, title, count, addLabel, addActions, headerAction }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '13px 14px 11px' }}>
    <Icon name={icon} size={16} color={T.mutedSoft} />
    <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text }}>{title}</div>
    {count != null && <span style={{ fontSize: 12, fontWeight: 500, color: T.mutedSoft }}>{count}</span>}
    <div style={{ flex: 1 }} />
    {headerAction}
    {addActions && <WidgetAdd label={addLabel} actions={addActions} />}
  </div>
);

const ShowMore = ({ all, onToggle, count }) => (
  <button className="ub-qlink" onClick={onToggle} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, border: 'none', background: 'none', color: T.muted, fontSize: 12, fontWeight: 500, cursor: 'pointer', padding: '11px 14px' }}>
    <span style={{ display: 'inline-flex', transform: all ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}><Icon name="chevronDown" size={13} /></span>
    {all ? 'Show less' : `Show ${count} more`}
  </button>
);

const Widget = ({ title, icon, addLabel, addActions, items, tabs, emptyTitle, renderRow }) => {
  const [tab, setTab] = useState(tabs ? tabs[0].id : null);
  const [all, setAll] = useState(false);
  const activeTab = tabs ? (tabs.find(t => t.id === tab) || tabs[0]) : null;
  const list = activeTab ? items.filter(activeTab.filter) : items;
  const counts = tabs ? Object.fromEntries(tabs.map(t => [t.id, items.filter(t.filter).length])) : {};
  const shown = all ? list : list.slice(0, 3);
  return (
    <div className="ub-widget" style={{ background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: 14, boxShadow: T.shadowSm, overflow: 'hidden' }}>
      <WidgetHead icon={icon} title={title} count={items.length} addLabel={addLabel} addActions={addActions} />
      {tabs && <WidgetTabs tabs={tabs} value={activeTab ? activeTab.id : tab} onChange={t => { setTab(t); setAll(false); }} counts={counts} />}
      {list.length === 0 ? (
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '12px 14px 16px', color: T.muted }}>
          <Icon name="check" size={15} color={T.greenDark} strokeWidth={2.4} />
          <span style={{ fontSize: 12.5 }}>{emptyTitle}</span>
        </div>
      ) : shown.map((item, i) => renderRow(item, i, shown.length))}
      {list.length > 3 && <ShowMore all={all} onToggle={() => setAll(a => !a)} count={list.length - 3} />}
    </div>
  );
};

// --- your progress (gamification: tier · this-week vs your own past · recent actions) ---
const relDay = (ts) => {
  const ago = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / DAY_MS);
  return ago <= 0 ? 'Today' : ago === 1 ? 'Yesterday' : ago + ' days ago';
};
const dayLetter = (ago) => 'SMTWTFS'[new Date(startOfDay(Date.now()) - ago * DAY_MS).getDay()];
const ProgressCard = ({ progress, allTime, recent }) => {
  const tf = tierFor(allTime);
  const maxBar = Math.max(1, ...progress.last7);
  const pace = progress.thisWeek > progress.prevWeek ? { txt: "Ahead of last week", col: T.greenDark }
    : progress.thisWeek === progress.prevWeek ? { txt: 'Matching your usual pace', col: T.muted }
    : { txt: 'A quieter week — every bit counts', col: T.muted };
  return (
    <div className="ub-widget" style={CARD}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '15px 16px 11px' }}>
        <Icon name="trendUp" size={16} color={T.mutedSoft} />
        <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text }}>Your progress</div>
        <div style={{ flex: 1 }} />
      </div>
      <div style={{ padding: '2px 16px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <IconChip icon={tf.tier.icon} tone="accent" size={34} gradient />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text }}>{tf.tier.name}</div>
            <div style={{ fontSize: 11.5, color: T.muted }}>{tf.next ? `${tf.toNext} more to ${tf.next.name}` : 'Top tier — nice work'}</div>
          </div>
          <span title="Actions all-time" style={{ fontSize: 12, fontWeight: 700, color: T.textSoft, fontVariantNumeric: 'tabular-nums' }}>{allTime}</span>
        </div>
        <div style={{ height: 7, background: T.fieldBg, borderRadius: 999, marginTop: 10, overflow: 'hidden' }}>
          <div style={{ width: Math.round(tf.progress * 100) + '%', height: '100%', background: `linear-gradient(90deg, ${T.primary}, ${T.green})`, borderRadius: 999, transition: 'width 0.5s ease' }} />
        </div>
      </div>
      <div style={{ borderTop: `1px solid ${T.borderSoft}`, padding: '12px 16px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8 }}>

          <span style={{ fontSize: 11.5, fontWeight: 600, color: pace.col }}>{pace.txt}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, marginTop: 10 }}>
          {progress.last7.map((v, i) => {
            const today = i === 6;
            return (
              <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                <div style={{ width: '100%', height: 34, display: 'flex', alignItems: 'flex-end' }}>
                  <div title={v + ' actions'} style={{ width: '100%', height: Math.round((v / maxBar) * 100) + '%', minHeight: v > 0 ? 4 : 2, background: today ? T.primary : (v > 0 ? '#C7C9FB' : T.border), borderRadius: 3, transformOrigin: 'bottom', animation: 'barrise 0.5s ease' }} />
                </div>
                <span style={{ fontSize: 9.5, color: today ? T.primary : T.mutedSoft, fontWeight: today ? 700 : 500 }}>{today ? 'Today' : dayLetter(6 - i)}</span>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ borderTop: `1px solid ${T.borderSoft}`, padding: '4px 6px 8px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: 0.5, padding: '8px 14px 4px' }}>Recent actions</div>
        {recent.length === 0
          ? <div style={{ fontSize: 12, color: T.muted, padding: '2px 14px 8px' }}>Clear something today and it'll show up here.</div>
          : recent.map((a, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 14px' }}>
              <Icon name="checkCircle" size={15} color={T.green} />

              <span style={{ fontSize: 11, color: T.mutedSoft, flexShrink: 0 }}>{relDay(a.ts)}</span>
            </div>
          ))}
      </div>
    </div>
  );
};

// Plan + add-ons control. Compact top-right dropdown: pick a plan and toggle add-ons,
// and the home reflows to the modules they unlock (a card per active add-on/module).
// This is the demo stand-in for the account's real subscription — hence the DEMO chip.
const PlanControl = ({ planId, plan, extraAddons, onSetPlan, onToggleAddon, isMobile }) => {
  const [open, setOpen] = useState(false);
  const included = plan.includedAddons || [];
  const total = priceFor(plan, extraAddons);
  const usedFree = extraAddons.filter(id => !included.includes(id) && !(addonById(id) || {}).comingSoon).length;
  const freeLeft = Math.max(0, (plan.freeSlots || 0) - usedFree);
  const priceLbl = (p) => p === 0 ? 'Free' : '$' + p.toFixed(2);
  // On mobile the pill sits near the middle, so anchor the panel to the viewport (with
  // side margins) instead of the pill's right edge — otherwise it clips off-screen.
  const panel = isMobile
    ? { position: 'fixed', top: 64, left: 12, right: 12, width: 'auto', maxWidth: 'none', maxHeight: '78vh' }
    : { position: 'absolute', top: 36, right: 0, width: 324, maxWidth: '88vw', maxHeight: '72vh' };
  return (
    <div style={{ position: 'relative' }}>
      {open && <div onClick={() => setOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 80 }} />}
      <button onClick={() => setOpen(v => !v)} title="Switch plan & add-ons (demo)"
        style={{ position: 'relative', zIndex: 91, display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px', minHeight: 30, borderRadius: 8, border: `1px dashed ${T.borderStrong}`, background: T.card, color: T.textSoft, fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
        <span style={{ fontSize: 9.5, fontWeight: 700, color: T.primary, background: T.primarySoft, borderRadius: 4, padding: '1px 5px', letterSpacing: 0.3 }}>DEMO</span>
        <span style={{ maxWidth: 150, overflow: 'hidden', textOverflow: 'ellipsis' }}>{plan.label}</span>
        <Icon name="chevronDown" size={12} />
      </button>
      {open && (
        <div style={{ ...panel, overflowY: 'auto', background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, boxShadow: T.shadowLg, zIndex: 91, textAlign: 'left', animation: 'expand .14s ease' }}>
          <div style={{ padding: '10px 14px 6px', fontSize: 11, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: 0.5 }}>Your plan</div>
          {PLANS.map(p => {
            const active = p.id === planId, dis = p.disabled;
            return (
              <button key={p.id} disabled={dis} onClick={() => { if (!dis) onSetPlan(p.id); }} data-hover={dis ? undefined : 'row'}
                style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', border: 'none', background: active ? T.primarySofter : 'none', padding: '8px 14px', cursor: dis ? 'not-allowed' : 'pointer', textAlign: 'left', opacity: dis ? 0.55 : 1 }}>
                <span style={{ width: 16, height: 16, flexShrink: 0, borderRadius: '50%', border: `1.5px solid ${active ? T.primary : T.borderStrong}`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{active && <span style={{ width: 8, height: 8, borderRadius: '50%', background: T.primary }} />}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, display: 'flex', alignItems: 'center', gap: 6 }}>
                    {p.label}
                    {p.tag && <span style={{ fontSize: 9, fontWeight: 700, color: '#fff', background: T.primary, borderRadius: 4, padding: '1px 5px', letterSpacing: 0.2 }}>{p.tag}</span>}
                  </div>
                  {dis && <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 1 }}>{p.comingSoon}</div>}
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, color: T.textSoft, fontVariantNumeric: 'tabular-nums' }}>{priceLbl(p.price)}</span>
              </button>
            );
          })}
          <div style={{ padding: '10px 14px 6px', borderTop: `1px solid ${T.borderSoft}`, marginTop: 4, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: 0.5 }}>Add-ons</span>
            {plan.freeSlots > 0 && <span style={{ fontSize: 10.5, fontWeight: 600, color: freeLeft > 0 ? T.greenDark : T.mutedSoft }}>{freeLeft} of {plan.freeSlots} free left</span>}
          </div>
          {ADDONS.map(a => {
            const isIncl = included.includes(a.id);
            const on = isIncl || extraAddons.includes(a.id);
            const right = isIncl
              ? <span style={{ fontSize: 10.5, fontWeight: 700, color: T.greenDark }}>Included</span>
              : a.comingSoon
                ? <span style={{ fontSize: 9, fontWeight: 700, color: T.amber, background: T.amberSoft, borderRadius: 4, padding: '1px 5px', letterSpacing: 0.3 }}>SOON</span>
                : <span style={{ fontSize: 12, fontWeight: 600, color: T.muted, fontVariantNumeric: 'tabular-nums' }}>${a.price.toFixed(2)}</span>;
            return (
              <button key={a.id} disabled={isIncl} onClick={() => { if (!isIncl) onToggleAddon(a.id); }} data-hover={isIncl ? undefined : 'row'}
                style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', border: 'none', background: 'none', padding: '8px 14px', cursor: isIncl ? 'default' : 'pointer', textAlign: 'left' }}>
                <span style={{ width: 18, height: 18, flexShrink: 0, borderRadius: 5, border: `1.5px solid ${on ? T.primary : T.borderStrong}`, background: on ? T.primary : T.card, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{on && <Icon name="check" size={12} color="#fff" strokeWidth={3} />}</span>
                <span style={{ width: 20, flexShrink: 0, display: 'inline-flex', justifyContent: 'center', color: T.mutedSoft }}><Icon name={a.icon} size={15} color={T.mutedSoft} /></span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text }}>{a.label}</div>
                  <div style={{ fontSize: 10.5, color: T.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{a.desc}</div>
                </div>
                {right}
              </button>
            );
          })}
          <div style={{ position: 'sticky', bottom: 0, background: T.card, borderTop: `1px solid ${T.borderSoft}`, padding: '10px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 11.5, color: T.muted }}>Total</span>
            <span style={{ fontSize: 15, fontWeight: 800, color: T.text, fontVariantNumeric: 'tabular-nums' }}>{total === 0 ? 'Free' : '$' + total.toFixed(2)}<span style={{ fontSize: 11, fontWeight: 500, color: T.muted }}> /mo</span></span>
          </div>
        </div>
      )}
    </div>
  );
};

const Hero = ({ health, count, streak, tier, isMobile, planProps, customizeOpen, onCustomizeToggle, customizeProps }) => {
  const [info, setInfo] = useState(false);
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const dateStr = new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  const controls = (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'center', flexWrap: 'wrap' }}>
      <PlanControl {...planProps} isMobile={isMobile} />
      <div style={{ position: 'relative' }}>
        {customizeOpen && <div onClick={onCustomizeToggle} style={{ position: 'fixed', inset: 0, zIndex: 80 }} />}
        <Btn variant="ghost" size="sm" icon="sliders" onClick={onCustomizeToggle} style={{ background: T.card, position: 'relative', zIndex: 91 }}>Customise</Btn>
        {customizeOpen && <CustomizePopover {...customizeProps} />}
      </div>
    </div>
  );
  // Business health lives in the header now — always visible above the fold, so the score
  // is a persistent anchor instead of a card that scrolls away. Kept compact (a small ring
  // + status + the day's counts) rather than the full-width metrics band we rejected earlier.
  const bandColor = BAND[health.band].color;
  const stat = (children, key) => <span key={key} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12.5, color: T.textSoft, whiteSpace: 'nowrap' }}>{children}</span>;
  const stats = [
    stat(<span><b style={{ fontWeight: 700, color: T.text }}>{count}</b> {isMobile ? 'to do' : 'to action'}</span>, 'a'),
    stat(<React.Fragment><Icon name="flame" size={13} color={T.amber} /><span><b style={{ fontWeight: 700, color: T.text }}>{streak}</b>-day streak</span></React.Fragment>, 's'),
  ];
  if (tier && !isMobile) stats.push(stat(<React.Fragment><Icon name={tier.icon} size={13} color={T.primary} /><b style={{ fontWeight: 700, color: T.text }}>{tier.name}</b></React.Fragment>, 't'));
  // On mobile skip the divider rules and let the gap do the spacing (thin rules read badly when the row wraps).
  const statRow = [];
  stats.forEach((s, i) => { if (!isMobile) statRow.push(<span key={'d' + i} style={{ width: 1, height: 24, background: T.border, flexShrink: 0 }} />); statRow.push(s); });
  return (
    <div style={{ position: 'relative', textAlign: 'center', padding: isMobile ? '0 0 20px' : '2px 0 24px' }}>
      {isMobile
        ? <div style={{ marginBottom: 12 }}>{controls}</div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: T.muted }}>{dateStr}</div>
      <div style={{ fontSize: isMobile ? 23 : 28, fontWeight: 800, color: T.text, letterSpacing: -0.6, marginTop: 4 }}>{greet}, {PROFILE.first}</div>
      {isMobile ? (
        // Mobile: a clean 2-row card (identity row + a centered stat row on a divider) so
        // the counts don't wrap lopsidedly the way a single flex-wrap row did.
        <div style={{ marginTop: 14, background: T.card, border: `1px solid ${T.border}`, borderRadius: 16, boxShadow: T.shadowSm, textAlign: 'left', overflow: 'hidden' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px' }}>
            <HealthRing score={health.score} band={health.band} size={46} celebrate={false} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: bandColor }}>{health.label}</div>
              <div style={{ fontSize: 12, color: T.muted, marginTop: 1 }}>Business health</div>
            </div>
            <button onClick={() => setInfo(v => !v)} title="How's this worked out?" style={{ border: 'none', background: info ? T.primarySoft : 'none', color: info ? T.primary : T.mutedSoft, cursor: 'pointer', padding: 4, display: 'inline-flex', borderRadius: 8, flexShrink: 0 }}><Icon name="info" size={15} /></button>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: '9px 14px', borderTop: `1px solid ${T.borderSoft}` }}>
            <span style={{ fontSize: 12.5, color: T.textSoft, whiteSpace: 'nowrap' }}><b style={{ fontWeight: 700, color: T.text }}>{count}</b> to do</span>
            <span style={{ width: 1, height: 14, background: T.border, flexShrink: 0 }} />
            <span style={{ fontSize: 12.5, color: T.textSoft, display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}><Icon name="flame" size={13} color={T.amber} /><span><b style={{ fontWeight: 700, color: T.text }}>{streak}</b>-day streak</span></span>
          </div>
        </div>
      ) : (
        <div style={{ display: 'inline-flex', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', gap: 14, marginTop: 18, background: T.card, border: `1px solid ${T.border}`, borderRadius: 18, padding: '8px 16px 8px 10px', boxShadow: T.shadowSm, maxWidth: '100%' }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
            <HealthRing score={health.score} band={health.band} size={46} celebrate={false} />
            <div style={{ textAlign: 'left', lineHeight: 1.2 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, color: bandColor }}>{health.label}</div>
              <div style={{ fontSize: 11.5, color: T.muted, marginTop: 1 }}>Business health</div>
            </div>
          </div>
          {statRow}
          <button onClick={() => setInfo(v => !v)} title="How's this worked out?" style={{ border: 'none', background: info ? T.primarySoft : 'none', color: info ? T.primary : T.mutedSoft, cursor: 'pointer', padding: 4, display: 'inline-flex', borderRadius: 8, flexShrink: 0 }}><Icon name="info" size={15} /></button>
        </div>
      )}
      {info && (
        <div style={{ margin: '10px auto 0', maxWidth: 520, textAlign: 'left', padding: 12, background: T.primarySofter, border: `1px solid ${T.borderSoft}`, borderRadius: 10, fontSize: 12, color: T.textSoft, lineHeight: 1.5 }}>

    <div style={{ marginTop: 18, display: 'flex', justifyContent: 'center', gap: 8, flexWrap: 'wrap' }}>

// --- Unibox screen (calm hero + Asana-style bento of self-contained widgets) ---
const GET_PAID_TABS = [
  { id: 'quotes', label: 'Quotes', filter: i => i.type === 'quote' },
  { id: 'send', label: 'To send', filter: i => i.type === 'send_invoice' },
  { id: 'overdue', label: 'Overdue', filter: i => i.type === 'overdue_invoice' },
  { id: 'due', label: 'Due soon', filter: i => i.type === 'due_soon' },
];
const WIDGET_LABELS = { get_paid: 'Get paid', health: 'Business health', reconcile: 'Bank feed', expenses: 'Expenses', assets: 'Assets', liabilities: 'Liabilities & equity', upcoming: 'Work coming up', keydates: 'Key dates', progress: 'Your progress', time: 'Time tracker', projects: 'Projects', km: 'KM tracker', inventory: 'Inventory', investment: 'Investments', crypto: 'Crypto' };

const UniboxScreen = ({ items, activeModules, reg, planProps, progress, activity, allTime, onComplete, fireToast, focus, isMobile }) => {
  const [open, setOpen] = useState(null);            // inline panel { id, mode }
  const [matchItem, setMatchItem] = useState(null);  // the Match window
  const [flashId, setFlashId] = useState(null);
  const [hidden, setHidden] = useState({});          // { [widgetId]: true }
  const [customize, setCustomize] = useState(false);
  const [showEverything, setShowEverything] = useState(false);   // "everything else" is collapsed until revealed
  const baseAllTime = useRef(allTime);               // completions-this-session baseline (for auto-reveal)
  const autoRevealed = useRef(false);
  const rowRefs = useRef({});
  // Column count is driven by the ACTUAL content width (not the window — the sidebar
  // steals width), measured live so columns never get too narrow to read. LANDMINE:
  // never derive this from window.innerWidth / useViewport — see docs/MEMORY.md.
  const wrapRef = useRef(null);
  const [cw, setCw] = useState(1120);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(es => { for (const e of es) setCw(e.contentRect.width); });
    ro.observe(el);
    setCw(el.getBoundingClientRect().width);
    return () => ro.disconnect();
  }, []);
  const cols = cw >= 900 ? 2 : 1;   // 2-col only when each column is wide enough for a full single-line row

  // Auto-reveal "everything else" once they've cleared their top 5 this session. Latched
  // (never re-hides on Undo), so once earned it stays; manual toggle still works after.
  useEffect(() => {
    if (!autoRevealed.current && (allTime - baseAllTime.current) >= 5) { autoRevealed.current = true; setShowEverything(true); }
  }, [allTime]);

  const has = (m) => activeModules.includes(m);
  const health = useMemo(() => computeHealth(items, progress.streak, PROFILE.isNew), [items, progress.streak]);
  const ranked = useMemo(() => rankItems(items), [items]);
  const byModule = (mods) => ranked.filter(i => mods.includes(i.module));
  const topFive = ranked.slice(0, 5);   // the "if you've got 5 minutes" focus list
  const tier = tierFor(allTime).tier;
  const recent = activity.slice(0, 5);
  const allClear = items.length === 0;

  const widgetIdForItem = (it) => it.module === 'bankfeed' ? 'reconcile' : it.module === 'expenses' ? 'expenses' : it.module === 'assets' ? 'assets' : 'get_paid';

  const scrollTo = (id, flash) => setTimeout(() => {
    const el = rowRefs.current[id];
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (flash) { setFlashId(id); setTimeout(() => setFlashId(null), 1400); } }
  }, 60);

  // Bell deep-link: reveal the item's widget and scroll+flash its row.
  useEffect(() => {
    if (!focus || !focus.id) return;
    const it = items.find(i => i.id === focus.id);
    if (it) { setHidden(h => ({ ...h, [widgetIdForItem(it)]: false })); scrollTo(focus.id, true); }
  }, [focus && focus.nonce]);

  const complete = (item, message, kind = 'done') => { onComplete(item, message, kind); setOpen(null); setMatchItem(null); };
  // `src` = which zone the row lives in ('top' = the 5-minute focus card, 'grid' = the
  // widget below). The same item can render in both, so we scope the open inline-panel by
  // src (a panel opens in the row you clicked, not both) and only anchor deep-link/jump
  // scrolling to the grid copy.
  const onAction = (item, actionId, src = 'grid') => {
    if (actionId === 'preview') { fireToast('Opening invoice preview (demo)'); return; }
    if (MATCH_ACTIONS.includes(actionId)) { setMatchItem(item); return; }   // → the Match window
    const mode = MODE_FOR[actionId];
    if (mode) {
      setOpen(prev => (prev && prev.id === item.id && prev.mode === mode && prev.src === src) ? null : { id: item.id, mode, src });
      if (src === 'grid') scrollTo(item.id, false);
      return;
    }
    complete(item, directMessage(item, actionId), 'done');
  };
  const confirmMatch = (item) => complete(item, item.amountTone === 'in' ? `Matched ${fmtMoney(item.amount)} to ${item.invoiceNo || 'your books'}` : `Matched ${fmtMoney(item.amount)} — reconciled`, 'match');
  const rejectMatch = (item) => complete(item, "We'll leave this one for you to match", 'skip');

  const makeRenderRow = (src) => (item, i, len) => (
    <ActionRow key={item.id} item={item}
      openMode={open && open.id === item.id && open.src === src ? open.mode : null}
      onAction={(it, actionId) => onAction(it, actionId, src)} onComplete={complete} onClose={() => setOpen(null)}
      innerRef={src === 'grid' ? (el => { rowRefs.current[item.id] = el; }) : undefined}
      flash={flashId === item.id} last={i === len - 1} isMobile={isMobile} showType={src === 'top'} />
  );
  const renderRow = makeRenderRow('grid');       // widget rows (existing behaviour)
  const renderTopRow = makeRenderRow('top');      // the 5-minute focus card

  const toggleWidget = (id) => setHidden(h => ({ ...h, [id]: !h[id] }));

  // Get paid adapts to modules: the Quotes tab + a "New quote" action only when quotes is in use.
  const getPaidTabs = GET_PAID_TABS.filter(t => t.id !== 'quotes' || has('quotes'));
  const getPaidItems = byModule(has('quotes') ? ['sales', 'quotes'] : ['sales']);
  const getPaidW = <Widget key="gp" title="Get paid" icon="dollar" items={getPaidItems} tabs={getPaidTabs}
    addLabel="New" addActions={[{ label: 'New invoice', onClick: () => fireToast('Opening new invoice (demo)') }].concat(has('quotes') ? [{ label: 'New quote', onClick: () => fireToast('Starting a new quote (demo)') }] : [])}
    emptyTitle="Nothing to chase right now." renderRow={renderRow} />;
  const bankfeedW = <Widget key="rc" title="Bank feed" icon="bank" items={byModule(['bankfeed'])}
    addActions={[{ label: 'Import', onClick: () => fireToast('Import bank statement (demo)') }]}
    emptyTitle="Every transaction is matched." renderRow={renderRow} />;
  const expensesW = <Widget key="ex" title="Expenses" icon="receipt" items={byModule(['expenses'])}
    addLabel="Log" addActions={[{ label: 'Log expense', onClick: () => fireToast('Log a new expense (demo)') }]}
    emptyTitle="Expenses are all sorted." renderRow={renderRow} />;
  const assetsW = <Widget key="as" title="Assets" icon="layers" items={byModule(['assets'])}
    addLabel="Log" addActions={[{ label: 'Log asset', onClick: () => fireToast('Log a new asset (demo)') }]}
    emptyTitle="Assets are all recorded." renderRow={renderRow} />;
  const upcomingW = <UpcomingWidget key="up" fireToast={fireToast} isMobile={isMobile} />;
  const keyDatesW = <KeyDatesWidget key="kd" fireToast={fireToast} reg={reg} isMobile={isMobile} />;
  const liabilitiesW = <LiabilitiesWidget key="li" fireToast={fireToast} isMobile={isMobile} />;
  const progressW = <ProgressCard key="pr" progress={progress} allTime={allTime} recent={recent} />;
  // Add-on module cards — surface only when their add-on is switched on (see PlanControl).
  const timeW = <AddonCard key="tm" icon="clock" title="Time tracker" rows={TIME_ENTRIES}
    lead={{ value: TIME_UNBILLED + ' hrs', label: 'unbilled · ready to invoice' }}
    addAction={{ label: 'Start timer', toast: 'Timer started (demo)' }} fireToast={fireToast} isMobile={isMobile} />;
  const projectsW = <AddonCard key="pj" icon="briefcase" title="Projects" rows={PROJECTS} fireToast={fireToast} isMobile={isMobile} />;
  const kmW = <AddonCard key="km" icon="car" title="KM tracker" rows={KM_TRIPS}
    lead={{ value: KM_WEEK + ' km', label: 'logged this week' }}
    addAction={{ label: 'Log trip', toast: 'Log a trip (demo)' }} fireToast={fireToast} isMobile={isMobile} />;
  const inventoryW = <AddonCard key="iv" icon="box" title="Inventory" rows={INVENTORY}
    addAction={{ label: 'Add item', toast: 'Add inventory item (demo)' }} fireToast={fireToast} isMobile={isMobile} />;
  const investmentW = <AddonCard key="in" icon="trendUp" title="Investments" rows={INVESTMENTS} fireToast={fireToast} isMobile={isMobile} />;
  const cryptoW = <CryptoWidget key="cy" />;

  // Plan + add-ons adaptive home: only surface widgets for modules this business's plan unlocks.
  const WIDGETS = [
    { id: 'get_paid', el: getPaidW, show: has('sales') || has('quotes') },
    { id: 'reconcile', el: bankfeedW, show: has('bankfeed') },
    { id: 'expenses', el: expensesW, show: has('expenses') },
    { id: 'progress', el: progressW, show: true },
    { id: 'time', el: timeW, show: has('time') },
    { id: 'assets', el: assetsW, show: has('assets') },
    { id: 'projects', el: projectsW, show: has('projects') },
    { id: 'upcoming', el: upcomingW, show: has('booking') },
    { id: 'km', el: kmW, show: has('km') },
    { id: 'inventory', el: inventoryW, show: has('inventory') },
    { id: 'investment', el: investmentW, show: has('investment') },
    { id: 'liabilities', el: liabilitiesW, show: has('liabilities') },
    { id: 'keydates', el: keyDatesW, show: has('sales') || has('liabilities') },
    { id: 'crypto', el: cryptoW, show: has('crypto') },
  ];
  const available = WIDGETS.filter(w => w.show);
  const bento = available.filter(w => !hidden[w.id]);
  const columns = Array.from({ length: cols }, () => []);
  bento.forEach((w, i) => columns[i % cols].push(w.el));
  const customiseList = available.map(w => ({ id: w.id, label: WIDGET_LABELS[w.id] }));

  // The focus card: a single flat list of your 5 most urgent, ranked (overdue first) —
  // the "if I've only got 5 minutes, what do I do today?" surface. It's capped at 5 so it
  // never overwhelms, but the list REFILLS as you clear (so a backlog of 17 still gets
  // worked through), and a progress bar makes the real total + what's left legible up front
  // (fixes the old tiny "5 of 17"). Same items as the full grid below — clearing here clears
  // everywhere. At the tail (fewer than 5 left) the list naturally counts down to zero.
  const doneToday = progress.today || 0;
  const remaining = items.length;
  const donePct = (doneToday + remaining) > 0 ? Math.round((doneToday / (doneToday + remaining)) * 100) : 0;
  const topFiveCard = (
    <div className="ub-topfive" style={{ background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: 16, boxShadow: T.shadowMd, overflow: 'hidden' }}>
      <div style={{ padding: '15px 16px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 11 }}>
          <span style={{ display: 'inline-flex', marginTop: 1 }}><Icon name="target" size={18} color={T.primary} /></span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 800, color: T.text, letterSpacing: -0.2 }}>If you've got 5 minutes</div>
            <div style={{ fontSize: 12.5, color: T.muted, marginTop: 2 }}>{remaining > 5 ? 'Your 5 most urgent — clear one and the next moves up.' : 'Your most urgent — clear these to lift your health.'}</div>
          </div>
        </div>
        <div style={{ marginTop: 13 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 12.5, color: T.muted }}>{doneToday > 0 && <React.Fragment><b style={{ color: T.greenDark, fontWeight: 700 }}>{doneToday} done</b> today · </React.Fragment>}<b style={{ color: T.text, fontWeight: 700 }}>{remaining}</b> left to action</span>
            {remaining > topFive.length && <span style={{ fontSize: 11.5, color: T.mutedSoft, fontWeight: 500 }}>showing top {topFive.length}</span>}
          </div>
          <div style={{ height: 6, borderRadius: 999, background: T.borderSoft, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: donePct + '%', background: `linear-gradient(90deg, ${T.primary}, ${T.green})`, borderRadius: 999, transition: 'width .45s cubic-bezier(.22,1,.36,1)' }} />
          </div>
        </div>
      </div>
      <div style={{ borderTop: `1px solid ${T.borderSoft}` }}>
        {topFive.map((item, i) => renderTopRow(item, i, topFive.length))}
      </div>
    </div>
  );
  // Header for the revealed grid — with a "Hide" toggle to collapse it back.
  const everythingHeading = (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '2px 2px 12px' }}>
      <span style={{ fontSize: 12, fontWeight: 700, color: T.mutedSoft, textTransform: 'uppercase', letterSpacing: 0.6, whiteSpace: 'nowrap' }}>Everything else</span>
      <div style={{ flex: 1, height: 1, background: T.borderSoft }} />
      <button className="ub-qlink" onClick={() => setShowEverything(false)} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, border: 'none', background: 'none', color: T.muted, fontSize: 12, fontWeight: 500, cursor: 'pointer', padding: 0, whiteSpace: 'nowrap' }}>
        <span style={{ display: 'inline-flex', transform: 'rotate(180deg)' }}><Icon name="chevronDown" size={13} /></span>Hide
      </button>
    </div>
  );
  // Collapsed state: a reveal button that names how many cards are tucked away.
  const revealControl = (
    <div style={{ textAlign: 'center' }}>
      <button onClick={() => setShowEverything(true)} data-hover="row" title="Show everything else"
        style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9, width: '100%', padding: '15px 18px', background: T.card, border: `1px solid ${T.borderSoft}`, borderRadius: 14, boxShadow: T.shadowSm, cursor: 'pointer', color: T.textSoft, fontSize: 13.5, fontWeight: 600 }}>
        <Icon name="chevronDown" size={16} color={T.mutedSoft} />
        Show everything else
        <span style={{ color: T.mutedSoft, fontWeight: 500 }}>· {bento.length} card{bento.length === 1 ? '' : 's'}</span>
      </button>
      <div style={{ fontSize: 11.5, color: T.mutedSoft, marginTop: 8 }}>Opens on its own once you've cleared your top 5.</div>
    </div>
  );

  return (
    <div ref={wrapRef}>
      <Hero health={health} count={items.length} streak={progress.streak} tier={tier} isMobile={isMobile}
        planProps={planProps}
        customizeOpen={customize} onCustomizeToggle={() => setCustomize(v => !v)}
        customizeProps={{ hidden, onToggle: toggleWidget, widgets: customiseList }} />
      {allClear
        ? <Celebration onNew={() => fireToast('Starting a new invoice (demo)')} />
        : <React.Fragment>
            <div style={{ marginBottom: isMobile ? 24 : 28 }}>{topFiveCard}</div>
            {showEverything
              ? <React.Fragment>
                  {everythingHeading}
                  <div className="ub-everything" style={{ display: 'flex', gap: 20, alignItems: 'flex-start' }}>
                    {columns.map((col, ci) => <div key={ci} style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 20 }}>{col}</div>)}
                  </div>
                </React.Fragment>
              : revealControl}
          </React.Fragment>}
      <MatchModal item={matchItem} isMobile={isMobile} onClose={() => setMatchItem(null)} onConfirm={confirmMatch} onReject={rejectMatch} />
    </div>
  );
};
