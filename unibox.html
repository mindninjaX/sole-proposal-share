const ACADEMY_STORE_KEY = 'sole.b2c.academy.v1';   // b2c-scoped: the SPM share sits on the same origin
// Every Academy route, in one place — consumed by the router's SECTIONS whitelist
// and by AppShell's sidebar-highlight derivation.
const ACADEMY_ROUTES = ['academy', 'academy-courses', 'academy-paths', 'academy-progress', 'course'];
const loadAcademy = () => { try { return JSON.parse(localStorage.getItem(ACADEMY_STORE_KEY) || '{}'); } catch (_) { return {}; } };
const saveAcademy = (patch) => { try { localStorage.setItem(ACADEMY_STORE_KEY, JSON.stringify({ ...loadAcademy(), ...patch })); } catch (_) {} };
const academyCompleted = () => loadAcademy().completed || {};
const isLessonComplete = (lessonId) => !!academyCompleted()[lessonId];
const setLessonComplete = (lessonId, done) => { const c = { ...academyCompleted() }; if (done) c[lessonId] = Date.now(); else delete c[lessonId]; saveAcademy({ completed: c }); };
const markLessonComplete = (lessonId) => setLessonComplete(lessonId, true);
const academyLastLesson = () => loadAcademy().lastLesson || {};
const setLastLesson = (courseId, lessonId) => saveAcademy({ lastLesson: { ...academyLastLesson(), [courseId]: lessonId }, lastCourse: courseId });
const courseById = (id) => ACADEMY_COURSES.find(c => c.id === id) || null;
const catColor = (course) => moduleFace(course).color;

// --- production state ---
// A chapter is only watchable once its video is published, so every surface has to
// be honest about what exists today. Nothing here may promise a video that hasn't
// been recorded. Mirrors the SPM Academy in index.html.
const ACADEMY_STATUS = {
  published: { label: 'Available',   pill: 'green'   },
  recording: { label: 'Recording',   pill: 'amber'   },
  planned:   { label: 'Coming soon', pill: 'neutral' },
};
// An unlabelled chapter is never playable — fail safe, not fail open.
const chapterStatus = (lesson) => (lesson && ACADEMY_STATUS[lesson.status]) ? lesson.status : 'planned';
const isPublished = (lesson) => chapterStatus(lesson) === 'published';
const publishedLessons = (course) => (course ? course.lessons : []).filter(isPublished);
const isModuleFullyPublished = (course) => !!course && course.lessons.length > 0 && course.lessons.every(isPublished);
// Optimistic: the module is watchable if ANY chapter is. Drives play-vs-chip.
const moduleStatus = (course) => publishedLessons(course).length ? 'published'
  : (course ? course.lessons : []).some(l => chapterStatus(l) === 'recording') ? 'recording' : 'planned';
// NB counts every NON-published chapter (recording + planned) — i.e. "still to come".
const recordingCount = (course) => (course ? course.lessons : []).filter(l => chapterStatus(l) !== 'published').length;
const courseMins = (course) => (course ? course.lessons : []).reduce((s, l) => s + (l.mins || 0), 0);
const courseDoneCount = (course) => (course ? course.lessons : []).filter(l => isLessonComplete(l.id)).length;
// Progress divides by EVERY chapter (not just published ones) so the bar can never
// read 100% on a half-recorded module. Completion — and therefore the certificate —
// additionally needs the whole module published, so nobody is certified on a module
// that doesn't exist yet.
const courseProgressPct = (course) => { const n = course ? course.lessons.length : 0; return n ? Math.round((courseDoneCount(course) / n) * 100) : 0; };
const isCourseComplete = (course) => !!course && isModuleFullyPublished(course) && courseDoneCount(course) === course.lessons.length;
const resumeLesson = (course) => {
  const ls = course ? course.lessons : []; if (!ls.length) return null;
  const last = academyLastLesson()[course.id];
  if (last && ls.some(l => l.id === last)) return last;
  const pub = publishedLessons(course);
  return (pub.find(l => !isLessonComplete(l.id)) || pub[0] || ls[0]).id;
};
const nextUpCourse = () => {
  // Prefer a module with something to watch — the hero shouldn't open on a poster.
  const watchable = ACADEMY_COURSES.filter(c => publishedLessons(c).length > 0);
  const pool = watchable.length ? watchable : ACADEMY_COURSES;
  const lc = loadAcademy().lastCourse;
  if (lc && courseById(lc) && !isCourseComplete(courseById(lc))) return courseById(lc);
  return pool.find(c => courseDoneCount(c) > 0 && !isCourseComplete(c))
      || pool.find(c => courseDoneCount(c) === 0)
      || pool[0];
};
const certifiedCourses = () => ACADEMY_COURSES.filter(isCourseComplete);
const academyStats = () => {
  const all = ACADEMY_COURSES.flatMap(c => c.lessons);
  const available = all.filter(isPublished);
  const done = all.filter(l => isLessonComplete(l.id));
  return {
    // Denominators are what EXISTS today, so the tiles don't read as a 2/34 failure
    // while the rest is still being filmed; `inProduction` carries the remainder.
    coursesDone: certifiedCourses().length,
    lessonsDone: done.length,
    totalLessons: available.length,
    inProduction: all.length - available.length,
    coursesAvailable: ACADEMY_COURSES.filter(isModuleFullyPublished).length,
    modules: ACADEMY_COURSES.length,
    minutes: done.reduce((s, l) => s + (l.mins || 0), 0),
    certificates: certifiedCourses().length,
  };
};

// The 16:9 video-first surface. Plays a real <video> file or a YouTube/Vimeo
// iframe when available; otherwise a branded gradient poster + play chrome.
const VideoStage = ({ lesson, color = T.primary, catIcon = 'video', playing, onPlay }) => {
  const hasFile = !!lesson.videoUrl;
  const hasEmbed = !!lesson.embedUrl;
  const stage = { position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radiusLg, overflow: 'hidden' };
  if (playing && hasFile) {
    return (
      <div style={{ ...stage, background: '#000' }}>
        <video src={lesson.videoUrl} controls autoPlay preload="metadata"
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
      </div>
    );
  }
  if (playing && hasEmbed) {
    const src = lesson.embedUrl + (lesson.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
    return (
      <div style={{ ...stage, background: '#000' }}>
        <iframe src={src} title={lesson.title} frameBorder="0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />
      </div>
    );
  }
  // An unrecorded chapter states its production state on the poster instead of
  // offering a play button — the old behaviour showed play, then admitted after the
  // click that there was nothing to watch.
  const state = chapterStatus(lesson);
  const pending = state !== 'published';
  const comingSoon = playing && !hasFile && !hasEmbed;
  return (
    <div style={{ ...stage, background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.46)} 100%)`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', background: `radial-gradient(110% 80% at 14% -6%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 50%)` }} />
      <div style={{ position: 'absolute', right: -26, bottom: -32, opacity: 0.13, color: '#fff', transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
        <Icon name={catIcon} size={210} color="#fff" strokeWidth={1.2} />
      </div>
      <div style={{ position: 'absolute', top: 16, left: 18, zIndex: 2, maxWidth: '70%' }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 1.4, textTransform: 'uppercase', color: 'rgba(255,255,255,0.82)' }}>{pending ? (state === 'recording' ? 'In production' : 'Scripted') : 'Video chapter'}</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginTop: 3, color: '#fff', letterSpacing: -0.2 }}>{lesson.title}</div>
      </div>
      <div style={{ position: 'absolute', top: 16, right: 18, zIndex: 2, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '4px 9px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={12} color="#fff" />{lesson.mins} min
      </div>
      {pending ? (
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <Icon name={state === 'recording' ? 'video' : 'clock'} size={30} color="#fff" />
          <div style={{ fontSize: 14.5, fontWeight: 700, marginTop: 8 }}>{state === 'recording' ? 'Being recorded now' : 'Coming soon'}</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 380, lineHeight: 1.5 }}>
            {state === 'recording'
              ? 'The video lands shortly. What it covers is written up below.'
              : 'This chapter is scripted and queued for filming. What it covers is written up below.'}
          </div>
        </div>
      ) : comingSoon ? (
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <div style={{ fontSize: 14.5, fontWeight: 700 }}>This clip couldn't load</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 380, lineHeight: 1.5 }}>Check your connection and try again — the notes, transcript and resources below are all still here.</div>
        </div>
      ) : (
        <button onClick={onPlay} aria-label="Play chapter" style={{
          position: 'relative', zIndex: 2, width: 82, height: 82, borderRadius: '50%', border: 'none', cursor: 'pointer',
          background: withAlpha('#FFFFFF', 0.97), color, display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 16px 40px rgba(0,0,0,0.30), 0 4px 12px rgba(0,0,0,0.12)', transition: 'transform .14s' }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.07)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 4 }}><polygon points="6,4 20,12 6,20" /></svg>
        </button>
      )}
      {/* No fake scrubber on a chapter that has no video — it implies a clip is loaded. */}
      {!pending && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 2, display: 'flex', alignItems: 'center', gap: 11, padding: '11px 15px', background: 'linear-gradient(180deg, transparent, rgba(0,0,0,0.38))' }}>
          <Icon name="play" size={15} color="#fff" />
          <div style={{ flex: 1, height: 4, borderRadius: 999, background: 'rgba(255,255,255,0.3)', overflow: 'hidden' }}>
            <div style={{ width: '0%', height: '100%', background: '#fff' }} />
          </div>
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.9)', fontVariantNumeric: 'tabular-nums' }}>0:00 / {lesson.mins}:00</span>
          <Icon name="video" size={15} color="rgba(255,255,255,0.9)" />
        </div>
      )}
    </div>
  );
};

// Shared course thumbnail — the module's signature motif. A category-hued
// gradient carries an oversized, cropped category-icon watermark (so each
// course is identifiable by module at a glance, not just another play tile),
// a frosted duration chip, a completed badge, a centred play button (grows on
// card hover via .academy-play), and a YouTube-style progress bar welded to
// the bottom edge for in-progress courses. Reused by CourseCard + the Home hero.
const AcademyThumb = ({ course, height, radius = T.radiusLg, playSize = 54, watermark = 132 }) => {
  const face = moduleFace(course);
  const color = catColor(course);
  const pct = courseProgressPct(course);
  const done = isCourseComplete(course);
  const started = courseDoneCount(course) > 0;
  // A module with nothing recorded shows its production state instead of a play
  // button — nobody should click play and get nothing.
  const mStatus = moduleStatus(course);
  const watchable = mStatus === 'published';
  return (
    <div style={{ position: 'relative', width: '100%', ...(height ? { height } : { aspectRatio: '16 / 9' }), borderRadius: radius, overflow: 'hidden',
      background: `linear-gradient(142deg, ${hexMix(color, '#FFFFFF', 0.10)} 0%, ${darkenHex(color, 0.24)} 100%)` }}>
      <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(120% 84% at 12% -8%, ${withAlpha('#FFFFFF', 0.16)} 0%, transparent 56%)` }} />
      <div style={{ position: 'absolute', right: -14, bottom: -18, opacity: 0.13, color: '#fff', transform: 'rotate(-6deg)', pointerEvents: 'none' }}>
        <Icon name={face.icon} size={watermark} color="#fff" strokeWidth={1.2} />
      </div>
      <div style={{ position: 'absolute', top: 12, right: 12, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={11} color="#fff" />{courseMins(course)} min
      </div>
      {done && <div style={{ position: 'absolute', top: 12, left: 12, display: 'inline-flex', alignItems: 'center', gap: 4, background: T.green, color: '#fff', fontSize: 10.5, fontWeight: 700, padding: '3px 8px', borderRadius: 999, boxShadow: '0 2px 8px rgba(5,150,105,0.4)' }}><Icon name="check" size={11} color="#fff" />Done</div>}
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {watchable ? (
          <div className="academy-play" style={{ width: playSize, height: playSize, borderRadius: '50%', background: withAlpha('#FFFFFF', 0.97), color, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 28px rgba(0,0,0,0.30)' }}>
            <svg width={Math.round(playSize * 0.33)} height={Math.round(playSize * 0.33)} viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: 2 }}><polygon points="6,4 20,12 6,20" /></svg>
          </div>
        ) : (
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: withAlpha('#0F1117', 0.42), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '6px 12px', borderRadius: 999, backdropFilter: 'blur(4px)', WebkitBackdropFilter: 'blur(4px)' }}>
            <Icon name={mStatus === 'recording' ? 'video' : 'clock'} size={13} color="#fff" />
            {mStatus === 'recording' ? 'Being recorded' : 'Coming soon'}
          </div>
        )}
      </div>
      {started && !done && (
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 4, background: withAlpha('#0F1117', 0.28) }}>
          <div style={{ width: `${pct}%`, height: '100%', background: '#fff' }} />
        </div>
      )}
    </div>
  );
};

// Catalog grid card — thumbnail + a quiet, scannable body (category · level,
// title, summary, and a status line that flips between progress and "Not started").
const CourseCard = ({ course, onOpen }) => {
  const face = moduleFace(course);
  const pct = courseProgressPct(course);
  const done = isCourseComplete(course);
  const started = courseDoneCount(course) > 0;
  const color = catColor(course);
  const mStatus = moduleStatus(course);
  const avail = publishedLessons(course).length;
  const pending = recordingCount(course);
  return (
    <div onClick={onOpen} role="button" tabIndex={0} data-academy-card
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onOpen(); } }}
      style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, overflow: 'hidden', cursor: 'pointer', display: 'flex', flexDirection: 'column', boxShadow: T.shadowSm, transition: 'border-color .14s, box-shadow .14s, transform .14s' }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = T.borderStrong; e.currentTarget.style.boxShadow = '0 10px 26px rgba(15,17,23,0.10)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.boxShadow = T.shadowSm; e.currentTarget.style.transform = 'none'; }}>
      <AcademyThumb course={course} radius={0} />
      <div style={{ padding: 15, display: 'flex', flexDirection: 'column', gap: 9, flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 10.5, fontWeight: 600, color: color }}><Icon name={face.icon} size={12} color={color} />{face.trackLabel}</span>
          <span style={{ width: 3, height: 3, borderRadius: 999, background: T.mutedSoft }} />
          <span style={{ fontSize: 10.5, color: T.muted }}>{course.level}</span>
        </div>
        <div style={{ fontSize: 14.5, fontWeight: 700, color: T.text, lineHeight: 1.3, letterSpacing: -0.2 }}>{course.title}</div>
        <Helper style={{ fontSize: 11.5, lineHeight: 1.5, flex: 1 }}>{course.summary}</Helper>
        {started ? (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, fontWeight: 500, color: done ? T.greenDark : T.muted, marginBottom: 5 }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>{done ? <Icon name="checkCircle" size={12} color={T.greenDark} /> : <Icon name="play" size={11} color={T.muted} />}{done ? 'Completed' : `${courseDoneCount(course)} of ${course.lessons.length} chapters`}</span><span>{pct}%</span>
            </div>
            <ProgressBar pct={pct} color={done ? T.green : color} height={5} />
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 11, color: T.muted }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{course.lessons.length} chapters</span>
            {mStatus === 'published'
              ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontWeight: 600, color }}>{pending ? `${avail} ready` : 'Start'}<Icon name="arrow" size={12} color={color} /></span>
              : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontWeight: 600, color: mStatus === 'recording' ? T.amber : T.mutedSoft }}>
                  <Icon name={mStatus === 'recording' ? 'video' : 'clock'} size={12} color={mStatus === 'recording' ? T.amber : T.mutedSoft} />
                  {mStatus === 'recording' ? 'Recording' : 'Coming soon'}
                </span>}
          </div>
        )}
      </div>
    </div>
  );
};

// Which paths contain a given course (used by the player's "Part of" card).
const pathsForCourse = (courseId) => LEARNING_PATHS.filter(p => p.courseIds.includes(courseId));

// A path can hold any number of courses, so the card must NOT render the full
// list (it wouldn't scale and rows would be uneven). Instead: a fixed-height
// summary — a segmented tracker (one segment per course, so it scales to any
// count) + a single "up next / start with" course callout + counts. The full
// ordered sequence lives in the player ("Part of these paths") / on open.
const LearningPathCard = ({ path, onOpen }) => {
  const courses = path.courseIds.map(courseById).filter(Boolean);
  const allLessons = courses.flatMap(c => c.lessons);
  const doneN = allLessons.filter(l => isLessonComplete(l.id)).length;
  const pct = allLessons.length ? Math.round((doneN / allLessons.length) * 100) : 0;
  const doneCourses = courses.filter(isCourseComplete).length;
  const started = doneN > 0;
  const complete = pct === 100;
  const totalMins = courses.reduce((s, c) => s + courseMins(c), 0);
  const currentIdx = courses.findIndex(c => !isCourseComplete(c)); // first unfinished; -1 if all done
  const nextCourse = currentIdx >= 0 ? courses[currentIdx] : null;
  return (
    <div data-academy-card onClick={onOpen} role="button" tabIndex={0}
      onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onOpen(); } }}
      style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, overflow: 'hidden', cursor: 'pointer', boxShadow: T.shadowSm, display: 'flex', flexDirection: 'column', transition: 'border-color .14s, box-shadow .14s, transform .14s' }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = T.borderStrong; e.currentTarget.style.boxShadow = '0 10px 26px rgba(15,17,23,0.10)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.boxShadow = T.shadowSm; e.currentTarget.style.transform = 'none'; }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '16px 18px 0' }}>
        <IconChip icon="graduation" tone="accent" size={38} gradient />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: T.text, letterSpacing: -0.2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{path.title}</div>
          <div style={{ fontSize: 11.5, color: T.muted, marginTop: 2, display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="target" size={12} color={T.mutedSoft} />{path.forRole}</div>
        </div>
        {complete ? <Pill color="green" style={{ fontSize: 9.5 }}>Complete</Pill> : started ? <Pill color="accent" style={{ fontSize: 9.5 }}>{pct}%</Pill> : null}
      </div>
      <div style={{ padding: '12px 18px 14px', display: 'flex', flexDirection: 'column', gap: 14, flex: 1 }}>
        <Helper style={{ fontSize: 12, lineHeight: 1.5, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{path.blurb}</Helper>
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: T.textSoft }}>Module path</span>
            <span style={{ fontSize: 10.5, color: T.muted }}>{doneCourses} of {courses.length} done</span>
          </div>
          <div style={{ display: 'flex', gap: 4 }}>
            {courses.map((c, i) => { const cDone = isCourseComplete(c); const cCur = i === currentIdx; return (
              <div key={c.id} title={c.title} style={{ flex: 1, height: 6, borderRadius: 999, background: cDone ? T.green : cCur ? T.primary : T.border }} />
            ); })}
          </div>
        </div>
        {complete ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, fontWeight: 600, color: T.greenDark }}><Icon name="checkCircle" size={15} color={T.green} />All {courses.length} modules complete</div>
        ) : nextCourse ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 11px', borderRadius: 10, background: T.fieldBg, border: `1px solid ${T.borderSoft}` }}>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: T.card, border: `1px solid ${T.border}`, color: catColor(nextCourse), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name={moduleFace(nextCourse).icon} size={15} color={catColor(nextCourse)} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 9.5, color: T.muted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 }}>{started ? 'Up next' : 'Start with'}</div>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nextCourse.title}</div>
            </div>
            <span style={{ fontSize: 10.5, color: T.muted, flexShrink: 0 }}>{nextCourse.lessons.length} chapters</span>
          </div>
        ) : null}
      </div>
      <div style={{ padding: '13px 18px', borderTop: `1px solid ${T.borderSoft}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
        <Btn variant={complete ? 'soft' : 'primary'} size="sm" icon={complete ? 'checkCircle' : 'play'}>{complete ? 'Review path' : started ? 'Continue' : 'Start path'}</Btn>
        <span style={{ fontSize: 11, color: T.muted, display: 'inline-flex', alignItems: 'center', gap: 12 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{courses.length} modules</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="clock" size={12} color={T.mutedSoft} />{totalMins} min</span>
        </span>
      </div>
    </div>
  );
};

// One chapter in the player's playlist. An unrecorded chapter reads muted with a
// production dot instead of a play glyph, so the list tells you at a glance what
// you can actually watch today. Clicking one still works — you land on an honest
// poster, not a dead end.
const LessonRow = ({ lesson, index, active, complete, onClick }) => {
  const st = chapterStatus(lesson);
  const pub = st === 'published';
  return (
  <button onClick={onClick} data-hover="row" style={{
    width: '100%', display: 'flex', alignItems: 'flex-start', gap: 10, padding: '9px 10px', border: 'none', textAlign: 'left',
    borderRadius: 8, background: active ? T.primarySoft : 'transparent', cursor: 'pointer' }}>
    <span style={{ width: 22, height: 22, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      background: complete ? T.green : active ? T.primary : T.fieldBg, color: (complete || active) ? '#fff' : T.muted,
      border: (complete || active) ? 'none' : `1px solid ${T.border}`, fontSize: 11, fontWeight: 700 }}>
      {/* The play glyph is reserved for chapters you can actually play — an
          active-but-unrecorded chapter keeps its number so the marker doesn't
          imply a video is sitting there. */}
      {complete ? <Icon name="check" size={12} color="#fff" /> : (active && pub) ? <Icon name="play" size={11} color="#fff" /> : index + 1}
    </span>
    {/* Wrap to two lines rather than ellipsing — chapter titles are the playlist's
        whole content, and "Deposits, terms and getting paid on the…" helps nobody. */}
    <span style={{ flex: 1, minWidth: 0, fontSize: 12.5, lineHeight: 1.35, fontWeight: active ? 600 : 500, color: active ? T.primary : pub ? T.text : T.muted,
      display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{lesson.title}</span>
    {!pub && <span title={st === 'recording' ? 'Being recorded' : 'Coming soon'} style={{ flexShrink: 0, width: 6, height: 6, borderRadius: 999, marginTop: 7, background: st === 'recording' ? T.amber : T.borderStrong }} />}
    <span style={{ fontSize: 11, color: T.muted, flexShrink: 0, marginTop: 1 }}>{lesson.mins}m</span>
  </button>
  );
};

const CertificateModal = ({ course, open, onClose, fireToast, isMobile }) => {
  if (!course) return null;
  const color = catColor(course);
  return (
    <Modal open={open} onClose={onClose} icon="award" title="Module completed" subtitle="Nice work — you've finished every chapter." maxWidth={540} isMobile={isMobile}>
      <div style={{ border: `1px solid ${T.border}`, borderRadius: 14, overflow: 'hidden' }}>
        <div style={{ background: `linear-gradient(135deg, ${color} 0%, ${darkenHex(color, 0.34)} 100%)`, padding: '28px 24px', textAlign: 'center', color: '#fff', position: 'relative' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1px)', backgroundSize: '16px 16px' }} />
          <div style={{ position: 'relative' }}>
            <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'rgba(255,255,255,0.95)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 12 }}><Icon name="award" size={28} color={color} /></div>
            <div style={{ fontSize: 11, letterSpacing: 2, textTransform: 'uppercase', opacity: 0.85, fontWeight: 700 }}>Certificate of completion</div>
            <div style={{ fontSize: 20, fontWeight: 800, marginTop: 6, letterSpacing: -0.3 }}>{course.title}</div>
          </div>
        </div>
        <div style={{ padding: '20px 24px', textAlign: 'center' }}>
          <Helper style={{ fontSize: 12 }}>Earned by</Helper>
          <div style={{ fontSize: 18, fontWeight: 700, color: T.text, marginTop: 2 }}>{ACADEMY_LEARNER}</div>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 22, marginTop: 14, fontSize: 11.5, color: T.muted }}>
            <div><div style={{ fontWeight: 700, color: T.text }}>{course.lessons.length}</div>lessons</div>
            <div><div style={{ fontWeight: 700, color: T.text }}>{courseMins(course)} min</div>of learning</div>
            <div><div style={{ fontWeight: 700, color: T.text }}>{fmtDate(new Date())}</div>completed</div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginTop: 18, flexWrap: 'wrap' }}>
            <Btn variant="primary" icon="download" onClick={() => fireToast('Certificate downloaded (demo)')}>Download</Btn>
            <Btn variant="ghost" icon="share" onClick={() => fireToast('Share link copied (demo)')}>Share</Btn>
            <Btn variant="ghost" onClick={onClose}>Close</Btn>
          </div>
          <div style={{ marginTop: 16, fontSize: 11, color: T.mutedSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
            <SoleLogo size={13} /> Academy
          </div>
        </div>
      </div>
    </Modal>
  );
};

// --- Sole Academy catalog views ---
// One rounded strip of hairline-separated cells rather than four floating boxes —
// the same shape as Unibox's health/streak strip, so the two surfaces read as one app.
const AcademyStats = ({ stats, isMobile }) => {
  // Denominators count what's recorded today; the sub-line carries the rest, so the
  // tiles don't read as a failure while the videos are still being filmed.
  const cells = [
    { icon: 'bookOpen',   tone: 'accent', label: 'Chapters watched', value: `${stats.lessonsDone}/${stats.totalLessons}`,
      sub: stats.inProduction ? `${stats.inProduction} more in production` : null },
    { icon: 'graduation', tone: 'blue',   label: 'Modules complete', value: `${stats.coursesDone}/${stats.modules}`,
      sub: `${stats.coursesAvailable} fully recorded so far` },
    { icon: 'clock',      tone: 'amber',  label: 'Minutes learned', value: stats.minutes, sub: null },
    { icon: 'award',      tone: 'green',  label: 'Certificates',    value: stats.certificates, sub: null },
  ];
  return (
    <Card padded={false} style={{ display: 'flex', flexWrap: 'wrap' }}>
      {cells.map((c, i) => (
        <div key={c.label} style={{ flex: '1 1 160px', minWidth: 0, display: 'flex', alignItems: 'center', gap: 11, padding: isMobile ? '13px 16px' : '15px 18px',
          borderLeft: i && !isMobile ? `1px solid ${T.borderSoft}` : 'none', borderTop: i && isMobile ? `1px solid ${T.borderSoft}` : 'none' }}>
          <IconChip icon={c.icon} tone={c.tone} size={32} gradient />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: T.text, letterSpacing: -0.4, lineHeight: 1.15 }}>{c.value}</div>
            <div style={{ fontSize: 11.5, color: T.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.label}</div>
            {c.sub && <div style={{ fontSize: 10.5, color: T.mutedSoft, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.sub}</div>}
          </div>
        </div>
      ))}
    </Card>
  );
};

const AcademyHome = ({ openCourse, openPath, goView }) => {
  const { isTablet } = useViewport();
  const stats = academyStats();
  const resume = nextUpCourse();
  const resumePct = resume ? courseProgressPct(resume) : 0;
  const resumeStarted = resume ? courseDoneCount(resume) > 0 : false;
  // resumeLesson() returns a lesson ID, not the lesson — resolve it to quote the
  // next lesson's length rather than the whole course's.
  const resumeNext = resume ? resume.lessons.find(l => l.id === resumeLesson(resume)) : null;
  const recommendedPath = LEARNING_PATHS[0];
  const popular = ACADEMY_POPULAR.map(courseById).filter(Boolean);
  const color = resume ? catColor(resume) : T.primary;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      {resume && (
        <div style={{ display: 'grid', gridTemplateColumns: isTablet ? '1fr' : 'minmax(0,1.35fr) minmax(0,1fr)', border: `1px solid ${T.border}`, borderRadius: T.radiusLg, overflow: 'hidden', background: T.card, boxShadow: T.shadowSm }}>
          <div style={{ padding: isTablet ? '24px 24px 8px' : '28px 30px', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 11 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11, fontWeight: 700, letterSpacing: 0.4, textTransform: 'uppercase', color: T.primary }}>
              <span style={{ width: 6, height: 6, borderRadius: 999, background: T.primary }} />{"If you've got 5 minutes"}
            </div>
            <div style={{ fontSize: 23, fontWeight: 800, letterSpacing: -0.5, lineHeight: 1.12 }}>{resume.title}</div>
            <Helper style={{ fontSize: 13, lineHeight: 1.55, maxWidth: 460 }}>{resume.summary}</Helper>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 11.5, color: T.muted, flexWrap: 'wrap' }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={13} color={T.mutedSoft} />{resume.lessons.length} chapters</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="clock" size={13} color={T.mutedSoft} />{resumeNext ? `Next: ${resumeNext.mins} min` : `${courseMins(resume)} min`}</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name={moduleFace(resume).icon} size={13} color={T.mutedSoft} />{moduleFace(resume).trackLabel}</span>
            </div>
            {resumeStarted && (
              <div style={{ maxWidth: 320 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: T.muted, marginBottom: 5 }}><span>{courseDoneCount(resume)} of {resume.lessons.length} done</span><span>{resumePct}%</span></div>
                <ProgressBar pct={resumePct} color={color} height={6} />
              </div>
            )}
            <div style={{ marginTop: 4 }}><Btn variant="primary" size="lg" icon="play" onClick={() => openCourse(resume)}>{resumeStarted ? 'Resume module' : 'Start module'}</Btn></div>
          </div>
          <div data-academy-card onClick={() => openCourse(resume)} style={{ cursor: 'pointer', padding: isTablet ? '0 24px 24px' : 20, display: 'flex', alignItems: 'center' }}>
            <AcademyThumb course={resume} playSize={64} watermark={156} />
          </div>
        </div>
      )}
      <AcademyStats stats={stats} isMobile={isTablet} />
      {recommendedPath && (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <SectionTitle>Where to start</SectionTitle>
            <button onClick={() => goView('paths')} style={{ border: 'none', background: 'transparent', color: T.primary, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>All paths →</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: isTablet ? '1fr' : '1fr 1fr', gap: 14, alignItems: 'start' }}>
            {LEARNING_PATHS.slice(0, 2).map(p => <LearningPathCard key={p.id} path={p} onOpen={() => openPath(p)} />)}
          </div>
        </div>
      )}
      <div>

};

// Full course view — video-first player + lesson playlist + progress + cert.
const CoursePlayerPage = ({ courseId, fireToast }) => {
  const course = courseById(courseId);
  const { isMobile, isTablet } = useViewport();
  const [, tick] = useState(0);
  const refresh = () => tick(t => t + 1);
  const [activeId, setActiveId] = useState(() => (course ? resumeLesson(course) : null));
  const [playing, setPlaying] = useState(false);
  const [tab, setTab] = useState('overview');
  const [certFor, setCertFor] = useState(null);
  useEffect(() => { if (course && activeId) setLastLesson(course.id, activeId); setPlaying(false); setTab('overview'); }, [activeId]);
  if (!course) {
    return (
      <div style={{ minWidth: 0 }}>
        <Btn variant="ghost" size="sm" icon="chevronLeft" onClick={() => { window.location.hash = '#/academy-courses'; }}>Back to modules</Btn>
        <Card style={{ marginTop: 16 }}><EmptyState icon="search" title="Module not found" hint="This module may have moved." action={<Btn variant="primary" size="sm" icon="bookOpen" onClick={() => { window.location.hash = '#/academy-courses'; }}>Browse modules</Btn>} /></Card>
      </div>
    );
  }
  const lessons = course.lessons;
  const idx = Math.max(0, lessons.findIndex(l => l.id === activeId));
  const lesson = lessons[idx];
  const color = catColor(course);
  const pct = courseProgressPct(course);
  const done = courseDoneCount(course);
  const complete = isLessonComplete(lesson.id);
  const isLast = idx === lessons.length - 1;
  const lessonPub = isPublished(lesson);
  const lessonState = chapterStatus(lesson);

  const completeAndNext = () => {
    const wasComplete = isCourseComplete(course);
    markLessonComplete(lesson.id);
    if (!isLast) setActiveId(lessons[idx + 1].id); else refresh();
    if (!wasComplete && isCourseComplete(course)) { setCertFor(course); fireToast('🎓 Module complete — certificate earned!'); }
    else fireToast('Chapter marked complete');
  };
  const toggleComplete = () => { setLessonComplete(lesson.id, !complete); refresh(); };

  const nextLesson = !isLast ? lessons[idx + 1] : null;
  const inPaths = pathsForCourse(course.id);
  const aboutRows = [
    ['bookOpen', 'Chapters', `${lessons.length}`],
    ['clock', 'Duration', `${courseMins(course)} min`],
    [moduleFace(course).icon, 'Track', moduleFace(course).trackLabel],
    ['menu', 'Menu group', course.menuGroup],
    ['target', 'Level', course.level],
  ];

  const playlist = (
    <Card padded={false} style={{ overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${T.borderSoft}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700 }}>Chapters</span>
          <span style={{ fontSize: 11, color: T.muted }}>{done}/{lessons.length} · {pct}%</span>
        </div>
        {recordingCount(course) > 0 && <Helper style={{ fontSize: 11, marginBottom: 8 }}>{publishedLessons(course).length} ready to watch · {recordingCount(course)} still in production</Helper>}
        <ProgressBar pct={pct} color={pct === 100 ? T.green : color} height={6} />
      </div>
      <div style={{ padding: 6, maxHeight: isTablet ? 'none' : 520, overflowY: 'auto' }}>
        {lessons.map((l, i) => <LessonRow key={l.id} lesson={l} index={i} active={l.id === lesson.id} complete={isLessonComplete(l.id)} onClick={() => setActiveId(l.id)} />)}
      </div>
    </Card>
  );

  const aboutCard = (
    <Card padded={false} style={{ overflow: 'hidden' }}>
      <div style={{ padding: '13px 16px', borderBottom: `1px solid ${T.borderSoft}`, fontSize: 13, fontWeight: 700 }}>About this module</div>
      <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 11 }}>
        {aboutRows.map(([ic, label, val], i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, color: T.muted }}><Icon name={ic} size={13} color={T.mutedSoft} />{label}</span>
            <span style={{ fontWeight: 600, color: T.text }}>{val}</span>
          </div>
        ))}
        {inPaths.length > 0 && (
          <div style={{ borderTop: `1px solid ${T.borderSoft}`, paddingTop: 11, marginTop: 1 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 7 }}>Part of these paths</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {inPaths.map(p => <button key={p.id} onClick={() => { window.location.hash = '#/academy-paths'; }} style={{ border: `1px solid ${T.border}`, background: T.card, borderRadius: 999, padding: '4px 10px', fontSize: 10.5, fontWeight: 600, color: T.textSoft, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="graduation" size={11} color={T.primary} />{p.title}</button>)}
            </div>
          </div>
        )}
      </div>
    </Card>
  );

  return (
    <div style={{ minWidth: 0 }}>
      <Btn variant="ghost" size="sm" icon="chevronLeft" onClick={() => { window.location.hash = '#/academy-courses'; }}>Back to modules</Btn>
      <div style={{ marginTop: 12, marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600, color }}><Icon name={moduleFace(course).icon} size={13} color={color} />{moduleFace(course).trackLabel}</span>
          <span style={{ width: 3, height: 3, borderRadius: 999, background: T.mutedSoft }} />
          <span style={{ fontSize: 11, color: T.muted }}>{course.level}</span>
          {isCourseComplete(course) && <Pill color="green" style={{ fontSize: 9.5, marginLeft: 2 }}>Completed</Pill>}
        </div>
        <div style={{ fontSize: 23, fontWeight: 800, letterSpacing: -0.4, marginTop: 7 }}>{course.title}</div>
        <Helper style={{ marginTop: 3, fontSize: 13, maxWidth: 640 }}>{course.summary}</Helper>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: isTablet ? '1fr' : 'minmax(0,1fr) 340px', gap: 22, alignItems: 'start' }}>
        <div style={{ minWidth: 0 }}>
          <VideoStage lesson={lesson} color={color} catIcon={moduleFace(course).icon} playing={playing} onPlay={() => setPlaying(true)} />
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, marginTop: 16, flexWrap: 'wrap' }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 11, color: T.muted, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                <span>Chapter {idx + 1} of {lessons.length} · {lesson.mins} min</span>
                {!lessonPub && <Pill color={lessonState === 'recording' ? 'amber' : 'neutral'} style={{ fontSize: 9.5 }}>{ACADEMY_STATUS[lessonState].label}</Pill>}
              </div>
              <div style={{ fontSize: 18, fontWeight: 700, marginTop: 2, letterSpacing: -0.2 }}>{lesson.title}</div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {/* Distinct keys force a remount (not an in-place restyle) so the Btn
                  atom's base `border` shorthand and the primary variant's `borderColor`
                  never transition on the same node — avoids React's shorthand warning.
                  An unrecorded chapter gets NO complete action at all — you can't
                  finish a video that doesn't exist yet. */}
              {!lessonPub ? null : complete
                ? <Btn key="lesson-done" variant="soft" size="sm" icon="check" onClick={toggleComplete}>Completed</Btn>
                : <Btn key="lesson-todo" variant="primary" size="sm" icon="check" iconRight={!isLast ? 'arrow' : undefined} onClick={completeAndNext}>{isLast ? 'Mark complete' : 'Complete & next'}</Btn>}
              {!isLast && <Btn variant="ghost" size="sm" iconRight="arrow" onClick={() => setActiveId(nextLesson.id)}>Next</Btn>}
            </div>
          </div>
          <Tabs tabs={[{ id: 'overview', label: 'Overview' }, { id: 'transcript', label: 'Transcript' }, { id: 'resources', label: 'Resources', count: (lesson.resources || []).length || undefined }]} value={tab} onChange={setTab} style={{ marginTop: 16 }} />
          {tab === 'overview' && (
            <Card>
              {/* Say plainly what state this chapter is in, rather than leaving the
                  learner to work out why there's no video. */}
              {!lessonPub && (
                <Banner tone={lessonState === 'recording' ? 'warn' : 'info'} icon={lessonState === 'recording' ? 'video' : 'clock'}
                  title={lessonState === 'recording' ? 'This chapter is being recorded' : 'This chapter is scripted, not yet filmed'}
                  style={{ marginBottom: 14 }}>
                  {lessonState === 'recording'
                    ? "The video lands shortly. In the meantime, here's what it covers — and you can go and click through the real screen in Sole now."
                    : "Here's what it will cover. It'll appear here as soon as it's recorded."}
                </Banner>
              )}
              <div style={{ fontSize: 13.5, color: T.textSoft, lineHeight: 1.65 }}>{lesson.description}</div>
              {lesson.takeaways && (
                <div style={{ marginTop: 16 }}>
                  <SectionTitle>What you'll learn</SectionTitle>
                  <div style={{ marginTop: 9, display: 'flex', flexDirection: 'column', gap: 9 }}>{lesson.takeaways.map((t, i) => <div key={i} style={{ display: 'flex', gap: 9, fontSize: 12.5, color: T.textSoft, lineHeight: 1.4 }}><Icon name="checkCircle" size={16} color={T.green} /><span>{t}</span></div>)}</div>
                </div>
              )}
              {nextLesson && (
                <div onClick={() => setActiveId(nextLesson.id)} data-hover="row" style={{ marginTop: 18, display: 'flex', alignItems: 'center', gap: 12, padding: '11px 12px', border: `1px solid ${T.border}`, borderRadius: 10, cursor: 'pointer' }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: T.primarySoft, color: T.primary, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="play" size={15} color={T.primary} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 10, color: T.muted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 }}>Up next</div><div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nextLesson.title}</div></div>
                  <Icon name="arrow" size={15} color={T.muted} />
                </div>
              )}
            </Card>
          )}
          {tab === 'transcript' && <Card><div style={{ fontSize: 12.5, color: T.muted, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{lesson.transcript || 'A full transcript will be available once the video for this chapter is published.'}</div></Card>}
          {tab === 'resources' && (
            <Card>
              {(lesson.resources || []).length
                ? <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{lesson.resources.map((r, i) => <a key={i} href={r.href || '#'} onClick={e => { if (!r.href || r.href === '#') { e.preventDefault(); fireToast('Opening resource (demo)'); } }} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', border: `1px solid ${T.border}`, borderRadius: 10, textDecoration: 'none', color: T.text, fontSize: 12.5, fontWeight: 500 }}><Icon name="fileText" size={15} color={T.primary} /><span style={{ flex: 1 }}>{r.label}</span><Icon name="arrow" size={13} color={T.muted} /></a>)}</div>
                : <EmptyState icon="paperclip" title="No resources for this chapter" hint="Downloadable templates and checklists will appear here." />}
            </Card>
          )}
        </div>
        <div style={{ minWidth: 0, display: 'flex', flexDirection: 'column', gap: 16 }}>
          {playlist}
          {isCourseComplete(course) && (
            <Card style={{ display: 'flex', alignItems: 'center', gap: 12, background: withAlpha(T.green, 0.07), borderColor: withAlpha(T.green, 0.35) }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: T.green, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="award" size={19} color="#fff" /></div>
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 12.5, fontWeight: 700 }}>Module complete</div><Helper style={{ fontSize: 11 }}>Your certificate is ready.</Helper></div>
              <Btn variant="soft" size="sm" onClick={() => setCertFor(course)}>View</Btn>
            </Card>
          )}
          {aboutCard}
        </div>
      </div>
      <CertificateModal course={certFor} open={!!certFor} onClose={() => setCertFor(null)} fireToast={fireToast} isMobile={isMobile} />
    </div>
  );
};

    { id: 'growth', label: 'Growth & Marketing', icon: 'rocket' },
    { id: 'legal', label: 'Legal Help', icon: 'shield' },
    { id: 'refer', label: 'Refer & Earn $50', icon: 'handshake', accent: 'red' },
    { id: 'community', label: 'Sole Community', icon: 'smile' },
    { id: 'perks', label: 'Sole Perks', icon: 'star' },
    { id: 'tax', label: 'Tax Estimator', icon: 'percent' } ],
  [ { id: 'settings', label: 'Settings', icon: 'sliders' },
    { id: 'support', label: 'Support', icon: 'messageSquare' } ],
];

// `active` is a section id, not a hash — AppShell derives it so sub-routes (e.g. the
// Academy course player) can keep their parent nav item lit.
const Sidebar = ({ active, count, onNav, onStub, isMobile, mobileOpen, onClose }) => {
  const railStyle = isMobile
    ? { position: 'fixed', top: 0, left: 0, zIndex: 60, transform: mobileOpen ? 'translateX(0)' : 'translateX(-100%)', transition: 'transform 0.24s cubic-bezier(0.32,0.72,0,1)', boxShadow: mobileOpen ? '4px 0 28px rgba(15,17,23,0.20)' : 'none' }
    : {};
  const click = (item) => { if (item.route) onNav(item.route); else onStub(item.label); if (isMobile) onClose(); };
  return (
    <React.Fragment>
      {isMobile && mobileOpen && <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(15,17,23,0.42)', zIndex: 59, animation: 'fadein 0.16s ease' }} />}
      <div style={{ width: 232, flexShrink: 0, height: '100vh', background: T.card, borderRight: `1px solid ${T.border}`, display: 'flex', flexDirection: 'column', ...railStyle }}>
        <div style={{ padding: '18px 20px 12px', display: 'flex', alignItems: 'center' }}>
          <SoleLogo size={24} />
          <div style={{ flex: 1 }} />
          {isMobile && <button onClick={onClose} title="Close menu" style={{ border: 'none', background: 'none', color: T.muted, cursor: 'pointer', padding: 4, display: 'inline-flex' }}><Icon name="close" size={20} /></button>}
        </div>
        <div className="scroll-area" style={{ flex: 1, padding: '4px 12px', overflowY: 'auto' }}>
          {NAV.map((section, si) => (
            <div key={si} style={{ paddingBottom: 8, marginBottom: 8, borderBottom: si < NAV.length - 1 ? `1px solid ${T.borderSoft}` : 'none' }}>
              {section.map(item => {
                const isActive = item.route && active === item.route.replace('#/', '');
                return (
                  <div key={item.id} data-nav-id={item.id} data-nav-active={isActive ? 'true' : 'false'} data-hover={isActive ? undefined : 'nav'}
                    onClick={() => click(item)}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 10px', borderRadius: 8, cursor: 'pointer', marginBottom: 1, background: isActive ? T.primarySoft : 'transparent', color: isActive ? T.primary : (item.accent === 'red' ? '#B91C1C' : T.textSoft), fontWeight: isActive ? 600 : 500, fontSize: 13 }}>
                    <Icon name={item.icon} size={17} color={isActive ? T.primary : (item.accent === 'red' ? '#B91C1C' : T.muted)} />
                    <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.label}</span>
                    {item.badge && count > 0 && (
                      <span style={{ background: isActive ? T.primary : T.red, color: '#fff', fontSize: 10.5, fontWeight: 700, borderRadius: 999, minWidth: 18, height: 18, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', padding: '0 5px' }}>{count}</span>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
        <div style={{ padding: '10px 14px', borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: 10 }}>
          <Avatar name={PROFILE.name} size={32} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Hi, {PROFILE.first} Williamson</div>
            <div style={{ fontSize: 11, color: T.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{PROFILE.email}</div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
};

const BellDropdown = ({ top, count, onPick, onOpenAll }) => (
  <div style={{ position: 'absolute', top: 40, right: 0, width: 320, background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, boxShadow: T.shadowLg, zIndex: 80, overflow: 'hidden', animation: 'expand 0.14s ease' }}>
    <div style={{ padding: '11px 14px', borderBottom: `1px solid ${T.borderSoft}`, display: 'flex', alignItems: 'center', gap: 8 }}>
      <span style={{ fontSize: 13, fontWeight: 700, color: T.text }}>Needs your attention</span>
      <Pill color="red">{count}</Pill>
    </div>
    <div>
      {top.map(item => {
        const sev = SEV[item.severity];
        return (
          <div key={item.id} data-hover="row" onClick={() => onPick(item.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', cursor: 'pointer', borderBottom: `1px solid ${T.borderSoft}` }}>
            <IconChip icon={item.icon} tone={sev.tone} size={28} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.rowTitle}</div>
              <div style={{ fontSize: 11, color: T.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.sub}</div>
            </div>
          </div>
        );
      })}
    </div>
    <div onClick={onOpenAll} data-hover="row" style={{ padding: '10px 14px', textAlign: 'center', cursor: 'pointer', fontSize: 12.5, fontWeight: 600, color: T.primary }}>Open Unibox</div>
  </div>
);

const TopBar = ({ count, items, onFocusItem, onNav, isMobile, onOpenNav }) => {
  const [bell, setBell] = useState(false);
  const [period, setPeriod] = useState('fy');
  const top = rankItems(items).slice(0, 5);
  return (
    <div style={{ flexShrink: 0, background: T.card, borderBottom: `1px solid ${T.border}`, padding: isMobile ? '10px 14px' : '10px 20px', display: 'flex', alignItems: 'center', gap: isMobile ? 8 : 12 }}>
      {isMobile && <button onClick={onOpenNav} title="Menu" style={{ flexShrink: 0, border: `1px solid ${T.border}`, background: T.card, borderRadius: 8, padding: 7, display: 'inline-flex', cursor: 'pointer', color: T.text }}><Icon name="menu" size={18} /></button>}
      <div style={{ position: 'relative', flex: isMobile ? 1 : '0 1 360px', minWidth: 0 }}>
        <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', display: 'inline-flex' }}><Icon name="search" size={15} color={T.mutedSoft} /></span>
        <input placeholder={isMobile ? 'Search' : 'Search or type a command'} style={{ width: '100%', padding: isMobile ? '8px 12px 8px 32px' : '8px 40px 8px 32px', border: `1px solid ${T.border}`, borderRadius: 8, background: T.fieldBg, fontSize: 13 }} />
        {!isMobile && <span style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', fontSize: 11, color: T.mutedSoft, border: `1px solid ${T.border}`, borderRadius: 5, padding: '1px 5px', background: T.card }}>⌘K</span>}
      </div>
      {!isMobile && <div style={{ flex: 1 }} />}
      {!isMobile && <Select value={period} onChange={e => setPeriod(e.target.value)} style={{ width: 140 }}>
        <option value="month">This month</option>
        <option value="quarter">This quarter</option>
        <option value="fy">This financial year</option>
      </Select>}
      {!isMobile && <Btn variant="soft" icon="calendar">Schedule support session</Btn>}
      <div style={{ position: 'relative', flexShrink: 0 }}>
        <Btn variant="iconOnly" icon="bell" onClick={() => setBell(v => !v)} title="Notifications" />
        {count > 0 && <span style={{ position: 'absolute', top: -3, right: -3, background: T.red, color: '#fff', fontSize: 10, fontWeight: 700, borderRadius: 999, minWidth: 16, height: 16, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', padding: '0 4px', border: `2px solid ${T.card}`, pointerEvents: 'none' }}>{count > 9 ? '9+' : count}</span>}
        {bell && <div onClick={() => setBell(false)} style={{ position: 'fixed', inset: 0, zIndex: 70 }} />}
        {bell && <BellDropdown top={top} count={count} onPick={(id) => { setBell(false); onFocusItem(id); }} onOpenAll={() => { setBell(false); onNav('#/unibox'); }} />}
      </div>
    </div>
  );
};

// Soft ambient "home" canvas — a calm indigo wash with two faint corner glows
// fading into the page. This is the biggest lever that reads "home", not "dashboard".
const UNIBOX_CANVAS = 'radial-gradient(1100px 420px at 6% -12%, rgba(91,91,246,0.12), transparent 60%), radial-gradient(950px 340px at 100% -8%, rgba(91,91,246,0.08), transparent 55%), linear-gradient(180deg, #ECECFB 0%, #F5F4F8 520px)';

const AppShell = ({ route }) => {
  const { isMobile } = useViewport();
  const [items, setItems] = useState(SEED_ITEMS);
  const [activity, setActivity] = useState(SEED_ACTIVITY);
  const [allTime, setAllTime] = useState(PROFILE.actionsAllTime);
  const [planId, setPlanId] = useState(PROFILE.plan);
  const [extraAddons, setExtraAddons] = useState([]);   // add-ons toggled on beyond the plan's included set
  const [toast, setToast] = useState(null);
  const [focus, setFocus] = useState(null);
  const [burst, setBurst] = useState({ n: 0, big: false });
  const [navOpen, setNavOpen] = useState(false);
  const toastTimer = useRef();
  const burstN = useRef(0);

  useEffect(() => { setNavOpen(false); }, [route.section, route.id]);   // close the mobile drawer on navigation

  const plan = planById(planId);
  const { activeModules, reg } = useMemo(() => modulesFor(plan, extraAddons), [planId, extraAddons]);
  const visibleItems = useMemo(() => items.filter(i => activeModules.includes(i.module)), [items, activeModules]);
  const progress = useMemo(() => computeProgress(activity), [activity]);

  const fireToast = (t) => {
    const obj = typeof t === 'string' ? { message: t } : t;
    setToast(obj);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(cur => cur === obj ? null : cur), obj.action ? 5000 : 2400);
  };
  const fireBurst = (big) => { burstN.current += 1; setBurst({ n: burstN.current, big: !!big }); };

  // Complete an action: remove it, log it to activity, bump the all-time count, then
  // celebrate (confetti + copy) on the first-of-day streak, a daily/tier milestone, or all-clear.
  const completeItem = (item, message, kind = 'done') => {
    const idx = items.findIndex(i => i.id === item.id);
    const entry = { ts: Date.now(), kind, label: message };
    const nextActivity = [entry, ...activity];
    const prevP = progress, nextP = computeProgress(nextActivity);
    const prevTier = tierFor(allTime).tier.name, nextTier = tierFor(allTime + 1).tier.name;
    const remaining = visibleItems.filter(i => i.id !== item.id).length;
    let msg = message, big = false, note = null;
    if (nextTier !== prevTier) { big = true; note = `Nice work — you've reached ${nextTier}`; }
    else { for (const m of DAILY_MILESTONES) if (prevP.today < m && nextP.today >= m) { big = true; note = `${m} done today — you're on a roll!`; break; } }
    if (remaining === 0) { big = true; if (!note) note = "That's everything actioned — you're all clear ✨"; }
    if (note) msg = note;
    else if (prevP.today === 0 && nextP.today >= 1) msg = `${message} · 🔥 ${nextP.streak}-day streak`;

    setItems(prev => prev.filter(i => i.id !== item.id));
    setActivity(nextActivity);
    setAllTime(a => a + 1);
    fireBurst(big);
    fireToast({ message: msg, tone: 'undo', action: { label: 'Undo', onClick: () => {
      setItems(cur => { const arr = [...cur]; arr.splice(Math.min(idx, arr.length), 0, item); return arr; });
      setActivity(cur => cur.filter(a => a !== entry));
      setAllTime(a => Math.max(0, a - 1));
    } } });
  };
  const nav = (hash) => { window.location.hash = hash; };
  const stub = (label) => fireToast(`${label} isn't part of this prototype`);
  const focusItem = (id) => { if (route.section !== 'unibox') window.location.hash = '#/unibox'; setFocus({ id, nonce: (focus ? focus.nonce : 0) + 1 }); };
  // Switching plan starts each plan clean (you see exactly what it includes); toggling an
  // add-on adds/removes its modules. Both clear any bell deep-link (it may now be hidden).
  const setPlan = (id) => { setPlanId(id); setExtraAddons([]); setFocus(null); };
  const toggleAddon = (id) => {
    if ((plan.includedAddons || []).includes(id)) return;   // included add-ons can't be turned off
    setExtraAddons(cur => cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
    setFocus(null);
  };

  const isUnibox = route.section === 'unibox';
  const isAcademy = ACADEMY_ROUTES.includes(route.section);
  // Keep "Sole Academy" lit for every academy sub-route AND the course player,
  // including on direct URL load / refresh.
  const sidebarActive = isAcademy ? 'academy' : route.section;
  // The indigo wash is what makes Unibox read as "home" — Academy is a catalog, so
  // it takes the flat page background. 1240 (not 1560) keeps the player's 16:9 stage
  // short enough that "Complete & next" stays above the fold on a 1440×900 screen.
  const canvas = isUnibox ? UNIBOX_CANVAS : T.bg;
  const maxWidth = isUnibox ? 1140 : isAcademy ? 1240 : 1560;
  const pad = isMobile ? '20px 16px 56px' : isUnibox ? '34px 28px 64px' : '24px 30px 56px';

  const content = () => {
    switch (route.section) {
      case 'dashboard':        return <DashboardStub count={visibleItems.length} onNav={nav} />;
      case 'academy':          return <AcademyPage view="home"     fireToast={fireToast} />;
      case 'academy-courses':  return <AcademyPage view="courses"  fireToast={fireToast} />;
      case 'academy-paths':    return <AcademyPage view="paths"    fireToast={fireToast} />;
      case 'academy-progress': return <AcademyPage view="progress" fireToast={fireToast} />;
      // key= is load-bearing: the player seeds its active lesson from resumeLesson()
      // on mount, so course -> course without a remount would strand the old lesson.
      case 'course':           return <CoursePlayerPage key={route.id} courseId={route.id} fireToast={fireToast} />;
      default:                 return <UniboxScreen items={visibleItems} activeModules={activeModules} reg={reg}
                                        planProps={{ planId, plan, extraAddons, onSetPlan: setPlan, onToggleAddon: toggleAddon }}
                                        progress={progress} activity={activity} allTime={allTime}
                                        onComplete={completeItem} fireToast={fireToast} focus={focus} isMobile={isMobile} />;
    }
  };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: T.bg, position: 'relative' }}>
      <Sidebar active={sidebarActive} count={visibleItems.length} onNav={nav} onStub={stub} isMobile={isMobile} mobileOpen={navOpen} onClose={() => setNavOpen(false)} />
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <TopBar count={visibleItems.length} items={visibleItems} onFocusItem={focusItem} onNav={nav} isMobile={isMobile} onOpenNav={() => setNavOpen(true)} />
        <div className="scroll-area" style={{ flex: 1, overflowY: 'auto', background: canvas }}>
          <div style={{ maxWidth, margin: '0 auto', padding: pad }}>
            {content()}
          </div>
        </div>
      </div>
      <Toast toast={toast} onClose={() => setToast(null)} />
      <Confetti fire={burst.n} big={burst.big} />
    </div>
  );
};

// --- root / render ---
// Every routable section must be listed here — parseHash falls back to 'unibox'
// for anything unknown, so an unrecognised deep link still lands somewhere real.
// The second capture group carries a detail id (#/course/c-invoice -> id 'c-invoice').
const SECTIONS = ['unibox', 'dashboard', ...ACADEMY_ROUTES];
const parseHash = (h) => {
  const m = (h || '').match(/^#\/([\w-]+)?(?:\/([\w-]+))?/);
  const s = m && m[1];
  return { section: SECTIONS.includes(s) ? s : 'unibox', id: m ? m[2] : undefined };
};
const Root = () => {
  const [route, setRoute] = useState(() => parseHash(window.location.hash));
  useEffect(() => {
    if (!window.location.hash) window.history.replaceState(null, '', '#/unibox');
    const onHash = () => setRoute(parseHash(window.location.hash));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return <AppShell route={route} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Root /></ErrorBoundary>);
</script>
</body>
</html>
