/* ===== helpers ============================================================ */
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = (prefix) => prefix + '-' + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);
const withAlpha = (hex, a) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};
const darkenHex = (hex, amt) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 - amt))));
  return '#' + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
};
const fmtWhen = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (_) { return ''; }
};
const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

/* ===== video links ========================================================
   The team pastes a link; we work out the rest. Deterministic derivation first
   (provider + embed URL + thumbnail from the id), then a best-effort oEmbed call
   for the title/duration/poster. oEmbed is allowed to fail silently — the
   derived values are what the live app actually needs. */
const parseVideoLink = (raw) => {
  const url = String(raw || '').trim();
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return {
    provider: 'youtube', label: 'YouTube', id: m[1],
    watchUrl: 'https://www.youtube.com/watch?v=' + m[1],
    embedUrl: 'https://www.youtube.com/embed/' + m[1],
    thumbUrl: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg',
    oembed: 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + m[1]),
  };
  m = url.match(/vimeo\.com\/(?:video\/|channels\/[\w]+\/)?(\d{6,})/i);
  if (m) return {
    provider: 'vimeo', label: 'Vimeo', id: m[1],
    watchUrl: 'https://vimeo.com/' + m[1],
    embedUrl: 'https://player.vimeo.com/video/' + m[1],
    thumbUrl: '',
    oembed: 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent('https://vimeo.com/' + m[1]),
  };
  m = url.match(/loom\.com\/(?:share|embed)\/([0-9a-f]{8,})/i);
  if (m) return {
    provider: 'loom', label: 'Loom', id: m[1],
    watchUrl: 'https://www.loom.com/share/' + m[1],
    embedUrl: 'https://www.loom.com/embed/' + m[1],
    thumbUrl: 'https://cdn.loom.com/sessions/thumbnails/' + m[1] + '-with-play.gif',
    oembed: 'https://www.loom.com/v1/oembed?url=' + encodeURIComponent('https://www.loom.com/share/' + m[1]),
  };
  if (/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return {
    provider: 'file', label: 'Video file', id: '', watchUrl: url, embedUrl: '', fileUrl: url, thumbUrl: '', oembed: '',
  };
  if (/^https?:\/\//i.test(url)) return {
    provider: 'unknown', label: 'Other link', id: '', watchUrl: url, embedUrl: url, thumbUrl: '', oembed: '',
  };
  return { provider: 'invalid', label: 'Not a link', id: '', watchUrl: '', embedUrl: '', thumbUrl: '', oembed: '' };
};

// Best-effort metadata. Resolves to {} on any failure — never throws, never blocks.
const fetchVideoMeta = (parsed) => {
  if (!parsed || !parsed.oembed) return Promise.resolve({});
  return fetch(parsed.oembed)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j) return {};
      const out = {};
      if (j.title) out.title = String(j.title);
      if (j.thumbnail_url) out.thumbUrl = String(j.thumbnail_url);
      // Vimeo returns seconds; Loom returns milliseconds on some payloads.
      let secs = Number(j.duration);
      if (isFinite(secs) && secs > 0) {
        if (secs > 60 * 60 * 12) secs = secs / 1000;   // clearly ms, not s
        out.mins = Math.max(1, Math.round(secs / 60));
      }
      return out;
    })
    .catch(() => ({}));
};

/* Move an item within an array, returning a new array. */
const moveItem = (arr, from, to) => {
  const a = arr.slice();
  if (from < 0 || from >= a.length) return a;
  const clamped = Math.max(0, Math.min(a.length - 1, to));
  a.splice(clamped, 0, a.splice(from, 1)[0]);
  return a;
};

/* ---- the published document ---------------------------------------------
   Strips internal-only fields so what engineering consumes is exactly the
   learner-facing contract. Documented in docs/ACADEMY_INTEGRATION.md. */
const toPublished = (doc) => ({
  product: doc.product,
  meta: { title: (doc.meta && doc.meta.title) || 'Sole Academy', blurb: (doc.meta && doc.meta.blurb) || '' },
  tracks: (doc.tracks || []).map(t => ({ id: t.id, label: t.label, color: t.color, blurb: t.blurb || '' })),
  courses: (doc.courses || []).map(c => ({
    id: c.id, title: c.title, menuGroup: c.menuGroup || '', track: c.track, icon: c.icon || 'bookOpen', level: c.level || 'Beginner',
    summary: c.summary || '', popular: !!c.popular,
    lessons: (c.lessons || []).map(l => {
      // ONE RULE: a chapter with a video can be watched, a chapter without one
      // cannot. Nothing else decides it.
      //
      // This used to be derived from a six-value production state, and the two
      // could disagree. Driving the tool for real caught it: pasting a YouTube
      // link showed "Live for learners once you publish", then published the
      // chapter as `recording`, because its production state still said
      // `outlined`. The editor promised one thing and the learner got another.
      // Deriving from the video is the only version of this that cannot drift.
      //
      // The single remaining production flag is a courtesy: a chapter with no
      // video can be marked "being recorded" so learners see that instead of a
      // flat "coming soon". It can never make a chapter watchable.
      const prodStatus = (l.production && l.production.status) || 'idea';
      const status = lessonHasVideo(l) ? 'published'
        : prodStatus === 'recording' ? 'recording'
        : 'planned';
      const out = {
        id: l.id, title: l.title, mins: Number(l.mins) || 0, type: l.type || 'video', status,
        description: l.description || '',
        takeaways: (l.takeaways || []).filter(t => String(t).trim()),
        transcript: l.transcript || '',
        tags: (l.tags || []).filter(t => String(t).trim()),
        resources: (l.resources || []).filter(r => String(r.label || '').trim() && String(r.href || '').trim()),
      };
      // Only emit the video keys that are actually set — the app branches on
      // their presence (videoUrl → <video>, embedUrl → <iframe>).
      if (l.videoUrl) out.videoUrl = l.videoUrl;
      if (l.embedUrl) out.embedUrl = l.embedUrl;
      if (l.thumbUrl) out.thumbUrl = l.thumbUrl;
      if (l.tour) out.tour = l.tour;
      if (l.guide) out.guide = l.guide;   // reserved for annotated-screenshot lessons
      return out;
    }),
  })),
  paths: (doc.paths || []).map(p => ({ id: p.id, title: p.title, forRole: p.forRole || '', blurb: p.blurb || '', courseIds: (p.courseIds || []).slice() })),
});

/* ===== drag to reorder ====================================================
   HTML5 drag-and-drop for speed, with ↑/↓ buttons on every row as the reliable
   path (and the only one that works from a keyboard). Nested lists stopPropagation
   so dragging a lesson doesn't also drag its course. */
const useDragOrder = (onMove) => {
  // The source index lives in a REF, not state. dragstart → dragover → drop can
  // all land in one tick (any synthetic drag, and some real fast ones), and a
  // state update wouldn't have committed yet, so the drop would read `null` and
  // silently do nothing. State is only mirrored for the visual highlight.
  const fromRef = useRef(null);
  const [from, setFrom] = useState(null);
  const [over, setOver] = useState(null);
  const reset = () => { fromRef.current = null; setFrom(null); setOver(null); };
  return (i) => ({
    draggable: true,
    onDragStart: (e) => {
      e.stopPropagation();
      fromRef.current = i; setFrom(i);
      // dataTransfer is absent on synthetic events; the reorder works without it.
      try { if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } } catch (_) {}
    },
    onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); if (over !== i) setOver(i); },
    onDragEnd: (e) => { e.stopPropagation(); reset(); },
    onDrop: (e) => {
      e.preventDefault(); e.stopPropagation();
      const f = fromRef.current;
      reset();
      if (f !== null && f !== i) onMove(f, i);
    },
    ...(from === i ? { 'data-dragging': '' } : {}),
    ...(over === i && from !== null && from !== i ? (from < i ? { 'data-drop-after': '' } : { 'data-drop-before': '' }) : {}),
  });
};

const CurriculumTree = ({ doc, sel, setSel, edit, fireToast, collapsed, setCollapsed }) => {
  const tracks = doc.tracks || [];
  const moveTrack = useDragOrder((f, t) => edit(d => { d.tracks = moveItem(d.tracks, f, t); }));

  const isOpen = (id) => !collapsed[id];
  const toggle = (id) => setCollapsed(c => ({ ...c, [id]: !c[id] }));

  const addTrack = () => {
    const t = emptyTrack();
    t.label = 'New track';
    edit(d => { d.tracks.push(t); });
    setSel({ kind: 'track', id: t.id });
  };
  const addCourse = (trackId) => {
    const c = emptyCourse(trackId);
    c.title = 'New module';
    edit(d => { d.courses.push(c); });
    setCollapsed(s => ({ ...s, [trackId]: false }));
    setSel({ kind: 'course', id: c.id });

  const addLesson = (courseId) => {
    const l = emptyLesson();
    l.title = 'New lesson';
    edit(d => { const c = findCourse(d, courseId); if (c) c.lessons.push(l); });
    setCollapsed(s => ({ ...s, [courseId]: false }));
    setSel({ kind: 'lesson', id: l.id, courseId });
  };

  const deleteTrack = (track) => {
    const owned = (doc.courses || []).filter(c => c.track === track.id);
    if (owned.length) { fireToast({ message: `Move or delete its ${plural(owned.length, 'module')} first`, tone: 'warn' }); return; }
    const snapshot = clone(doc.tracks);
    edit(d => { d.tracks = d.tracks.filter(t => t.id !== track.id); });
    if (sel.kind === 'track' && sel.id === track.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${track.label || 'track'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.tracks = snapshot; }) } });
  };
  const deleteCourse = (course) => {
    const snapshot = clone(doc.courses);
    const snapPaths = clone(doc.paths);
    edit(d => {
      d.courses = d.courses.filter(c => c.id !== course.id);
      d.paths.forEach(p => { p.courseIds = p.courseIds.filter(id => id !== course.id); });
    });
    if (sel.id === course.id || sel.courseId === course.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${course.title || 'module'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.courses = snapshot; d.paths = snapPaths; }) } });
  };
  const deleteLesson = (course, lesson) => {
    const snapshot = clone(course.lessons);
    edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = c.lessons.filter(l => l.id !== lesson.id); });
    if (sel.kind === 'lesson' && sel.id === lesson.id) setSel({ kind: 'course', id: course.id });
    fireToast({ message: `Deleted "${lesson.title || 'lesson'}"`, action: { label: 'Undo', onClick: () => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = snapshot; }) } });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700 }}>Curriculum</div>
          <Helper style={{ fontSize: 10.5, whiteSpace: 'nowrap' }}>{plural((doc.courses || []).length, 'module')} · {plural(allLessons(doc).length, 'chapter')}</Helper>
        </div>
      </div>

      <div className="scroll" style={{ flex: 1, padding: '8px 8px 40px' }}>
        {tracks.length === 0 && (
          <EmptyState icon="layers" title="No tracks yet"
            hint="Tracks are the filter chips learners see across the top of the catalog. Start with one, then add courses inside it."
            action={<Btn variant="primary" size="sm" icon="plus" onClick={addTrack}>Add the first track</Btn>} />
        )}
        {tracks.map((track, ti) => {
          const courses = (doc.courses || []).filter(c => c.track === track.id);
          const open = isOpen(track.id);
          const selectedTrack = sel.kind === 'track' && sel.id === track.id;
          return (
            <div key={track.id} {...moveTrack(ti)} style={{ marginBottom: 3, borderRadius: T.radius }}>
              <div data-row onClick={() => setSel({ kind: 'track', id: track.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 8px', borderRadius: T.radius, cursor: 'pointer',
                  background: selectedTrack ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedTrack) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedTrack) e.currentTarget.style.background = 'transparent'; }}>
                <button data-btn onClick={e => { e.stopPropagation(); toggle(track.id); }} aria-label={open ? 'Collapse' : 'Expand'}
                  style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
                  <Icon name={open ? 'chevronDown' : 'chevronRight'} size={13} />
                </button>
                <span style={{ width: 20, height: 20, borderRadius: 6, background: withAlpha(track.color || T.primary, 0.13), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Icon name="layers" size={12} color={track.color || T.primary} />
                </span>
                <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 700, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {track.label || <span style={{ color: T.red }}>Untitled track</span>}
                </span>
                <span style={{ fontSize: 10, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{courses.length}</span>
                <RowActions
                  canUp={ti > 0} canDown={ti < tracks.length - 1}
                  onUp={() => edit(d => { d.tracks = moveItem(d.tracks, ti, ti - 1); })}
                  onDown={() => edit(d => { d.tracks = moveItem(d.tracks, ti, ti + 1); })}
                  onDelete={() => deleteTrack(track)}
                  extra={<button data-btn onClick={(e) => { e.stopPropagation(); addCourse(track.id); }} aria-label="Add course"
                    style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={13} /></button>} />
              </div>

              {open && (
                <div style={{ marginLeft: 14, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 2 }}>
                  {courses.length === 0 && (
                    <button data-btn onClick={() => addCourse(track.id)}
                      style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '5px 8px', color: T.mutedSoft, fontSize: 11, textAlign: 'left' }}>
                      <Icon name="plus" size={12} />Add a module
                    </button>
                  )}
                  {courses.map((course) => (
                    <CourseBranch key={course.id} doc={doc} track={track} course={course} courses={courses}
                      sel={sel} setSel={setSel} edit={edit}
                      open={isOpen(course.id)} toggle={() => toggle(course.id)}
                      onAddLesson={() => addLesson(course.id)}
                      onDeleteCourse={() => deleteCourse(course)}
                      onDeleteLesson={(l) => deleteLesson(course, l)} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* One course row plus its lesson list. Split out so each course owns its own
   drag state — a single shared one would make every list jump at once. */
const CourseBranch = ({ doc, track, course, courses, sel, setSel, edit, open, toggle, onAddLesson, onDeleteCourse, onDeleteLesson }) => {
  const idx = courses.indexOf(course);
  const globalIdx = (doc.courses || []).indexOf(course);
  // Reorder within the track: translate a local swap into the global array.
  const moveWithinTrack = (from, to) => edit(d => {
    const ids = courses.map(c => c.id);
    const reordered = moveItem(ids, from, to);
    const others = d.courses.filter(c => c.track !== track.id);
    const mine = reordered.map(id => d.courses.find(c => c.id === id)).filter(Boolean);
    // Keep the track's courses contiguous at the position of its first member.
    const firstAt = d.courses.findIndex(c => c.track === track.id);
    const out = others.slice();
    out.splice(Math.max(0, firstAt), 0, ...mine);
    d.courses = out;
  });
  const courseDnd = useDragOrder(moveWithinTrack);
  const moveLesson = (f, t) => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = moveItem(c.lessons, f, t); });
  const lessonDnd = useDragOrder(moveLesson);
  const selectedCourse = sel.kind === 'course' && sel.id === course.id;
  const lessons = course.lessons || [];
  const withVideo = lessons.filter(lessonHasVideo).length;

  return (
    <div {...courseDnd(idx)} style={{ marginBottom: 2, borderRadius: T.radius }}>
      <div data-row onClick={() => setSel({ kind: 'course', id: course.id })}
        style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 8px', borderRadius: T.radius, cursor: 'pointer',
          background: selectedCourse ? T.primarySoft : 'transparent' }}
        onMouseEnter={e => { if (!selectedCourse) e.currentTarget.style.background = T.fieldBg; }}
        onMouseLeave={e => { if (!selectedCourse) e.currentTarget.style.background = 'transparent'; }}>
        <button data-btn onClick={e => { e.stopPropagation(); toggle(); }} aria-label={open ? 'Collapse' : 'Expand'}
          style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
          <Icon name={open ? 'chevronDown' : 'chevronRight'} size={12} />
        </button>
        <span style={{ flex: 1, minWidth: 0, fontSize: 11.5, fontWeight: 600, color: T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {course.title || <span style={{ color: T.red }}>Untitled course</span>}
        </span>
        {course.popular && <Icon name="star" size={10} color={T.amber} />}
        <span style={{ fontSize: 9.5, color: withVideo === lessons.length && lessons.length ? T.greenDark : T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>
          {withVideo}/{lessons.length}
        </span>
        <RowActions
          canUp={idx > 0} canDown={idx < courses.length - 1}
          onUp={() => moveWithinTrack(idx, idx - 1)}
          onDown={() => moveWithinTrack(idx, idx + 1)}
          onDelete={onDeleteCourse}
          extra={<button data-btn onClick={(e) => { e.stopPropagation(); onAddLesson(); }} aria-label="Add lesson"
            style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={12} /></button>} />
      </div>

      {open && (
        <div style={{ marginLeft: 12, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 1 }}>
          {lessons.length === 0 && (
            <button data-btn onClick={onAddLesson}
              style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '4px 8px', color: T.mutedSoft, fontSize: 10.5, textAlign: 'left' }}>
              <Icon name="plus" size={11} />Add a lesson
            </button>
          )}
          {lessons.map((l, li) => {
            const selectedLesson = sel.kind === 'lesson' && sel.id === l.id;
            const st = statusById(l.production && l.production.status);
            return (
              <div key={l.id} {...lessonDnd(li)} data-row
                onClick={() => setSel({ kind: 'lesson', id: l.id, courseId: course.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px', marginBottom: 1, borderRadius: 6, cursor: 'pointer',
                  background: selectedLesson ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedLesson) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedLesson) e.currentTarget.style.background = 'transparent'; }}>
                <span title={st.label} style={{ width: 6, height: 6, borderRadius: 999, background: st.color, flexShrink: 0 }} />
                <Icon name={lessonHasVideo(l) ? 'video' : 'clock'} size={11} color={lessonHasVideo(l) ? T.greenDark : T.borderStrong} />
                <span style={{ flex: 1, minWidth: 0, fontSize: 11, color: selectedLesson ? T.text : T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {l.title || <span style={{ color: T.red }}>Untitled lesson</span>}
                </span>
                <span style={{ fontSize: 9.5, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{l.mins || 0}m</span>
                <RowActions
                  canUp={li > 0} canDown={li < lessons.length - 1}
                  onUp={() => moveLesson(li, li - 1)}
                  onDown={() => moveLesson(li, li + 1)}
                  onDelete={() => onDeleteLesson(l)} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

const CourseEditor = ({ doc, course, edit, fireToast, onCopyToOtherProduct, otherProductLabel, setSel }) => {
  const set = (patch) => edit(d => { const c = findCourse(d, course.id); if (c) Object.assign(c, patch); });
  const tracks = doc.tracks || [];
  const lessons = course.lessons || [];
  const inPaths = (doc.paths || []).filter(p => (p.courseIds || []).includes(course.id));
  const color = trackColorOf(doc, course.track);

  // The YouTube-description helper Johann asked for: a course's lesson list as
  // chapter text, ready to paste into a video description.
  const contentPack = () => {
    const lines = [];
    lines.push(course.title || 'Untitled course');
    if (course.summary) lines.push('', course.summary);
    lines.push('', 'In this course:');
    let t = 0;
    lessons.forEach((l) => {
      const mm = String(Math.floor(t / 60)).padStart(2, '0');
      const ss = String(t % 60).padStart(2, '0');
      lines.push(`${mm}:${ss} ${l.title || 'Untitled lesson'}`);
      t += (Number(l.mins) || 0) * 60;
    });
    const text = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(
      () => fireToast('Course content pack copied'),
      () => fireToast({ message: 'Could not copy — check clipboard permissions', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available in this browser', tone: 'warn' });
  };

  return (
    <EditorShell eyebrow="Course" title={course.title || 'Untitled course'} icon={course.icon || 'bookOpen'} color={color}
      actions={<>
        <Btn variant="outline" size="sm" icon="copy" onClick={contentPack}>Content pack</Btn>
        {onCopyToOtherProduct && <Btn variant="outline" size="sm" icon="layers" onClick={onCopyToOtherProduct}>Copy to {otherProductLabel}</Btn>}
      </>}>
      <Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="Title" hint="What learners scan in the catalog. Name it after the thing they want to do.">
            <Input value={course.title || ''} onChange={e => set({ title: e.target.value })} placeholder="Running a payrun, step by step" />
          </Field>
          <Field label="Summary" hint="Two lines max — it fills the body of the course card.">
            <Textarea rows={2} value={course.summary || ''} onChange={e => set({ summary: e.target.value })} placeholder="Run compliant Australian payroll end-to-end — from employers to a finalised, STP-reported payrun." />
          </Field>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <Field label="Track">
              <Select value={course.track || ''} onChange={e => set({ track: e.target.value })}>
                <option value="">— none —</option>
                {tracks.map(t => <option key={t.id} value={t.id}>{t.label || t.id}</option>)}
              </Select>
            </Field>
            <Field label="Level">
              <Select value={course.level || 'Beginner'} onChange={e => set({ level: e.target.value })}>
                {LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
              </Select>
            </Field>
          </div>
          <Field label="Menu group" hint="The group in the app's left-hand menu this module teaches — leave blank if not applicable (e.g. for the B2C product).">
            <Input value={course.menuGroup || ''} onChange={e => set({ menuGroup: e.target.value })} placeholder="Payroll" />
          </Field>
          <Field label="Icon" hint="This exact set is what the app can draw. Anything else would render as a fallback.">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
              {COURSE_ICONS.map(n => (
                <button key={n} data-btn onClick={() => set({ icon: n })} title={n}
                  style={{ width: 32, height: 32, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: `1px solid ${course.icon === n ? color : T.border}`,
                    background: course.icon === n ? withAlpha(color, 0.12) : T.card }}>
                  <Icon name={n} size={15} color={course.icon === n ? color : T.muted} />
                </button>
              ))}
            </div>
          </Field>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 9, cursor: 'pointer' }}>
            <input type="checkbox" checked={!!course.popular} onChange={e => set({ popular: e.target.checked })} style={{ marginTop: 2, accentColor: T.primary }} />
            <span>
              <span style={{ fontSize: 12, fontWeight: 600 }}>Feature on the Academy home page</span>
              <Helper style={{ fontSize: 10.5 }}>Shows under “Popular courses”. Three or four is about right — feature everything and you've featured nothing.</Helper>
            </span>
          </label>
          <Field label="Id" hint="Learner progress is stored against this. Changing it resets everyone's progress for this course.">
            <Input value={course.id} onChange={e => {
              const next = slug(e.target.value) || course.id;
              edit(d => {
                (d.paths || []).forEach(p => { p.courseIds = p.courseIds.map(id => id === course.id ? next : id); });
                const c = findCourse(d, course.id); if (c) c.id = next;
              });
              setSel({ kind: 'course', id: next });
            }} style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 11.5 }} />
          </Field>
        </div>
      </Card>

      <Card>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <SectionTitle>Lessons</SectionTitle>
          <Helper style={{ fontSize: 11 }}>{plural(lessons.length, 'chapter')} · {courseMins(course)} min total</Helper>
        </div>
        {lessons.length === 0
          ? <Helper>No lessons yet. Add them from the tree on the left.</Helper>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              {lessons.map((l, i) => {
                const st = statusById(l.production && l.production.status);
                return (
                  <div key={l.id} onClick={() => setSel({ kind: 'lesson', id: l.id, courseId: course.id })}
                    style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '7px 9px', borderRadius: T.radius, border: `1px solid ${T.borderSoft}`, cursor: 'pointer', background: T.fieldBg }}>
                    <span style={{ fontSize: 10.5, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums', width: 14 }}>{i + 1}</span>
                    <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.title || 'Untitled lesson'}</span>
                    {!lessonHasVideo(l) && <Pill color={T.amber}>No video</Pill>}
                    <Pill color={st.color}>{st.label}</Pill>
                    <span style={{ fontSize: 10.5, color: T.mutedSoft }}>{l.mins || 0} min</span>
                  </div>
                );
              })}
            </div>}
      </Card>

      {inPaths.length > 0 && (
        <Card>
          <SectionTitle style={{ marginBottom: 8 }}>Part of these learning paths</SectionTitle>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {inPaths.map(p => <Pill key={p.id} color={T.primary} icon="graduation">{p.title || p.id}</Pill>)}
          </div>
        </Card>
      )}
    </EditorShell>
  );
};

/* ---- the video field ------------------------------------------------------
   Paste a link, get everything else. We derive the provider, embed URL and
   poster from the id (deterministic, works offline), then try oEmbed for the
   real title/length/poster. The embed renders live underneath so a wrong or
   private link is obvious in the editor rather than in front of a learner. */
const VideoField = ({ lesson, onApply, fireToast }) => {
  const [raw, setRaw] = useState(lesson.videoUrl || lesson.embedUrl || '');
  const [busy, setBusy] = useState(false);
  const [meta, setMeta] = useState(null);
  const [showEmbed, setShowEmbed] = useState(false);

  // Reset when the selected lesson changes.
  useEffect(() => {
    setRaw(lesson.videoUrl || lesson.embedUrl || '');
    setMeta(null);
    setShowEmbed(false);
  }, [lesson.id]);

  const parsed = useMemo(() => parseVideoLink(raw), [raw]);
  const attached = lessonHasVideo(lesson);

  const attach = () => {
    if (!parsed || parsed.provider === 'invalid') { fireToast({ message: 'That does not look like a video link', tone: 'error' }); return; }
    const patch = parsed.provider === 'file'
      ? { videoUrl: parsed.fileUrl, embedUrl: '', thumbUrl: lesson.thumbUrl || '' }
      : { videoUrl: '', embedUrl: parsed.embedUrl, thumbUrl: parsed.thumbUrl || lesson.thumbUrl || '' };
    onApply(patch);
    setBusy(true);
    fetchVideoMeta(parsed).then(m => {
      setBusy(false);
      if (m && (m.title || m.mins || m.thumbUrl)) setMeta(m);
      if (m && m.thumbUrl && !parsed.thumbUrl) onApply({ thumbUrl: m.thumbUrl });
    });
    fireToast(`${parsed.label} video attached`);
  };

  const clear = () => { onApply({ videoUrl: '', embedUrl: '', thumbUrl: '' }); setRaw(''); setMeta(null); setShowEmbed(false); };

  const providerTone = parsed && parsed.provider === 'invalid' ? T.red
    : parsed && parsed.provider === 'unknown' ? T.amber : T.greenDark;

  return (
    <Card style={{ borderColor: attached ? withAlpha(T.green, 0.35) : T.border }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 12 }}>
        <SectionTitle>Video</SectionTitle>
        {attached
          ? <Pill color={T.greenDark} icon="checkCircle">Attached</Pill>
          : <Pill color={T.amber} icon="alertTriangle">No video yet</Pill>}
      </div>

      <Field hint="Paste the YouTube, Vimeo or Loom link. Unlisted links are fine — that's what we recommend. We work out the embed and the thumbnail from it.">
        <div style={{ display: 'flex', gap: 6 }}>
          <Input value={raw} onChange={e => setRaw(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); attach(); } }}
            placeholder="https://www.youtube.com/watch?v=…" />
          <Btn variant="primary" size="sm" icon="link" onClick={attach} disabled={!raw.trim()}>Attach</Btn>
          {attached && <Btn variant="ghost" size="sm" icon="close" onClick={clear} style={{ color: T.muted }}>Clear</Btn>}
        </div>
      </Field>

      {raw.trim() && parsed && (
        <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 8, fontSize: 11.5 }}>
          <Pill color={providerTone} icon={parsed.provider === 'invalid' ? 'xCircle' : 'video'}>{parsed.label}</Pill>
          {parsed.provider === 'unknown' && <Helper style={{ fontSize: 11 }}>We'll embed it as-is. Check the preview below actually plays.</Helper>}
          {busy && <Helper style={{ fontSize: 11 }}>Looking up the details…</Helper>}
        </div>
      )}

      {meta && (
        <div style={{ marginTop: 12, padding: 11, borderRadius: T.radius, background: T.primarySofter, border: `1px solid ${T.borderSoft}` }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: T.primaryDark, marginBottom: 7 }}>Found on the video — use it?</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
            {meta.title && <Btn variant="outline" size="sm" icon="check" onClick={() => { onApply({ title: meta.title }); setMeta({ ...meta, title: null }); }}>Title: “{meta.title.length > 42 ? meta.title.slice(0, 42) + '…' : meta.title}”</Btn>}

/* ===== media library ======================================================
   Thumbnails, checklists and screenshots — the files that go WITH lessons.
   Videos are never uploaded here; they live on YouTube/Vimeo/Loom and the lesson
   stores the link. Shared across both products on purpose: a logo or a checklist
   is rarely product-specific. */


const indexDoc = (d) => {
  const map = {};
  ((d && d.tracks) || []).forEach(t => { map['track:' + t.id] = { kind: 'Track', label: t.label || t.id, obj: t }; });
  ((d && d.courses) || []).forEach(c => {
    map['course:' + c.id] = { kind: 'Course', label: c.title || c.id, obj: { ...c, lessons: (c.lessons || []).map(l => l.id) } };
    (c.lessons || []).forEach(l => { map['lesson:' + l.id] = { kind: 'Lesson', label: l.title || l.id, obj: l, parent: c.title || c.id }; });
  });
  ((d && d.paths) || []).forEach(p => { map['path:' + p.id] = { kind: 'Path', label: p.title || p.id, obj: p }; });
  return map;
};
const diffDocs = (a, b) => {
  const A = indexDoc(a), B = indexDoc(b);
  const added = [], removed = [], changed = [];
  Object.keys(B).forEach(k => {
    if (!A[k]) added.push(B[k]);
    else if (JSON.stringify(A[k].obj) !== JSON.stringify(B[k].obj)) changed.push(B[k]);
  });
  Object.keys(A).forEach(k => { if (!B[k]) removed.push(A[k]); });
  return { added, removed, changed, total: added.length + removed.length + changed.length };
};

      </div>
    </div>
  );

/* ===== shell ============================================================== */
// Two screens, on purpose. The job this tool exists for is "put the video
// against the chapter, then publish". Learning paths, the production tracker,
// the media library and the in-tool preview were all real features and all of
// them were things to read past on the way to that job. Paths and tracks are
// still in the document and still render in the Academy; they are just not
// edited here any more. The preview is the live Academy itself.
const NAV = [
  { id: 'curriculum', label: 'Curriculum', icon: 'layers' },
  { id: 'publish', label: 'Publish', icon: 'send' },
];

const AcademyStudio = () => {
  const savedUI = lsRead(LS_UI, {});
  const [product, setProduct] = useState(savedUI.product && PRODUCTS.some(p => p.id === savedUI.product) ? savedUI.product : PRODUCTS[0].id);
  const [screen, setScreen] = useState('curriculum');
  const [docs, setDocs] = useState(() => {
    const stored = lsRead(LS_DOCS, null);
    const base = seedDocs();
    if (!stored) return base;
    const out = {};
    PRODUCTS.forEach(p => { out[p.id] = normaliseDoc(stored[p.id] || base[p.id], p.id); });
    return out;
  });
  const [sel, setSel] = useState({ kind: null });
  const [collapsed, setCollapsed] = useState(savedUI.collapsed || {});
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  // THE TOOL IS LOCKED. There used to be a "work in this browser instead" escape
  // hatch that ran the whole thing against localStorage without signing in. It
  // was there so the tool worked before any backend existed, and it meant anyone
  // with the URL could open and edit the curriculum. The backend exists now, so
  // the hatch is gone and the sign-in gate below is unconditional.
  const cloudConfigured = !!(CLOUD && CLOUD.isConfigured && CLOUD.isConfigured());
  const cloudReady = !!(CLOUD && CLOUD.isCloud && CLOUD.isCloud());
  const needsAuth = !!(CLOUD && CLOUD.needsAuth && CLOUD.needsAuth());
  const [cloudError, setCloudError] = useState('');
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(!needsAuth);
  const [email, setEmail] = useState('');
  const [authSent, setAuthSent] = useState(false);
  const [authErr, setAuthErr] = useState('');
  const [saveState, setSaveState] = useState('idle');   // idle | saving | saved | error | conflict
  const [conflictBy, setConflictBy] = useState('');
  const [versions, setVersions] = useState({});          // product → [rows]
  const [publishing, setPublishing] = useState(false);
  const stamps = useRef({});                             // product → server updated_at
  const loadedFromCloud = useRef({});                    // product → bool
  const skipNextSave = useRef(true);

  const fireToast = useCallback((t) => {
    const obj = typeof t === 'string' ? { message: t } : t;
    setToast(obj);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), obj && obj.action ? 5000 : 2400);
  }, []);

  const doc = docs[product] || seedDocs()[product];
  const productMeta = PRODUCTS.find(p => p.id === product) || PRODUCTS[0];
  const other = PRODUCTS.find(p => p.id !== product) || null;

  const edit = useCallback((mutator) => {
    setDocs(prev => {
      const next = { ...prev };
      const d = clone(prev[product]);
      mutator(d);
      next[product] = d;
      return next;
    });
  }, [product]);

  /* ---- local mirror (always) + shared draft (when connected) ------------ */
  useEffect(() => { lsWrite(LS_UI, { product, collapsed }); }, [product, collapsed]);

  useEffect(() => {
    lsWrite(LS_DOCS, docs);
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (!cloudReady || (needsAuth && !user)) return;
    if (!loadedFromCloud.current[product]) return;   // don't overwrite the server before we've read it
    setSaveState('saving');
    const t = setTimeout(() => {
      CLOUD.saveDraft(product, docs[product], stamps.current[product])
        .then(res => {
          if (res && res.conflict) {
            setSaveState('conflict');
            setConflictBy(res.updated_by_email || 'someone else');
            return;
          }
          stamps.current[product] = (res && res.updated_at) || stamps.current[product];
          setCloudError('');
          setSaveState('saved');
        })
        .catch((e) => {
          setSaveState('error');
          setCloudError((e && e.message) || 'Could not reach the shared curriculum');
        });
    }, 800);
    return () => clearTimeout(t);
  }, [docs, product, cloudReady, user, needsAuth]);

  /* ---- auth ------------------------------------------------------------- */
  useEffect(() => {
    if (!CLOUD || !cloudReady) { setAuthChecked(true); return; }
    let sub = null;
    CLOUD.getUser().then(u => { setUser(u); setAuthChecked(true); });
    if (CLOUD.onAuth) sub = CLOUD.onAuth(u => { setUser(u); setAuthChecked(true); });
    return () => { if (sub && sub.unsubscribe) sub.unsubscribe(); };
  }, [cloudReady]);

  /* ---- pull the shared draft + versions + assets ------------------------ */
  // The save effect needs the newest docs without re-subscribing, and seeding a
  // fresh backend needs whatever this browser already has.
  const docsRef = useRef(docs);
  useEffect(() => { docsRef.current = docs; }, [docs]);

  const pullProduct = useCallback((pid) => {
    if (!cloudReady || (needsAuth && !user)) return;
    CLOUD.loadDraft(pid).then(row => {
      if (row && row.doc) {
        stamps.current[pid] = row.updated_at;
        skipNextSave.current = true;
        setDocs(prev => ({ ...prev, [pid]: normaliseDoc(row.doc, pid) }));
        loadedFromCloud.current[pid] = true;
      } else {
        // Nothing shared yet — seed the backend from what's in this browser so
        // the first person to open the tool populates the team's draft.
        stamps.current[pid] = null;
        loadedFromCloud.current[pid] = true;
        CLOUD.saveDraft(pid, docsRef.current[pid], null)
          .then(res => { if (res && res.updated_at) stamps.current[pid] = res.updated_at; })
          .catch(e => setCloudError((e && e.message) || 'Could not write to the shared curriculum'));
      }
    }).catch(e => {
      loadedFromCloud.current[pid] = true;
      setCloudError((e && e.message) || 'Could not read the shared curriculum');
    });
    CLOUD.listVersions(pid).then(rows => setVersions(v => ({ ...v, [pid]: rows || [] }))).catch(() => {});
  }, [cloudReady, needsAuth, user]);

  useEffect(() => {
    if (!cloudReady || (needsAuth && !user)) return;
    PRODUCTS.forEach(p => { if (!loadedFromCloud.current[p.id]) pullProduct(p.id); });
  }, [cloudReady, needsAuth, user, pullProduct]);

  /* ---- selection helpers ----------------------------------------------- */
  const jumpTo = useCallback((target) => {
    if (!target) return;
    setScreen('curriculum');
    if (target.kind === 'lesson') {
      setCollapsed(c => {
        const n = { ...c };
        const course = findCourse(doc, target.courseId);
        if (course) { n[target.courseId] = false; n[course.track] = false; }
        return n;
      });
      setSel({ kind: 'lesson', id: target.id, courseId: target.courseId });
    } else if (target.kind === 'course') {
      const course = findCourse(doc, target.id);
      if (course) setCollapsed(c => ({ ...c, [course.track]: false }));
      setSel({ kind: 'course', id: target.id });
    }
  }, [doc]);

  const jumpToLesson = useCallback((courseId, lessonId) => jumpTo({ kind: 'lesson', id: lessonId, courseId }), [jumpTo]);

  /* ---- publish / rollback ---------------------------------------------- */
  const latest = (versions[product] || [])[0] || null;

  const onPublish = (note) => {
    if (!cloudReady) return;
    setPublishing(true);
    CLOUD.publishVersion(product, toPublished(doc), note)
      .then(row => {
        setVersions(v => ({ ...v, [product]: [row].concat(v[product] || []) }));
        fireToast(`Published version ${row.version} of ${productMeta.label}`);
      })
      .catch(e => fireToast({ message: 'Publish failed — ' + ((e && e.message) || 'unknown error'), tone: 'error' }))
      .then(() => setPublishing(false));
  };

  const onRollback = (v) => {
    const snapshot = clone(doc);
    // A published snapshot has no production metadata; keep what the draft knows
    // so loading an old version doesn't wipe the team's status board.
    const merged = normaliseDoc(clone(v.doc), product);
    const prodBy = {};
    allLessons(doc).forEach(({ lesson }) => { if (lesson.production) prodBy[lesson.id] = lesson.production; });
    merged.courses.forEach(c => c.lessons.forEach(l => { if (prodBy[l.id]) l.production = prodBy[l.id]; }));
    setDocs(prev => ({ ...prev, [product]: merged }));
    fireToast({ message: `Loaded version ${v.version} into your draft`, action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
  };

  /* ---- media ------------------------------------------------------------ */
  /* ---- copy a course across products ----------------------------------- */
  const copyCourseToOther = (course) => {
    if (!other) return;
    const copy = clone(course);
    const taken = {};
    (docs[other.id].courses || []).forEach(c => { taken[c.id] = true; (c.lessons || []).forEach(l => { taken[l.id] = true; }); });
    if (taken[copy.id]) copy.id = copy.id + '-copy';
    copy.lessons.forEach(l => { if (taken[l.id]) l.id = l.id + '-copy'; });
    // Carry the track across if the other product has one with the same id;
    // otherwise leave it unset so the readiness check flags it for a decision.
    const hasTrack = (docs[other.id].tracks || []).some(t => t.id === copy.track);
    if (!hasTrack) copy.track = '';
    setDocs(prev => {
      const next = { ...prev };
      const d = clone(prev[other.id]);
      d.courses.push(copy);
      next[other.id] = d;
      return next;
    });
    fireToast({
      message: `Copied to ${other.label}`,
      action: { label: 'Go there', onClick: () => { setProduct(other.id); setScreen('curriculum'); setSel({ kind: 'course', id: copy.id }); } },
    });
  };

  const resetToSeed = () => {
    const snapshot = clone(doc);
    setDocs(prev => ({ ...prev, [product]: normaliseDoc(clone(SEED[product] || {}), product) }));
    setSel({ kind: null });
    fireToast({ message: 'Reset to the starter curriculum', action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
  };

  /* ---- auth gate ------------------------------------------------------- */
  const doSignIn = () => {
    setAuthErr('');
    const e = email.trim();
    if (!e) return;
    CLOUD.signIn(e).then(() => setAuthSent(true)).catch(err => setAuthErr((err && err.message) || 'Could not send the link'));
  };

  if (!cloudConfigured) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <Card style={{ width: '100%', maxWidth: 420, textAlign: 'center' }} pad={28}>
          <SectionTitle style={{ fontSize: 16 }}>Not configured</SectionTitle>
          <Helper style={{ marginTop: 8 }}>
            This Studio has no backend set up, so there is nothing to sign in to and nothing to
            publish. See <b>docs/ACADEMY_STUDIO_SETUP.md</b>.
          </Helper>
        </Card>
      </div>
    );
  }

  if (needsAuth && !authChecked) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: 24, height: 24, borderRadius: '50%', border: `2.5px solid ${T.border}`, borderTopColor: T.primary, animation: 'spin 700ms linear infinite' }} />
      </div>
    );
  }

  if (needsAuth && !user) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <Card style={{ width: '100%', maxWidth: 400, textAlign: 'center' }} pad={28}>
          <div style={{ width: 42, height: 42, margin: '0 auto 14px', borderRadius: 12, background: T.primarySoft, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="graduation" size={21} color={T.primary} />
          </div>
          <SectionTitle style={{ fontSize: 17 }}>Sole Academy Studio</SectionTitle>
          <Helper style={{ margin: '8px 0 18px' }}>
            Sign in to open the team's curriculum. We'll email you a one-time link — no password to remember.
          </Helper>
          {authSent ? (
            <Banner tone="success" icon="mail" title="Check your email">
              We sent a sign-in link to <b>{email.trim()}</b>. Open it on this device.
            </Banner>
          ) : (
            <form onSubmit={e => { e.preventDefault(); doSignIn(); }}>
              <Input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@soleapp.com.au" style={{ textAlign: 'center' }} />
              <Btn variant="primary" size="lg" icon="mail" type="submit" style={{ width: '100%', marginTop: 10 }}>Email me a link</Btn>
              {authErr && <Helper style={{ color: T.red, marginTop: 10 }}>{authErr}</Helper>}
              <Helper style={{ fontSize: 10.5, marginTop: 12 }}>Only teammates who've been invited can sign in.</Helper>
            </form>
          )}
        </Card>
      </div>
    );
  }

  /* ---- editor pane for the curriculum screen --------------------------- */
  const renderEditor = () => {
    if (sel.kind === 'course') {
      const course = findCourse(doc, sel.id);
      if (course) return (
        <CourseEditor doc={doc} course={course} edit={edit} fireToast={fireToast} setSel={setSel}
          otherProductLabel={other ? other.short : ''}
          onCopyToOtherProduct={other ? () => copyCourseToOther(course) : null} />
      );
    }
    if (sel.kind === 'lesson') {
      const course = findCourse(doc, sel.courseId);
      const lesson = findLesson(doc, sel.courseId, sel.id);
      if (course && lesson) return <LessonEditor doc={doc} course={course} lesson={lesson} edit={edit} fireToast={fireToast} setSel={setSel} />;
    }
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <EmptyState icon="layers" title="Pick something to edit"
          hint="Pick a chapter from the tree on the left, then paste its video link. Drag rows, or use the little arrows, to reorder them." />
      </div>
    );
  };

  const saveLabel = saveState === 'saving' ? 'Saving…'
    : saveState === 'saved' ? 'Saved'
    : saveState === 'error' ? 'Save failed'
    : saveState === 'conflict' ? 'Out of date'
    : cloudReady ? 'Up to date' : 'Saved in this browser';
  const saveColor = saveState === 'error' || saveState === 'conflict' ? T.red : saveState === 'saving' ? T.amber : T.greenDark;

  return (
    <div style={{ height: '100%', display: 'grid', gridTemplateColumns: '212px minmax(0,1fr)', background: T.bg }}>
      {/* rail */}
      <aside style={{ background: T.card, borderRight: `1px solid ${T.border}`, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ padding: '15px 14px 12px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 26, height: 26, borderRadius: 8, background: T.primary, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Icon name="graduation" size={14} color="#fff" />
            </span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, letterSpacing: -0.2 }}>Academy Studio</div>
              <div style={{ fontSize: 9.5, color: T.mutedSoft }}>Internal · content team</div>
            </div>
          </div>
        </div>

        <div style={{ padding: '12px 12px 10px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft, marginBottom: 7 }}>Curriculum for</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
            {PRODUCTS.map(p => {
              const active = p.id === product;
              const d = docs[p.id];
              return (
                <button key={p.id} data-btn onClick={() => { setProduct(p.id); setSel({ kind: null }); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 9px', borderRadius: T.radius, textAlign: 'left',
                    border: `1px solid ${active ? T.primary : T.border}`, background: active ? T.primarySoft : T.card }}>
                  <span style={{ width: 22, height: 22, borderRadius: 6, background: active ? T.primary : T.fieldBg, color: active ? '#fff' : T.muted,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 800, flexShrink: 0 }}>{p.short}</span>
                  <span style={{ minWidth: 0, flex: 1 }}>
                    <span style={{ display: 'block', fontSize: 11, fontWeight: 700, color: active ? T.primaryDark : T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.label}</span>
                    <span style={{ display: 'block', fontSize: 9.5, color: T.mutedSoft }}>{d ? `${(d.courses || []).length}c · ${allLessons(d).length}l` : ''}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>

        <nav className="scroll" style={{ flex: 1, padding: '10px 10px 20px' }}>
          {NAV.map(n => {
            const active = screen === n.id;
            // The nav used to carry a red count of readiness blockers. There is
            // no readiness engine any more: a chapter without a video is a normal,
            // publishable state, so there was nothing left for it to count.
            const badge = null;
            return (
              <button key={n.id} data-btn onClick={() => setScreen(n.id)}
                style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '8px 10px', marginBottom: 2, borderRadius: T.radius,
                  border: 'none', background: active ? T.primarySoft : 'transparent', color: active ? T.primaryDark : T.textSoft,
                  fontSize: 12, fontWeight: active ? 700 : 500, textAlign: 'left' }}>
                <Icon name={n.icon} size={14} color={active ? T.primary : T.mutedSoft} />
                <span style={{ flex: 1 }}>{n.label}</span>
                {badge && <Pill color={T.red}>{badge}</Pill>}
              </button>
            );
          })}

          <div style={{ marginTop: 16, paddingTop: 12, borderTop: `1px solid ${T.borderSoft}` }}>
            <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft, marginBottom: 7, paddingLeft: 10 }}>Start over</div>
            <button data-btn onClick={resetToSeed} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '7px 10px', borderRadius: T.radius, border: 'none', background: 'transparent', color: T.muted, fontSize: 11.5, textAlign: 'left' }}>
              <Icon name="undo" size={13} color={T.mutedSoft} />Reset to starter
            </button>
          </div>
        </nav>

        <div style={{ padding: '10px 12px', borderTop: `1px solid ${T.borderSoft}` }}>
          <div title="Shared with your team" style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10, fontWeight: 700, color: T.greenDark }}>
            <span style={{ width: 7, height: 7, borderRadius: 999, background: T.green }} />Shared
          </div>
          {user && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 7 }}>
              <span style={{ flex: 1, minWidth: 0, fontSize: 9.5, color: T.mutedSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.email}</span>
              <button data-btn onClick={() => CLOUD.signOut().then(() => setUser(null))} aria-label="Sign out"
                style={{ border: 'none', background: 'transparent', padding: 2, color: T.mutedSoft }}><Icon name="logout" size={12} /></button>
            </div>
          )}
        </div>
      </aside>

      {/* main */}
      <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>
        <header style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 20px', background: T.card, borderBottom: `1px solid ${T.border}`, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 8 }}>
              {(NAV.find(n => n.id === screen) || {}).label}
              <span style={{ fontSize: 10.5, fontWeight: 600, color: T.muted }}>· {productMeta.label}</span>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10.5, fontWeight: 600, color: saveColor }}>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: saveColor }} />{saveLabel}
          </div>
          {latest && <Pill color={T.mutedSoft} icon="send">Live: v{latest.version}</Pill>}
          <Btn variant="outline" size="sm" icon="eye" onClick={() => window.open('academy.html', '_blank', 'noopener')}>See the Academy</Btn>
          <Btn variant="primary" size="sm" icon="send" onClick={() => setScreen('publish')}>Publish</Btn>
        </header>

        {cloudError && saveState !== 'conflict' && (
          <div style={{ padding: '10px 20px 0' }}>
            <Banner tone="warn" icon="alertTriangle" title="Can't reach the shared curriculum"
              action={<Btn variant="outline" size="sm" onClick={() => setCloudError('')}>Dismiss</Btn>}>
              Your work is still being saved in this browser, so nothing is lost. If this is a fresh setup, the database tables probably aren't created yet — run <b>supabase/migrations/0003_academy_cms.sql</b> once (see <b>docs/ACADEMY_STUDIO_SETUP.md</b>). Details: <span style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 10.5 }}>{cloudError}</span>
            </Banner>
          </div>
        )}

        {saveState === 'conflict' && (
          <div style={{ padding: '10px 20px', background: T.redSoft, borderBottom: `1px solid ${withAlpha(T.red, 0.25)}` }}>
            <Banner tone="danger" icon="alertTriangle" title={`${conflictBy} saved changes while you were editing`}
              action={<div style={{ display: 'flex', gap: 7 }}>
                <Btn variant="outline" size="sm" icon="refresh" onClick={() => {
                  loadedFromCloud.current[product] = false;
                  setSaveState('idle');
                  pullProduct(product);
                  fireToast('Reloaded the shared version');
                }}>Load theirs</Btn>
                <Btn variant="danger" size="sm" onClick={() => {
                  stamps.current[product] = null;   // force-win the next write
                  setSaveState('idle');
                  fireToast('Your next edit will overwrite theirs');
                }}>Keep mine</Btn>
              </div>}>
              To avoid clobbering their work, saving has paused. Load their version (you'll lose your unsaved edits), or keep yours and overwrite.
            </Banner>
          </div>
        )}

        {screen === 'curriculum' && (
          <div style={{ display: 'grid', gridTemplateColumns: '330px minmax(0,1fr)', flex: 1, minHeight: 0 }}>
            <div style={{ background: T.card, borderRight: `1px solid ${T.border}`, minHeight: 0 }}>
              <CurriculumTree doc={doc} sel={sel} setSel={setSel} edit={edit} fireToast={fireToast}
                collapsed={collapsed} setCollapsed={setCollapsed} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>{renderEditor()}</div>
          </div>
        )}
        {screen === 'publish' && (
          <PublishScreen doc={doc} product={product} productLabel={productMeta.label}
            latest={latest} onPublish={onPublish} cloud={cloudReady} publishing={publishing} />
        )}
      </div>

      <Toast toast={toast} />
    </div>
  );
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 28 }}>
        <div style={{ background: T.redSoft, border: `1px solid ${T.red}`, borderRadius: T.radiusCard, padding: 20, maxWidth: 760 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: T.red, marginBottom: 8 }}>Something broke</div>
          <div style={{ fontSize: 12.5, marginBottom: 12 }}>
            Your work is saved in this browser, so a refresh should bring it back. If it keeps happening, send this message to Rishabh.
          </div>
          <pre style={{ margin: 0, fontSize: 11, whiteSpace: 'pre-wrap', color: T.textSoft, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
            {String(this.state.error && this.state.error.stack || this.state.error)}
          </pre>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><AcademyStudio /></ErrorBoundary>
);
</script>
</body>
</html>
