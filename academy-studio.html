                  {isImg && url
                    ? <img src={url} alt={a.name || ''} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
                    : <Icon name="fileText" size={26} color={T.mutedSoft} />}
                </div>
                <div style={{ padding: 10 }}>
                  <div title={a.name} style={{ fontSize: 11.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{a.name || 'Untitled'}</div>
                  <div style={{ fontSize: 10, color: T.mutedSoft, marginTop: 2 }}>{a.created_by_email || ''}</div>
                  <div style={{ display: 'flex', gap: 5, marginTop: 9 }}>
                    <Btn variant="outline" size="sm" icon="copy" onClick={() => copy(url)} style={{ flex: 1 }}>Link</Btn>
                    <Btn variant="ghost" size="sm" icon="trash" aria-label="Delete" onClick={() => setPendingDelete(a)} style={{ color: T.mutedSoft, padding: '5px 7px' }} />
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <Modal open={!!pendingDelete} onClose={() => setPendingDelete(null)} title="Delete this file?"
        footer={<>
          <Btn variant="outline" onClick={() => setPendingDelete(null)}>Cancel</Btn>
          <Btn variant="danger" icon="trash" onClick={() => { onDelete(pendingDelete); setPendingDelete(null); }}>Delete for good</Btn>
        </>}>
        <Helper>
          <b>{pendingDelete && pendingDelete.name}</b> will be removed permanently. Unlike everything else in the Studio, this one cannot be undone.
        </Helper>
        {pendingDelete && usedBy(pendingDelete).length > 0 && (
          <Banner tone="danger" icon="alertTriangle" title={`Still used by ${plural(usedBy(pendingDelete).length, 'lesson')}`} style={{ marginTop: 12 }}>
            Those links will break for learners. Point them somewhere else first:
            <div style={{ marginTop: 6 }}>
              {usedBy(pendingDelete).map((s, i) => <div key={i} style={{ fontSize: 11 }}>· {s}</div>)}
            </div>
          </Banner>
        )}
      </Modal>
    </div>
  );
};

const indexDoc = (d) => {
  const map = {};
  ((d && d.tracks) || []).forEach(t => { map['track:' + t.id] = { kind: 'Track', label: t.label || t.id, obj: t }; });
  ((d && d.courses) || []).forEach(c => {
    map['course:' + c.id] = { kind: 'Course', label: c.title || c.id, obj: { ...c, lessons: (c.lessons || []).map(l => l.id) } };
    (c.lessons || []).forEach(l => { map['lesson:' + l.id] = { kind: 'Lesson', label: l.title || l.id, obj: l, parent: c.title || c.id }; });
  });
  ((d && d.paths) || []).forEach(p => { map['path:' + p.id] = { kind: 'Path', label: p.title || p.id, obj: p }; });
  return map;
};
// Postgres `jsonb` does not preserve object key order: a published document read
// back out of the database holds exactly the same data with its keys reordered
// (shortest key first, then alphabetical). Comparing JSON.stringify output
// therefore reported EVERY lesson as changed, forever. That is what "93 changes
// not live yet" meant on 27 Aug 2026, on a draft that was byte-equal to the live
// version. A diff that always says "everything changed" is a diff nobody reads,
// which is a plausible part of why a night's work sat unpublished.
const stableJson = (v) => {
  if (Array.isArray(v)) return '[' + v.map(stableJson).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableJson(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
};
const diffDocs = (a, b) => {
  const A = indexDoc(a), B = indexDoc(b);
  const added = [], removed = [], changed = [];
  Object.keys(B).forEach(k => {
    if (!A[k]) added.push(B[k]);
    else if (stableJson(A[k].obj) !== stableJson(B[k].obj)) changed.push(B[k]);
  });
  Object.keys(A).forEach(k => { if (!B[k]) removed.push(A[k]); });
  return { added, removed, changed, total: added.length + removed.length + changed.length };
};

/* Browser and Postgres error strings are not for the person reading them.
   Translate the two that actually happen; pass anything else through so a real
   cause is never hidden. */
const plainError = (msg) => {
  const m = String(msg || '');
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Could not reach the server. Check your internet connection and try again.';
  if (/jwt|token|expired|not authenticated/i.test(m)) return 'Your sign-in expired. Reload the page and sign in again.';
  if (/duplicate/i.test(m)) return 'Someone else published at the same moment. Reload the page and try again.';
  return m || 'Unknown error';
};

/* ---- readiness + publish -------------------------------------------------- */
const IssuesPanel = ({ issues, onJump }) => {
  const [open, setOpen] = useState({});
  const blocks = issues.filter(i => i.severity === 'block');
  const warns = issues.filter(i => i.severity === 'warn');

  const groups = [];
  issues.forEach(i => {
    let g = groups.find(x => x.group === i.group && x.severity === i.severity);
    if (!g) { g = { group: i.group, severity: i.severity, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  groups.sort((a, b) => (a.severity === b.severity ? b.items.length - a.items.length : a.severity === 'block' ? -1 : 1));

  if (!issues.length) return (
    <Banner tone="success" icon="checkCircle" title="Everything checks out">
      No blockers and nothing missing. This curriculum is ready to publish.
    </Banner>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {blocks.length > 0 && <Pill color={T.red} icon="xCircle">{plural(blocks.length, 'blocker')}</Pill>}
        {warns.length > 0 && <Pill color={T.amber} icon="alertTriangle">{plural(warns.length, 'warning')}</Pill>}
      </div>
      {blocks.length > 0 && (
        <Banner tone="danger" icon="xCircle" title="Fix these before publishing">
          Each of these would visibly break something for a learner, so publishing is held until they are resolved.
        </Banner>
      )}
      <Card pad={0} style={{ overflow: 'hidden' }}>
        {groups.map((g, gi) => {
          const key = g.severity + ':' + g.group;
          const isOpen = !!open[key];
          const tone = g.severity === 'block' ? T.red : T.amber;
          return (
            <div key={key} style={{ borderTop: gi ? `1px solid ${T.borderSoft}` : 'none' }}>
              <button data-btn onClick={() => setOpen(o => ({ ...o, [key]: !o[key] }))}
                style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', border: 'none', background: 'transparent', padding: '10px 14px', textAlign: 'left' }}>
                <Icon name={isOpen ? 'chevronDown' : 'chevronRight'} size={13} color={T.mutedSoft} />
                <Icon name={g.severity === 'block' ? 'xCircle' : 'alertTriangle'} size={14} color={tone} />
                <span style={{ flex: 1, fontSize: 12.5, fontWeight: 600 }}>{g.group}</span>
                <Pill color={tone}>{g.items.length}</Pill>
              </button>
              {isOpen && (
                <div style={{ padding: '0 14px 10px 44px' }}>
                  {g.items.map(i => (
                    <div key={i.id} style={{ padding: '7px 0', borderTop: `1px solid ${T.borderSoft}` }}>
                      <button data-btn onClick={() => onJump(i.target)}
                        style={{ border: 'none', background: 'transparent', padding: 0, textAlign: 'left', fontSize: 12, fontWeight: 600, color: T.primary }}>
                        {i.label} →
                      </button>
                      <Helper style={{ fontSize: 11, marginTop: 2 }}>{i.detail}</Helper>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </Card>
    </div>
  );
};

const PublishScreen = ({ doc, productLabel, versions, latest, onPublish, onRollback, onJump, cloud, fireToast, publishing, onRefresh }) => {
  const issues = useMemo(() => computeIssues(doc), [doc]);
  const blockers = issues.filter(i => i.severity === 'block');
  const published = useMemo(() => toPublished(doc), [doc]);
  const diff = useMemo(() => diffDocs(latest ? latest.doc : null, published), [latest, published]);
  const [note, setNote] = useState('');
  const [confirming, setConfirming] = useState(false);
  const [showJson, setShowJson] = useState(false);

  const download = (filename, text, mime) => {
    try {
      const blob = new Blob([text], { type: mime || 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (_) { fireToast({ message: 'Download failed in this browser', tone: 'error' }); }
  };

  const asSeedCode = () => {
    const tracks = published.tracks.map(t => ({ id: t.id, label: t.label, color: t.color, blurb: t.blurb }));
    const courses = published.courses.map(c => ({ id: c.id, title: c.title, menuGroup: c.menuGroup, track: c.track, icon: c.icon, level: c.level, summary: c.summary, lessons: c.lessons }));
    const popular = published.courses.filter(c => c.popular).map(c => c.id);
    return [
      '// Generated by Sole Academy Studio, ' + productLabel + ', ' + new Date().toISOString(),
      '// Paste over the matching consts in index.html. See docs/ACADEMY_INTEGRATION.md.',
      'const ACADEMY_TRACKS = ' + JSON.stringify(tracks, null, 2) + ';',
      'const ACADEMY_COURSES = ' + JSON.stringify(courses, null, 2) + ';',
      'const ACADEMY_POPULAR = ' + JSON.stringify(popular) + ';',
      'const LEARNING_PATHS = ' + JSON.stringify(published.paths, null, 2) + ';',
    ].join('\n\n');
  };
  const copySeed = () => {
    const text = asSeedCode();
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => fireToast('Seed code copied'), () => fireToast({ message: 'Could not copy', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available', tone: 'warn' });
  };

  const changeLine = (g) => `${g.kind} · ${g.label}${g.parent ? ` (in ${g.parent})` : ''}`;

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ marginBottom: 16 }}>
        <SectionTitle style={{ fontSize: 16 }}>Publish</SectionTitle>
        <Helper style={{ marginTop: 2, maxWidth: 620 }}>
          Publishing takes a snapshot of this curriculum and makes it the live one for <b>{productLabel}</b>. Your draft keeps working after, nothing you edit reaches learners until you publish again.
        </Helper>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 18, maxWidth: 820 }}>
        <div>
          <SectionTitle style={{ marginBottom: 9 }}>1. Readiness</SectionTitle>
          <IssuesPanel issues={issues} onJump={onJump} />
        </div>

        <div>
          <SectionTitle style={{ marginBottom: 9 }}>2. What is changing</SectionTitle>
          {!cloud ? (
            <Banner tone="warn" icon="alertTriangle" title="Not connected, publishing is off">
              Publishing needs the shared backend so the live app has somewhere to read from. Use <b>Download curriculum.json</b> below and hand the file over instead.
            </Banner>
          ) : !latest ? (
            <Banner tone="accent" icon="send" title="Nothing published yet">
              This would be version 1: {plural(published.courses.length, 'module')}, {plural(published.courses.reduce((s, c) => s + c.lessons.length, 0), 'lesson')} and {plural(published.paths.length, 'learning path')}.
            </Banner>
          ) : diff.total === 0 ? (
            <Banner tone="info" icon="checkCircle" title={`No changes since version ${latest.version}`}>
              Your draft matches what is live. Published {fmtWhen(latest.published_at)}{latest.published_by_email ? ` by ${latest.published_by_email}` : ''}.
            </Banner>
          ) : (
            <Card>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
                {diff.added.length > 0 && <Pill color={T.greenDark} icon="plus">{diff.added.length} new</Pill>}
                {diff.changed.length > 0 && <Pill color={T.blue} icon="edit">{diff.changed.length} edited</Pill>}
                {diff.removed.length > 0 && <Pill color={T.red} icon="trash">{diff.removed.length} removed</Pill>}
                <Helper style={{ fontSize: 11 }}>vs live version {latest.version}</Helper>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 3, maxHeight: 260, overflowY: 'auto' }}>
                {diff.added.map((g, i) => <div key={'a' + i} style={{ fontSize: 11.5, color: T.greenDark, display: 'flex', gap: 7 }}><Icon name="plus" size={12} color={T.greenDark} />{changeLine(g)}</div>)}
                {diff.changed.map((g, i) => <div key={'c' + i} style={{ fontSize: 11.5, color: T.textSoft, display: 'flex', gap: 7 }}><Icon name="edit" size={12} color={T.blue} />{changeLine(g)}</div>)}
                {diff.removed.map((g, i) => <div key={'r' + i} style={{ fontSize: 11.5, color: T.red, display: 'flex', gap: 7 }}><Icon name="trash" size={12} color={T.red} />{changeLine(g)}</div>)}
              </div>
            </Card>
          )}
        </div>

        <div>
          <SectionTitle style={{ marginBottom: 9 }}>3. Go live</SectionTitle>
          <Card>
            <Field label="What changed in this release?" hint="Shows in the version history so anyone can see why a version exists.">
              <Input value={note} onChange={e => setNote(e.target.value)} placeholder="Added the four payroll videos" />
            </Field>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
              <Btn variant="success" icon="send" disabled={!cloud || blockers.length > 0 || publishing}
                onClick={() => setConfirming(true)}>
                {publishing ? 'Publishing…' : latest ? `Publish version ${latest.version + 1}` : 'Publish version 1'}
              </Btn>
              <Btn variant="outline" icon="download" onClick={() => download(`academy-${doc.product}-curriculum.json`, JSON.stringify(published, null, 2))}>Download curriculum.json</Btn>
              <Btn variant="outline" icon="copy" onClick={copySeed}>Copy as code</Btn>
              <Btn variant="ghost" icon="eye" onClick={() => setShowJson(true)} style={{ color: T.muted }}>View JSON</Btn>
            </div>
            {blockers.length > 0 && <Helper style={{ marginTop: 10, color: T.red }}>{plural(blockers.length, 'blocker')} above must be fixed first.</Helper>}
          </Card>
        </div>

        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 9 }}>
            <SectionTitle>Version history</SectionTitle>
            {cloud && <Btn variant="ghost" size="sm" icon="refresh" onClick={onRefresh} style={{ color: T.muted }}>Refresh</Btn>}
          </div>
          {!versions.length ? (
            <Card><Helper>Nothing published yet.</Helper></Card>
          ) : (
            <Card pad={0} style={{ overflow: 'hidden' }}>
              {versions.map((v, i) => (
                <div key={v.id || v.version} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderTop: i ? `1px solid ${T.borderSoft}` : 'none' }}>
                  <Pill color={i === 0 ? T.greenDark : T.mutedSoft}>{i === 0 ? 'Live' : 'v' + v.version}</Pill>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>{v.note || `Version ${v.version}`}</div>
                    <Helper style={{ fontSize: 10.5 }}>{fmtWhen(v.published_at)}{v.published_by_email ? ` · ${v.published_by_email}` : ''}</Helper>
                  </div>
                  <Helper style={{ fontSize: 10.5, whiteSpace: 'nowrap' }}>
                    {((v.doc && v.doc.courses) || []).length}m · {((v.doc && v.doc.courses) || []).reduce((s, c) => s + ((c.lessons || []).length), 0)}l
                  </Helper>
                  <Btn variant="outline" size="sm" icon="undo" onClick={() => onRollback(v)}>Load into draft</Btn>
                </div>
              ))}
            </Card>
          )}
        </div>
      </div>

      <Modal open={confirming} onClose={() => setConfirming(false)} title="Publish this curriculum?"
        footer={<>
          <Btn variant="outline" onClick={() => setConfirming(false)}>Cancel</Btn>
          <Btn variant="success" icon="send" onClick={() => { setConfirming(false); onPublish(note); setNote(''); }}>Publish</Btn>
        </>}>
        <Helper style={{ marginBottom: 12 }}>
          This becomes the live curriculum for <b>{productLabel}</b>: {plural(published.courses.length, 'module')}, {plural(published.courses.reduce((s, c) => s + c.lessons.length, 0), 'lesson')}, {plural(published.paths.length, 'learning path')}.
        </Helper>
        {issues.filter(i => i.severity === 'warn').length > 0 && (
          <Banner tone="warn" icon="alertTriangle" title={`${plural(issues.filter(i => i.severity === 'warn').length, 'warning')}, publishing anyway is fine`}>
            Mostly lessons without video yet. They will show the coming soon poster until footage is attached.
          </Banner>
        )}
        <Helper style={{ marginTop: 12 }}>Previous versions stay in the history, so this is reversible.</Helper>
      </Modal>

      <Modal open={showJson} onClose={() => setShowJson(false)} title="Published curriculum JSON" width={720}
        footer={<Btn variant="outline" onClick={() => setShowJson(false)}>Close</Btn>}>
        <Helper style={{ marginBottom: 10 }}>Exactly what a consumer receives. Internal production fields are stripped.</Helper>
        <pre style={{ margin: 0, fontSize: 10.5, lineHeight: 1.5, background: T.fieldBg, border: `1px solid ${T.borderSoft}`, borderRadius: T.radius, padding: 12, overflow: 'auto', maxHeight: '55vh', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
          {JSON.stringify(published, null, 2)}
        </pre>
      </Modal>
    </div>
  );
};

/* ===== learning paths ======================================================
   A path is a hand-picked playlist of individual videos, pulled from any
   module in any order, not a sequence of whole modules. A lesson stays
   1:1 with its module; only paths get this flexibility. */
const PathsScreen = ({ doc, edit, fireToast }) => {
  const paths = doc.paths || [];
  const [selId, setSelId] = useState(paths.length ? paths[0].id : null);
  const path = paths.find(p => p.id === selId) || null;
  const pathDnd = useDragOrder((f, t) => edit(d => { d.paths = moveItem(d.paths, f, t); }));

  const addPath = () => {
    const p = emptyPath();
    p.title = 'New learning path';
    edit(d => { d.paths.push(p); });
    setSelId(p.id);
  };
  const set = (patch) => edit(d => { const p = (d.paths || []).find(x => x.id === selId); if (p) Object.assign(p, patch); });
  const deletePath = (p) => {
    const snapshot = clone(doc.paths);
    edit(d => { d.paths = d.paths.filter(x => x.id !== p.id); });
    if (selId === p.id) setSelId(null);
    fireToast({ message: `Deleted "${p.title || 'path'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.paths = snapshot; }) } });
  };

  const inPath = (path ? path.lessonIds : []) || [];
  const entries = inPath.map(id => findLessonAnywhere(doc, id)).filter(Boolean);
  const moveLesson = (f, t) => set({ lessonIds: moveItem(inPath, f, t) });

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '280px minmax(0,1fr)', height: '100%', minHeight: 0 }}>
      <div style={{ borderRight: `1px solid ${T.border}`, background: T.card, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700 }}>Learning paths</div>
            <Helper style={{ fontSize: 10.5 }}>{plural(paths.length, 'path')}</Helper>
          </div>
          <Btn variant="soft" size="sm" icon="plus" onClick={addPath}>Path</Btn>
        </div>
        <div className="scroll" style={{ flex: 1, padding: 8 }}>
          {paths.length === 0 && <EmptyState icon="graduation" title="No paths yet" hint="A path is an ordered playlist of videos for one kind of person, for example new team member, or payroll specialist." action={<Btn variant="primary" size="sm" icon="plus" onClick={addPath}>Add a path</Btn>} />}
          {paths.map((p, i) => {
            const selected = p.id === selId;
            const missing = (p.lessonIds || []).filter(id => !findLessonAnywhere(doc, id)).length;
            return (
              <div key={p.id} {...pathDnd(i)} data-row onClick={() => setSelId(p.id)}
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 9px', marginBottom: 3, borderRadius: T.radius, cursor: 'pointer', background: selected ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selected) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selected) e.currentTarget.style.background = 'transparent'; }}>
                <Icon name="graduation" size={13} color={selected ? T.primary : T.mutedSoft} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title || 'Untitled path'}</div>
                  <div style={{ fontSize: 10, color: T.mutedSoft }}>{plural((p.lessonIds || []).length, 'video')}{missing ? ` · ${missing} broken` : ''}</div>
                </div>
                {missing > 0 && <Icon name="alertTriangle" size={12} color={T.red} />}
                <RowActions canUp={i > 0} canDown={i < paths.length - 1}
                  onUp={() => edit(d => { d.paths = moveItem(d.paths, i, i - 1); })}
                  onDown={() => edit(d => { d.paths = moveItem(d.paths, i, i + 1); })}
                  onDelete={() => deletePath(p)} />
              </div>
            );
          })}
        </div>
      </div>

      {!path ? (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <EmptyState icon="graduation" title="Pick a path" hint="Or add a new one to get started." />
        </div>
      ) : (
        <EditorShell eyebrow="Learning path" title={path.title || 'Untitled path'} icon="graduation" color={T.primary}>
          <Card>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <Field label="Title">
                <Input value={path.title || ''} onChange={e => set({ title: e.target.value })} placeholder="Getting started (new team member)" />
              </Field>
              <Field label="Who it is for" hint="Appears as a small line on the card, for example Everyone, first week.">
                <Input value={path.forRole || ''} onChange={e => set({ forRole: e.target.value })} placeholder="Everyone, first week" />
              </Field>
              <Field label="Blurb" hint="One sentence on why someone would take this path.">
                <Textarea rows={2} value={path.blurb || ''} onChange={e => set({ blurb: e.target.value })} placeholder="The essentials every new user needs before touching live client work." />
              </Field>
            </div>
          </Card>

          <Card>
            <SectionTitle style={{ marginBottom: 4 }}>Videos, in order</SectionTitle>
            <Helper style={{ marginBottom: 12 }}>Pull in any lesson from any module. Learners are pointed at the first one they have not finished, so the order matters.</Helper>
            {entries.length === 0
              ? <Helper style={{ marginBottom: 12 }}>Nothing added yet.</Helper>
              : <div style={{ display: 'flex', flexDirection: 'column', gap: 5, marginBottom: 12 }}>
                  {inPath.map((lid, i) => {
                    const found = findLessonAnywhere(doc, lid);
                    return (
                      <div key={lid + i} data-row style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '7px 9px', borderRadius: T.radius, border: `1px solid ${found ? T.borderSoft : withAlpha(T.red, 0.4)}`, background: found ? T.fieldBg : T.redSoft }}>
                        <span style={{ fontSize: 10.5, color: T.mutedSoft, width: 14, fontVariantNumeric: 'tabular-nums' }}>{i + 1}</span>
                        {found ? (
                          <>
                            <Icon name={found.course.icon || 'bookOpen'} size={13} color={trackColorOf(doc, found.course.track)} />
                            <span style={{ flex: 1, minWidth: 0, fontSize: 12, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{found.lesson.title || 'Untitled'}</span>
                            <span style={{ fontSize: 10.5, color: T.mutedSoft }}>{found.course.title}</span>
                          </>
                        ) : (
                          <span style={{ flex: 1, fontSize: 12, color: T.red }}>Deleted lesson, "{lid}". Remove it.</span>
                        )}
                        <RowActions canUp={i > 0} canDown={i < inPath.length - 1}
                          onUp={() => moveLesson(i, i - 1)} onDown={() => moveLesson(i, i + 1)}
                          onDelete={() => set({ lessonIds: inPath.filter((_, j) => j !== i) })} />
                      </div>
                    );
                  })}
                </div>}
            <Select value="" onChange={e => { if (e.target.value) set({ lessonIds: inPath.concat(e.target.value) }); }}>
              <option value="">Add a video to this path…</option>
              {(doc.courses || []).map(c => (
                <optgroup key={c.id} label={c.title || c.id}>
                  {(c.lessons || []).filter(l => !inPath.includes(l.id)).map(l => (
                    <option key={l.id} value={l.id}>{l.title || l.id}</option>
                  ))}
                </optgroup>
              ))}
            </Select>
          </Card>
        </EditorShell>
      )}
    </div>
  );
};

const NAV = [
  { id: 'curriculum', label: 'Curriculum', icon: 'layers' },
  { id: 'paths', label: 'Learning paths', icon: 'graduation' },
  { id: 'production', label: 'Production', icon: 'clipboardCheck' },
  { id: 'media', label: 'Media', icon: 'image' },
  { id: 'preview', label: 'Preview', icon: 'eye' },
  { id: 'publish', label: 'Publish', icon: 'send' },
];

const AcademyStudio = () => {
  const savedUI = lsRead(LS_UI, {});
  // LOCKED TO ONE PRODUCT. The switcher used to sit in the rail, and it is how
  // a night's work can land in the wrong curriculum: the B2C draft was edited
  // by accident once already. SPM is the only one anything reads today. The
  // other document is untouched in the database if it is ever needed again.
  const product = PRODUCTS[0].id;
  const productMeta = PRODUCTS.find(p => p.id === product) || PRODUCTS[0];
  const [docs, setDocs] = useState(() => {
    // Always normalise, even the freshly-seeded fallback: it's what runs the
    // paths courseIds-to-lessonIds migration (see normaliseDoc), and a first
    // load on a browser with no local cache used to skip it entirely.
    const stored = lsRead(LS_DOCS, null);
    const base = seedDocs();
    const out = {};
    PRODUCTS.forEach(p => { out[p.id] = normaliseDoc((stored && stored[p.id]) || base[p.id], p.id); });
    return out;
  });
  const [screen, setScreen] = useState('curriculum');
  const [sel, setSel] = useState({ kind: null });
  const [collapsed, setCollapsed] = useState(savedUI.collapsed || {});
  const [toast, setToast] = useState(null);
  const [assets, setAssets] = useState([]);
  const [uploading, setUploading] = useState(false);
  const toastTimer = useRef(null);

  // THE TOOL IS LOCKED. There used to be a "work in this browser instead" escape
  // hatch that ran the whole thing against localStorage without signing in. It
  // was there so the tool worked before any backend existed, and it meant anyone
  // with the URL could open and edit the curriculum. The backend exists now, so
  // the hatch is gone and the sign-in gate below is unconditional.
  const cloudConfigured = !!(CLOUD && CLOUD.isConfigured && CLOUD.isConfigured());
  const cloudReady = !!(CLOUD && CLOUD.isCloud && CLOUD.isCloud());
  const needsAuth = !!(CLOUD && CLOUD.needsAuth && CLOUD.needsAuth());
  const [cloudError, setCloudError] = useState('');
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(!needsAuth);
  const [email, setEmail] = useState('');
  const [authSent, setAuthSent] = useState(false);
  const [authErr, setAuthErr] = useState('');
  const [saveState, setSaveState] = useState('idle');   // idle | saving | saved | error | conflict
  const [conflictBy, setConflictBy] = useState('');
  const [versions, setVersions] = useState({});          // product → [rows]
  const [publishing, setPublishing] = useState(false);
  const stamps = useRef({});                             // product → server updated_at
  const loadedFromCloud = useRef({});                    // product → bool
  const skipNextSave = useRef(true);

  const fireToast = useCallback((t) => {
    const obj = typeof t === 'string' ? { message: t } : t;
    setToast(obj);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), obj && obj.action ? 5000 : 2400);
  }, []);

  const doc = docs[product] || seedDocs()[product];

  const edit = useCallback((mutator) => {
    setDocs(prev => {
      const next = { ...prev };
      const d = clone(prev[product]);
      mutator(d);
      next[product] = d;
      return next;
    });
  }, [product]);

  /* ---- local mirror (always) + shared draft (when connected) ------------ */
  useEffect(() => { lsWrite(LS_UI, { product, collapsed }); }, [product, collapsed]);

  useEffect(() => {
    lsWrite(LS_DOCS, docs);
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (!cloudReady || (needsAuth && !user)) return;
    if (!loadedFromCloud.current[product]) return;   // don't overwrite the server before we've read it
    setSaveState('saving');
    const t = setTimeout(() => {
      CLOUD.saveDraft(product, docs[product], stamps.current[product])
        .then(res => {
          if (res && res.conflict) {
            setSaveState('conflict');
            setConflictBy(res.updated_by_email || 'someone else');
            return;
          }
          stamps.current[product] = (res && res.updated_at) || stamps.current[product];
          setCloudError('');
          setSaveState('saved');
        })
        .catch((e) => {
          setSaveState('error');
          setCloudError((e && e.message) || 'Could not reach the shared curriculum');
        });
    }, 800);
    return () => clearTimeout(t);
  }, [docs, product, cloudReady, user, needsAuth]);

  /* ---- auth ------------------------------------------------------------- */
  useEffect(() => {
    if (!CLOUD || !cloudReady) { setAuthChecked(true); return; }
    let sub = null;
    CLOUD.getUser().then(u => { setUser(u); setAuthChecked(true); });
    if (CLOUD.onAuth) sub = CLOUD.onAuth(u => { setUser(u); setAuthChecked(true); });
    return () => { if (sub && sub.unsubscribe) sub.unsubscribe(); };
  }, [cloudReady]);

  /* ---- pull the shared draft + versions + assets ------------------------ */
  // The save effect needs the newest docs without re-subscribing, and seeding a
  // fresh backend needs whatever this browser already has.
  const docsRef = useRef(docs);
  useEffect(() => { docsRef.current = docs; }, [docs]);

  const pullProduct = useCallback((pid) => {
    if (!cloudReady || (needsAuth && !user)) return;
    CLOUD.loadDraft(pid).then(row => {
      if (row && row.doc) {
        stamps.current[pid] = row.updated_at;
        skipNextSave.current = true;
        setDocs(prev => ({ ...prev, [pid]: normaliseDoc(row.doc, pid) }));
        loadedFromCloud.current[pid] = true;
      } else {
        // Nothing shared yet — seed the backend from what's in this browser so
        // the first person to open the tool populates the team's draft.
        stamps.current[pid] = null;
        loadedFromCloud.current[pid] = true;
        CLOUD.saveDraft(pid, docsRef.current[pid], null)
          .then(res => { if (res && res.updated_at) stamps.current[pid] = res.updated_at; })
          .catch(e => setCloudError((e && e.message) || 'Could not write to the shared curriculum'));
      }
    }).catch(e => {
      loadedFromCloud.current[pid] = true;
      setCloudError((e && e.message) || 'Could not read the shared curriculum');
    });
    CLOUD.listVersions(pid).then(rows => setVersions(v => ({ ...v, [pid]: rows || [] }))).catch(() => {});
  }, [cloudReady, needsAuth, user]);

  useEffect(() => {
    if (!cloudReady || (needsAuth && !user)) return;
    PRODUCTS.forEach(p => { if (!loadedFromCloud.current[p.id]) pullProduct(p.id); });
  }, [cloudReady, needsAuth, user, pullProduct]);

  // Media works the same whether or not the shared backend is up, only gated
  // on sign-in.
  useEffect(() => {
    if (!CLOUD) return;
    if (cloudReady && needsAuth && !user) return;
    CLOUD.listAssets().then(a => setAssets(a || [])).catch(() => {});
  }, [cloudReady, needsAuth, user]);

  const owners = useMemo(() => {
    const set = {};
    allLessons(doc).forEach(({ lesson }) => {
      const o = ((lesson.production && lesson.production.owner) || '').trim();
      if (o) set[o] = true;
    });
    return Object.keys(set).sort();
  }, [doc]);

  /* ---- selection helpers ----------------------------------------------- */
  const jumpTo = useCallback((target) => {
    if (!target) return;
    if (target.kind === 'path') { setScreen('paths'); return; }
    setScreen('curriculum');
    if (target.kind === 'lesson') {
      setCollapsed(c => {
        const n = { ...c };
        const course = findCourse(doc, target.courseId);
        if (course) { n[target.courseId] = false; n[course.track] = false; }
        return n;
      });
      setSel({ kind: 'lesson', id: target.id, courseId: target.courseId });
    } else if (target.kind === 'course') {
      const course = findCourse(doc, target.id);
      if (course) setCollapsed(c => ({ ...c, [course.track]: false }));
      setSel({ kind: 'course', id: target.id });
    } else {
      setSel({ kind: 'track', id: target.id });
    }
  }, [doc]);
  const jumpToLesson = useCallback((courseId, lessonId) => jumpTo({ kind: 'lesson', id: lessonId, courseId }), [jumpTo]);

  /* ---- media -------------------------------------------------------------
     Backed by CLOUD.listAssets/saveAsset/deleteAsset, already implemented in
     resources/academy-cloud.js. Videos are never uploaded here, they live on
     YouTube/Vimeo/Loom; this is for thumbnails, checklists and screenshots. */
  const onUpload = (files) => {
    if (!CLOUD) { fireToast({ message: 'Media needs resources/academy-cloud.js, it did not load', tone: 'error' }); return; }
    setUploading(true);
    const readOne = (file) => new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve({ name: file.name, mime: file.type || 'application/octet-stream', dataUri: fr.result, product });
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(file);
    });
    Promise.all(files.map(readOne))
      .then(recs => Promise.all(recs.filter(Boolean).map(r => CLOUD.saveAsset(r).catch(() => null))))
      .then(saved => {
        const ok = (saved || []).filter(Boolean);
        if (ok.length) setAssets(prev => ok.concat(prev.filter(a => !ok.some(s => s.id === a.id))));
        fireToast(ok.length ? `${plural(ok.length, 'file')} uploaded` : { message: 'Upload failed', tone: 'error' });
      })
      .then(() => setUploading(false), () => setUploading(false));
  };
  const onDeleteAsset = (a) => {
    if (!CLOUD) return;
    CLOUD.deleteAsset(a.id).then(() => {
      setAssets(prev => prev.filter(x => x.id !== a.id));
      fireToast('File deleted');
    }).catch(() => fireToast({ message: 'Could not delete', tone: 'error' }));
  };

  /* ---- publish / rollback ---------------------------------------------- */
  const latest = (versions[product] || [])[0] || null;

  const onPublish = (note) => {
    if (!cloudReady) {
      // Was a bare `return` once, so a click while disconnected did nothing
      // at all and looked exactly like a click that worked.
      fireToast({ message: 'You are not connected to the shared curriculum, so nothing was sent.', tone: 'error' });
      return;
    }
    setPublishing(true);
    CLOUD.publishVersion(product, toPublished(doc), note)
      .then(row => {
        setVersions(v => ({ ...v, [product]: [row].concat(v[product] || []) }));
        fireToast(`Published version ${row.version}`);
      })
      .catch(e => fireToast({ message: 'Publish failed, ' + plainError(e && e.message), tone: 'error' }))
      .then(() => setPublishing(false));
  };

  const onRollback = (v) => {
    const snapshot = clone(doc);
    // A published snapshot has no production metadata, keep what the draft
    // already knows so loading an old version does not wipe the team's
    // status board.
    const merged = normaliseDoc(clone(v.doc), product);
    const prodBy = {};
    allLessons(doc).forEach(({ lesson }) => { if (lesson.production) prodBy[lesson.id] = lesson.production; });
    merged.courses.forEach(c => c.lessons.forEach(l => { if (prodBy[l.id]) l.production = prodBy[l.id]; }));
    setDocs(prev => ({ ...prev, [product]: merged }));
    fireToast({ message: `Loaded version ${v.version} into your draft`, action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
  };

  /* ---- auth gate ------------------------------------------------------- */
  const [password, setPassword] = useState('');
  const [signingIn, setSigningIn] = useState(false);
  const passwordMode = !!(CLOUD && CLOUD.isPasswordMode && CLOUD.isPasswordMode());

  const doSignIn = () => {
    setAuthErr('');
    const e = email.trim();
    if (!e) return;
    if (passwordMode) {
      if (!password) { setAuthErr('Enter your password'); return; }
      setSigningIn(true);
      CLOUD.signInWithPassword(e, password)
        .then(() => setSigningIn(false))
        .catch(err => {
          setSigningIn(false);
          // GoTrue says "Invalid login credentials" for a wrong password AND for
          // an address with no account, on purpose. Do not guess which.
          const m = (err && err.message) || '';
          setAuthErr(/invalid login/i.test(m) ? 'That email and password do not match an account.' : (m || 'Could not sign in'));
        });
      return;
    }
    CLOUD.signIn(e).then(() => setAuthSent(true)).catch(err => setAuthErr((err && err.message) || 'Could not send the link'));
  };

  /* ---- what is attached but not live yet --------------------------------
     This cost a night on 27 Aug 2026. Rishav attached 10 videos, saw the green
     video icon on every one of them, and reasonably read that as "live". It
     means "attached to the draft". Nothing reaches a learner until Publish,
     and the tool said so nowhere except on a screen he had no reason to open.
     "Saved" and "live" are two different things here, so the header now says
     which one you have, and offers the missing step in one click. */
  // What learners can watch this second, straight from the published version.
  const live = useMemo(() => liveVideoMap(latest ? latest.doc : null), [latest]);
  const waiting = useMemo(() => waitingLessons(doc, live), [doc, live]);
  const draftAsPublished = useMemo(() => toPublished(doc), [doc]);
  const pending = useMemo(() => diffDocs(latest ? latest.doc : null, draftAsPublished), [latest, draftAsPublished]);
  const countWatchable = (d) => (d ? d.courses || [] : []).reduce((n, c) =>
    n + (c.lessons || []).filter(l => l.status === 'published').length, 0);

  /* ---- do not lose work to a closed tab ---------------------------------
     Two different losses, one dialog. An edit that has not reached the server
     yet is gone for good; work that is saved but unpublished is safe, but the
     person almost certainly meant to publish it. The browser picks the wording,
     so all we control is when it appears. */
  const unsaved = saveState === 'saving' || saveState === 'error' || saveState === 'conflict';
  const unpublished = pending.total > 0;
  useEffect(() => {
    if (!unsaved && !unpublished) return;
    const onBeforeUnload = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
    window.addEventListener('beforeunload', onBeforeUnload);
    return () => window.removeEventListener('beforeunload', onBeforeUnload);
  }, [unsaved, unpublished]);

  /* ======================================================================
     EVERY HOOK MUST BE ABOVE THIS LINE. What follows are early returns for the
     sign-in gate, so a hook added below runs on some renders and not others,
     and React throws "Rendered more hooks than during the previous render".
     That has now happened twice. Put new useState/useEffect/useMemo up there.
     ====================================================================== */
  if (!cloudConfigured) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <Card style={{ width: '100%', maxWidth: 420, textAlign: 'center' }} pad={28}>
          <SectionTitle style={{ fontSize: 16 }}>Not configured</SectionTitle>
          <Helper style={{ marginTop: 8 }}>
            This Studio has no backend set up, so there is nothing to sign in to and nothing to
            publish. See <b>docs/ACADEMY_STUDIO_SETUP.md</b>.
          </Helper>
        </Card>
      </div>
    );
  }

  if (needsAuth && !authChecked) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: 24, height: 24, borderRadius: '50%', border: `2.5px solid ${T.border}`, borderTopColor: T.primary, animation: 'spin 700ms linear infinite' }} />
      </div>
    );
  }

  if (needsAuth && !user) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <Card style={{ width: '100%', maxWidth: 400, textAlign: 'center' }} pad={28}>
          <div style={{ width: 42, height: 42, margin: '0 auto 14px', borderRadius: 12, background: T.primarySoft, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="graduation" size={21} color={T.primary} />
          </div>
          <SectionTitle style={{ fontSize: 17 }}>Sole Academy Studio</SectionTitle>
          <Helper style={{ margin: '8px 0 18px' }}>
            {passwordMode
              ? "Sign in to open the team's curriculum. Rishabh has your password."
              : "Sign in to open the team's curriculum. We'll email you a one-time link."}
          </Helper>
          {authSent ? (
            <Banner tone="success" icon="mail" title="Check your email">
              We sent a sign-in link to <b>{email.trim()}</b>. Open it on this device.
            </Banner>
          ) : (
            <form onSubmit={e => { e.preventDefault(); doSignIn(); }}>
              <Input type="email" autoComplete="username" value={email} onChange={e => setEmail(e.target.value)}
                placeholder="you@soleapp.com.au" style={{ textAlign: 'center' }} />
              {passwordMode && (
                <Input type="password" autoComplete="current-password" value={password}
                  onChange={e => setPassword(e.target.value)} placeholder="Password"
                  style={{ textAlign: 'center', marginTop: 8 }} />
              )}
              {/* No icon in password mode: the `lock` glyph in this file's icon set
                  draws as a plain circle at button size, which reads as an info
                  badge rather than a padlock. A wrong glyph passes every check
                  except looking at it. */}
              <Btn variant="primary" size="lg" icon={passwordMode ? undefined : 'mail'} type="submit"
                disabled={signingIn} style={{ width: '100%', marginTop: 10 }}>
                {passwordMode ? (signingIn ? 'Signing in…' : 'Sign in') : 'Email me a link'}
              </Btn>
              {authErr && <Helper style={{ color: T.red, marginTop: 10 }}>{authErr}</Helper>}
              <Helper style={{ fontSize: 10.5, marginTop: 12 }}>
                {passwordMode
                  ? 'Only people Rishabh has set up can sign in. Ask him if you need a password.'
                  : "Only teammates who've been invited can sign in."}
              </Helper>
            </form>
          )}
        </Card>
      </div>
    );
  }

  /* ---- the editor pane ------------------------------------------------- */
  const renderEditor = () => {
    if (sel.kind === 'lesson') {
      const course = findCourse(doc, sel.courseId);
      const lesson = findLesson(doc, sel.courseId, sel.id);
      if (course && lesson) return (
        <LessonEditor doc={doc} course={course} lesson={lesson} live={live} edit={edit} fireToast={fireToast}
          setSel={setSel} onPublish={() => setScreen('publish')} publishing={publishing} owners={owners} />
      );
    }
    if (sel.kind === 'course') {
      const course = findCourse(doc, sel.id);
      if (course) return <CourseEditor doc={doc} course={course} edit={edit} fireToast={fireToast} setSel={setSel} />;
    }
    if (sel.kind === 'track') {
      const track = trackById(doc, sel.id);
      if (track) return <TrackEditor doc={doc} track={track} edit={edit} />;
    }
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <EmptyState icon="video" title="Pick a track, module or lesson on the left"
          hint="Or add a new one. Open a lesson, paste the YouTube link, then press Publish when you're ready." />
      </div>
    );
  };


  const saveLabel = saveState === 'saving' ? 'Saving…'
    : saveState === 'error' ? 'Not saved'
    : saveState === 'conflict' ? 'Out of date'
    : 'Saved';
  const saveColor = saveState === 'error' || saveState === 'conflict' ? T.red : saveState === 'saving' ? T.amber : T.greenDark;

  const liveCount = countWatchable(latest ? latest.doc : null);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg }}>
      <header style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '11px 20px', background: T.card, borderBottom: `1px solid ${T.border}`, flexWrap: 'wrap' }}>
        <span style={{ width: 26, height: 26, borderRadius: 8, background: T.primary, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name="graduation" size={14} color="#fff" />
        </span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: -0.2 }}>Academy Studio</div>
          <div style={{ fontSize: 10, color: T.mutedSoft }}>Sole Practice Manager</div>
        </div>

        {/* The scoreboard. Two numbers, and the second one is the whole reason
            this header exists: work that is saved is not work that is live. */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginLeft: 8, paddingLeft: 14, borderLeft: `1px solid ${T.borderSoft}` }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 700, color: T.greenDark }}>
            <Icon name="checkCircle" size={14} color={T.greenDark} />{liveCount} live
          </span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 700, color: waiting.length ? T.amber : T.mutedSoft }}>
            <Icon name="alertTriangle" size={14} color={waiting.length ? T.amber : T.mutedSoft} />{waiting.length} not live
          </span>
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, fontWeight: 600, color: saveColor }}>
          <span style={{ width: 6, height: 6, borderRadius: 999, background: saveColor }} />{saveLabel}
        </div>
        <Btn variant="outline" size="sm" icon="eye" onClick={() => window.open('academy.html', '_blank', 'noopener')}>See the Academy</Btn>
        <Btn variant={unpublished ? 'success' : 'outline'} size="sm" icon="send"
          disabled={!unpublished} onClick={() => setScreen('publish')}>
          {unpublished ? 'Publish' : 'Everything is live'}
        </Btn>
        {user && (
          <button data-btn onClick={() => CLOUD.signOut().then(() => setUser(null))} title={user.email + ' · sign out'} aria-label="Sign out"
            style={{ border: 'none', background: 'transparent', padding: 4, color: T.mutedSoft, display: 'flex' }}><Icon name="logout" size={14} /></button>
        )}
      </header>

      {/* The missing step, made impossible to miss. It only shows when the draft
          really is ahead of what learners can see, and it goes the moment you
          publish. */}
      {cloudReady && unpublished && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
          padding: '12px 20px', background: T.amberSoft, borderBottom: `1px solid ${withAlpha(T.amber, 0.30)}` }}>
          <Icon name="alertTriangle" size={16} color={T.amber} />
          <div style={{ flex: 1, minWidth: 240, fontSize: 13, color: T.text }}>
            <b>{waiting.length > 0
              ? `${plural(waiting.length, 'video')} saved but not live yet.`
              : 'You have edits that are not live yet.'}</b>
            <span style={{ color: T.muted }}> Nobody can see {waiting.length === 1 ? 'it' : 'them'} until you publish.</span>
          </div>
          <Btn variant="success" size="sm" icon="send" disabled={publishing}
            onClick={() => setScreen('publish')}>Publish now</Btn>
        </div>
      )}

      {cloudError && saveState !== 'conflict' && (
        <div style={{ padding: '10px 20px 0' }}>
          <Banner tone="warn" icon="alertTriangle" title="Cannot reach the shared curriculum"
            action={<Btn variant="outline" size="sm" onClick={() => setCloudError('')}>Dismiss</Btn>}>
            Your work is still saved in this browser, so nothing is lost, but it is not reaching the team
            and it cannot be published. Check your connection, then reload. Details: <span style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 10.5 }}>{cloudError}</span>
          </Banner>
        </div>
      )}

      {saveState === 'conflict' && (
        <div style={{ padding: '10px 20px', background: T.redSoft, borderBottom: `1px solid ${withAlpha(T.red, 0.25)}` }}>
          <Banner tone="danger" icon="alertTriangle" title={`${conflictBy} saved changes while you were editing`}
            action={<div style={{ display: 'flex', gap: 7 }}>
              <Btn variant="outline" size="sm" icon="refresh" onClick={() => {
                loadedFromCloud.current[product] = false;
                setSaveState('idle');
                pullProduct(product);
                fireToast('Reloaded the shared version');
              }}>Load theirs</Btn>
              <Btn variant="danger" size="sm" onClick={() => {
                stamps.current[product] = null;   // force-win the next write
                setSaveState('idle');
                fireToast('Your next edit will overwrite theirs');
              }}>Keep mine</Btn>
            </div>}>
            To avoid clobbering their work, saving has paused. Load their version, which loses your unsaved edits, or keep yours and overwrite.
          </Banner>
        </div>
      )}

      <div style={{ display: 'flex', flex: 1, minHeight: 0 }}>
        <nav style={{ width: 168, flexShrink: 0, background: T.card, borderRight: `1px solid ${T.border}`, padding: '10px 8px', display: 'flex', flexDirection: 'column', gap: 2 }}>
          {NAV.map(n => {
            const active = screen === n.id;
            return (
              <button key={n.id} data-btn onClick={() => setScreen(n.id)}
                style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '8px 10px', borderRadius: T.radius, border: 'none',
                  background: active ? T.primarySoft : 'transparent', color: active ? T.primaryDark : T.textSoft, fontSize: 12.5, fontWeight: active ? 700 : 500, textAlign: 'left' }}>
                <Icon name={n.icon} size={15} color={active ? T.primaryDark : T.mutedSoft} />
                {n.label}
              </button>
            );
          })}
        </nav>

        {screen === 'curriculum' && (
          <div style={{ display: 'grid', gridTemplateColumns: '280px minmax(0,1fr)', flex: 1, minHeight: 0 }}>
            <div style={{ background: T.card, borderRight: `1px solid ${T.border}`, minHeight: 0 }}>
              <CurriculumTree doc={doc} live={live} sel={sel} setSel={setSel} edit={edit} fireToast={fireToast} collapsed={collapsed} setCollapsed={setCollapsed} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>{renderEditor()}</div>
          </div>
        )}
        {screen === 'paths' && <PathsScreen doc={doc} edit={edit} fireToast={fireToast} />}
        {screen === 'production' && <ProductionScreen doc={doc} edit={edit} jumpToLesson={jumpToLesson} owners={owners} />}
        {screen === 'media' && <MediaScreen assets={assets} onUpload={onUpload} onDelete={onDeleteAsset} cloud={cloudReady} fireToast={fireToast} busy={uploading} doc={doc} />}
        {screen === 'preview' && <PreviewScreen doc={doc} />}
        {screen === 'publish' && (
          <PublishScreen doc={doc} productLabel={productMeta.label} versions={versions[product] || []} latest={latest}
            onPublish={onPublish} onRollback={onRollback} onJump={jumpTo} cloud={cloudReady} fireToast={fireToast}
            publishing={publishing} onRefresh={() => pullProduct(product)} />
        )}
      </div>

      <Toast toast={toast} />
    </div>
  );
};


class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 28 }}>
        <div style={{ background: T.redSoft, border: `1px solid ${T.red}`, borderRadius: T.radiusCard, padding: 20, maxWidth: 760 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: T.red, marginBottom: 8 }}>Something broke</div>
          <div style={{ fontSize: 12.5, marginBottom: 12 }}>
            Your work is saved in this browser, so a refresh should bring it back. If it keeps happening, send this message to Rishabh.
          </div>
          <pre style={{ margin: 0, fontSize: 11, whiteSpace: 'pre-wrap', color: T.textSoft, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
            {String(this.state.error && this.state.error.stack || this.state.error)}
          </pre>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><AcademyStudio /></ErrorBoundary>
);
</script>
</body>
</html>
