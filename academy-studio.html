            </div>
          )
        )}
      </div>
    </div>
  );
};

/* ===== media library ======================================================
   Thumbnails, checklists and screenshots — the files that go WITH lessons.
   Videos are never uploaded here; they live on YouTube/Vimeo/Loom and the lesson
   stores the link. Shared across both products on purpose: a logo or a checklist
   is rarely product-specific. */
const MediaScreen = ({ assets, onUpload, onDelete, cloud, fireToast, busy, doc }) => {
  const [q, setQ] = useState('');
  const [pendingDelete, setPendingDelete] = useState(null);
  const fileRef = useRef(null);
  const query = q.trim().toLowerCase();
  const shown = assets.filter(a => !query || ((a.name || '') + ' ' + (a.tags || '')).toLowerCase().includes(query));

  // Deleting a file removes the bytes from storage — there's nothing to undo, so
  // this confirms instead. It also checks whether any lesson still links to the
  // file, because a silent 404 in a published lesson is the worst outcome here.
  const usedBy = (asset) => {
    const url = asset && (asset.url || asset.public_url);
    if (!url || !doc) return [];
    const hits = [];
    (doc.courses || []).forEach(c => (c.lessons || []).forEach(l => {
      const inResources = (l.resources || []).some(r => r.href === url);
      const inThumb = l.thumbUrl === url;
      if (inResources || inThumb) hits.push(`${l.title || 'Untitled lesson'} (${c.title || 'Untitled course'})`);
    }));
    return hits;
  };

  const copy = (url) => {
    if (!url) return;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => fireToast('Link copied'), () => fireToast({ message: 'Could not copy', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available', tone: 'warn' });
  };

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 14, marginBottom: 16, flexWrap: 'wrap' }}>
        <div>
          <SectionTitle style={{ fontSize: 16 }}>Media</SectionTitle>
          <Helper style={{ marginTop: 2, maxWidth: 560 }}>
            Thumbnails, checklists and screenshots. Upload once, paste the link into any lesson's Downloads. Shared across both products.
          </Helper>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.docx,.xlsx,.csv" style={{ display: 'none' }}
            onChange={e => { const fs = Array.from(e.target.files || []); if (fs.length) onUpload(fs); e.target.value = ''; }} />
          <Btn variant="primary" size="sm" icon="upload" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy}>
            {busy ? 'Uploading…' : 'Upload files'}
          </Btn>
        </div>
      </div>

      {!cloud && (
        <Banner tone="warn" icon="alertTriangle" title="Local only — these files are in this browser" style={{ marginBottom: 16 }}>
          Uploads are held in this browser until the shared backend is connected, so teammates can't see them and a cleared cache loses them. Fine for trying things out; connect Supabase before you rely on it. See <b>docs/ACADEMY_STUDIO_SETUP.md</b>.
        </Banner>
      )}

      <div style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 11px', border: `1px solid ${T.border}`, borderRadius: T.radius, background: T.card, maxWidth: 300, marginBottom: 16 }}>
        <Icon name="search" size={13} color={T.muted} />
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search files…"
          style={{ flex: 1, minWidth: 0, border: 'none', background: 'transparent', outline: 'none', fontSize: 12.5 }} />
      </div>

      {shown.length === 0 ? (
        <Card><EmptyState icon="image" title={assets.length ? 'Nothing matches' : 'No files yet'}
          hint={assets.length ? 'Try a different search.' : 'Upload a checklist PDF or a custom thumbnail and it appears here, ready to link from any lesson.'}
          action={!assets.length ? <Btn variant="soft" size="sm" icon="upload" onClick={() => fileRef.current && fileRef.current.click()}>Upload a file</Btn> : null} /></Card>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(170px,1fr))', gap: 13 }}>
          {shown.map(a => {
            const url = a.url || a.public_url || a.dataUri;
            const isImg = /^image\//.test(a.mime || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(a.name || '');
            return (
              <Card key={a.id} pad={0} style={{ overflow: 'hidden' }}>
                <div style={{ height: 104, background: T.fieldBg, display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: `1px solid ${T.borderSoft}` }}>
                  {isImg && url
                    ? <img src={url} alt={a.name || ''} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
                    : <Icon name="fileText" size={26} color={T.mutedSoft} />}
                </div>
                <div style={{ padding: 10 }}>
                  <div title={a.name} style={{ fontSize: 11.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{a.name || 'Untitled'}</div>
                  <div style={{ fontSize: 10, color: T.mutedSoft, marginTop: 2 }}>{a.created_by_email || ''}</div>
                  <div style={{ display: 'flex', gap: 5, marginTop: 9 }}>
                    <Btn variant="outline" size="sm" icon="copy" onClick={() => copy(url)} style={{ flex: 1 }}>Link</Btn>
                    <Btn variant="ghost" size="sm" icon="trash" aria-label="Delete" onClick={() => setPendingDelete(a)} style={{ color: T.mutedSoft, padding: '5px 7px' }} />
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <Modal open={!!pendingDelete} onClose={() => setPendingDelete(null)} title="Delete this file?"
        footer={<>
          <Btn variant="outline" onClick={() => setPendingDelete(null)}>Cancel</Btn>
          <Btn variant="danger" icon="trash" onClick={() => { onDelete(pendingDelete); setPendingDelete(null); }}>Delete for good</Btn>
        </>}>
        <Helper>
          <b>{pendingDelete && pendingDelete.name}</b> will be removed permanently. Unlike everything else in the Studio, this one can't be undone.
        </Helper>
        {pendingDelete && usedBy(pendingDelete).length > 0 && (
          <Banner tone="danger" icon="alertTriangle" title={`Still used by ${plural(usedBy(pendingDelete).length, 'lesson')}`} style={{ marginTop: 12 }}>
            Those links will break for learners. Point them somewhere else first:
            <div style={{ marginTop: 6 }}>
              {usedBy(pendingDelete).map((s, i) => <div key={i} style={{ fontSize: 11 }}>· {s}</div>)}
            </div>
          </Banner>
        )}
      </Modal>
    </div>
  );
};

/* ===== readiness + publish ================================================ */
const IssuesPanel = ({ issues, onJump }) => {
  const [open, setOpen] = useState({});
  const blocks = issues.filter(i => i.severity === 'block');
  const warns = issues.filter(i => i.severity === 'warn');

  const groups = [];
  issues.forEach(i => {
    let g = groups.find(x => x.category === i.category && x.severity === i.severity);
    if (!g) { g = { category: i.category, severity: i.severity, items: [] }; groups.push(g); }
    g.items.push(i);
  });
  groups.sort((a, b) => (a.severity === b.severity ? b.items.length - a.items.length : a.severity === 'block' ? -1 : 1));

  if (!issues.length) return (
    <Banner tone="success" icon="checkCircle" title="Everything checks out">
      No blockers and nothing missing. This curriculum is ready to publish.
    </Banner>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {blocks.length > 0 && <Pill color={T.red} icon="xCircle">{plural(blocks.length, 'blocker')}</Pill>}
        {warns.length > 0 && <Pill color={T.amber} icon="alertTriangle">{plural(warns.length, 'warning')}</Pill>}
      </div>
      {blocks.length > 0 && (
        <Banner tone="danger" icon="xCircle" title="Fix these before publishing">
          Each of these would visibly break something for a learner, so publishing is held until they're resolved.
        </Banner>
      )}
      <Card pad={0} style={{ overflow: 'hidden' }}>
        {groups.map((g, gi) => {
          const key = g.severity + ':' + g.category;
          const isOpen = !!open[key];
          const tone = g.severity === 'block' ? T.red : T.amber;
          return (
            <div key={key} style={{ borderTop: gi ? `1px solid ${T.borderSoft}` : 'none' }}>
              <button data-btn onClick={() => setOpen(o => ({ ...o, [key]: !o[key] }))}
                style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', border: 'none', background: 'transparent', padding: '10px 14px', textAlign: 'left' }}>
                <Icon name={isOpen ? 'chevronDown' : 'chevronRight'} size={13} color={T.mutedSoft} />
                <Icon name={g.severity === 'block' ? 'xCircle' : 'alertTriangle'} size={14} color={tone} />
                <span style={{ flex: 1, fontSize: 12.5, fontWeight: 600 }}>{g.category}</span>
                <Pill color={tone}>{g.items.length}</Pill>
              </button>
              {isOpen && (
                <div style={{ padding: '0 14px 10px 44px' }}>
                  {g.items.map(i => (
                    <div key={i.id} style={{ padding: '7px 0', borderTop: `1px solid ${T.borderSoft}` }}>
                      <button data-btn onClick={() => onJump(i.target)}
                        style={{ border: 'none', background: 'transparent', padding: 0, textAlign: 'left', fontSize: 12, fontWeight: 600, color: T.primary }}>
                        {i.label} →
                      </button>
                      <Helper style={{ fontSize: 11, marginTop: 2 }}>{i.detail}</Helper>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </Card>
    </div>
  );
};

const indexDoc = (d) => {
  const map = {};
  ((d && d.categories) || []).forEach(c => { map['category:' + c.id] = { kind: 'Category', label: c.label || c.id, obj: c }; });
  ((d && d.courses) || []).forEach(c => {
    map['course:' + c.id] = { kind: 'Course', label: c.title || c.id, obj: { ...c, lessons: (c.lessons || []).map(l => l.id) } };
    (c.lessons || []).forEach(l => { map['lesson:' + l.id] = { kind: 'Lesson', label: l.title || l.id, obj: l, parent: c.title || c.id }; });
  });
  ((d && d.paths) || []).forEach(p => { map['path:' + p.id] = { kind: 'Path', label: p.title || p.id, obj: p }; });
  return map;
};
const diffDocs = (a, b) => {
  const A = indexDoc(a), B = indexDoc(b);
  const added = [], removed = [], changed = [];
  Object.keys(B).forEach(k => {
    if (!A[k]) added.push(B[k]);
    else if (JSON.stringify(A[k].obj) !== JSON.stringify(B[k].obj)) changed.push(B[k]);
  });
  Object.keys(A).forEach(k => { if (!B[k]) removed.push(A[k]); });
  return { added, removed, changed, total: added.length + removed.length + changed.length };
};

const PublishScreen = ({ doc, product, productLabel, versions, latest, onPublish, onRollback, onJump, cloud, fireToast, publishing, onRefresh }) => {
  const issues = useMemo(() => computeIssues(doc), [doc]);
  const blockers = issues.filter(i => i.severity === 'block');
  const published = useMemo(() => toPublished(doc), [doc]);
  const diff = useMemo(() => diffDocs(latest ? latest.doc : null, published), [latest, published]);
  const [note, setNote] = useState('');
  const [confirming, setConfirming] = useState(false);
  const [showJson, setShowJson] = useState(false);

  const download = (filename, text, mime) => {
    try {
      const blob = new Blob([text], { type: mime || 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (_) { fireToast({ message: 'Download failed in this browser', tone: 'error' }); }
  };

  const asSeedCode = () => {
    const cats = published.categories.map(c => ({ id: c.id, label: c.label, icon: c.icon, color: c.color, blurb: c.blurb }));
    const courses = published.courses.map(c => ({ id: c.id, title: c.title, category: c.category, level: c.level, summary: c.summary, lessons: c.lessons }));
    const popular = published.courses.filter(c => c.popular).map(c => c.id);
    return [
      '// Generated by Sole Academy Studio — ' + productLabel + ' — ' + new Date().toISOString(),
      '// Paste over the matching consts in index.html. See docs/ACADEMY_INTEGRATION.md.',
      'const ACADEMY_CATEGORIES = ' + JSON.stringify(cats, null, 2) + ';',
      'const ACADEMY_COURSES = ' + JSON.stringify(courses, null, 2) + ';',
      'const ACADEMY_POPULAR = ' + JSON.stringify(popular) + ';',
      'const LEARNING_PATHS = ' + JSON.stringify(published.paths, null, 2) + ';',
    ].join('\n\n');
  };
  const copySeed = () => {
    const text = asSeedCode();
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => fireToast('Seed code copied'), () => fireToast({ message: 'Could not copy', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available', tone: 'warn' });
  };

  const changeLine = (g) => `${g.kind} · ${g.label}${g.parent ? ` (in ${g.parent})` : ''}`;

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ marginBottom: 16 }}>
        <SectionTitle style={{ fontSize: 16 }}>Publish</SectionTitle>
        <Helper style={{ marginTop: 2, maxWidth: 620 }}>
          Publishing takes a snapshot of this curriculum and makes it the live one for <b>{productLabel}</b>. Your draft keeps working after — nothing you edit reaches learners until you publish again.
        </Helper>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 18, maxWidth: 820 }}>
        <div>
          <SectionTitle style={{ marginBottom: 9 }}>1 · Readiness</SectionTitle>
          <IssuesPanel issues={issues} onJump={onJump} />
        </div>

        <div>
          <SectionTitle style={{ marginBottom: 9 }}>2 · What's changing</SectionTitle>
          {!cloud ? (
            <Banner tone="warn" icon="alertTriangle" title="Not connected — publishing is off">
              Publishing needs the shared backend so the live app has somewhere to read from. Until then, use <b>Download curriculum.json</b> below and hand the file over. See <b>docs/ACADEMY_STUDIO_SETUP.md</b>.
            </Banner>
          ) : !latest ? (
            <Banner tone="accent" icon="send" title="Nothing published yet">
              This would be version 1 — {plural(published.courses.length, 'course')}, {plural(published.courses.reduce((s, c) => s + c.lessons.length, 0), 'lesson')} and {plural(published.paths.length, 'learning path')}.
            </Banner>
          ) : diff.total === 0 ? (
            <Banner tone="info" icon="checkCircle" title={`No changes since version ${latest.version}`}>
              Your draft matches what's live. Published {fmtWhen(latest.published_at)}{latest.published_by_email ? ` by ${latest.published_by_email}` : ''}.
            </Banner>
          ) : (
            <Card>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
                {diff.added.length > 0 && <Pill color={T.greenDark} icon="plus">{diff.added.length} new</Pill>}
                {diff.changed.length > 0 && <Pill color={T.blue} icon="edit">{diff.changed.length} edited</Pill>}
                {diff.removed.length > 0 && <Pill color={T.red} icon="trash">{diff.removed.length} removed</Pill>}
                <Helper style={{ fontSize: 11 }}>vs live version {latest.version}</Helper>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 3, maxHeight: 260, overflowY: 'auto' }}>
                {diff.added.map((g, i) => <div key={'a' + i} style={{ fontSize: 11.5, color: T.greenDark, display: 'flex', gap: 7 }}><Icon name="plus" size={12} color={T.greenDark} />{changeLine(g)}</div>)}
                {diff.changed.map((g, i) => <div key={'c' + i} style={{ fontSize: 11.5, color: T.textSoft, display: 'flex', gap: 7 }}><Icon name="edit" size={12} color={T.blue} />{changeLine(g)}</div>)}
                {diff.removed.map((g, i) => <div key={'r' + i} style={{ fontSize: 11.5, color: T.red, display: 'flex', gap: 7 }}><Icon name="trash" size={12} color={T.red} />{changeLine(g)}</div>)}
              </div>
            </Card>
          )}
        </div>

        <div>
          <SectionTitle style={{ marginBottom: 9 }}>3 · Go live</SectionTitle>
          <Card>
            <Field label="What changed in this release?" hint="Shows in the version history so anyone can see why a version exists.">
              <Input value={note} onChange={e => setNote(e.target.value)} placeholder="Added the four payroll videos" />
            </Field>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
              <Btn variant="success" icon="send" disabled={!cloud || blockers.length > 0 || publishing}
                onClick={() => setConfirming(true)}>
                {publishing ? 'Publishing…' : latest ? `Publish version ${latest.version + 1}` : 'Publish version 1'}
              </Btn>
              <Btn variant="outline" icon="download" onClick={() => download(`academy-${product}-curriculum.json`, JSON.stringify(published, null, 2))}>Download curriculum.json</Btn>
              <Btn variant="outline" icon="copy" onClick={copySeed}>Copy as code</Btn>
              <Btn variant="ghost" icon="eye" onClick={() => setShowJson(true)} style={{ color: T.muted }}>View JSON</Btn>
            </div>
            {blockers.length > 0 && <Helper style={{ marginTop: 10, color: T.red }}>{plural(blockers.length, 'blocker')} above must be fixed first.</Helper>}
          </Card>
        </div>

        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 9 }}>
            <SectionTitle>Version history</SectionTitle>
            {cloud && <Btn variant="ghost" size="sm" icon="refresh" onClick={onRefresh} style={{ color: T.muted }}>Refresh</Btn>}
          </div>
          {!versions.length ? (
            <Card><Helper>Nothing published yet.</Helper></Card>
          ) : (
            <Card pad={0} style={{ overflow: 'hidden' }}>
              {versions.map((v, i) => (
                <div key={v.id || v.version} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderTop: i ? `1px solid ${T.borderSoft}` : 'none' }}>
                  <Pill color={i === 0 ? T.greenDark : T.mutedSoft}>{i === 0 ? 'Live' : 'v' + v.version}</Pill>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>{v.note || `Version ${v.version}`}</div>
                    <Helper style={{ fontSize: 10.5 }}>{fmtWhen(v.published_at)}{v.published_by_email ? ` · ${v.published_by_email}` : ''}</Helper>
                  </div>
                  <Helper style={{ fontSize: 10.5, whiteSpace: 'nowrap' }}>
                    {((v.doc && v.doc.courses) || []).length}c · {((v.doc && v.doc.courses) || []).reduce((s, c) => s + ((c.lessons || []).length), 0)}l
                  </Helper>
                  <Btn variant="outline" size="sm" icon="undo" onClick={() => onRollback(v)}>Load into draft</Btn>
                </div>
              ))}
            </Card>
          )}
        </div>
      </div>

      <Modal open={confirming} onClose={() => setConfirming(false)} title="Publish this curriculum?"
        footer={<>
          <Btn variant="outline" onClick={() => setConfirming(false)}>Cancel</Btn>
          <Btn variant="success" icon="send" onClick={() => { setConfirming(false); onPublish(note); setNote(''); }}>Publish</Btn>
        </>}>
        <Helper style={{ marginBottom: 12 }}>
          This becomes the live curriculum for <b>{productLabel}</b> — {plural(published.courses.length, 'course')}, {plural(published.courses.reduce((s, c) => s + c.lessons.length, 0), 'lesson')}, {plural(published.paths.length, 'learning path')}.
        </Helper>
        {issues.filter(i => i.severity === 'warn').length > 0 && (
          <Banner tone="warn" icon="alertTriangle" title={`${plural(issues.filter(i => i.severity === 'warn').length, 'warning')} — publishing anyway is fine`}>
            Mostly lessons without video yet. They'll show the “coming soon” poster until footage is attached.
          </Banner>
        )}
        <Helper style={{ marginTop: 12 }}>Previous versions stay in the history, so this is reversible.</Helper>
      </Modal>

      <Modal open={showJson} onClose={() => setShowJson(false)} title="Published curriculum JSON" width={720}
        footer={<Btn variant="outline" onClick={() => setShowJson(false)}>Close</Btn>}>
        <Helper style={{ marginBottom: 10 }}>Exactly what a consumer receives. Internal production fields are stripped.</Helper>
        <pre style={{ margin: 0, fontSize: 10.5, lineHeight: 1.5, background: T.fieldBg, border: `1px solid ${T.borderSoft}`, borderRadius: T.radius, padding: 12, overflow: 'auto', maxHeight: '55vh', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
          {JSON.stringify(published, null, 2)}
        </pre>
      </Modal>
    </div>
  );
};

/* ===== shell ============================================================== */
const NAV = [
  { id: 'curriculum', label: 'Curriculum', icon: 'layers' },
  { id: 'paths', label: 'Learning paths', icon: 'graduation' },
  { id: 'production', label: 'Production', icon: 'clipboardCheck' },
  { id: 'media', label: 'Media', icon: 'image' },
  { id: 'preview', label: 'Preview', icon: 'eye' },
  { id: 'publish', label: 'Publish', icon: 'send' },
];

const AcademyStudio = () => {
  const savedUI = lsRead(LS_UI, {});
  const [product, setProduct] = useState(savedUI.product && PRODUCTS.some(p => p.id === savedUI.product) ? savedUI.product : PRODUCTS[0].id);
  const [screen, setScreen] = useState('curriculum');
  const [docs, setDocs] = useState(() => {
    const stored = lsRead(LS_DOCS, null);
    const base = seedDocs();
    if (!stored) return base;
    const out = {};
    PRODUCTS.forEach(p => { out[p.id] = normaliseDoc(stored[p.id] || base[p.id], p.id); });
    return out;
  });
  const [sel, setSel] = useState({ kind: null });
  const [collapsed, setCollapsed] = useState(savedUI.collapsed || {});
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  // cloud. `localOnly` lets someone use the whole tool before any backend setup
  // has happened — every authoring feature works against localStorage, so gating
  // it behind a login would be a wall for no benefit. Signing in is what turns
  // *sharing* on, not what unlocks the tool.
  const cloudConfigured = !!(CLOUD && CLOUD.isConfigured && CLOUD.isConfigured());
  const [localOnly, setLocalOnly] = useState(!!savedUI.localOnly);
  // Push the preference into the cloud layer before anything reads its state, so
  // "work locally" also means media/uploads stay local. Idempotent by design.
  if (CLOUD && CLOUD.forceLocal) CLOUD.forceLocal(localOnly);
  const cloudReady = !!(CLOUD && CLOUD.isCloud && CLOUD.isCloud());
  const needsAuth = !!(CLOUD && CLOUD.needsAuth && CLOUD.needsAuth());
  const [cloudError, setCloudError] = useState('');
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(!needsAuth);
  const [email, setEmail] = useState('');
  const [authSent, setAuthSent] = useState(false);
  const [authErr, setAuthErr] = useState('');
  const [saveState, setSaveState] = useState('idle');   // idle | saving | saved | error | conflict
  const [conflictBy, setConflictBy] = useState('');
  const [versions, setVersions] = useState({});          // product → [rows]
  const [assets, setAssets] = useState([]);
  const [publishing, setPublishing] = useState(false);
  const [uploading, setUploading] = useState(false);
  const stamps = useRef({});                             // product → server updated_at
  const loadedFromCloud = useRef({});                    // product → bool
  const skipNextSave = useRef(true);

  const fireToast = useCallback((t) => {
    const obj = typeof t === 'string' ? { message: t } : t;
    setToast(obj);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), obj && obj.action ? 5000 : 2400);
  }, []);

  const doc = docs[product] || seedDocs()[product];
  const productMeta = PRODUCTS.find(p => p.id === product) || PRODUCTS[0];
  const other = PRODUCTS.find(p => p.id !== product) || null;

  const edit = useCallback((mutator) => {
    setDocs(prev => {
      const next = { ...prev };
      const d = clone(prev[product]);
      mutator(d);
      next[product] = d;
      return next;
    });
  }, [product]);

  const owners = useMemo(() => {
    const set = {};
    PRODUCTS.forEach(p => {
      const d = docs[p.id];
      if (!d) return;
      allLessons(d).forEach(({ lesson }) => {
        const o = (lesson.production && lesson.production.owner || '').trim();
        if (o) set[o] = true;
      });
    });
    return Object.keys(set).sort();
  }, [docs]);

  const issues = useMemo(() => computeIssues(doc), [doc]);
  const blockerCount = issues.filter(i => i.severity === 'block').length;

  /* ---- local mirror (always) + shared draft (when connected) ------------ */
  useEffect(() => { lsWrite(LS_UI, { product, collapsed, localOnly }); }, [product, collapsed, localOnly]);

  useEffect(() => {
    lsWrite(LS_DOCS, docs);
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (!cloudReady || (needsAuth && !user)) return;
    if (!loadedFromCloud.current[product]) return;   // don't overwrite the server before we've read it
    setSaveState('saving');
    const t = setTimeout(() => {
      CLOUD.saveDraft(product, docs[product], stamps.current[product])
        .then(res => {
          if (res && res.conflict) {
            setSaveState('conflict');
            setConflictBy(res.updated_by_email || 'someone else');
            return;
          }
          stamps.current[product] = (res && res.updated_at) || stamps.current[product];
          setCloudError('');
          setSaveState('saved');
        })
        .catch((e) => {
          setSaveState('error');
          setCloudError((e && e.message) || 'Could not reach the shared curriculum');
        });
    }, 800);
    return () => clearTimeout(t);
  }, [docs, product, cloudReady, user, needsAuth]);

  /* ---- auth ------------------------------------------------------------- */
  useEffect(() => {
    if (!CLOUD || !cloudReady) { setAuthChecked(true); return; }
    let sub = null;
    CLOUD.getUser().then(u => { setUser(u); setAuthChecked(true); });
    if (CLOUD.onAuth) sub = CLOUD.onAuth(u => { setUser(u); setAuthChecked(true); });
    return () => { if (sub && sub.unsubscribe) sub.unsubscribe(); };
  }, [cloudReady]);

  /* ---- pull the shared draft + versions + assets ------------------------ */
  // The save effect needs the newest docs without re-subscribing, and seeding a
  // fresh backend needs whatever this browser already has.
  const docsRef = useRef(docs);
  useEffect(() => { docsRef.current = docs; }, [docs]);

  const pullProduct = useCallback((pid) => {
    if (!cloudReady || (needsAuth && !user)) return;
    CLOUD.loadDraft(pid).then(row => {
      if (row && row.doc) {
        stamps.current[pid] = row.updated_at;
        skipNextSave.current = true;
        setDocs(prev => ({ ...prev, [pid]: normaliseDoc(row.doc, pid) }));
        loadedFromCloud.current[pid] = true;
      } else {
        // Nothing shared yet — seed the backend from what's in this browser so
        // the first person to open the tool populates the team's draft.
        stamps.current[pid] = null;
        loadedFromCloud.current[pid] = true;
        CLOUD.saveDraft(pid, docsRef.current[pid], null)
          .then(res => { if (res && res.updated_at) stamps.current[pid] = res.updated_at; })
          .catch(e => setCloudError((e && e.message) || 'Could not write to the shared curriculum'));
      }
    }).catch(e => {
      loadedFromCloud.current[pid] = true;
      setCloudError((e && e.message) || 'Could not read the shared curriculum');
    });
    CLOUD.listVersions(pid).then(rows => setVersions(v => ({ ...v, [pid]: rows || [] }))).catch(() => {});
  }, [cloudReady, needsAuth, user]);

  useEffect(() => {
    if (!cloudReady || (needsAuth && !user)) return;
    PRODUCTS.forEach(p => { if (!loadedFromCloud.current[p.id]) pullProduct(p.id); });
  }, [cloudReady, needsAuth, user, pullProduct]);

  // Media works in local mode too (data URIs in this browser), so this is only
  // gated on the sign-in step, not on having a backend.
  useEffect(() => {
    if (!CLOUD) return;
    if (cloudReady && needsAuth && !user) return;
    CLOUD.listAssets().then(a => setAssets(a || [])).catch(() => {});
  }, [cloudReady, needsAuth, user]);

  /* ---- selection helpers ----------------------------------------------- */
  const jumpTo = useCallback((target) => {
    if (!target) return;
    if (target.kind === 'path') { setScreen('paths'); return; }
    setScreen('curriculum');
    if (target.kind === 'lesson') {
      setCollapsed(c => {
        const n = { ...c };
        const course = findCourse(doc, target.courseId);
        if (course) { n[target.courseId] = false; n[course.category] = false; }
        return n;
      });
      setSel({ kind: 'lesson', id: target.id, courseId: target.courseId });
    } else if (target.kind === 'course') {
      const course = findCourse(doc, target.id);
      if (course) setCollapsed(c => ({ ...c, [course.category]: false }));
      setSel({ kind: 'course', id: target.id });
    } else {
      setSel({ kind: 'category', id: target.id });
    }
  }, [doc]);

  const jumpToLesson = useCallback((courseId, lessonId) => jumpTo({ kind: 'lesson', id: lessonId, courseId }), [jumpTo]);

  /* ---- publish / rollback ---------------------------------------------- */
  const latest = (versions[product] || [])[0] || null;

  const onPublish = (note) => {
    if (!cloudReady) return;
    setPublishing(true);
    CLOUD.publishVersion(product, toPublished(doc), note)
      .then(row => {
        setVersions(v => ({ ...v, [product]: [row].concat(v[product] || []) }));
        fireToast(`Published version ${row.version} of ${productMeta.label}`);
      })
      .catch(e => fireToast({ message: 'Publish failed — ' + ((e && e.message) || 'unknown error'), tone: 'error' }))
      .then(() => setPublishing(false));
  };

  const onRollback = (v) => {
    const snapshot = clone(doc);
    // A published snapshot has no production metadata; keep what the draft knows
    // so loading an old version doesn't wipe the team's status board.
    const merged = normaliseDoc(clone(v.doc), product);
    const prodBy = {};
    allLessons(doc).forEach(({ lesson }) => { if (lesson.production) prodBy[lesson.id] = lesson.production; });
    merged.courses.forEach(c => c.lessons.forEach(l => { if (prodBy[l.id]) l.production = prodBy[l.id]; }));
    setDocs(prev => ({ ...prev, [product]: merged }));
    fireToast({ message: `Loaded version ${v.version} into your draft`, action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
  };

  /* ---- media ------------------------------------------------------------ */
  const onUpload = (files) => {
    if (!CLOUD) { fireToast({ message: 'Media needs resources/academy-cloud.js — it did not load', tone: 'error' }); return; }
    setUploading(true);
    const readOne = (file) => new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve({ name: file.name, mime: file.type || 'application/octet-stream', dataUri: fr.result, product });
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(file);
    });
    Promise.all(files.map(readOne))
      .then(recs => Promise.all(recs.filter(Boolean).map(r => CLOUD.saveAsset(r).catch(() => null))))
      .then(saved => {
        const ok = (saved || []).filter(Boolean);
        if (ok.length) setAssets(prev => ok.concat(prev.filter(a => !ok.some(s => s.id === a.id))));
        fireToast(ok.length ? `${plural(ok.length, 'file')} uploaded` : { message: 'Upload failed', tone: 'error' });
      })
      .then(() => setUploading(false), () => setUploading(false));
  };
  const onDeleteAsset = (a) => {
    if (!CLOUD) return;
    CLOUD.deleteAsset(a.id).then(() => {
      setAssets(prev => prev.filter(x => x.id !== a.id));
      fireToast('File deleted');
    }).catch(() => fireToast({ message: 'Could not delete', tone: 'error' }));
  };

  /* ---- copy a course across products ----------------------------------- */
  const copyCourseToOther = (course) => {
    if (!other) return;
    const copy = clone(course);
    const taken = {};
    (docs[other.id].courses || []).forEach(c => { taken[c.id] = true; (c.lessons || []).forEach(l => { taken[l.id] = true; }); });
    if (taken[copy.id]) copy.id = copy.id + '-copy';
    copy.lessons.forEach(l => { if (taken[l.id]) l.id = l.id + '-copy'; });
    // Carry the category across if the other product has one with the same id;
    // otherwise leave it unset so the readiness check flags it for a decision.
    const hasCat = (docs[other.id].categories || []).some(c => c.id === copy.category);
    if (!hasCat) copy.category = '';
    setDocs(prev => {
      const next = { ...prev };
      const d = clone(prev[other.id]);
      d.courses.push(copy);
      next[other.id] = d;
      return next;
    });
    fireToast({
      message: `Copied to ${other.label}`,
      action: { label: 'Go there', onClick: () => { setProduct(other.id); setScreen('curriculum'); setSel({ kind: 'course', id: copy.id }); } },
    });
  };

  /* ---- backup / restore the draft -------------------------------------- */
  const fileRef = useRef(null);
  const exportDraft = () => {
    try {
      const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `academy-${product}-draft.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      fireToast('Draft downloaded');
    } catch (_) { fireToast({ message: 'Download failed', tone: 'error' }); }
  };
  const importDraft = (file) => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const parsed = JSON.parse(fr.result);
        const snapshot = clone(doc);
        setDocs(prev => ({ ...prev, [product]: normaliseDoc(parsed, product) }));
        fireToast({ message: 'Draft replaced from file', action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
      } catch (_) { fireToast({ message: 'That file is not a valid curriculum', tone: 'error' }); }
    };
    fr.onerror = () => fireToast({ message: 'Could not read that file', tone: 'error' });
    fr.readAsText(file);
  };
  const resetToSeed = () => {
    const snapshot = clone(doc);
    setDocs(prev => ({ ...prev, [product]: normaliseDoc(clone(SEED[product] || {}), product) }));
    setSel({ kind: null });
    fireToast({ message: 'Reset to the starter curriculum', action: { label: 'Undo', onClick: () => setDocs(prev => ({ ...prev, [product]: snapshot })) } });
  };

  /* ---- auth gate ------------------------------------------------------- */
  const doSignIn = () => {
    setAuthErr('');
    const e = email.trim();
    if (!e) return;
    CLOUD.signIn(e).then(() => setAuthSent(true)).catch(err => setAuthErr((err && err.message) || 'Could not send the link'));
  };

  if (cloudReady && needsAuth && !authChecked) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: 24, height: 24, borderRadius: '50%', border: `2.5px solid ${T.border}`, borderTopColor: T.primary, animation: 'spin 700ms linear infinite' }} />
      </div>
    );
  }

  if (cloudReady && needsAuth && !user) {
    return (
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <Card style={{ width: '100%', maxWidth: 400, textAlign: 'center' }} pad={28}>
          <div style={{ width: 42, height: 42, margin: '0 auto 14px', borderRadius: 12, background: T.primarySoft, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="graduation" size={21} color={T.primary} />
          </div>
          <SectionTitle style={{ fontSize: 17 }}>Sole Academy Studio</SectionTitle>
          <Helper style={{ margin: '8px 0 18px' }}>
            Sign in to open the team's curriculum. We'll email you a one-time link — no password to remember.
          </Helper>
          {authSent ? (
            <Banner tone="success" icon="mail" title="Check your email">
              We sent a sign-in link to <b>{email.trim()}</b>. Open it on this device.
            </Banner>
          ) : (
            <form onSubmit={e => { e.preventDefault(); doSignIn(); }}>
              <Input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@soleapp.com.au" style={{ textAlign: 'center' }} />
              <Btn variant="primary" size="lg" icon="mail" type="submit" style={{ width: '100%', marginTop: 10 }}>Email me a link</Btn>
              {authErr && <Helper style={{ color: T.red, marginTop: 10 }}>{authErr}</Helper>}
              <Helper style={{ fontSize: 10.5, marginTop: 12 }}>Only teammates who've been invited can sign in.</Helper>
            </form>
          )}
          <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${T.borderSoft}` }}>
            <Btn variant="ghost" size="sm" onClick={() => setLocalOnly(true)} style={{ color: T.muted }}>Work in this browser instead →</Btn>
            <Helper style={{ fontSize: 10.5, marginTop: 6 }}>
              Everything works without signing in — your curriculum just stays on this computer instead of being shared, and publishing is off.
            </Helper>
          </div>
        </Card>
      </div>
    );
  }

  /* ---- editor pane for the curriculum screen --------------------------- */
  const renderEditor = () => {
    if (sel.kind === 'category') {
      const cat = catById(doc, sel.id);
      if (cat) return <CategoryEditor doc={doc} cat={cat} edit={edit} />;
    }
    if (sel.kind === 'course') {
      const course = findCourse(doc, sel.id);
      if (course) return (
        <CourseEditor doc={doc} course={course} edit={edit} fireToast={fireToast} setSel={setSel}
          otherProductLabel={other ? other.short : ''}
          onCopyToOtherProduct={other ? () => copyCourseToOther(course) : null} />
      );
    }
    if (sel.kind === 'lesson') {
      const course = findCourse(doc, sel.courseId);
      const lesson = findLesson(doc, sel.courseId, sel.id);
      if (course && lesson) return <LessonEditor doc={doc} course={course} lesson={lesson} edit={edit} fireToast={fireToast} owners={owners} setSel={setSel} />;
    }
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <EmptyState icon="layers" title="Pick something to edit"
          hint="Choose a category, course or lesson from the tree. Drag rows, or use the little arrows, to reorder them." />
      </div>
    );
  };

  const saveLabel = saveState === 'saving' ? 'Saving…'
    : saveState === 'saved' ? 'Saved'
    : saveState === 'error' ? 'Save failed'
    : saveState === 'conflict' ? 'Out of date'
    : cloudReady ? 'Up to date' : 'Saved in this browser';
  const saveColor = saveState === 'error' || saveState === 'conflict' ? T.red : saveState === 'saving' ? T.amber : T.greenDark;

  return (
    <div style={{ height: '100%', display: 'grid', gridTemplateColumns: '212px minmax(0,1fr)', background: T.bg }}>
      {/* rail */}
      <aside style={{ background: T.card, borderRight: `1px solid ${T.border}`, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ padding: '15px 14px 12px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 26, height: 26, borderRadius: 8, background: T.primary, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Icon name="graduation" size={14} color="#fff" />
            </span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, letterSpacing: -0.2 }}>Academy Studio</div>
              <div style={{ fontSize: 9.5, color: T.mutedSoft }}>Internal · content team</div>
            </div>
          </div>
        </div>

        <div style={{ padding: '12px 12px 10px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft, marginBottom: 7 }}>Curriculum for</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
            {PRODUCTS.map(p => {
              const active = p.id === product;
              const d = docs[p.id];
              return (
                <button key={p.id} data-btn onClick={() => { setProduct(p.id); setSel({ kind: null }); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 9px', borderRadius: T.radius, textAlign: 'left',
                    border: `1px solid ${active ? T.primary : T.border}`, background: active ? T.primarySoft : T.card }}>
                  <span style={{ width: 22, height: 22, borderRadius: 6, background: active ? T.primary : T.fieldBg, color: active ? '#fff' : T.muted,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 800, flexShrink: 0 }}>{p.short}</span>
                  <span style={{ minWidth: 0, flex: 1 }}>
                    <span style={{ display: 'block', fontSize: 11, fontWeight: 700, color: active ? T.primaryDark : T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.label}</span>
                    <span style={{ display: 'block', fontSize: 9.5, color: T.mutedSoft }}>{d ? `${(d.courses || []).length}c · ${allLessons(d).length}l` : ''}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>

        <nav className="scroll" style={{ flex: 1, padding: '10px 10px 20px' }}>
          {NAV.map(n => {
            const active = screen === n.id;
            const badge = n.id === 'publish' && blockerCount > 0 ? blockerCount : null;
            return (
              <button key={n.id} data-btn onClick={() => setScreen(n.id)}
                style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '8px 10px', marginBottom: 2, borderRadius: T.radius,
                  border: 'none', background: active ? T.primarySoft : 'transparent', color: active ? T.primaryDark : T.textSoft,
                  fontSize: 12, fontWeight: active ? 700 : 500, textAlign: 'left' }}>
                <Icon name={n.icon} size={14} color={active ? T.primary : T.mutedSoft} />
                <span style={{ flex: 1 }}>{n.label}</span>
                {badge && <Pill color={T.red}>{badge}</Pill>}
              </button>
            );
          })}

          <div style={{ marginTop: 16, paddingTop: 12, borderTop: `1px solid ${T.borderSoft}` }}>
            <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft, marginBottom: 7, paddingLeft: 10 }}>This draft</div>
            <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }}
              onChange={e => { const f = (e.target.files || [])[0]; if (f) importDraft(f); e.target.value = ''; }} />
            <button data-btn onClick={exportDraft} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '7px 10px', borderRadius: T.radius, border: 'none', background: 'transparent', color: T.muted, fontSize: 11.5, textAlign: 'left' }}>
              <Icon name="download" size={13} color={T.mutedSoft} />Back up to a file
            </button>
            <button data-btn onClick={() => fileRef.current && fileRef.current.click()} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '7px 10px', borderRadius: T.radius, border: 'none', background: 'transparent', color: T.muted, fontSize: 11.5, textAlign: 'left' }}>
              <Icon name="upload" size={13} color={T.mutedSoft} />Restore from a file
            </button>
            <button data-btn onClick={resetToSeed} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '7px 10px', borderRadius: T.radius, border: 'none', background: 'transparent', color: T.muted, fontSize: 11.5, textAlign: 'left' }}>
              <Icon name="undo" size={13} color={T.mutedSoft} />Reset to starter
            </button>
          </div>
        </nav>

        <div style={{ padding: '10px 12px', borderTop: `1px solid ${T.borderSoft}` }}>
          {cloudReady
            ? <div title="Shared with your team" style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10, fontWeight: 700, color: T.greenDark }}>
                <span style={{ width: 7, height: 7, borderRadius: 999, background: T.green }} />Shared
              </div>
            : <div title="This browser only — sign in to share with the team">
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10, fontWeight: 700, color: T.amber }}>
                  <span style={{ width: 7, height: 7, borderRadius: 999, background: T.amber }} />Local only
                </div>
                {cloudConfigured && (
                  <button data-btn onClick={() => setLocalOnly(false)}
                    style={{ border: 'none', background: 'transparent', padding: '3px 0 0', color: T.primary, fontSize: 10, fontWeight: 700 }}>Sign in to share →</button>
                )}
              </div>}
          {user && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 7 }}>
              <span style={{ flex: 1, minWidth: 0, fontSize: 9.5, color: T.mutedSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.email}</span>
              <button data-btn onClick={() => CLOUD.signOut().then(() => setUser(null))} aria-label="Sign out"
                style={{ border: 'none', background: 'transparent', padding: 2, color: T.mutedSoft }}><Icon name="logout" size={12} /></button>
            </div>
          )}
        </div>
      </aside>

      {/* main */}
      <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>
        <header style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 20px', background: T.card, borderBottom: `1px solid ${T.border}`, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 8 }}>
              {(NAV.find(n => n.id === screen) || {}).label}
              <span style={{ fontSize: 10.5, fontWeight: 600, color: T.muted }}>· {productMeta.label}</span>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10.5, fontWeight: 600, color: saveColor }}>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: saveColor }} />{saveLabel}
          </div>
          {latest && <Pill color={T.mutedSoft} icon="send">Live: v{latest.version}</Pill>}
          <Btn variant="outline" size="sm" icon="eye" onClick={() => setScreen('preview')}>Preview</Btn>
          <Btn variant="primary" size="sm" icon="send" onClick={() => setScreen('publish')}>Publish</Btn>
        </header>

        {cloudError && saveState !== 'conflict' && (
          <div style={{ padding: '10px 20px 0' }}>
            <Banner tone="warn" icon="alertTriangle" title="Can't reach the shared curriculum"
              action={<Btn variant="outline" size="sm" onClick={() => setCloudError('')}>Dismiss</Btn>}>
              Your work is still being saved in this browser, so nothing is lost. If this is a fresh setup, the database tables probably aren't created yet — run <b>supabase/migrations/0003_academy_cms.sql</b> once (see <b>docs/ACADEMY_STUDIO_SETUP.md</b>). Details: <span style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 10.5 }}>{cloudError}</span>
            </Banner>
          </div>
        )}

        {saveState === 'conflict' && (
          <div style={{ padding: '10px 20px', background: T.redSoft, borderBottom: `1px solid ${withAlpha(T.red, 0.25)}` }}>
            <Banner tone="danger" icon="alertTriangle" title={`${conflictBy} saved changes while you were editing`}
              action={<div style={{ display: 'flex', gap: 7 }}>
                <Btn variant="outline" size="sm" icon="refresh" onClick={() => {
                  loadedFromCloud.current[product] = false;
                  setSaveState('idle');
                  pullProduct(product);
                  fireToast('Reloaded the shared version');
                }}>Load theirs</Btn>
                <Btn variant="danger" size="sm" onClick={() => {
                  stamps.current[product] = null;   // force-win the next write
                  setSaveState('idle');
                  fireToast('Your next edit will overwrite theirs');
                }}>Keep mine</Btn>
              </div>}>
              To avoid clobbering their work, saving has paused. Load their version (you'll lose your unsaved edits), or keep yours and overwrite.
            </Banner>
          </div>
        )}

        {screen === 'curriculum' && (
          <div style={{ display: 'grid', gridTemplateColumns: '330px minmax(0,1fr)', flex: 1, minHeight: 0 }}>
            <div style={{ background: T.card, borderRight: `1px solid ${T.border}`, minHeight: 0 }}>
              <CurriculumTree doc={doc} sel={sel} setSel={setSel} edit={edit} fireToast={fireToast}
                collapsed={collapsed} setCollapsed={setCollapsed} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>{renderEditor()}</div>
          </div>
        )}
        {screen === 'paths' && <PathsScreen doc={doc} edit={edit} fireToast={fireToast} />}
        {screen === 'production' && <ProductionScreen doc={doc} edit={edit} jumpToLesson={jumpToLesson} owners={owners} />}
        {screen === 'media' && <MediaScreen assets={assets} onUpload={onUpload} onDelete={onDeleteAsset} cloud={cloudReady} fireToast={fireToast} busy={uploading} doc={doc} />}
        {screen === 'preview' && <PreviewScreen doc={doc} />}
        {screen === 'publish' && (
          <PublishScreen doc={doc} product={product} productLabel={productMeta.label}
            versions={versions[product] || []} latest={latest}
            onPublish={onPublish} onRollback={onRollback} onJump={jumpTo}
            cloud={cloudReady} fireToast={fireToast} publishing={publishing}
            onRefresh={() => { CLOUD.listVersions(product).then(rows => { setVersions(v => ({ ...v, [product]: rows || [] })); fireToast('History refreshed'); }).catch(() => {}); }} />
        )}
      </div>

      <Toast toast={toast} />
    </div>
  );
};

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 28 }}>
        <div style={{ background: T.redSoft, border: `1px solid ${T.red}`, borderRadius: T.radiusCard, padding: 20, maxWidth: 760 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: T.red, marginBottom: 8 }}>Something broke</div>
          <div style={{ fontSize: 12.5, marginBottom: 12 }}>
            Your work is saved in this browser, so a refresh should bring it back. If it keeps happening, send this message to Rishabh.
          </div>
          <pre style={{ margin: 0, fontSize: 11, whiteSpace: 'pre-wrap', color: T.textSoft, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>
            {String(this.state.error && this.state.error.stack || this.state.error)}
          </pre>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><AcademyStudio /></ErrorBoundary>
);
</script>
</body>
</html>
