/* ===== helpers ============================================================ */
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = (prefix) => prefix + '-' + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);
const withAlpha = (hex, a) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};
const darkenHex = (hex, amt) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 - amt))));
  return '#' + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
};
const fmtWhen = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (_) { return ''; }
};
const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

/* ===== video links ========================================================
   The team pastes a link; we work out the rest. Deterministic derivation first
   (provider + embed URL + thumbnail from the id), then a best-effort oEmbed call
   for the title/duration/poster. oEmbed is allowed to fail silently — the
   derived values are what the live app actually needs. */
const parseVideoLink = (raw) => {
  const url = String(raw || '').trim();
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return {
    provider: 'youtube', label: 'YouTube', id: m[1],
    watchUrl: 'https://www.youtube.com/watch?v=' + m[1],
    embedUrl: 'https://www.youtube.com/embed/' + m[1],
    thumbUrl: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg',
    oembed: 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + m[1]),
  };
  m = url.match(/vimeo\.com\/(?:video\/|channels\/[\w]+\/)?(\d{6,})/i);
  if (m) return {
    provider: 'vimeo', label: 'Vimeo', id: m[1],
    watchUrl: 'https://vimeo.com/' + m[1],
    embedUrl: 'https://player.vimeo.com/video/' + m[1],
    thumbUrl: '',
    oembed: 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent('https://vimeo.com/' + m[1]),
  };
  m = url.match(/loom\.com\/(?:share|embed)\/([0-9a-f]{8,})/i);
  if (m) return {
    provider: 'loom', label: 'Loom', id: m[1],
    watchUrl: 'https://www.loom.com/share/' + m[1],
    embedUrl: 'https://www.loom.com/embed/' + m[1],
    thumbUrl: 'https://cdn.loom.com/sessions/thumbnails/' + m[1] + '-with-play.gif',
    oembed: 'https://www.loom.com/v1/oembed?url=' + encodeURIComponent('https://www.loom.com/share/' + m[1]),
  };
  if (/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return {
    provider: 'file', label: 'Video file', id: '', watchUrl: url, embedUrl: '', fileUrl: url, thumbUrl: '', oembed: '',
  };
  if (/^https?:\/\//i.test(url)) return {
    provider: 'unknown', label: 'Other link', id: '', watchUrl: url, embedUrl: url, thumbUrl: '', oembed: '',
  };
  return { provider: 'invalid', label: 'Not a link', id: '', watchUrl: '', embedUrl: '', thumbUrl: '', oembed: '' };
};

// Best-effort metadata. Resolves to {} on any failure — never throws, never blocks.
const fetchVideoMeta = (parsed) => {
  if (!parsed || !parsed.oembed) return Promise.resolve({});
  return fetch(parsed.oembed)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j) return {};
      const out = {};
      if (j.title) out.title = String(j.title);
      if (j.thumbnail_url) out.thumbUrl = String(j.thumbnail_url);
      // Vimeo returns seconds; Loom returns milliseconds on some payloads.
      let secs = Number(j.duration);
      if (isFinite(secs) && secs > 0) {
        if (secs > 60 * 60 * 12) secs = secs / 1000;   // clearly ms, not s
        out.mins = Math.max(1, Math.round(secs / 60));
      }
      return out;
    })
    .catch(() => ({}));
};

/* Move an item within an array, returning a new array. */
const moveItem = (arr, from, to) => {
  const a = arr.slice();
  if (from < 0 || from >= a.length) return a;
  const clamped = Math.max(0, Math.min(a.length - 1, to));
  a.splice(clamped, 0, a.splice(from, 1)[0]);
  return a;
};

/* ---- readiness checks ----------------------------------------------------
   What would embarrass us if it shipped. Severity: 'block' stops a publish,
   'warn' is advisory. Every issue carries enough to jump straight to the fix. */
const computeIssues = (doc) => {
  const issues = [];
  const push = (severity, group, label, detail, target) => issues.push({ id: uid('i'), severity, group, label, detail, target });
  const tracks = doc.tracks || [];
  const courses = doc.courses || [];
  const paths = doc.paths || [];

  const seen = {};
  const dupe = (id, what, target) => {
    if (!id) { push('block', 'Missing id', `${what} has no id`, 'Every item needs a stable id, progress tracking keys off it.', target); return; }
    if (seen[id]) push('block', 'Duplicate id', `"${id}" is used twice`, `${what} reuses an id that already exists. Learner progress would be shared between them.`, target);
    seen[id] = true;
  };
  tracks.forEach(t => dupe(t.id, `Track "${t.label || 'Untitled'}"`, { kind: 'track', id: t.id }));
  courses.forEach(c => {
    dupe(c.id, `Course "${c.title || 'Untitled'}"`, { kind: 'course', id: c.id });
    (c.lessons || []).forEach(l => dupe(l.id, `Lesson "${l.title || 'Untitled'}"`, { kind: 'lesson', id: l.id, courseId: c.id }));
  });

  tracks.forEach(t => {
    if (!String(t.label || '').trim()) push('block', 'Untitled', 'A track has no name', 'Learners see this as a filter chip, it cannot be blank.', { kind: 'track', id: t.id });
    if (TRACK_COLORS.every(x => x.hex !== t.color)) push('block', 'Bad colour', `"${t.label || t.id}" uses an unsupported colour`, `"${t.color}" is not one of the five colours the app supports, pick one from the list.`, { kind: 'track', id: t.id });
    if (!courses.some(x => x.track === t.id)) push('warn', 'Empty track', `"${t.label || t.id}" has no courses`, 'It will not appear anywhere for learners. Delete it or add a course.', { kind: 'track', id: t.id });
  });

  courses.forEach(c => {
    if (!String(c.title || '').trim()) push('block', 'Untitled', 'A course has no title', 'Course cards would render blank.', { kind: 'course', id: c.id });
    if (!trackById(doc, c.track)) push('block', 'Orphan course', `"${c.title || c.id}" has no valid track`, 'It will not show under any filter. Pick a track.', { kind: 'course', id: c.id });
    if (COURSE_ICONS.indexOf(c.icon) < 0) push('block', 'Bad icon', `"${c.title || c.id}" uses an unknown icon`, `"${c.icon}" is not an icon the app can render, pick one from the list.`, { kind: 'course', id: c.id });
    if (!(c.lessons || []).length) push('block', 'Empty course', `"${c.title || c.id}" has no lessons`, 'Opening it would show an empty player.', { kind: 'course', id: c.id });
    if (!String(c.summary || '').trim()) push('warn', 'No summary', `"${c.title || c.id}" has no summary`, 'The card body would be blank in the catalog.', { kind: 'course', id: c.id });
    (c.lessons || []).forEach(l => {
      if (!String(l.title || '').trim()) push('block', 'Untitled', `A lesson in "${c.title || c.id}" has no title`, 'Playlist rows would render blank.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!lessonHasVideo(l)) push('warn', 'No video', `"${l.title || l.id}" has no video`, 'Learners get the preview poster instead of a video.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!String(l.description || '').trim()) push('warn', 'No description', `"${l.title || l.id}" has no description`, 'The lesson page would have no text under the player.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!(Number(l.mins) > 0)) push('warn', 'No duration', `"${l.title || l.id}" has no length`, 'Duration chips would read "0 min".', { kind: 'lesson', id: l.id, courseId: c.id });
      (l.resources || []).forEach(r => {
        if (String(r.label || '').trim() && !String(r.href || '').trim()) push('warn', 'Dead resource link', `"${r.label}" in "${l.title || l.id}" has no URL`, 'It would render as a link that goes nowhere.', { kind: 'lesson', id: l.id, courseId: c.id });
      });
    });
  });

  paths.forEach(p => {
    if (!String(p.title || '').trim()) push('block', 'Untitled', 'A learning path has no title', 'Path cards would render blank.', { kind: 'path', id: p.id });
    if (!(p.lessonIds || []).length) push('block', 'Empty path', `"${p.title || p.id}" has no videos`, 'Opening it would go nowhere.', { kind: 'path', id: p.id });
    (p.lessonIds || []).forEach(lid => {
      if (!findLessonAnywhere(doc, lid)) push('block', 'Broken path', `"${p.title || p.id}" points at a deleted video`, `Lesson "${lid}" no longer exists. Remove it from the path.`, { kind: 'path', id: p.id });
    });
  });

  return issues;
};

/* ---- the published document ---------------------------------------------
   Strips internal-only fields so what engineering consumes is exactly the
   learner-facing contract. Documented in docs/ACADEMY_INTEGRATION.md. */
const toPublished = (doc) => ({
  product: doc.product,
  meta: { title: (doc.meta && doc.meta.title) || 'Sole Academy', blurb: (doc.meta && doc.meta.blurb) || '' },
  tracks: (doc.tracks || []).map(t => ({ id: t.id, label: t.label, color: t.color, blurb: t.blurb || '' })),
  courses: (doc.courses || []).map(c => ({
    id: c.id, title: c.title, menuGroup: c.menuGroup || '', track: c.track, icon: c.icon || 'bookOpen', level: c.level || 'Beginner',
    summary: c.summary || '', popular: !!c.popular,
    lessons: (c.lessons || []).map(l => {
      // ONE RULE: a chapter with a video can be watched, a chapter without one
      // cannot. Nothing else decides it.
      //
      // This used to be derived from a six-value production state, and the two
      // could disagree. Driving the tool for real caught it: pasting a YouTube
      // link showed "Live for learners once you publish", then published the
      // chapter as `recording`, because its production state still said
      // `outlined`. The editor promised one thing and the learner got another.
      // Deriving from the video is the only version of this that cannot drift.
      //
      // The single remaining production flag is a courtesy: a chapter with no
      // video can be marked "being recorded" so learners see that instead of a
      // flat "coming soon". It can never make a chapter watchable.
      const prodStatus = (l.production && l.production.status) || 'idea';
      const status = lessonHasVideo(l) ? 'published'
        : prodStatus === 'recording' ? 'recording'
        : 'planned';
      const out = {
        id: l.id, title: l.title, mins: Number(l.mins) || 0, type: l.type || 'video', status,
        description: l.description || '',
        takeaways: (l.takeaways || []).filter(t => String(t).trim()),
        transcript: l.transcript || '',
        tags: (l.tags || []).filter(t => String(t).trim()),
        resources: (l.resources || []).filter(r => String(r.label || '').trim() && String(r.href || '').trim()),
      };
      // Only emit the video keys that are actually set — the app branches on
      // their presence (videoUrl → <video>, embedUrl → <iframe>).
      if (l.videoUrl) out.videoUrl = l.videoUrl;
      if (l.embedUrl) out.embedUrl = l.embedUrl;
      if (l.thumbUrl) out.thumbUrl = l.thumbUrl;
      if (l.tour) out.tour = l.tour;
      if (l.guide) out.guide = l.guide;   // reserved for annotated-screenshot lessons
      return out;
    }),
  })),
  // A path is a hand-picked playlist of individual videos, not a sequence of whole
  // modules, so it can mix one Deals lesson with two Payroll lessons in any
  // order. See docs/ACADEMY_INTEGRATION.md for the shape and the migration
  // note (this replaces the old courseIds-based shape).
  paths: (doc.paths || []).map(p => ({ id: p.id, title: p.title, forRole: p.forRole || '', blurb: p.blurb || '', lessonIds: (p.lessonIds || []).slice() })),
});

/* ===== local persistence ==================================================
   Always on, even in shared mode — a refresh or a dropped connection must never
   lose in-progress work. Mirrors the Studio's approach (swallow quota errors). */
const LS_DOCS = 'sole.academy.studio.docs.v1';
const LS_UI = 'sole.academy.studio.ui.v1';
const lsRead = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (_) { return fallback; } };
const lsWrite = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

const seedDocs = () => {
  const out = {};
  PRODUCTS.forEach(p => { out[p.id] = clone(SEED[p.id] || { product: p.id, meta: { title: 'Sole Academy', blurb: '' }, tracks: [], courses: [], paths: [] }); });
  return out;
};
// Fill in anything a hand-edited or older document is missing, so the editor
// never has to null-check its way through a screen. Also backfills the old
// category-based shape (pre 4 Aug 2026 restructure) so a stale seed file or an
// imported draft never crashes the tool — see docs/ACADEMY_INTEGRATION.md.
const normaliseDoc = (d, productId) => {
  const doc = d && typeof d === 'object' ? clone(d) : {};
  doc.product = productId;
  doc.meta = doc.meta || { title: 'Sole Academy', blurb: '' };
  doc.tracks = Array.isArray(doc.tracks) ? doc.tracks : (Array.isArray(doc.categories) ? doc.categories : []);
  doc.courses = Array.isArray(doc.courses) ? doc.courses : [];
  doc.paths = Array.isArray(doc.paths) ? doc.paths : [];
  doc.courses.forEach(c => {
    c.track = c.category || c.track || '';
    c.menuGroup = c.menuGroup || '';
    c.icon = c.icon || 'bookOpen';
    c.lessons = Array.isArray(c.lessons) ? c.lessons : [];
    c.level = c.level || 'Beginner';
    c.lessons.forEach(l => {
      l.type = l.type || 'video';
      l.tour = l.tour || '';
      l.takeaways = Array.isArray(l.takeaways) ? l.takeaways : [];
      l.tags = Array.isArray(l.tags) ? l.tags : [];
      l.resources = Array.isArray(l.resources) ? l.resources : [];
      l.production = l.production || { status: 'idea', owner: '', due: '', notes: '' };
    });
  });
  // Paths moved from "a sequence of whole modules" (courseIds) to "a playlist
  // of individual videos" (lessonIds). A path saved under the old shape is
  // migrated once, in order, expanding each course into its lessons, so
  // nothing already published breaks the moment this loads.
  doc.paths.forEach(p => {
    if (!Array.isArray(p.lessonIds) && Array.isArray(p.courseIds)) {
      p.lessonIds = p.courseIds.flatMap(cid => {
        const c = doc.courses.find(x => x.id === cid);
        return c ? (c.lessons || []).map(l => l.id) : [];
      });
    }
    p.lessonIds = Array.isArray(p.lessonIds) ? p.lessonIds : [];
    delete p.courseIds;
  });
  return doc;
};

const findCourse = (doc, id) => (doc.courses || []).find(c => c.id === id) || null;
// A path's lessonIds don't carry which course each video lives in, so
// resolving one means searching every course. Small catalog, cheap search.
const findLessonAnywhere = (doc, lessonId) => {
  for (const c of (doc.courses || [])) {
    const l = (c.lessons || []).find(x => x.id === lessonId);
    if (l) return { course: c, lesson: l };
  }
  return null;
};
const findLesson = (doc, courseId, lessonId) => {
  const c = findCourse(doc, courseId);
  return c ? ((c.lessons || []).find(l => l.id === lessonId) || null) : null;
};

/* ---- live vs waiting ------------------------------------------------------
   The one question this tool kept failing to answer: can a learner watch this
   right now? It is not "does the row have a video", it is "is that exact video
   in the published version". Everything on screen reads from these two. */
const liveVideoMap = (liveDoc) => {
  const map = {};
  ((liveDoc && liveDoc.courses) || []).forEach(c => (c.lessons || []).forEach(l => {
    const url = l.embedUrl || l.videoUrl;
    if (url && l.status === 'published') map[l.id] = url;
  }));
  return map;
};
// 'live'    published, and the link has not changed since
// 'waiting' has a video that learners cannot see yet
// 'none'    no video attached
const lessonLiveState = (lesson, live) => {
  const url = lesson.embedUrl || lesson.videoUrl;
  if (!url) return 'none';
  return live[lesson.id] === url ? 'live' : 'waiting';
};
const LIVE_FACE = {
  live:    { label: 'Live',     color: T.greenDark, bg: T.greenSoft,  icon: 'checkCircle' },
  waiting: { label: 'Not live', color: T.amber,     bg: T.amberSoft,  icon: 'alertTriangle' },
  none:    { label: 'No video', color: T.mutedSoft, bg: T.fieldBg,    icon: 'clock' },
};
const waitingLessons = (doc, live) => allLessons(doc)
  .filter(({ lesson }) => lessonLiveState(lesson, live) === 'waiting');

/* ---- the curriculum tree --------------------------------------------------
   Track → course → lesson, collapsible, drag or arrow to reorder. Selecting
   any row opens it in the editor pane on the right. Full add/delete/rename/
   reorder is back (the content team designs the curriculum now, not just
   Rishav pasting one link), but the live/not-live honesty marker per lesson
   stays exactly as it was: it answers "can a learner watch this right now",
   not just "does this row have a video attached". */
const useDragOrder = (onMove) => {
  const fromRef = useRef(null);
  const [from, setFrom] = useState(null);
  const [over, setOver] = useState(null);
  const reset = () => { fromRef.current = null; setFrom(null); setOver(null); };
  return (i) => ({
    draggable: true,
    onDragStart: (e) => {
      e.stopPropagation();
      fromRef.current = i; setFrom(i);
      try { if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } } catch (_) {}
    },
    onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); if (over !== i) setOver(i); },
    onDragEnd: (e) => { e.stopPropagation(); reset(); },
    onDrop: (e) => {
      e.preventDefault(); e.stopPropagation();
      const f = fromRef.current;
      reset();
      if (f !== null && f !== i) onMove(f, i);
    },
    ...(from === i ? { 'data-dragging': '' } : {}),
    ...(over === i && from !== null && from !== i ? (from < i ? { 'data-drop-after': '' } : { 'data-drop-before': '' }) : {}),
  });
};

/* Small up/down/delete cluster shown on row hover. */
const RowActions = ({ onUp, onDown, onDelete, canUp, canDown, extra }) => (
  <div className="row-actions" style={{ display: 'flex', alignItems: 'center', gap: 1 }} onClick={e => e.stopPropagation()}>
    {extra}
    <button data-btn onClick={onUp} disabled={!canUp} aria-label="Move up"
      style={{ border: 'none', background: 'transparent', padding: 2, color: canUp ? T.muted : T.borderStrong, cursor: canUp ? 'pointer' : 'default' }}><Icon name="chevronUp" size={13} /></button>
    <button data-btn onClick={onDown} disabled={!canDown} aria-label="Move down"
      style={{ border: 'none', background: 'transparent', padding: 2, color: canDown ? T.muted : T.borderStrong, cursor: canDown ? 'pointer' : 'default' }}><Icon name="chevronDown" size={13} /></button>
    {onDelete && <button data-btn onClick={onDelete} aria-label="Delete"
      style={{ border: 'none', background: 'transparent', padding: 2, color: T.mutedSoft }}><Icon name="trash" size={13} /></button>}
  </div>
);

const CurriculumTree = ({ doc, live, sel, setSel, edit, fireToast, collapsed, setCollapsed }) => {
  const tracks = doc.tracks || [];
  const moveTrack = useDragOrder((f, t) => edit(d => { d.tracks = moveItem(d.tracks, f, t); }));
  const isOpen = (id) => !collapsed[id];
  const toggle = (id) => setCollapsed(c => ({ ...c, [id]: !c[id] }));

  const addTrack = () => {
    const t = emptyTrack();
    t.label = 'New track';
    edit(d => { d.tracks.push(t); });
    setSel({ kind: 'track', id: t.id });
  };
  const addCourse = (trackId) => {
    const c = emptyCourse(trackId);
    c.title = 'New module';
    edit(d => { d.courses.push(c); });
    setCollapsed(s => ({ ...s, [trackId]: false }));
    setSel({ kind: 'course', id: c.id });
  };
  const addLesson = (courseId) => {
    const l = emptyLesson();
    l.title = 'New lesson';
    edit(d => { const c = findCourse(d, courseId); if (c) c.lessons.push(l); });
    setCollapsed(s => ({ ...s, [courseId]: false }));
    setSel({ kind: 'lesson', id: l.id, courseId });
  };
  const deleteTrack = (track) => {
    const owned = (doc.courses || []).filter(c => c.track === track.id);
    if (owned.length) { fireToast({ message: `Move or delete its ${plural(owned.length, 'module')} first`, tone: 'warn' }); return; }
    const snapshot = clone(doc.tracks);
    edit(d => { d.tracks = d.tracks.filter(t => t.id !== track.id); });
    if (sel.kind === 'track' && sel.id === track.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${track.label || 'track'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.tracks = snapshot; }) } });
  };
  const deleteCourse = (course) => {
    const snapshot = clone(doc.courses);
    const snapPaths = clone(doc.paths);
    const lessonIds = (course.lessons || []).map(l => l.id);
    edit(d => {
      d.courses = d.courses.filter(c => c.id !== course.id);
      d.paths.forEach(p => { p.lessonIds = (p.lessonIds || []).filter(id => !lessonIds.includes(id)); });
    });
    if (sel.id === course.id || sel.courseId === course.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${course.title || 'module'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.courses = snapshot; d.paths = snapPaths; }) } });
  };
  const deleteLesson = (course, lesson) => {
    const snapshot = clone(course.lessons);
    const snapPaths = clone(doc.paths);
    edit(d => {
      const c = findCourse(d, course.id);
      if (c) c.lessons = c.lessons.filter(l => l.id !== lesson.id);
      d.paths.forEach(p => { p.lessonIds = (p.lessonIds || []).filter(id => id !== lesson.id); });
    });
    if (sel.kind === 'lesson' && sel.id === lesson.id) setSel({ kind: 'course', id: course.id });
    fireToast({ message: `Deleted "${lesson.title || 'lesson'}"`, action: { label: 'Undo', onClick: () => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = snapshot; d.paths = snapPaths; }) } });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700 }}>Curriculum</div>
          <Helper style={{ fontSize: 10.5, whiteSpace: 'nowrap' }}>{plural((doc.courses || []).length, 'module')} · {plural(allLessons(doc).length, 'lesson')}</Helper>
        </div>
        <Btn variant="soft" size="sm" icon="plus" onClick={addTrack} style={{ flexShrink: 0 }}>Track</Btn>
      </div>
      <div className="scroll" style={{ flex: 1, padding: '8px 8px 40px' }}>
        {tracks.length === 0 && (
          <EmptyState icon="layers" title="No tracks yet"
            hint="Tracks are the browse buckets learners see across the catalog. Start with one, then add modules inside it."
            action={<Btn variant="primary" size="sm" icon="plus" onClick={addTrack}>Add the first track</Btn>} />
        )}
        {tracks.map((track, ti) => {
          const courses = (doc.courses || []).filter(c => c.track === track.id);
          const open = isOpen(track.id);
          const selectedTrack = sel.kind === 'track' && sel.id === track.id;
          return (
            <div key={track.id} {...moveTrack(ti)} style={{ marginBottom: 3, borderRadius: T.radius }}>
              <div data-row onClick={() => setSel({ kind: 'track', id: track.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 8px', borderRadius: T.radius, cursor: 'pointer',
                  background: selectedTrack ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedTrack) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedTrack) e.currentTarget.style.background = 'transparent'; }}>
                <button data-btn onClick={e => { e.stopPropagation(); toggle(track.id); }} aria-label={open ? 'Collapse' : 'Expand'}
                  style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
                  <Icon name={open ? 'chevronDown' : 'chevronRight'} size={13} />
                </button>
                <span style={{ width: 20, height: 20, borderRadius: 6, background: withAlpha(track.color || T.primary, 0.13), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Icon name="layers" size={12} color={track.color || T.primary} />
                </span>
                <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 700, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {track.label || <span style={{ color: T.red }}>Untitled track</span>}
                </span>
                <span style={{ fontSize: 10, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{courses.length}</span>
                <RowActions
                  canUp={ti > 0} canDown={ti < tracks.length - 1}
                  onUp={() => edit(d => { d.tracks = moveItem(d.tracks, ti, ti - 1); })}
                  onDown={() => edit(d => { d.tracks = moveItem(d.tracks, ti, ti + 1); })}
                  onDelete={() => deleteTrack(track)}
                  extra={<button data-btn onClick={(e) => { e.stopPropagation(); addCourse(track.id); }} aria-label="Add module"
                    style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={13} /></button>} />
              </div>
              {open && (
                <div style={{ marginLeft: 14, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 2 }}>
                  {courses.length === 0 && (
                    <button data-btn onClick={() => addCourse(track.id)}
                      style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '5px 8px', color: T.mutedSoft, fontSize: 11, textAlign: 'left' }}>
                      <Icon name="plus" size={12} />Add a module
                    </button>
                  )}
                  {courses.map((course) => (
                    <CourseBranch key={course.id} doc={doc} track={track} course={course} courses={courses} live={live}
                      sel={sel} setSel={setSel} edit={edit}
                      open={isOpen(course.id)} toggle={() => toggle(course.id)}
                      onAddLesson={() => addLesson(course.id)}
                      onDeleteCourse={() => deleteCourse(course)}
                      onDeleteLesson={(l) => deleteLesson(course, l)} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '9px 14px', borderTop: `1px solid ${T.borderSoft}`, flexWrap: 'wrap' }}>
        {['live', 'waiting', 'none'].map(k => (
          <span key={k} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10, color: T.muted }}>
            <Icon name={LIVE_FACE[k].icon} size={11} color={LIVE_FACE[k].color} />{LIVE_FACE[k].label}
          </span>
        ))}
      </div>
    </div>
  );
};

/* One module row plus its lesson list. Split out so each module owns its own
   drag state, a single shared one would make every list jump at once. */
const CourseBranch = ({ doc, track, course, courses, live, sel, setSel, edit, open, toggle, onAddLesson, onDeleteCourse, onDeleteLesson }) => {
  const idx = courses.indexOf(course);
  const moveWithinTrack = (from, to) => edit(d => {
    const ids = courses.map(c => c.id);
    const reordered = moveItem(ids, from, to);
    const others = d.courses.filter(c => c.track !== track.id);
    const mine = reordered.map(id => d.courses.find(c => c.id === id)).filter(Boolean);
    const firstAt = d.courses.findIndex(c => c.track === track.id);
    const out = others.slice();
    out.splice(Math.max(0, firstAt), 0, ...mine);
    d.courses = out;
  });
  const courseDnd = useDragOrder(moveWithinTrack);
  const moveLesson = (f, t) => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = moveItem(c.lessons, f, t); });
  const lessonDnd = useDragOrder(moveLesson);
  const selectedCourse = sel.kind === 'course' && sel.id === course.id;
  const lessons = course.lessons || [];
  const liveN = lessons.filter(l => lessonLiveState(l, live) === 'live').length;
  const waitN = lessons.filter(l => lessonLiveState(l, live) === 'waiting').length;

  return (
    <div {...courseDnd(idx)} style={{ marginBottom: 2, borderRadius: T.radius }}>
      <div data-row onClick={() => setSel({ kind: 'course', id: course.id })}
        style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 8px', borderRadius: T.radius, cursor: 'pointer',
          background: selectedCourse ? T.primarySoft : 'transparent' }}
        onMouseEnter={e => { if (!selectedCourse) e.currentTarget.style.background = T.fieldBg; }}
        onMouseLeave={e => { if (!selectedCourse) e.currentTarget.style.background = 'transparent'; }}>
        <button data-btn onClick={e => { e.stopPropagation(); toggle(); }} aria-label={open ? 'Collapse' : 'Expand'}
          style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
          <Icon name={open ? 'chevronDown' : 'chevronRight'} size={12} />
        </button>
        <span style={{ flex: 1, minWidth: 0, fontSize: 11.5, fontWeight: 600, color: T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {course.title || <span style={{ color: T.red }}>Untitled module</span>}
        </span>
        {course.popular && <Icon name="star" size={10} color={T.amber} />}
        {waitN > 0 && <span title={`${waitN} not live yet`} style={{ fontSize: 9.5, fontWeight: 800, color: T.amber }}>{waitN}</span>}
        <span style={{ fontSize: 9.5, color: liveN ? T.greenDark : T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{liveN}/{lessons.length}</span>
        <RowActions
          canUp={idx > 0} canDown={idx < courses.length - 1}
          onUp={() => moveWithinTrack(idx, idx - 1)}
          onDown={() => moveWithinTrack(idx, idx + 1)}
          onDelete={onDeleteCourse}
          extra={<button data-btn onClick={(e) => { e.stopPropagation(); onAddLesson(); }} aria-label="Add lesson"
            style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={12} /></button>} />
      </div>
      {open && (
        <div style={{ marginLeft: 12, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 1 }}>
          {lessons.length === 0 && (
            <button data-btn onClick={onAddLesson}
              style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '4px 8px', color: T.mutedSoft, fontSize: 10.5, textAlign: 'left' }}>
              <Icon name="plus" size={11} />Add a lesson
            </button>
          )}
          {lessons.map((l, li) => {
            const selectedLesson = sel.kind === 'lesson' && sel.id === l.id;
            const state = lessonLiveState(l, live);
            const face = LIVE_FACE[state];
            return (
              <div key={l.id} {...lessonDnd(li)} data-row
                onClick={() => setSel({ kind: 'lesson', id: l.id, courseId: course.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px', marginBottom: 1, borderRadius: 6, cursor: 'pointer',
                  background: selectedLesson ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedLesson) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedLesson) e.currentTarget.style.background = 'transparent'; }}>
                <Icon name={face.icon} size={11} color={face.color} />
                <span style={{ flex: 1, minWidth: 0, fontSize: 11, color: selectedLesson ? T.text : T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {l.title || <span style={{ color: T.red }}>Untitled lesson</span>}
                </span>
                {state !== 'none' && <span style={{ fontSize: 9, fontWeight: 800, letterSpacing: 0.3, textTransform: 'uppercase', color: face.color }}>{face.label}</span>}
                <span style={{ fontSize: 9.5, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{l.mins || 0}m</span>
                <RowActions
                  canUp={li > 0} canDown={li < lessons.length - 1}
                  onUp={() => moveLesson(li, li - 1)}
                  onDown={() => moveLesson(li, li + 1)}
                  onDelete={() => onDeleteLesson(l)} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

/* ===== editors ============================================================ */

        </span>

          <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft }}>{eyebrow}</div>

const TrackEditor = ({ doc, track, edit }) => {
  const set = (patch) => edit(d => { const t = (d.tracks || []).find(x => x.id === track.id); if (t) Object.assign(t, patch); });
  const owned = (doc.courses || []).filter(c => c.track === track.id);
  return (
    <EditorShell eyebrow="Track" title={track.label || 'Untitled track'} icon="layers" color={track.color}>
      <Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="Name" hint="Learners see this as a browse chip. Keep it short and plain, for example Payroll and tax.">
            <Input value={track.label || ''} onChange={e => set({ label: e.target.value })} placeholder="Get started" />
          </Field>
          <Field label="One-line description" hint="Shown under the track name in some views. Say what the learner will be able to do.">
            <Input value={track.blurb || ''} onChange={e => set({ blurb: e.target.value })} placeholder="Set up your practice and find your way around" />
          </Field>
          <Field label="Colour" hint="Tints the module thumbnails in this track, so learners can tell modules apart at a glance.">
            <div style={{ display: 'flex', gap: 7 }}>
              {TRACK_COLORS.map(c => (
                <button key={c.hex} data-btn onClick={() => set({ color: c.hex })} title={c.label}
                  style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px', borderRadius: 999, fontSize: 11.5, fontWeight: 600,
                    border: `1px solid ${track.color === c.hex ? c.hex : T.border}`, background: track.color === c.hex ? withAlpha(c.hex, 0.10) : T.card, color: track.color === c.hex ? c.hex : T.muted }}>
                  <span style={{ width: 11, height: 11, borderRadius: 999, background: c.hex }} />{c.label}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Id" hint="Used by the app to remember which chip a module belongs to. Changing it detaches every module below, rename the label instead unless you know why you're doing this.">
            <Input value={track.id} onChange={e => {
              const next = slug(e.target.value) || track.id;
              edit(d => {
                (d.courses || []).forEach(c => { if (c.track === track.id) c.track = next; });
                const t = (d.tracks || []).find(x => x.id === track.id); if (t) t.id = next;
              });
            }} style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 11.5 }} />
          </Field>
        </div>
      </Card>
      <Card>
        <SectionTitle style={{ marginBottom: 10 }}>Modules in this track</SectionTitle>
        {owned.length === 0
          ? <Helper>None yet. Use the plus button on the track row in the tree.</Helper>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {owned.map(c => (
                <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                  <Icon name={c.icon || 'bookOpen'} size={13} color={T.mutedSoft} />
                  <span style={{ flex: 1 }}>{c.title || 'Untitled'}</span>

                </div>
              ))}
            </div>}
      </Card>
    </EditorShell>

};

const CourseEditor = ({ doc, course, edit, fireToast, setSel }) => {
  const set = (patch) => edit(d => { const c = findCourse(d, course.id); if (c) Object.assign(c, patch); });
  const tracks = doc.tracks || [];
  const lessons = course.lessons || [];
  const inPaths = (doc.paths || []).filter(p => (p.lessonIds || []).some(id => lessons.some(l => l.id === id)));
  const color = trackColorOf(doc, course.track);

  // A ready-to-paste YouTube description: the module's own lesson list as
  // chapter timestamps.
  const contentPack = () => {
    const lines = [];
    lines.push(course.title || 'Untitled module');
    if (course.summary) lines.push('', course.summary);
    lines.push('', 'In this module:');
    let t = 0;
    lessons.forEach((l) => {
      const mm = String(Math.floor(t / 60)).padStart(2, '0');
      const ss = String(t % 60).padStart(2, '0');
      lines.push(`${mm}:${ss} ${l.title || 'Untitled lesson'}`);
      t += (Number(l.mins) || 0) * 60;
    });
    const text = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(
      () => fireToast('Module content pack copied'),
      () => fireToast({ message: 'Could not copy, check clipboard permissions', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available in this browser', tone: 'warn' });
  };

  return (
    <EditorShell eyebrow="Module" title={course.title || 'Untitled module'} icon={course.icon || 'bookOpen'} color={color}

          <Field label="Title" hint="What learners scan in the catalog. Name it after the thing they want to do.">

          <Field label="Summary" hint="Two lines max, it fills the body of the module card.">
            <Textarea rows={2} value={course.summary || ''} onChange={e => set({ summary: e.target.value })} placeholder="Run compliant Australian payroll, end to end." />

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <Field label="Track">
              <Select value={course.track || ''} onChange={e => set({ track: e.target.value })}>
                <option value="">(none)</option>
                {tracks.map(t => <option key={t.id} value={t.id}>{t.label || t.id}</option>)}
              </Select>
            </Field>
            <Field label="Level">
              <Select value={course.level || 'Beginner'} onChange={e => set({ level: e.target.value })}>
                {LEVELS.map(l => <option key={l} value={l}>{l}</option>)}

          <Field label="Menu group" hint="The group in the app's left-hand menu this module teaches. Leave blank if it doesn't map to one.">

            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
              {COURSE_ICONS.map(n => (
                <button key={n} data-btn onClick={() => set({ icon: n })} title={n}
                  style={{ width: 32, height: 32, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center',

/* ---- the video field ------------------------------------------------------
   Paste a link, press Attach, watch it play right here. If it plays here it
   plays for a learner, which is the whole point of showing the embed. */
const VideoField = ({ lesson, onApply, fireToast }) => {
  const [raw, setRaw] = useState(lesson.videoUrl || lesson.embedUrl || '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');
  const [meta, setMeta] = useState(null);

  useEffect(() => {
    setRaw(lesson.videoUrl || lesson.embedUrl || '');
    setErr(''); setNote(''); setMeta(null);
  }, [lesson.id]);

  const attached = lessonHasVideo(lesson);

  const attach = () => {
    const parsed = parseVideoLink(raw);
    if (!parsed || parsed.provider === 'invalid') {
      setErr('That does not look like a video link. Copy the address from the browser bar on the YouTube page, it should start with https://www.youtube.com/ or https://youtu.be/');
      return;
    }
    setErr('');
    const patch = parsed.provider === 'file'
      ? { videoUrl: parsed.fileUrl, embedUrl: '', thumbUrl: lesson.thumbUrl || '' }
      : { videoUrl: '', embedUrl: parsed.embedUrl, thumbUrl: parsed.thumbUrl || lesson.thumbUrl || '' };
    onApply(patch);
    fireToast('Video attached. Publish to make it live.');
    // The video knows its own title and length; what's typed into the curriculum
    // so far was a guess, so offer to replace it rather than silently overwriting
    // a title someone already wrote on purpose.
    setBusy(true);
    fetchVideoMeta(parsed).then(m => {
      setBusy(false);
      if (m && m.mins) { onApply({ mins: m.mins }); setNote('Length set to ' + m.mins + ' min, taken from the video.'); }
      if (m && m.title) setMeta(m);
    });
  };

  const clear = () => { onApply({ videoUrl: '', embedUrl: '', thumbUrl: '' }); setRaw(''); setErr(''); setNote(''); setMeta(null); };

  return (
    <Card>
      <SectionTitle style={{ marginBottom: 10 }}>1. The video</SectionTitle>
      <div style={{ display: 'flex', gap: 6 }}>
        <Input value={raw} onChange={e => { setRaw(e.target.value); setErr(''); }}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); attach(); } }}
          placeholder="Paste the YouTube link here" />
        <Btn variant="primary" icon="link" onClick={attach} disabled={!raw.trim()}>Attach</Btn>
      </div>
      <Helper style={{ marginTop: 7 }}>Unlisted YouTube links are fine, and are what we recommend.</Helper>

      {err && (
        <div style={{ marginTop: 10, padding: '9px 11px', borderRadius: T.radius, background: T.redSoft, border: `1px solid ${withAlpha(T.red, 0.3)}`,
          fontSize: 12, color: T.red, display: 'flex', gap: 8 }}>
          <Icon name="alertTriangle" size={14} color={T.red} /><span>{err}</span>
        </div>
      )}
      {busy && <Helper style={{ marginTop: 8 }}>Looking up the video&rsquo;s details…</Helper>}
      {note && <Helper style={{ marginTop: 8, color: T.greenDark }}>{note}</Helper>}

      {meta && meta.title && (
        <div style={{ marginTop: 12, padding: 11, borderRadius: T.radius, background: T.primarySofter, border: `1px solid ${T.borderSoft}` }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: T.primaryDark, marginBottom: 7 }}>Found on the video, use it?</div>
          <Btn variant="outline" size="sm" icon="check" onClick={() => { onApply({ title: meta.title }); setMeta(null); }}>
            Title: "{meta.title.length > 42 ? meta.title.slice(0, 42) + '…' : meta.title}"
          </Btn>
        </div>
      )}

      {attached && (
        <div style={{ marginTop: 13 }}>
          <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radius, overflow: 'hidden', background: '#000' }}>
            {lesson.videoUrl
              ? <video src={lesson.videoUrl} controls preload="metadata" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
              : <iframe src={lesson.embedUrl} title={lesson.title || 'Chapter video'} frameBorder="0"
                  allow="encrypted-media; fullscreen; picture-in-picture" allowFullScreen
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />}
          </div>
          <div style={{ marginTop: 9, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <Helper style={{ flex: 1, minWidth: 200, fontSize: 11 }}>Play it here. If it plays for you it plays for a learner.</Helper>
            <Btn variant="ghost" size="sm" icon="close" onClick={clear} style={{ color: T.muted }}>Remove this video</Btn>
          </div>
          <Field label="Thumbnail override" hint="Leave blank to use the video's own poster. Paste an image URL, or a link copied from Media, to use something else." style={{ marginTop: 12 }}>
            <Input value={lesson.thumbUrl || ''} onChange={e => onApply({ thumbUrl: e.target.value })} placeholder="https://… (optional)" />
          </Field>
        </div>
      )}
    </Card>
  );
};

/* ===== production board ===================================================
   Every lesson in one list, grouped by where it is up to. Purely internal
   workflow tracking: none of it feeds the learner-facing published status,
   which stays exactly "has a real video, or it doesn't" (toPublished above). */
const ProductionScreen = ({ doc, edit, jumpToLesson, owners }) => {
  const [q, setQ] = useState('');
  const [owner, setOwner] = useState('all');
  const [courseId, setCourseId] = useState('all');
  const rows = allLessons(doc);

  const counts = STATUSES.map(s => ({ ...s, n: rows.filter(r => ((r.lesson.production && r.lesson.production.status) || 'idea') === s.id).length }));
  const total = rows.length;
  const done = counts.find(c => c.id === 'published');
  const query = q.trim().toLowerCase();

  const filtered = rows.filter(({ lesson, course }) => {
    const p = lesson.production || {};
    if (owner !== 'all' && (p.owner || '') !== owner) return false;
    if (courseId !== 'all' && course.id !== courseId) return false;
    if (query && !((lesson.title || '') + ' ' + (course.title || '') + ' ' + (p.owner || '') + ' ' + (p.notes || '')).toLowerCase().includes(query)) return false;
    return true;
  });

  const setStatus = (course, lesson, status) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), status };
  });
  const setOwnerOn = (course, lesson, v) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), owner: v };
  });
  const setDue = (course, lesson, v) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), due: v };
  });

  const overdue = (p) => {
    if (!p || !p.due || p.status === 'published') return false;
    const d = new Date(p.due + 'T23:59:59');
    return !isNaN(d.getTime()) && d.getTime() < Date.now();
  };

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ marginBottom: 16 }}>
        <SectionTitle style={{ fontSize: 16 }}>Production</SectionTitle>
        <Helper style={{ marginTop: 2 }}>Where every lesson is up to. Internal only, none of this is published.</Helper>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px,1fr))', gap: 9, marginBottom: 14 }}>
        {counts.map(c => (
          <Card key={c.id} pad={12}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10.5, fontWeight: 700, color: c.color, textTransform: 'uppercase', letterSpacing: 0.4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 999, background: c.color }} />{c.label}
            </div>
            <div style={{ fontSize: 21, fontWeight: 800, marginTop: 5, letterSpacing: -0.5 }}>{c.n}</div>
          </Card>
        ))}
      </div>

      <Card style={{ marginBottom: 14 }} pad={13}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, marginBottom: 8, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 12, fontWeight: 600 }}>{done ? done.n : 0} of {total} lessons published</div>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.primary }}>{total ? Math.round(((done ? done.n : 0) / total) * 100) : 0}%</div>
        </div>
        <ProgressBar pct={total ? ((done ? done.n : 0) / total) * 100 : 0} color={T.green} height={7} />
      </Card>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 11px', border: `1px solid ${T.border}`, borderRadius: T.radius, background: T.card, minWidth: 220 }}>
          <Icon name="search" size={13} color={T.muted} />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search lessons, owners, notes…"
            style={{ flex: 1, minWidth: 0, border: 'none', background: 'transparent', outline: 'none', fontSize: 12.5 }} />
          {q && <button data-btn onClick={() => setQ('')} aria-label="Clear" style={{ border: 'none', background: 'transparent', padding: 0, color: T.muted }}><Icon name="close" size={12} /></button>}
        </div>
        <Select value={owner} onChange={e => setOwner(e.target.value)} style={{ width: 'auto', minWidth: 130 }}>
          <option value="all">Everyone</option>
          <option value="">Unassigned</option>
          {owners.map(o => <option key={o} value={o}>{o}</option>)}
        </Select>
        <Select value={courseId} onChange={e => setCourseId(e.target.value)} style={{ width: 'auto', maxWidth: 240 }}>
          <option value="all">All modules</option>
          {(doc.courses || []).map(c => <option key={c.id} value={c.id}>{c.title || c.id}</option>)}
        </Select>
        <Helper style={{ fontSize: 11 }}>{filtered.length} of {total}</Helper>
      </div>

      {filtered.length === 0 ? (
        <Card><EmptyState icon="search" title="Nothing matches" hint="Try a different owner, module or search." /></Card>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {STATUSES.map(s => {
            const group = filtered.filter(r => (((r.lesson.production && r.lesson.production.status) || 'idea') === s.id));
            if (!group.length) return null;
            return (
              <div key={s.id}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }} />
                  <div style={{ fontSize: 12.5, fontWeight: 700 }}>{s.label}</div>
                  <Helper style={{ fontSize: 11 }}>{s.blurb} · {group.length}</Helper>
                </div>
                <Card pad={0} style={{ overflow: 'hidden' }}>
                  {group.map(({ lesson, course }, i) => {
                    const p = lesson.production || {};
                    const late = overdue(p);
                    return (
                      <div key={lesson.id} style={{ display: 'grid', gridTemplateColumns: 'minmax(0,2.2fr) minmax(0,1.2fr) 130px 132px 118px', gap: 10, alignItems: 'center',
                        padding: '9px 13px', borderTop: i ? `1px solid ${T.borderSoft}` : 'none' }}>
                        <div style={{ minWidth: 0 }}>
                          <button data-btn onClick={() => jumpToLesson(course.id, lesson.id)}
                            style={{ border: 'none', background: 'transparent', padding: 0, textAlign: 'left', fontSize: 12.5, fontWeight: 600, color: T.text, display: 'flex', alignItems: 'center', gap: 6, maxWidth: '100%' }}>
                            <Icon name={lessonHasVideo(lesson) ? 'video' : 'clock'} size={12} color={lessonHasVideo(lesson) ? T.greenDark : T.borderStrong} />
                            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lesson.title || 'Untitled lesson'}</span>
                          </button>
                          {p.notes && <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.notes}</div>}
                        </div>
                        <div style={{ fontSize: 11, color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{course.title || 'Untitled module'}</div>
                        <Input list="academy-owners" value={p.owner || ''} placeholder="Unassigned"
                          onChange={e => setOwnerOn(course, lesson, e.target.value)} style={{ padding: '4px 8px', fontSize: 11.5 }} />
                        <Input type="date" value={p.due || ''} onChange={e => setDue(course, lesson, e.target.value)}
                          style={{ padding: '4px 8px', fontSize: 11.5, borderColor: late ? T.red : T.border, color: late ? T.red : T.text }} />
                        <Select value={p.status || 'idea'} onChange={e => setStatus(course, lesson, e.target.value)} style={{ padding: '4px 8px', fontSize: 11.5 }}>
                          {STATUSES.map(x => <option key={x.id} value={x.id}>{x.label}</option>)}
                        </Select>
                      </div>
                    );
                  })}
                </Card>
              </div>
            );
          })}
        </div>
      )}
      <datalist id="academy-owners">{owners.map(o => <option key={o} value={o} />)}</datalist>
    </div>
  );
};

/* ===== preview =============================================================
   Ports the live Academy's own presentation logic (thumb, course card, path
   card, video stage) so the team sees the real thing, not an approximation.
   Deliberately self-contained: this does not fetch from academy-app, so
   Studio stays independent of engineering's app, matching the ownership
   split between the two tools. Progress always shows as "not started", this
   previews content, not one person's history. */
const PreviewThumb = ({ doc, course, playSize = 54, watermark = 132, radius = T.radiusLg }) => {
  const color = trackColorOf(doc, course.track);
  const icon = course.icon || 'bookOpen';
  const lessons = course.lessons || [];
  const firstThumb = (lessons.find(l => l.thumbUrl) || {}).thumbUrl;
  return (
    <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: radius, overflow: 'hidden',
      background: firstThumb ? `#000 center/cover no-repeat url("${firstThumb}")` : `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.44)} 100%)` }}>
      {!firstThumb && <>
        <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(120% 84% at 12% -8%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 52%)` }} />
        <div style={{ position: 'absolute', right: -20, bottom: -26, opacity: 0.15, transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
          <Icon name={icon} size={watermark} color="#fff" strokeWidth={1.3} />
        </div>
      </>}
      {firstThumb && <div style={{ position: 'absolute', inset: 0, background: withAlpha('#0F1117', 0.28) }} />}
      <div style={{ position: 'absolute', top: 12, right: 12, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, backdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={11} color="#fff" />{courseMins(course)} min
      </div>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: playSize, height: playSize, borderRadius: '50%', background: withAlpha('#FFFFFF', 0.97), display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 28px rgba(0,0,0,0.30)' }}>
          <svg width={Math.round(playSize * 0.33)} height={Math.round(playSize * 0.33)} viewBox="0 0 24 24" fill={color} style={{ marginLeft: 2 }}><polygon points="6,4 20,12 6,20" /></svg>
        </div>
      </div>
    </div>
  );
};

const PreviewCourseCard = ({ doc, course, onOpen }) => {

/* A path is now a lesson-level playlist, so its card previews the actual
   video sequence (with which module each one is from) rather than a
   module-by-module tracker. */
const PreviewPathCard = ({ doc, path }) => {
  const entries = (path.lessonIds || []).map(id => findLessonAnywhere(doc, id)).filter(Boolean);
  const mins = entries.reduce((s, { lesson }) => s + (Number(lesson.mins) || 0), 0);
  return (
    <div style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, padding: 16, boxShadow: T.shadowSm, display: 'flex', flexDirection: 'column', gap: 11 }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 11 }}>
        <span style={{ width: 34, height: 34, borderRadius: 10, background: T.primarySoft, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name="graduation" size={17} color={T.primary} />
        </span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: -0.2 }}>{path.title || 'Untitled path'}</div>
          <div style={{ fontSize: 10.5, color: T.muted, marginTop: 1 }}>{path.forRole || 'Not set'}</div>
        </div>
      </div>
      <Helper style={{ fontSize: 11.5 }}>{path.blurb || <span style={{ color: T.mutedSoft, fontStyle: 'italic' }}>No blurb yet</span>}</Helper>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        {entries.slice(0, 5).map(({ course, lesson }, i) => (
          <div key={lesson.id + i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 11.5 }}>
            <span style={{ width: 16, textAlign: 'center', color: T.mutedSoft, fontSize: 10, fontVariantNumeric: 'tabular-nums' }}>{i + 1}</span>
            <Icon name={course.icon || 'bookOpen'} size={12} color={trackColorOf(doc, course.track)} />
            <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lesson.title || 'Untitled lesson'}</span>
            <span style={{ color: T.mutedSoft, fontSize: 10 }}>{course.title}</span>
          </div>
        ))}
        {entries.length > 5 && <Helper style={{ fontSize: 10.5 }}>+ {entries.length - 5} more</Helper>}
        {entries.length === 0 && <Helper style={{ fontSize: 11 }}>No videos in this path yet.</Helper>}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 11, color: T.muted }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{plural(entries.length, 'video')}</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="clock" size={12} color={T.mutedSoft} />{mins} min</span>
      </div>
    </div>
  );
};

const PreviewStage = ({ doc, course, lesson }) => {
  const [playing, setPlaying] = useState(false);
  const color = trackColorOf(doc, course.track);
  useEffect(() => { setPlaying(false); }, [lesson.id]);
  const stage = { position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radiusLg, overflow: 'hidden' };

  if (playing && lesson.videoUrl) return (
    <div style={{ ...stage, background: '#000' }}>
      <video src={lesson.videoUrl} controls autoPlay preload="metadata" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
    </div>
  );
  if (playing && lesson.embedUrl) {
    const src = lesson.embedUrl + (lesson.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
    return (
      <div style={{ ...stage, background: '#000' }}>
        <iframe src={src} title={lesson.title} frameBorder="0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />
      </div>
    );
  }
  const comingSoon = playing && !lessonHasVideo(lesson);
  return (
    <div style={{ ...stage, background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.46)} 100%)`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', background: `radial-gradient(110% 80% at 14% -6%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 50%)` }} />
      <div style={{ position: 'absolute', right: -26, bottom: -32, opacity: 0.13, transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
        <Icon name={course.icon || 'bookOpen'} size={210} color="#fff" strokeWidth={1.2} />
      </div>
      <div style={{ position: 'absolute', top: 16, left: 18, zIndex: 2, maxWidth: '70%' }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 1.4, textTransform: 'uppercase', color: 'rgba(255,255,255,0.82)' }}>Video lesson</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginTop: 3, color: '#fff', letterSpacing: -0.2 }}>{lesson.title || 'Untitled lesson'}</div>
      </div>
      <div style={{ position: 'absolute', top: 16, right: 18, zIndex: 2, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '4px 9px', borderRadius: 999 }}>
        <Icon name="clock" size={12} color="#fff" />{lesson.mins || 0} min
      </div>
      {comingSoon ? (
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <div style={{ fontSize: 14.5, fontWeight: 700 }}>Preview coming soon</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 380, lineHeight: 1.5 }}>The full video for this lesson is being recorded. Explore the feature live in your dashboard, then mark it complete.</div>
        </div>
      ) : (
        <button data-btn onClick={() => setPlaying(true)} aria-label="Play lesson" style={{
          position: 'relative', zIndex: 2, width: 82, height: 82, borderRadius: '50%', border: 'none',
          background: withAlpha('#FFFFFF', 0.97), display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 16px 40px rgba(0,0,0,0.30)' }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill={color} style={{ marginLeft: 4 }}><polygon points="6,4 20,12 6,20" /></svg>
        </button>

                  const active = l.id === lesson.id;
                  return (
                    <div key={l.id} onClick={() => setLessonId(l.id)}

};

/* ===== media library =======================================================
   Thumbnails, checklists and screenshots, the files that go WITH lessons.
   Videos are never uploaded here; they live on YouTube/Vimeo/Loom and the
   lesson stores the link. Backed by CLOUD.listAssets/saveAsset/deleteAsset,
   already implemented in resources/academy-cloud.js, nothing new to build
   on the backend. */
const MediaScreen = ({ assets, onUpload, onDelete, cloud, fireToast, busy, doc }) => {
  const [q, setQ] = useState('');
  const [pendingDelete, setPendingDelete] = useState(null);
  const fileRef = useRef(null);
  const query = q.trim().toLowerCase();
  const shown = assets.filter(a => !query || ((a.name || '') + ' ' + (a.tags || '')).toLowerCase().includes(query));

  const usedBy = (asset) => {
    const url = asset && (asset.url || asset.public_url);
    if (!url || !doc) return [];
    const hits = [];
    (doc.courses || []).forEach(c => (c.lessons || []).forEach(l => {
      const inResources = (l.resources || []).some(r => r.href === url);
      const inThumb = l.thumbUrl === url;
      if (inResources || inThumb) hits.push(`${l.title || 'Untitled lesson'} (${c.title || 'Untitled module'})`);
    }));
    return hits;
  };

  const copy = (url) => {
    if (!url) return;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => fireToast('Link copied'), () => fireToast({ message: 'Could not copy', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available', tone: 'warn' });
  };

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 14, marginBottom: 16, flexWrap: 'wrap' }}>
        <div>
          <SectionTitle style={{ fontSize: 16 }}>Media</SectionTitle>
          <Helper style={{ marginTop: 2, maxWidth: 560 }}>
            Thumbnails, checklists and screenshots. Upload once, paste the link into any lesson's thumbnail override or downloads.
          </Helper>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.docx,.xlsx,.csv" style={{ display: 'none' }}
            onChange={e => { const fs = Array.from(e.target.files || []); if (fs.length) onUpload(fs); e.target.value = ''; }} />

            const isImg = /^image\//.test(a.mime || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(a.name || '');

              <Card key={a.id} pad={0} style={{ overflow: 'hidden' }}>
