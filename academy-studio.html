/* ===== helpers ============================================================ */
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = (prefix) => prefix + '-' + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);
const withAlpha = (hex, a) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};
const darkenHex = (hex, amt) => {
  const h = String(hex).replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 - amt))));
  return '#' + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
};
const fmtWhen = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (_) { return ''; }
};
const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

/* ===== video links ========================================================
   The team pastes a link; we work out the rest. Deterministic derivation first
   (provider + embed URL + thumbnail from the id), then a best-effort oEmbed call
   for the title/duration/poster. oEmbed is allowed to fail silently — the
   derived values are what the live app actually needs. */
const parseVideoLink = (raw) => {
  const url = String(raw || '').trim();
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return {
    provider: 'youtube', label: 'YouTube', id: m[1],
    watchUrl: 'https://www.youtube.com/watch?v=' + m[1],
    embedUrl: 'https://www.youtube.com/embed/' + m[1],
    thumbUrl: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg',
    oembed: 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + m[1]),
  };
  m = url.match(/vimeo\.com\/(?:video\/|channels\/[\w]+\/)?(\d{6,})/i);
  if (m) return {
    provider: 'vimeo', label: 'Vimeo', id: m[1],
    watchUrl: 'https://vimeo.com/' + m[1],
    embedUrl: 'https://player.vimeo.com/video/' + m[1],
    thumbUrl: '',
    oembed: 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent('https://vimeo.com/' + m[1]),
  };
  m = url.match(/loom\.com\/(?:share|embed)\/([0-9a-f]{8,})/i);
  if (m) return {
    provider: 'loom', label: 'Loom', id: m[1],
    watchUrl: 'https://www.loom.com/share/' + m[1],
    embedUrl: 'https://www.loom.com/embed/' + m[1],
    thumbUrl: 'https://cdn.loom.com/sessions/thumbnails/' + m[1] + '-with-play.gif',
    oembed: 'https://www.loom.com/v1/oembed?url=' + encodeURIComponent('https://www.loom.com/share/' + m[1]),
  };
  if (/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return {
    provider: 'file', label: 'Video file', id: '', watchUrl: url, embedUrl: '', fileUrl: url, thumbUrl: '', oembed: '',
  };
  if (/^https?:\/\//i.test(url)) return {
    provider: 'unknown', label: 'Other link', id: '', watchUrl: url, embedUrl: url, thumbUrl: '', oembed: '',
  };
  return { provider: 'invalid', label: 'Not a link', id: '', watchUrl: '', embedUrl: '', thumbUrl: '', oembed: '' };
};

// Best-effort metadata. Resolves to {} on any failure — never throws, never blocks.
const fetchVideoMeta = (parsed) => {
  if (!parsed || !parsed.oembed) return Promise.resolve({});
  return fetch(parsed.oembed)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j) return {};
      const out = {};
      if (j.title) out.title = String(j.title);
      if (j.thumbnail_url) out.thumbUrl = String(j.thumbnail_url);
      // Vimeo returns seconds; Loom returns milliseconds on some payloads.
      let secs = Number(j.duration);
      if (isFinite(secs) && secs > 0) {
        if (secs > 60 * 60 * 12) secs = secs / 1000;   // clearly ms, not s
        out.mins = Math.max(1, Math.round(secs / 60));
      }
      return out;
    })
    .catch(() => ({}));
};

/* Move an item within an array, returning a new array. */
const moveItem = (arr, from, to) => {
  const a = arr.slice();
  if (from < 0 || from >= a.length) return a;
  const clamped = Math.max(0, Math.min(a.length - 1, to));
  a.splice(clamped, 0, a.splice(from, 1)[0]);
  return a;
};

/* ---- readiness checks ----------------------------------------------------
   What would embarrass us if it shipped. Severity: 'block' stops a publish,
   'warn' is advisory. Every issue carries enough to jump straight to the fix. */
const computeIssues = (doc) => {
  const issues = [];
  const push = (severity, category, label, detail, target) => issues.push({ id: uid('i'), severity, category, label, detail, target });
  const cats = doc.categories || [];
  const courses = doc.courses || [];
  const paths = doc.paths || [];

  // duplicate ids anywhere — these silently break progress tracking in the app
  const seen = {};
  const dupe = (id, what, target) => {
    if (!id) { push('block', 'Missing id', `${what} has no id`, 'Every item needs a stable id — progress tracking keys off it.', target); return; }
    if (seen[id]) push('block', 'Duplicate id', `"${id}" is used twice`, `${what} reuses an id that already exists. Learner progress would be shared between them.`, target);
    seen[id] = true;
  };
  cats.forEach(c => dupe(c.id, `Category "${c.label || 'Untitled'}"`, { kind: 'category', id: c.id }));
  courses.forEach(c => {
    dupe(c.id, `Course "${c.title || 'Untitled'}"`, { kind: 'course', id: c.id });
    (c.lessons || []).forEach(l => dupe(l.id, `Lesson "${l.title || 'Untitled'}"`, { kind: 'lesson', id: l.id, courseId: c.id }));
  });

  cats.forEach(c => {
    if (!String(c.label || '').trim()) push('block', 'Untitled', 'A category has no name', 'Learners see this as a filter chip — it cannot be blank.', { kind: 'category', id: c.id });
    if (CATEGORY_ICONS.indexOf(c.icon) < 0) push('block', 'Bad icon', `"${c.label || c.id}" uses an unknown icon`, `"${c.icon}" is not an icon the app can render — pick one from the list.`, { kind: 'category', id: c.id });
    if (!courses.some(x => x.category === c.id)) push('warn', 'Empty category', `"${c.label || c.id}" has no courses`, 'It will not appear anywhere for learners. Delete it or add a course.', { kind: 'category', id: c.id });
  });

  courses.forEach(c => {
    if (!String(c.title || '').trim()) push('block', 'Untitled', 'A course has no title', 'Course cards would render blank.', { kind: 'course', id: c.id });
    if (!catById(doc, c.category)) push('block', 'Orphan course', `"${c.title || c.id}" has no valid category`, 'It will not show under any filter. Pick a category.', { kind: 'course', id: c.id });
    if (!(c.lessons || []).length) push('block', 'Empty course', `"${c.title || c.id}" has no lessons`, 'Opening it would show an empty player.', { kind: 'course', id: c.id });
    if (!String(c.summary || '').trim()) push('warn', 'No summary', `"${c.title || c.id}" has no summary`, 'The card body would be blank in the catalog.', { kind: 'course', id: c.id });
    (c.lessons || []).forEach(l => {
      if (!String(l.title || '').trim()) push('block', 'Untitled', `A lesson in "${c.title || c.id}" has no title`, 'Playlist rows would render blank.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!lessonHasVideo(l)) push('warn', 'No video', `"${l.title || l.id}" has no video`, 'Learners get the "preview coming soon" poster instead of a video.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!String(l.description || '').trim()) push('warn', 'No description', `"${l.title || l.id}" has no description`, 'The lesson page would have no text under the player.', { kind: 'lesson', id: l.id, courseId: c.id });
      if (!(Number(l.mins) > 0)) push('warn', 'No duration', `"${l.title || l.id}" has no length`, 'Duration chips would read "0 min".', { kind: 'lesson', id: l.id, courseId: c.id });
      (l.resources || []).forEach(r => {
        if (String(r.label || '').trim() && !String(r.href || '').trim()) push('warn', 'Dead resource link', `"${r.label}" in "${l.title || l.id}" has no URL`, 'It would render as a link that goes nowhere.', { kind: 'lesson', id: l.id, courseId: c.id });
      });
    });
  });

  paths.forEach(p => {
    if (!String(p.title || '').trim()) push('block', 'Untitled', 'A learning path has no title', 'Path cards would render blank.', { kind: 'path', id: p.id });
    if (!(p.courseIds || []).length) push('block', 'Empty path', `"${p.title || p.id}" has no courses`, 'Opening it would go nowhere.', { kind: 'path', id: p.id });
    (p.courseIds || []).forEach(cid => {
      if (!courses.some(c => c.id === cid)) push('block', 'Broken path', `"${p.title || p.id}" points at a deleted course`, `Course "${cid}" no longer exists. Remove it from the path.`, { kind: 'path', id: p.id });
    });
  });

  return issues;
};

/* ===== drag to reorder ====================================================
   HTML5 drag-and-drop for speed, with ↑/↓ buttons on every row as the reliable
   path (and the only one that works from a keyboard). Nested lists stopPropagation
   so dragging a lesson doesn't also drag its course. */
const useDragOrder = (onMove) => {
  // The source index lives in a REF, not state. dragstart → dragover → drop can
  // all land in one tick (any synthetic drag, and some real fast ones), and a
  // state update wouldn't have committed yet, so the drop would read `null` and
  // silently do nothing. State is only mirrored for the visual highlight.
  const fromRef = useRef(null);
  const [from, setFrom] = useState(null);
  const [over, setOver] = useState(null);
  const reset = () => { fromRef.current = null; setFrom(null); setOver(null); };
  return (i) => ({
    draggable: true,
    onDragStart: (e) => {
      e.stopPropagation();
      fromRef.current = i; setFrom(i);
      // dataTransfer is absent on synthetic events; the reorder works without it.
      try { if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); } } catch (_) {}
    },
    onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); if (over !== i) setOver(i); },
    onDragEnd: (e) => { e.stopPropagation(); reset(); },
    onDrop: (e) => {
      e.preventDefault(); e.stopPropagation();
      const f = fromRef.current;
      reset();
      if (f !== null && f !== i) onMove(f, i);
    },
    ...(from === i ? { 'data-dragging': '' } : {}),
    ...(over === i && from !== null && from !== i ? (from < i ? { 'data-drop-after': '' } : { 'data-drop-before': '' }) : {}),
  });
};

   any row opens it in the editor pane on the right. */
const CurriculumTree = ({ doc, sel, setSel, edit, fireToast, collapsed, setCollapsed }) => {
  const cats = doc.categories || [];
  const moveCat = useDragOrder((f, t) => edit(d => { d.categories = moveItem(d.categories, f, t); }));

  const isOpen = (id) => !collapsed[id];
  const toggle = (id) => setCollapsed(c => ({ ...c, [id]: !c[id] }));

  const addCategory = () => {
    const c = emptyCategory();
    c.label = 'New category';
    edit(d => { d.categories.push(c); });
    setSel({ kind: 'category', id: c.id });
  };
  const addCourse = (categoryId) => {
    const c = emptyCourse(categoryId);
    c.title = 'New course';
    edit(d => { d.courses.push(c); });
    setCollapsed(s => ({ ...s, [categoryId]: false }));
    setSel({ kind: 'course', id: c.id });
  };
  const addLesson = (courseId) => {
    const l = emptyLesson();
    l.title = 'New lesson';
    edit(d => { const c = findCourse(d, courseId); if (c) c.lessons.push(l); });
    setCollapsed(s => ({ ...s, [courseId]: false }));
    setSel({ kind: 'lesson', id: l.id, courseId });
  };

  const deleteCategory = (cat) => {
    const owned = (doc.courses || []).filter(c => c.category === cat.id);
    if (owned.length) { fireToast({ message: `Move or delete its ${plural(owned.length, 'course')} first`, tone: 'warn' }); return; }
    const snapshot = clone(doc.categories);
    edit(d => { d.categories = d.categories.filter(c => c.id !== cat.id); });
    if (sel.kind === 'category' && sel.id === cat.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${cat.label || 'category'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.categories = snapshot; }) } });
  };
  const deleteCourse = (course) => {
    const snapshot = clone(doc.courses);
    const snapPaths = clone(doc.paths);
    edit(d => {
      d.courses = d.courses.filter(c => c.id !== course.id);
      d.paths.forEach(p => { p.courseIds = p.courseIds.filter(id => id !== course.id); });
    });
    if (sel.id === course.id || sel.courseId === course.id) setSel({ kind: null });
    fireToast({ message: `Deleted "${course.title || 'course'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.courses = snapshot; d.paths = snapPaths; }) } });
  };
  const deleteLesson = (course, lesson) => {
    const snapshot = clone(course.lessons);
    edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = c.lessons.filter(l => l.id !== lesson.id); });
    if (sel.kind === 'lesson' && sel.id === lesson.id) setSel({ kind: 'course', id: course.id });
    fireToast({ message: `Deleted "${lesson.title || 'lesson'}"`, action: { label: 'Undo', onClick: () => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = snapshot; }) } });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700 }}>Curriculum</div>
          <Helper style={{ fontSize: 10.5, whiteSpace: 'nowrap' }}>{plural((doc.courses || []).length, 'course')} · {plural(allLessons(doc).length, 'lesson')}</Helper>
        </div>
        <Btn variant="soft" size="sm" icon="plus" onClick={addCategory} style={{ flexShrink: 0 }}>Category</Btn>
      </div>

      <div className="scroll" style={{ flex: 1, padding: '8px 8px 40px' }}>
        {cats.length === 0 && (
          <EmptyState icon="layers" title="No categories yet"
            hint="Categories are the filter chips learners see across the top of the catalog. Start with one, then add courses inside it."
            action={<Btn variant="primary" size="sm" icon="plus" onClick={addCategory}>Add the first category</Btn>} />
        )}
        {cats.map((cat, ci) => {
          const courses = (doc.courses || []).filter(c => c.category === cat.id);
          const open = isOpen(cat.id);
          const selectedCat = sel.kind === 'category' && sel.id === cat.id;
          return (
            <div key={cat.id} {...moveCat(ci)} style={{ marginBottom: 3, borderRadius: T.radius }}>
              <div data-row onClick={() => setSel({ kind: 'category', id: cat.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 8px', borderRadius: T.radius, cursor: 'pointer',
                  background: selectedCat ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedCat) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedCat) e.currentTarget.style.background = 'transparent'; }}>
                <button data-btn onClick={e => { e.stopPropagation(); toggle(cat.id); }} aria-label={open ? 'Collapse' : 'Expand'}
                  style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
                  <Icon name={open ? 'chevronDown' : 'chevronRight'} size={13} />
                </button>
                <span style={{ width: 20, height: 20, borderRadius: 6, background: withAlpha(cat.color || T.primary, 0.13), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Icon name={cat.icon || 'bookOpen'} size={12} color={cat.color || T.primary} />
                </span>
                <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 700, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {cat.label || <span style={{ color: T.red }}>Untitled category</span>}
                </span>
                <span style={{ fontSize: 10, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{courses.length}</span>
                <RowActions
                  canUp={ci > 0} canDown={ci < cats.length - 1}
                  onUp={() => edit(d => { d.categories = moveItem(d.categories, ci, ci - 1); })}
                  onDown={() => edit(d => { d.categories = moveItem(d.categories, ci, ci + 1); })}
                  onDelete={() => deleteCategory(cat)}
                  extra={<button data-btn onClick={(e) => { e.stopPropagation(); addCourse(cat.id); }} aria-label="Add course"
                    style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={13} /></button>} />
              </div>

              {open && (
                <div style={{ marginLeft: 14, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 2 }}>
                  {courses.length === 0 && (
                    <button data-btn onClick={() => addCourse(cat.id)}
                      style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '5px 8px', color: T.mutedSoft, fontSize: 11, textAlign: 'left' }}>
                      <Icon name="plus" size={12} />Add a course
                    </button>
                  )}
                  {courses.map((course) => (
                    <CourseBranch key={course.id} doc={doc} cat={cat} course={course} courses={courses}
                      sel={sel} setSel={setSel} edit={edit}
                      open={isOpen(course.id)} toggle={() => toggle(course.id)}
                      onAddLesson={() => addLesson(course.id)}
                      onDeleteCourse={() => deleteCourse(course)}
                      onDeleteLesson={(l) => deleteLesson(course, l)} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* One course row plus its lesson list. Split out so each course owns its own
   drag state — a single shared one would make every list jump at once. */
const CourseBranch = ({ doc, cat, course, courses, sel, setSel, edit, open, toggle, onAddLesson, onDeleteCourse, onDeleteLesson }) => {
  const idx = courses.indexOf(course);
  const globalIdx = (doc.courses || []).indexOf(course);
  // Reorder within the category: translate a local swap into the global array.
  const moveWithinCat = (from, to) => edit(d => {
    const ids = courses.map(c => c.id);
    const reordered = moveItem(ids, from, to);
    const others = d.courses.filter(c => c.category !== cat.id);
    const mine = reordered.map(id => d.courses.find(c => c.id === id)).filter(Boolean);
    // Keep the category's courses contiguous at the position of its first member.
    const firstAt = d.courses.findIndex(c => c.category === cat.id);
    const out = others.slice();
    out.splice(Math.max(0, firstAt), 0, ...mine);
    d.courses = out;
  });
  const courseDnd = useDragOrder(moveWithinCat);
  const moveLesson = (f, t) => edit(d => { const c = findCourse(d, course.id); if (c) c.lessons = moveItem(c.lessons, f, t); });
  const lessonDnd = useDragOrder(moveLesson);
  const selectedCourse = sel.kind === 'course' && sel.id === course.id;
  const lessons = course.lessons || [];
  const withVideo = lessons.filter(lessonHasVideo).length;

  return (
    <div {...courseDnd(idx)} style={{ marginBottom: 2, borderRadius: T.radius }}>
      <div data-row onClick={() => setSel({ kind: 'course', id: course.id })}
        style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 8px', borderRadius: T.radius, cursor: 'pointer',
          background: selectedCourse ? T.primarySoft : 'transparent' }}
        onMouseEnter={e => { if (!selectedCourse) e.currentTarget.style.background = T.fieldBg; }}
        onMouseLeave={e => { if (!selectedCourse) e.currentTarget.style.background = 'transparent'; }}>
        <button data-btn onClick={e => { e.stopPropagation(); toggle(); }} aria-label={open ? 'Collapse' : 'Expand'}
          style={{ border: 'none', background: 'transparent', padding: 0, color: T.mutedSoft, display: 'flex' }}>
          <Icon name={open ? 'chevronDown' : 'chevronRight'} size={12} />
        </button>
        <span style={{ flex: 1, minWidth: 0, fontSize: 11.5, fontWeight: 600, color: T.textSoft, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {course.title || <span style={{ color: T.red }}>Untitled course</span>}
        </span>
        {course.popular && <Icon name="star" size={10} color={T.amber} />}
        <span style={{ fontSize: 9.5, color: withVideo === lessons.length && lessons.length ? T.greenDark : T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>
          {withVideo}/{lessons.length}
        </span>
        <RowActions
          canUp={idx > 0} canDown={idx < courses.length - 1}
          onUp={() => moveWithinCat(idx, idx - 1)}
          onDown={() => moveWithinCat(idx, idx + 1)}
          onDelete={onDeleteCourse}
          extra={<button data-btn onClick={(e) => { e.stopPropagation(); onAddLesson(); }} aria-label="Add lesson"
            style={{ border: 'none', background: 'transparent', padding: 2, color: T.muted }}><Icon name="plus" size={12} /></button>} />
      </div>

      {open && (
        <div style={{ marginLeft: 12, borderLeft: `1px solid ${T.borderSoft}`, paddingLeft: 6, marginTop: 1 }}>
          {lessons.length === 0 && (
            <button data-btn onClick={onAddLesson}
              style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', border: 'none', background: 'transparent', padding: '4px 8px', color: T.mutedSoft, fontSize: 10.5, textAlign: 'left' }}>
              <Icon name="plus" size={11} />Add a lesson
            </button>
          )}
          {lessons.map((l, li) => {
            const selectedLesson = sel.kind === 'lesson' && sel.id === l.id;
            const st = statusById(l.production && l.production.status);
            return (
              <div key={l.id} {...lessonDnd(li)} data-row
                onClick={() => setSel({ kind: 'lesson', id: l.id, courseId: course.id })}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px', marginBottom: 1, borderRadius: 6, cursor: 'pointer',
                  background: selectedLesson ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selectedLesson) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selectedLesson) e.currentTarget.style.background = 'transparent'; }}>
                <span title={st.label} style={{ width: 6, height: 6, borderRadius: 999, background: st.color, flexShrink: 0 }} />
                <Icon name={lessonHasVideo(l) ? 'video' : 'clock'} size={11} color={lessonHasVideo(l) ? T.greenDark : T.borderStrong} />
                <span style={{ flex: 1, minWidth: 0, fontSize: 11, color: selectedLesson ? T.text : T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {l.title || <span style={{ color: T.red }}>Untitled lesson</span>}
                </span>
                <span style={{ fontSize: 9.5, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums' }}>{l.mins || 0}m</span>
                <RowActions
                  canUp={li > 0} canDown={li < lessons.length - 1}
                  onUp={() => moveLesson(li, li - 1)}
                  onDown={() => moveLesson(li, li + 1)}
                  onDelete={() => onDeleteLesson(l)} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

  <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
    <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 14, marginBottom: 18 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 11, minWidth: 0 }}>
        <span style={{ width: 34, height: 34, borderRadius: 10, background: withAlpha(color || T.primary, 0.12), display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name={icon} size={17} color={color || T.primary} />
        </span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: T.mutedSoft }}>{eyebrow}</div>
          <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: -0.2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</div>

const CategoryEditor = ({ doc, cat, edit }) => {
  const set = (patch) => edit(d => { const c = (d.categories || []).find(x => x.id === cat.id); if (c) Object.assign(c, patch); });
  const owned = (doc.courses || []).filter(c => c.category === cat.id);
  return (
    <EditorShell eyebrow="Category" title={cat.label || 'Untitled category'} icon={cat.icon || 'bookOpen'} color={cat.color}>
      <Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="Name" hint="Learners see this as a filter chip above the course grid. Keep it short and plain — “Payroll & tax”, not “Payroll and taxation management”.">
            <Input value={cat.label || ''} onChange={e => set({ label: e.target.value })} placeholder="Get started" />
          </Field>
          <Field label="One-line description" hint="Shown under the category name in some views. Say what the learner will be able to do.">
            <Input value={cat.blurb || ''} onChange={e => set({ blurb: e.target.value })} placeholder="Set up your practice and find your way around" />
          </Field>
          <Field label="Icon" hint="This exact set is what the app can draw. Anything else would render as a fallback.">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
              {CATEGORY_ICONS.map(n => (
                <button key={n} data-btn onClick={() => set({ icon: n })} title={n}
                  style={{ width: 32, height: 32, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: `1px solid ${cat.icon === n ? (cat.color || T.primary) : T.border}`,
                    background: cat.icon === n ? withAlpha(cat.color || T.primary, 0.12) : T.card }}>
                  <Icon name={n} size={15} color={cat.icon === n ? (cat.color || T.primary) : T.muted} />
                </button>
              ))}
            </div>
          </Field>
          <Field label="Colour" hint="Tints the course thumbnails in this category, so learners can tell modules apart at a glance.">
            <div style={{ display: 'flex', gap: 7 }}>
              {CATEGORY_COLORS.map(c => (
                <button key={c.hex} data-btn onClick={() => set({ color: c.hex })} title={c.label}
                  style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px', borderRadius: 999, fontSize: 11.5, fontWeight: 600,
                    border: `1px solid ${cat.color === c.hex ? c.hex : T.border}`, background: cat.color === c.hex ? withAlpha(c.hex, 0.10) : T.card, color: cat.color === c.hex ? c.hex : T.muted }}>
                  <span style={{ width: 11, height: 11, borderRadius: 999, background: c.hex }} />{c.label}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Id" hint="Used by the app to remember which chip a course belongs to. Changing it detaches every course below — rename the label instead unless you know why you're doing this.">
            <Input value={cat.id} onChange={e => {
              const next = slug(e.target.value) || cat.id;
              edit(d => {
                (d.courses || []).forEach(c => { if (c.category === cat.id) c.category = next; });
                const c = (d.categories || []).find(x => x.id === cat.id); if (c) c.id = next;
              });
            }} style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 11.5 }} />
          </Field>
        </div>
      </Card>
      <Card>
        <SectionTitle style={{ marginBottom: 10 }}>Courses in this category</SectionTitle>
        {owned.length === 0
          ? <Helper>None yet. Use the + on the category row in the tree.</Helper>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {owned.map(c => (
                <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}>
                  <Icon name="bookOpen" size={13} color={T.mutedSoft} />
                  <span style={{ flex: 1 }}>{c.title || 'Untitled'}</span>
                  <span style={{ color: T.mutedSoft, fontSize: 11 }}>{plural((c.lessons || []).length, 'lesson')} · {courseMins(c)} min</span>
                </div>
              ))}
            </div>}
      </Card>
    </EditorShell>
  );
};

const CourseEditor = ({ doc, course, edit, fireToast, onCopyToOtherProduct, otherProductLabel, setSel }) => {
  const set = (patch) => edit(d => { const c = findCourse(d, course.id); if (c) Object.assign(c, patch); });
  const cats = doc.categories || [];
  const lessons = course.lessons || [];
  const inPaths = (doc.paths || []).filter(p => (p.courseIds || []).includes(course.id));

  // The YouTube-description helper Johann asked for: a course's lesson list as
  // chapter text, ready to paste into a video description.
  const contentPack = () => {
    const lines = [];
    lines.push(course.title || 'Untitled course');
    if (course.summary) lines.push('', course.summary);
    lines.push('', 'In this course:');
    let t = 0;
    lessons.forEach((l) => {
      const mm = String(Math.floor(t / 60)).padStart(2, '0');
      const ss = String(t % 60).padStart(2, '0');
      lines.push(`${mm}:${ss} ${l.title || 'Untitled lesson'}`);
      t += (Number(l.mins) || 0) * 60;
    });
    const text = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(
      () => fireToast('Course content pack copied'),
      () => fireToast({ message: 'Could not copy — check clipboard permissions', tone: 'error' }));
    else fireToast({ message: 'Clipboard not available in this browser', tone: 'warn' });
  };

  return (
    <EditorShell eyebrow="Course" title={course.title || 'Untitled course'} icon={catIconOf(doc, course)} color={catColorOf(doc, course)}
      actions={<>
        <Btn variant="outline" size="sm" icon="copy" onClick={contentPack}>Content pack</Btn>
        {onCopyToOtherProduct && <Btn variant="outline" size="sm" icon="layers" onClick={onCopyToOtherProduct}>Copy to {otherProductLabel}</Btn>}
      </>}>
      <Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Field label="Title" hint="What learners scan in the catalog. Name it after the thing they want to do.">
            <Input value={course.title || ''} onChange={e => set({ title: e.target.value })} placeholder="Running a payrun, step by step" />
          </Field>
          <Field label="Summary" hint="Two lines max — it fills the body of the course card.">
            <Textarea rows={2} value={course.summary || ''} onChange={e => set({ summary: e.target.value })} placeholder="Run compliant Australian payroll end-to-end — from employers to a finalised, STP-reported payrun." />
          </Field>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <Field label="Category">
              <Select value={course.category || ''} onChange={e => set({ category: e.target.value })}>
                <option value="">— none —</option>
                {cats.map(c => <option key={c.id} value={c.id}>{c.label || c.id}</option>)}
              </Select>
            </Field>
            <Field label="Level">
              <Select value={course.level || 'Beginner'} onChange={e => set({ level: e.target.value })}>
                {LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
              </Select>
            </Field>
          </div>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 9, cursor: 'pointer' }}>
            <input type="checkbox" checked={!!course.popular} onChange={e => set({ popular: e.target.checked })} style={{ marginTop: 2, accentColor: T.primary }} />
            <span>
              <span style={{ fontSize: 12, fontWeight: 600 }}>Feature on the Academy home page</span>
              <Helper style={{ fontSize: 10.5 }}>Shows under “Popular courses”. Three or four is about right — feature everything and you've featured nothing.</Helper>
            </span>
          </label>
          <Field label="Id" hint="Learner progress is stored against this. Changing it resets everyone's progress for this course.">
            <Input value={course.id} onChange={e => {
              const next = slug(e.target.value) || course.id;
              edit(d => {
                (d.paths || []).forEach(p => { p.courseIds = p.courseIds.map(id => id === course.id ? next : id); });
                const c = findCourse(d, course.id); if (c) c.id = next;
              });
              setSel({ kind: 'course', id: next });
            }} style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 11.5 }} />
          </Field>
        </div>
      </Card>

      <Card>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <SectionTitle>Lessons</SectionTitle>
          <Helper style={{ fontSize: 11 }}>{plural(lessons.length, 'lesson')} · {courseMins(course)} min total</Helper>
        </div>
        {lessons.length === 0
          ? <Helper>No lessons yet. Add them from the tree on the left.</Helper>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              {lessons.map((l, i) => {
                const st = statusById(l.production && l.production.status);
                return (
                  <div key={l.id} onClick={() => setSel({ kind: 'lesson', id: l.id, courseId: course.id })}
                    style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '7px 9px', borderRadius: T.radius, border: `1px solid ${T.borderSoft}`, cursor: 'pointer', background: T.fieldBg }}>
                    <span style={{ fontSize: 10.5, color: T.mutedSoft, fontVariantNumeric: 'tabular-nums', width: 14 }}>{i + 1}</span>
                    <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.title || 'Untitled lesson'}</span>
                    {!lessonHasVideo(l) && <Pill color={T.amber}>No video</Pill>}
                    <Pill color={st.color}>{st.label}</Pill>
                    <span style={{ fontSize: 10.5, color: T.mutedSoft }}>{l.mins || 0} min</span>
                  </div>
                );
              })}
            </div>}
      </Card>

      {inPaths.length > 0 && (
        <Card>
          <SectionTitle style={{ marginBottom: 8 }}>Part of these learning paths</SectionTitle>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {inPaths.map(p => <Pill key={p.id} color={T.primary} icon="graduation">{p.title || p.id}</Pill>)}
          </div>
        </Card>
      )}
    </EditorShell>
  );
};

/* ---- the video field ------------------------------------------------------
   Paste a link, get everything else. We derive the provider, embed URL and
   poster from the id (deterministic, works offline), then try oEmbed for the
   real title/length/poster. The embed renders live underneath so a wrong or
   private link is obvious in the editor rather than in front of a learner. */
const VideoField = ({ lesson, onApply, fireToast }) => {
  const [raw, setRaw] = useState(lesson.videoUrl || lesson.embedUrl || '');
  const [busy, setBusy] = useState(false);
  const [meta, setMeta] = useState(null);
  const [showEmbed, setShowEmbed] = useState(false);

  // Reset when the selected lesson changes.
  useEffect(() => {
    setRaw(lesson.videoUrl || lesson.embedUrl || '');
    setMeta(null);
    setShowEmbed(false);
  }, [lesson.id]);

  const parsed = useMemo(() => parseVideoLink(raw), [raw]);
  const attached = lessonHasVideo(lesson);

  const attach = () => {
    if (!parsed || parsed.provider === 'invalid') { fireToast({ message: 'That does not look like a video link', tone: 'error' }); return; }
    const patch = parsed.provider === 'file'
      ? { videoUrl: parsed.fileUrl, embedUrl: '', thumbUrl: lesson.thumbUrl || '' }
      : { videoUrl: '', embedUrl: parsed.embedUrl, thumbUrl: parsed.thumbUrl || lesson.thumbUrl || '' };
    onApply(patch);
    setBusy(true);
    fetchVideoMeta(parsed).then(m => {
      setBusy(false);
      if (m && (m.title || m.mins || m.thumbUrl)) setMeta(m);
      if (m && m.thumbUrl && !parsed.thumbUrl) onApply({ thumbUrl: m.thumbUrl });
    });
    fireToast(`${parsed.label} video attached`);
  };

  const clear = () => { onApply({ videoUrl: '', embedUrl: '', thumbUrl: '' }); setRaw(''); setMeta(null); setShowEmbed(false); };

  const providerTone = parsed && parsed.provider === 'invalid' ? T.red
    : parsed && parsed.provider === 'unknown' ? T.amber : T.greenDark;

  return (
    <Card style={{ borderColor: attached ? withAlpha(T.green, 0.35) : T.border }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 12 }}>
        <SectionTitle>Video</SectionTitle>
        {attached
          ? <Pill color={T.greenDark} icon="checkCircle">Attached</Pill>
          : <Pill color={T.amber} icon="alertTriangle">No video yet</Pill>}
      </div>

      <Field hint="Paste the YouTube, Vimeo or Loom link. Unlisted links are fine — that's what we recommend. We work out the embed and the thumbnail from it.">
        <div style={{ display: 'flex', gap: 6 }}>
          <Input value={raw} onChange={e => setRaw(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); attach(); } }}
            placeholder="https://www.youtube.com/watch?v=…" />
          <Btn variant="primary" size="sm" icon="link" onClick={attach} disabled={!raw.trim()}>Attach</Btn>
          {attached && <Btn variant="ghost" size="sm" icon="close" onClick={clear} style={{ color: T.muted }}>Clear</Btn>}
        </div>
      </Field>

      {raw.trim() && parsed && (
        <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 8, fontSize: 11.5 }}>
          <Pill color={providerTone} icon={parsed.provider === 'invalid' ? 'xCircle' : 'video'}>{parsed.label}</Pill>
          {parsed.provider === 'unknown' && <Helper style={{ fontSize: 11 }}>We'll embed it as-is. Check the preview below actually plays.</Helper>}
          {busy && <Helper style={{ fontSize: 11 }}>Looking up the details…</Helper>}
        </div>
      )}

      {meta && (
        <div style={{ marginTop: 12, padding: 11, borderRadius: T.radius, background: T.primarySofter, border: `1px solid ${T.borderSoft}` }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: T.primaryDark, marginBottom: 7 }}>Found on the video — use it?</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
            {meta.title && <Btn variant="outline" size="sm" icon="check" onClick={() => { onApply({ title: meta.title }); setMeta({ ...meta, title: null }); }}>Title: “{meta.title.length > 42 ? meta.title.slice(0, 42) + '…' : meta.title}”</Btn>}
            {meta.mins && <Btn variant="outline" size="sm" icon="check" onClick={() => { onApply({ mins: meta.mins }); setMeta({ ...meta, mins: null }); }}>Length: {meta.mins} min</Btn>}
          </div>
        </div>
      )}

      {attached && (
        <div style={{ marginTop: 13 }}>
          {showEmbed ? (
            <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radius, overflow: 'hidden', background: '#000' }}>
              {lesson.videoUrl
                ? <video src={lesson.videoUrl} controls autoPlay preload="metadata" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
                : <iframe src={lesson.embedUrl} title={lesson.title || 'Lesson video'} frameBorder="0"
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen
                    style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />}
            </div>
          ) : (
            <button data-btn onClick={() => setShowEmbed(true)}
              style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radius, overflow: 'hidden', border: `1px solid ${T.border}`, padding: 0,
                background: lesson.thumbUrl ? `#000 center/cover no-repeat url("${lesson.thumbUrl}")` : T.fieldBg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ width: 52, height: 52, borderRadius: '50%', background: 'rgba(255,255,255,0.95)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 8px 22px rgba(0,0,0,0.3)' }}>
                <Icon name="play" size={18} color={T.primary} />
              </span>
              <span style={{ position: 'absolute', bottom: 9, left: 11, fontSize: 10.5, fontWeight: 700, color: '#fff', textShadow: '0 1px 4px rgba(0,0,0,0.6)' }}>Click to test the embed</span>
            </button>
          )}
          <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <Helper style={{ fontSize: 10.5, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', wordBreak: 'break-all', flex: 1, minWidth: 200 }}>
              {lesson.embedUrl || lesson.videoUrl}
            </Helper>
            {(lesson.embedUrl || lesson.videoUrl) && (
              <a href={lesson.embedUrl || lesson.videoUrl} target="_blank" rel="noopener noreferrer"
                style={{ fontSize: 11, fontWeight: 600, color: T.primary, textDecoration: 'none', whiteSpace: 'nowrap' }}>Open in a new tab →</a>
            )}
          </div>
          <Field label="Thumbnail override" hint="Leave blank to use the video's own poster. Paste an image URL to use something else." style={{ marginTop: 12 }}>
            <Input value={lesson.thumbUrl || ''} onChange={e => onApply({ thumbUrl: e.target.value })} placeholder="https://… (optional)" />
          </Field>
        </div>
      )}

      {!attached && (
        <Banner tone="info" icon="info" style={{ marginTop: 12 }}>
          Until a video is attached, learners see a branded poster and “Preview coming soon”. The lesson still appears in the catalog, so it's safe to publish an outline first and add footage later.
        </Banner>
      )}
    </Card>
  );
};

/* ===== learning paths ===================================================== */
const PathsScreen = ({ doc, edit, fireToast }) => {
  const paths = doc.paths || [];
  const [selId, setSelId] = useState(paths.length ? paths[0].id : null);
  const path = paths.find(p => p.id === selId) || null;
  const pathDnd = useDragOrder((f, t) => edit(d => { d.paths = moveItem(d.paths, f, t); }));

  const addPath = () => {
    const p = emptyPath();
    p.title = 'New learning path';
    edit(d => { d.paths.push(p); });
    setSelId(p.id);
  };
  const set = (patch) => edit(d => { const p = (d.paths || []).find(x => x.id === selId); if (p) Object.assign(p, patch); });
  const deletePath = (p) => {
    const snapshot = clone(doc.paths);
    edit(d => { d.paths = d.paths.filter(x => x.id !== p.id); });
    if (selId === p.id) setSelId(null);
    fireToast({ message: `Deleted "${p.title || 'path'}"`, action: { label: 'Undo', onClick: () => edit(d => { d.paths = snapshot; }) } });
  };

  const inPath = (path ? path.courseIds : []) || [];
  const available = (doc.courses || []).filter(c => !inPath.includes(c.id));
  const moveCourse = (f, t) => set({ courseIds: moveItem(inPath, f, t) });

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '280px minmax(0,1fr)', height: '100%', minHeight: 0 }}>
      <div style={{ borderRight: `1px solid ${T.border}`, background: T.card, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 700 }}>Learning paths</div>
            <Helper style={{ fontSize: 10.5 }}>{plural(paths.length, 'path')}</Helper>
          </div>
          <Btn variant="soft" size="sm" icon="plus" onClick={addPath}>Path</Btn>
        </div>
        <div className="scroll" style={{ flex: 1, padding: 8 }}>
          {paths.length === 0 && <EmptyState icon="graduation" title="No paths yet" hint="A path is a recommended order of courses for one kind of person — “new team member”, “payroll specialist”." action={<Btn variant="primary" size="sm" icon="plus" onClick={addPath}>Add a path</Btn>} />}
          {paths.map((p, i) => {
            const selected = p.id === selId;
            const missing = (p.courseIds || []).filter(id => !findCourse(doc, id)).length;
            return (
              <div key={p.id} {...pathDnd(i)} data-row onClick={() => setSelId(p.id)}
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 9px', marginBottom: 3, borderRadius: T.radius, cursor: 'pointer', background: selected ? T.primarySoft : 'transparent' }}
                onMouseEnter={e => { if (!selected) e.currentTarget.style.background = T.fieldBg; }}
                onMouseLeave={e => { if (!selected) e.currentTarget.style.background = 'transparent'; }}>
                <Icon name="graduation" size={13} color={selected ? T.primary : T.mutedSoft} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title || 'Untitled path'}</div>
                  <div style={{ fontSize: 10, color: T.mutedSoft }}>{plural((p.courseIds || []).length, 'course')}{missing ? ` · ${missing} broken` : ''}</div>
                </div>
                {missing > 0 && <Icon name="alertTriangle" size={12} color={T.red} />}
                <RowActions canUp={i > 0} canDown={i < paths.length - 1}
                  onUp={() => edit(d => { d.paths = moveItem(d.paths, i, i - 1); })}
                  onDown={() => edit(d => { d.paths = moveItem(d.paths, i, i + 1); })}
                  onDelete={() => deletePath(p)} />
              </div>
            );
          })}
        </div>
      </div>

      {!path ? (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <EmptyState icon="graduation" title="Pick a path" hint="Or add a new one to get started." />
        </div>
      ) : (
        <EditorShell eyebrow="Learning path" title={path.title || 'Untitled path'} icon="graduation" color={T.primary}>
          <Card>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <Field label="Title">
                <Input value={path.title || ''} onChange={e => set({ title: e.target.value })} placeholder="Getting started (new team member)" />
              </Field>
              <Field label="Who it's for" hint="Appears as a small line on the card — “Everyone · first week”.">
                <Input value={path.forRole || ''} onChange={e => set({ forRole: e.target.value })} placeholder="Everyone · first week" />
              </Field>
              <Field label="Blurb" hint="One sentence on why someone would take this path.">
                <Textarea rows={2} value={path.blurb || ''} onChange={e => set({ blurb: e.target.value })} placeholder="The essentials every new user needs before touching live client work." />
              </Field>
            </div>
          </Card>

          <Card>
            <SectionTitle style={{ marginBottom: 4 }}>Courses, in order</SectionTitle>
            <Helper style={{ marginBottom: 12 }}>Learners are pointed at the first one they haven't finished, so the order matters.</Helper>
            {inPath.length === 0
              ? <Helper style={{ marginBottom: 12 }}>Nothing added yet.</Helper>
              : <div style={{ display: 'flex', flexDirection: 'column', gap: 5, marginBottom: 12 }}>
                  {inPath.map((cid, i) => {
                    const c = findCourse(doc, cid);
                    return (
                      <div key={cid + i} data-row style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '7px 9px', borderRadius: T.radius, border: `1px solid ${c ? T.borderSoft : withAlpha(T.red, 0.4)}`, background: c ? T.fieldBg : T.redSoft }}>
                        <span style={{ fontSize: 10.5, color: T.mutedSoft, width: 14, fontVariantNumeric: 'tabular-nums' }}>{i + 1}</span>
                        {c ? (
                          <>
                            <Icon name={catIconOf(doc, c)} size={13} color={catColorOf(doc, c)} />
                            <span style={{ flex: 1, minWidth: 0, fontSize: 12, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.title || 'Untitled'}</span>
                            <span style={{ fontSize: 10.5, color: T.mutedSoft }}>{plural((c.lessons || []).length, 'lesson')}</span>
                          </>
                        ) : (
                          <span style={{ flex: 1, fontSize: 12, color: T.red }}>Deleted course — “{cid}”. Remove it.</span>
                        )}
                        <RowActions canUp={i > 0} canDown={i < inPath.length - 1}
                          onUp={() => moveCourse(i, i - 1)} onDown={() => moveCourse(i, i + 1)}
                          onDelete={() => set({ courseIds: inPath.filter((_, j) => j !== i) })} />
                      </div>
                    );
                  })}
                </div>}
            <Select value="" onChange={e => { if (e.target.value) set({ courseIds: inPath.concat(e.target.value) }); }}>
              <option value="">+ Add a course to this path…</option>
              {available.map(c => <option key={c.id} value={c.id}>{c.title || c.id}</option>)}
            </Select>
            {available.length === 0 && inPath.length > 0 && <Helper style={{ fontSize: 10.5, marginTop: 6 }}>Every course is already in this path.</Helper>}
          </Card>
        </EditorShell>
      )}
    </div>
  );
};

/* ===== production board ===================================================
   Every lesson in one list, grouped by where it's up to. This is the screen that
   answers "what's left and who has it" without anyone calling a meeting. */
const ProductionScreen = ({ doc, edit, jumpToLesson, owners }) => {
  const [q, setQ] = useState('');
  const [owner, setOwner] = useState('all');
  const [courseId, setCourseId] = useState('all');
  const rows = allLessons(doc);

  const counts = STATUSES.map(s => ({ ...s, n: rows.filter(r => (r.lesson.production && r.lesson.production.status || 'idea') === s.id).length }));
  const total = rows.length;
  const done = counts.find(c => c.id === 'published');
  const query = q.trim().toLowerCase();

  const filtered = rows.filter(({ lesson, course }) => {
    const p = lesson.production || {};
    if (owner !== 'all' && (p.owner || '') !== owner) return false;
    if (courseId !== 'all' && course.id !== courseId) return false;
    if (query && !((lesson.title || '') + ' ' + (course.title || '') + ' ' + (p.owner || '') + ' ' + (p.notes || '')).toLowerCase().includes(query)) return false;
    return true;
  });

  const setStatus = (course, lesson, status) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), status };
  });
  const setOwnerOn = (course, lesson, v) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), owner: v };
  });
  const setDue = (course, lesson, v) => edit(d => {
    const l = findLesson(d, course.id, lesson.id);
    if (l) l.production = { ...(l.production || {}), due: v };
  });

  const overdue = (p) => {
    if (!p || !p.due || p.status === 'published') return false;
    const d = new Date(p.due + 'T23:59:59');
    return !isNaN(d.getTime()) && d.getTime() < Date.now();
  };

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, padding: '20px 24px 60px' }}>
      <div style={{ marginBottom: 16 }}>
        <SectionTitle style={{ fontSize: 16 }}>Production</SectionTitle>
        <Helper style={{ marginTop: 2 }}>Where every lesson is up to. Internal only — none of this is published.</Helper>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px,1fr))', gap: 9, marginBottom: 14 }}>
        {counts.map(c => (
          <Card key={c.id} pad={12}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10.5, fontWeight: 700, color: c.color, textTransform: 'uppercase', letterSpacing: 0.4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 999, background: c.color }} />{c.label}
            </div>
            <div style={{ fontSize: 21, fontWeight: 800, marginTop: 5, letterSpacing: -0.5 }}>{c.n}</div>
          </Card>
        ))}
      </div>

      <Card style={{ marginBottom: 14 }} pad={13}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, marginBottom: 8, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 12, fontWeight: 600 }}>{done ? done.n : 0} of {total} lessons published</div>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.primary }}>{total ? Math.round(((done ? done.n : 0) / total) * 100) : 0}%</div>
        </div>
        <ProgressBar pct={total ? ((done ? done.n : 0) / total) * 100 : 0} color={T.green} height={7} />
      </Card>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '6px 11px', border: `1px solid ${T.border}`, borderRadius: T.radius, background: T.card, minWidth: 220 }}>
          <Icon name="search" size={13} color={T.muted} />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search lessons, owners, notes…"
            style={{ flex: 1, minWidth: 0, border: 'none', background: 'transparent', outline: 'none', fontSize: 12.5 }} />
          {q && <button data-btn onClick={() => setQ('')} aria-label="Clear" style={{ border: 'none', background: 'transparent', padding: 0, color: T.muted }}><Icon name="close" size={12} /></button>}
        </div>
        <Select value={owner} onChange={e => setOwner(e.target.value)} style={{ width: 'auto', minWidth: 130 }}>
          <option value="all">Everyone</option>
          <option value="">Unassigned</option>
          {owners.map(o => <option key={o} value={o}>{o}</option>)}
        </Select>
        <Select value={courseId} onChange={e => setCourseId(e.target.value)} style={{ width: 'auto', maxWidth: 240 }}>
          <option value="all">All courses</option>
          {(doc.courses || []).map(c => <option key={c.id} value={c.id}>{c.title || c.id}</option>)}
        </Select>
        <Helper style={{ fontSize: 11 }}>{filtered.length} of {total}</Helper>
      </div>

      {filtered.length === 0 ? (
        <Card><EmptyState icon="search" title="Nothing matches" hint="Try a different owner, course or search." /></Card>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {STATUSES.map(s => {
            const group = filtered.filter(r => ((r.lesson.production && r.lesson.production.status) || 'idea') === s.id);
            if (!group.length) return null;
            return (
              <div key={s.id}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }} />
                  <div style={{ fontSize: 12.5, fontWeight: 700 }}>{s.label}</div>
                  <Helper style={{ fontSize: 11 }}>{s.blurb} · {group.length}</Helper>
                </div>
                <Card pad={0} style={{ overflow: 'hidden' }}>
                  {group.map(({ lesson, course }, i) => {
                    const p = lesson.production || {};
                    const late = overdue(p);
                    return (
                      <div key={lesson.id} style={{ display: 'grid', gridTemplateColumns: 'minmax(0,2.2fr) minmax(0,1.2fr) 130px 132px 118px', gap: 10, alignItems: 'center',
                        padding: '9px 13px', borderTop: i ? `1px solid ${T.borderSoft}` : 'none' }}>
                        <div style={{ minWidth: 0 }}>
                          <button data-btn onClick={() => jumpToLesson(course.id, lesson.id)}
                            style={{ border: 'none', background: 'transparent', padding: 0, textAlign: 'left', fontSize: 12.5, fontWeight: 600, color: T.text, display: 'flex', alignItems: 'center', gap: 6, maxWidth: '100%' }}>
                            <Icon name={lessonHasVideo(lesson) ? 'video' : 'clock'} size={12} color={lessonHasVideo(lesson) ? T.greenDark : T.borderStrong} />
                            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{lesson.title || 'Untitled lesson'}</span>
                          </button>
                          {p.notes && <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.notes}</div>}
                        </div>
                        <div style={{ fontSize: 11, color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{course.title || 'Untitled course'}</div>
                        <Input list="academy-owners" value={p.owner || ''} placeholder="Unassigned"
                          onChange={e => setOwnerOn(course, lesson, e.target.value)} style={{ padding: '4px 8px', fontSize: 11.5 }} />
                        <Input type="date" value={p.due || ''} onChange={e => setDue(course, lesson, e.target.value)}
                          style={{ padding: '4px 8px', fontSize: 11.5, borderColor: late ? T.red : T.border, color: late ? T.red : T.text }} />
                        <Select value={p.status || 'idea'} onChange={e => setStatus(course, lesson, e.target.value)} style={{ padding: '4px 8px', fontSize: 11.5 }}>
                          {STATUSES.map(x => <option key={x.id} value={x.id}>{x.label}</option>)}
                        </Select>
                      </div>
                    );
                  })}
                </Card>
              </div>
            );
          })}
        </div>
      )}
      <datalist id="academy-owners">{owners.map(o => <option key={o} value={o} />)}</datalist>
    </div>
  );
};

/* ===== preview ============================================================
   Ports the live Academy's presentation components (AcademyThumb, CourseCard,
   LearningPathCard, LessonRow, VideoStage from index.html) so the team sees the
   real thing, not an approximation. Progress is always shown as "not started" —
   this previews content, not a particular learner's state. */
const AcademyThumb = ({ doc, course, playSize = 54, watermark = 132, radius = T.radiusLg }) => {
  const color = catColorOf(doc, course);
  const icon = catIconOf(doc, course);
  const lessons = course.lessons || [];
  const firstThumb = (lessons.find(l => l.thumbUrl) || {}).thumbUrl;
  return (
    <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: radius, overflow: 'hidden',
      background: firstThumb ? `#000 center/cover no-repeat url("${firstThumb}")` : `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.44)} 100%)` }}>
      {!firstThumb && <>
        <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(120% 84% at 12% -8%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 52%)` }} />
        <div style={{ position: 'absolute', right: -20, bottom: -26, opacity: 0.15, transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
          <Icon name={icon} size={watermark} color="#fff" strokeWidth={1.3} />
        </div>
      </>}
      {firstThumb && <div style={{ position: 'absolute', inset: 0, background: withAlpha('#0F1117', 0.28) }} />}
      <div style={{ position: 'absolute', top: 12, right: 12, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, backdropFilter: 'blur(4px)' }}>
        <Icon name="clock" size={11} color="#fff" />{courseMins(course)} min
      </div>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: playSize, height: playSize, borderRadius: '50%', background: withAlpha('#FFFFFF', 0.97), display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 28px rgba(0,0,0,0.30)' }}>
          <svg width={Math.round(playSize * 0.33)} height={Math.round(playSize * 0.33)} viewBox="0 0 24 24" fill={color} style={{ marginLeft: 2 }}><polygon points="6,4 20,12 6,20" /></svg>
        </div>
      </div>
    </div>
  );
};

const PreviewCourseCard = ({ doc, course, onOpen }) => {
  const cat = catById(doc, course.category);
  const color = catColorOf(doc, course);
  return (
    <div onClick={onOpen} role="button" tabIndex={0}
      style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, overflow: 'hidden', cursor: 'pointer', display: 'flex', flexDirection: 'column', boxShadow: T.shadowSm }}>
      <AcademyThumb doc={doc} course={course} radius={0} />
      <div style={{ padding: 15, display: 'flex', flexDirection: 'column', gap: 9, flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 10.5, fontWeight: 600, color }}>
            <Icon name={catIconOf(doc, course)} size={12} color={color} />{cat ? cat.label : 'No category'}
          </span>
          <span style={{ width: 3, height: 3, borderRadius: 999, background: T.mutedSoft }} />
          <span style={{ fontSize: 10.5, color: T.muted }}>{course.level || 'Beginner'}</span>
        </div>
        <div style={{ fontSize: 14.5, fontWeight: 700, color: T.text, lineHeight: 1.3, letterSpacing: -0.2 }}>{course.title || 'Untitled course'}</div>
        <Helper style={{ fontSize: 11.5, lineHeight: 1.5, flex: 1 }}>{course.summary || <span style={{ color: T.mutedSoft, fontStyle: 'italic' }}>No summary yet</span>}</Helper>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 11, color: T.muted }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{plural((course.lessons || []).length, 'lesson')}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontWeight: 600, color }}>Start<Icon name="arrow" size={12} color={color} /></span>
        </div>
      </div>
    </div>
  );
};

const PreviewPathCard = ({ doc, path }) => {
  const courses = (path.courseIds || []).map(id => findCourse(doc, id)).filter(Boolean);
  const lessons = courses.flatMap(c => c.lessons || []);
  const mins = courses.reduce((s, c) => s + courseMins(c), 0);
  const next = courses[0];
  return (
    <div style={{ border: `1px solid ${T.border}`, borderRadius: T.radiusCard, background: T.card, padding: 16, boxShadow: T.shadowSm, display: 'flex', flexDirection: 'column', gap: 11 }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 11 }}>
        <span style={{ width: 34, height: 34, borderRadius: 10, background: T.primarySoft, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name="graduation" size={17} color={T.primary} />
        </span>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: -0.2 }}>{path.title || 'Untitled path'}</div>
          <div style={{ fontSize: 10.5, color: T.muted, marginTop: 1 }}>{path.forRole || '—'}</div>
        </div>
      </div>
      <Helper style={{ fontSize: 11.5 }}>{path.blurb || <span style={{ color: T.mutedSoft, fontStyle: 'italic' }}>No blurb yet</span>}</Helper>
      <div style={{ display: 'flex', gap: 3 }}>
        {courses.map(c => <div key={c.id} style={{ flex: 1, height: 4, borderRadius: 999, background: withAlpha(catColorOf(doc, c), 0.35) }} />)}
      </div>
      {next && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '8px 10px', borderRadius: T.radius, background: T.fieldBg, border: `1px solid ${T.borderSoft}` }}>
          <span style={{ width: 28, height: 28, borderRadius: 8, background: T.card, border: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Icon name={catIconOf(doc, next)} size={14} color={catColorOf(doc, next)} />
          </span>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: T.mutedSoft }}>Start with</div>
            <div style={{ fontSize: 11.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{next.title || 'Untitled'}</div>
          </div>
        </div>
      )}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 11, color: T.muted }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="layers" size={12} color={T.mutedSoft} />{plural(courses.length, 'course')}</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="bookOpen" size={12} color={T.mutedSoft} />{plural(lessons.length, 'lesson')}</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="clock" size={12} color={T.mutedSoft} />{mins} min</span>
      </div>
    </div>
  );
};

/* The 16:9 stage, matching index.html's VideoStage: a real player when there's a
   video, otherwise the branded poster learners actually get. */
const PreviewStage = ({ doc, course, lesson }) => {
  const [playing, setPlaying] = useState(false);
  const color = catColorOf(doc, course);
  useEffect(() => { setPlaying(false); }, [lesson.id]);
  const stage = { position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: T.radiusLg, overflow: 'hidden' };

  if (playing && lesson.videoUrl) return (
    <div style={{ ...stage, background: '#000' }}>
      <video src={lesson.videoUrl} controls autoPlay preload="metadata" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
    </div>
  );
  if (playing && lesson.embedUrl) {
    const src = lesson.embedUrl + (lesson.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
    return (
      <div style={{ ...stage, background: '#000' }}>
        <iframe src={src} title={lesson.title} frameBorder="0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }} />
      </div>
    );
  }
  // Matches index.html: the poster always offers a play button; a lesson with no
  // footage yet only reveals "coming soon" once the learner actually clicks it.
  const comingSoon = playing && !lessonHasVideo(lesson);
  return (
    <div style={{ ...stage, background: `linear-gradient(142deg, ${color} 0%, ${darkenHex(color, 0.46)} 100%)`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', background: `radial-gradient(110% 80% at 14% -6%, ${withAlpha('#FFFFFF', 0.20)} 0%, transparent 50%)` }} />
      <div style={{ position: 'absolute', right: -26, bottom: -32, opacity: 0.13, transform: 'rotate(-8deg)', pointerEvents: 'none' }}>
        <Icon name={catIconOf(doc, course)} size={210} color="#fff" strokeWidth={1.2} />
      </div>
      <div style={{ position: 'absolute', top: 16, left: 18, zIndex: 2, maxWidth: '70%' }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 1.4, textTransform: 'uppercase', color: 'rgba(255,255,255,0.82)' }}>Video lesson</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginTop: 3, color: '#fff', letterSpacing: -0.2 }}>{lesson.title || 'Untitled lesson'}</div>
      </div>
      <div style={{ position: 'absolute', top: 16, right: 18, zIndex: 2, display: 'inline-flex', alignItems: 'center', gap: 5, background: withAlpha('#0F1117', 0.34), color: '#fff', fontSize: 11.5, fontWeight: 600, padding: '4px 9px', borderRadius: 999 }}>
        <Icon name="clock" size={12} color="#fff" />{lesson.mins || 0} min
      </div>
      {comingSoon ? (
        <div style={{ position: 'relative', zIndex: 2, textAlign: 'center', color: '#fff', padding: '0 24px' }}>
          <div style={{ fontSize: 14.5, fontWeight: 700 }}>Preview coming soon</div>
          <div style={{ fontSize: 12.5, opacity: 0.88, marginTop: 5, maxWidth: 380, lineHeight: 1.5 }}>The full video for this lesson is being recorded. Explore the feature live in your dashboard, then mark it complete.</div>
        </div>
      ) : (
        <button data-btn onClick={() => setPlaying(true)} aria-label="Play lesson" style={{
          position: 'relative', zIndex: 2, width: 82, height: 82, borderRadius: '50%', border: 'none',
          background: withAlpha('#FFFFFF', 0.97), display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 16px 40px rgba(0,0,0,0.30)' }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill={color} style={{ marginLeft: 4 }}><polygon points="6,4 20,12 6,20" /></svg>
        </button>
      )}
    </div>
  );
};

const PreviewScreen = ({ doc }) => {
  const [tab, setTab] = useState('catalog');
  const [openCourseId, setOpenCourseId] = useState(null);
  const [lessonId, setLessonId] = useState(null);
  const courses = doc.courses || [];
  const paths = doc.paths || [];
  const cats = doc.categories || [];
  const [cat, setCat] = useState('all');

  const openCourse = courses.find(c => c.id === openCourseId) || null;
  const lessons = openCourse ? (openCourse.lessons || []) : [];
  const lesson = lessons.find(l => l.id === lessonId) || lessons[0] || null;
  const popular = courses.filter(c => c.popular);
  const shown = cat === 'all' ? courses : courses.filter(c => c.category === cat);

  const open = (c) => { setOpenCourseId(c.id); setLessonId((c.lessons || [])[0] ? c.lessons[0].id : null); setTab('player'); };

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0, background: T.bg }}>
      <div style={{ padding: '16px 24px 0' }}>
        <Banner tone="accent" icon="eye" title="This is what learners see">
          The real Academy components, rendered from your draft. Progress always shows as “not started” — this previews the content, not one person's history.
        </Banner>
        <div style={{ display: 'flex', gap: 6, margin: '14px 0 0' }}>
          {[{ id: 'catalog', label: 'Catalog', icon: 'layers' }, { id: 'paths', label: 'Learning paths', icon: 'graduation' }, { id: 'player', label: 'Course player', icon: 'play' }].map(t => (
            <Chip key={t.id} selected={tab === t.id} onClick={() => setTab(t.id)}>{t.label}</Chip>
          ))}
        </div>
      </div>

      <div style={{ padding: '18px 24px 60px' }}>
        {tab === 'catalog' && (
          <>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.3, display: 'flex', alignItems: 'center', gap: 8 }}>
              <Icon name="graduation" size={22} color={T.primary} />{(doc.meta && doc.meta.title) || 'Sole Academy'}
            </div>
            <Helper style={{ marginTop: 3, maxWidth: 640 }}>{(doc.meta && doc.meta.blurb) || ''}</Helper>

            {popular.length > 0 && (
              <div style={{ marginTop: 22 }}>
                <SectionTitle style={{ marginBottom: 10 }}>Popular courses</SectionTitle>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px,1fr))', gap: 14 }}>
                  {popular.map(c => <PreviewCourseCard key={c.id} doc={doc} course={c} onOpen={() => open(c)} />)}
                </div>
              </div>
            )}

            <div style={{ marginTop: 24 }}>
              <SectionTitle style={{ marginBottom: 10 }}>All courses</SectionTitle>
              <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', marginBottom: 14 }}>
                <Chip selected={cat === 'all'} onClick={() => setCat('all')}>{`All · ${courses.length}`}</Chip>
                {cats.map(c => {
                  const n = courses.filter(x => x.category === c.id).length;
                  return n ? <Chip key={c.id} tone={c.color} selected={cat === c.id} onClick={() => setCat(c.id)}>{`${c.label} · ${n}`}</Chip> : null;
                })}
              </div>
              {shown.length === 0
                ? <Card><EmptyState icon="layers" title="Nothing to show" hint="Add a course in Curriculum and it appears here." /></Card>
                : <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px,1fr))', gap: 14 }}>
                    {shown.map(c => <PreviewCourseCard key={c.id} doc={doc} course={c} onOpen={() => open(c)} />)}
                  </div>}
            </div>
          </>
        )}

        {tab === 'paths' && (
          paths.length === 0
            ? <Card><EmptyState icon="graduation" title="No learning paths" hint="Build one on the Learning paths screen." /></Card>
            : <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px,1fr))', gap: 14 }}>
                {paths.map(p => <PreviewPathCard key={p.id} doc={doc} path={p} />)}
              </div>
        )}

        {tab === 'player' && (
          !openCourse || !lesson ? (
            <Card><EmptyState icon="play" title="Pick a course first"
              hint="Open one from the Catalog tab to see the lesson player."
              action={<Btn variant="soft" size="sm" onClick={() => setTab('catalog')}>Go to the catalog</Btn>} /></Card>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 300px', gap: 18, alignItems: 'start' }}>
              <div>
                <PreviewStage doc={doc} course={openCourse} lesson={lesson} />
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 19, fontWeight: 800, letterSpacing: -0.3 }}>{lesson.title || 'Untitled lesson'}</div>
                  <Helper style={{ marginTop: 6, fontSize: 12.5 }}>{lesson.description || ''}</Helper>
                </div>
                {(lesson.takeaways || []).filter(Boolean).length > 0 && (
                  <Card style={{ marginTop: 16 }}>
                    <SectionTitle style={{ marginBottom: 9 }}>What you'll be able to do</SectionTitle>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                      {lesson.takeaways.filter(Boolean).map((t, i) => (
                        <div key={i} style={{ display: 'flex', gap: 8, fontSize: 12.5 }}>
                          <Icon name="checkCircle" size={14} color={T.greenDark} />{t}
                        </div>
                      ))}
                    </div>
                  </Card>
                )}
                {(lesson.resources || []).filter(r => r.label).length > 0 && (
                  <Card style={{ marginTop: 14 }}>
                    <SectionTitle style={{ marginBottom: 9 }}>Downloads</SectionTitle>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {lesson.resources.filter(r => r.label).map((r, i) => (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: r.href ? T.primary : T.mutedSoft }}>
                          <Icon name="download" size={13} color={r.href ? T.primary : T.mutedSoft} />{r.label}{!r.href && <span style={{ fontSize: 10.5 }}>(no link)</span>}
                        </div>
                      ))}
                    </div>
                  </Card>
                )}
                {(lesson.transcript || '').trim() && (
                  <Card style={{ marginTop: 14 }}>
                    <SectionTitle style={{ marginBottom: 9 }}>Transcript</SectionTitle>
                    {lesson.transcript.split('\n').filter(p => p.trim()).map((p, i) => (
                      <p key={i} style={{ margin: '0 0 9px', fontSize: 12.5, lineHeight: 1.62, color: T.textSoft }}>{p}</p>
                    ))}
                  </Card>
                )}
              </div>
              <Card pad={0} style={{ overflow: 'hidden' }}>
                <div style={{ padding: '12px 14px', borderBottom: `1px solid ${T.borderSoft}` }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700 }}>{openCourse.title || 'Untitled course'}</div>
                  <Helper style={{ fontSize: 10.5, marginTop: 2 }}>{plural(lessons.length, 'lesson')} · {courseMins(openCourse)} min</Helper>
                </div>
                {lessons.map((l, i) => {
                  const active = l.id === lesson.id;
                  return (
                    <div key={l.id} onClick={() => setLessonId(l.id)}
                      style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', cursor: 'pointer',
                        borderTop: i ? `1px solid ${T.borderSoft}` : 'none', background: active ? T.primarySofter : 'transparent' }}>
                      <span style={{ width: 22, height: 22, borderRadius: 999, border: `1px solid ${active ? T.primary : T.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700, color: active ? T.primary : T.mutedSoft, flexShrink: 0 }}>{i + 1}</span>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12, fontWeight: active ? 700 : 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.title || 'Untitled lesson'}</div>
                        <div style={{ fontSize: 10, color: T.mutedSoft, display: 'flex', alignItems: 'center', gap: 5, marginTop: 1 }}>
                          <Icon name={lessonHasVideo(l) ? 'video' : 'clock'} size={10} color={T.mutedSoft} />{l.mins || 0} min
                        </div>
                      </div>
                    </div>
                  );
                })}
              </Card>
